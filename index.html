defSkill({id:'stress',icon:'🧱',name:'Force, stress & units',short:'σ = F/A, N and mm → MPa',levels:['w1l1'],
 plain:'<b>Force</b> is how hard something pulls or pushes (newtons, N). <b>Stress</b> is how concentrated that force is inside the material: the force divided by the cross-section area that carries it, <b>σ = F/A</b>. Engineers usually work in N and mm, so stress comes out in N/mm², which is the same as <b>MPa</b> (megapascal). A weight of <i>m</i> kg pulls with a force F = m·g = m × 9.81 N.',
 analogy:'Walk on deep snow in boots and you sink; on skis you don\'t. Same body weight (force), but the skis spread it over a much bigger area, so the "stress" on the snow is lower. A thin rod is the boot, a thick rod is the ski.',
 example:'A Ø10 mm steel rod holds a 50 kg bag. Force F = 50 × 9.81 = 490.5 N. Area A = π·10²/4 = 78.5 mm². Stress σ = 490.5 / 78.5 = <b>6.2 MPa</b>.',
 formula:'σ = F / A  · F = m·g · A<sub>round</sub> = π·d²/4 · 1 N/mm² = 1 MPa',why:'The material does not care about the total force – only about how much force each square millimetre has to carry.',
 check:{q:'A bar with a cross-section of 100 mm² carries a force of 2000 N. What is the stress?',opts:[{t:'20 MPa',ok:true,why:'σ = 2000 N / 100 mm² = 20 N/mm² = 20 MPa.'},{t:'200 000 MPa',why:'That multiplies instead of divides.'},{t:'0.05 MPa',why:'That is A/F – upside down.'}]},
 gens:[()=>{const b=rint(2,8)*5,h=rint(2,6)*5,F=rint(2,30)*500;return numTask(`A flat steel bar ${b} mm × ${h} mm is pulled with <b>F = ${F} N</b>. What is the tensile stress?`,F/(b*h),{unit:'MPa',tol:0.02,dec:1,sk:'stress',hint:'Area of a rectangle = width × thickness (in mm²). Then divide the force (N) by it.',explain:`A = ${b}·${h} = ${b*h} mm² → σ = ${F}/${b*h} = ${fmt(F/(b*h),1)} MPa.`});},
  ()=>{const d=pick([6,8,10,12,16,20]),F=rint(2,20);const A=Math.PI*d*d/4;return numTask(`A round rod Ø${d} mm carries <b>${F} kN</b>. Stress in MPa?`,F*1000/A,{unit:'MPa',tol:0.02,dec:1,sk:'stress',hint:'Convert kN to N first (× 1000). Round area A = π·d²/4.',explain:`A = π·${d}²/4 = ${fmt(A,1)} mm²; F = ${F*1000} N → σ = ${fmt(F*1000/A,1)} MPa.`});},
  ()=>{const m=rint(4,40)*5;return numTask(`A crate of <b>${m} kg</b> hangs on a hook. What force (weight) does it pull with? (g = 9.81 m/s²)`,m*g9,{unit:'N',tol:0.01,dec:0,sk:'stress',hint:'Weight force F = m · g.',explain:`F = ${m}·9.81 = ${fmt(m*g9,0)} N.`});}]});

defSkill({id:'sf',icon:'🛡',name:'Safety factor',short:'n = strength / stress',levels:['w1l3'],
 plain:'A <b>safety factor</b> compares what a part <i>can</i> carry with what it <i>does</i> carry: <b>n = strength / stress</b>. n = 1 means it is exactly at its limit; n = 2 means it could carry twice the load. We need n &gt; 1 because loads, materials and calculations all have uncertainty. Rules (codes, company standards) say which n is required – e.g. higher for loads hanging over people.',
 analogy:'A lift says "max 8 persons" although the cables could hold far more. The difference is the safety margin for the day somebody brings a piano.',
 example:'Steel with yield strength S<sub>y</sub> = 235 MPa, stress σ = 94 MPa → n = 235/94 = <b>2.5</b>. If the rule demands n ≥ 3, the part is not good enough – make it bigger.',
 formula:'n = S / σ  (S = yield strength S<sub>y</sub> for "no permanent bending", S<sub>ut</sub> for "no breaking") · required area A = n·F/S',why:'A margin covers what we don\'t know exactly: real loads, weak spots in the material, wear and our own simplifications.',
 check:{q:'Strength 300 MPa, stress 100 MPa. Safety factor?',opts:[{t:'3',ok:true,why:'n = 300/100 = 3.'},{t:'0.33',why:'Upside down: strength goes on top.'},{t:'200',why:'Subtracting is not a factor – divide.'}]},
 gens:[()=>{const Sy=pick([235,275,355,460]),s=rint(5,30)*5;return numTask(`Yield strength S<sub>y</sub> = ${Sy} MPa, working stress σ = ${s} MPa. Safety factor against yielding?`,Sy/s,{tol:0.02,dec:2,sk:'sf',hint:'Divide strength by stress.',explain:`n = ${Sy}/${s} = ${fmt(Sy/s,2)}.`});},
  ()=>{const Sy=pick([235,355]),F=rint(5,40)*1000,n=pick([2,3,4]);return numTask(`A tie rod (S<sub>y</sub> = ${Sy} MPa) must carry F = ${F/1000} kN with a safety factor of ${n}. Minimum cross-section area?`,n*F/Sy,{unit:'mm²',tol:0.02,dec:0,sk:'sf',hint:'Allowed stress = S<sub>y</sub>/n. Then A = F / allowed stress.',explain:`σ<sub>allow</sub> = ${Sy}/${n} = ${fmt(Sy/n,1)} MPa → A = ${F}/${fmt(Sy/n,1)} = ${fmt(n*F/Sy,0)} mm².`});},
  ()=>ch('A calculation gives a safety factor n = 0.8. What does it mean?',[{t:'The stress is higher than the strength – the part is expected to fail',ok:true,why:'n < 1: demand exceeds capacity.'},{t:'The part is 80 % safe – acceptable',why:'n < 1 is never acceptable: the stress already exceeds the strength.'},{t:'It is fine because real materials are stronger',why:'Relying on luck is not engineering.'}])]});

defSkill({id:'mat',icon:'🧪',name:'Material behaviour',short:'stiffness E, yield, toughness, brittle vs ductile',levels:['w1l1'],
 plain:'Pull a steel bar and measure: at first it stretches a tiny bit and springs back (<b>elastic</b>, strain ε = σ/E, where <b>E</b> is Young\'s modulus = stiffness). Above the <b>yield strength</b> it stays bent. At the <b>tensile strength</b> it breaks. <b>Stiffness</b> (how much it deflects) and <b>strength</b> (when it fails) are different things. <b>Toughness</b> is the ability to absorb energy with a crack or notch present – some steels become <b>brittle</b> when cold.',
 analogy:'A rubber band is not stiff but stretchy; a glass rod is stiff but brittle; a paperclip bends (yields) before it breaks. Chocolate snaps cleanly when cold from the fridge but bends when warm – steel can do the same thing with temperature.',
 example:'Steel E = 210 000 MPa, stress 105 MPa → strain ε = 105/210 000 = 0.0005. A 2 m (2000 mm) bar stretches 0.0005 × 2000 = <b>1 mm</b>.',
 formula:'ε = σ / E · ΔL = ε·L · E<sub>steel</sub> ≈ 210 000 MPa, E<sub>alu</sub> ≈ 70 000 MPa',why:'Stiffness decides deflection and sag, strength decides failure, toughness decides whether a crack is dangerous.',
 check:{q:'A shelf sags a lot but does not break. Which property is too low?',opts:[{t:'Stiffness (E·I)',ok:true,why:'Sag = deflection = a stiffness problem.'},{t:'Tensile strength',why:'Strength is about breaking, not sagging.'},{t:'Toughness',why:'Toughness matters for cracks and impacts.'}]},
 gens:[()=>{const E=pick([210000,70000]),s=rint(4,30)*5,L=rint(5,30)*100;return numTask(`A bar (E = ${E} MPa) of length ${L} mm carries σ = ${s} MPa. How much does it stretch?`,s/E*L,{unit:'mm',tol:0.02,dec:3,sk:'mat',hint:'Strain first: ε = σ/E (no unit). Then ΔL = ε·L.',explain:`ε = ${s}/${E} = ${(s/E).toFixed(6)} → ΔL = ${fmt(s/E*L,3)} mm.`});},
  ()=>ch('Charpy impact energy of a steel drops from 120 J at +20 °C to 6 J at −30 °C. What does that mean?',[{t:'The steel becomes brittle when cold – cracks can run without warning',ok:true,why:'Low impact energy = low toughness = brittle behaviour.'},{t:'The steel gets weaker in tension by 95 %',why:'Yield strength barely changes; toughness collapses.'},{t:'Nothing – Charpy is only a quality test',why:'It is exactly the warning sign for low-temperature use.'}]),
  ()=>{const E=pick([210000,70000]),eps=rint(2,9)/10000;return numTask(`A strain gauge reads ε = ${eps.toFixed(4)} on a part with E = ${E} MPa. Stress?`,E*eps,{unit:'MPa',tol:0.02,dec:1,sk:'mat',hint:'Hooke\'s law: σ = E·ε.',explain:`σ = ${E}·${eps.toFixed(4)} = ${fmt(E*eps,1)} MPa.`});}]});

defSkill({id:'bend',icon:'📏',name:'Bending',short:'M = F·L, σ = M/W, W = bh²/6',levels:['w1l4'],
 plain:'A load on a beam creates a <b>bending moment</b> M (force × lever arm, N·mm). The top and bottom surfaces carry the highest stress: <b>σ = M/W</b>, where W is the <b>section modulus</b>. For a rectangle b wide and h high, W = b·h²/6 – the height counts squared. A cantilever with end load: M = F·L at the wall. A simply supported beam with a centre load: M = F·L/4; with an evenly spread load w (N/mm): M = w·L²/8.',
 analogy:'A plastic ruler lying flat bends easily; turn it on its edge and it is very hard to bend. Same material, same area – the height in the bending direction makes the difference.',
 example:'Cantilever, F = 200 N at L = 500 mm → M = 100 000 N·mm. Section 20 × 10 mm (h = 10): W = 20·10²/6 = 333 mm³ → σ = 100 000/333 = <b>300 MPa</b>. On edge (h = 20): W = 10·20²/6 = 667 mm³ → 150 MPa.',
 formula:'σ = M / W · W<sub>rect</sub> = b·h²/6 · M<sub>cantilever</sub> = F·L · M<sub>centre load</sub> = F·L/4 · M<sub>spread load</sub> = w·L²/8',why:'Bending puts the outer fibres in tension and compression – the further from the middle, the higher the stress.',
 check:{q:'You double the height h of a rectangular beam (same load). The bending stress becomes…',opts:[{t:'¼ of before',ok:true,why:'W ∝ h², so 2× height → 4× W → ¼ stress.'},{t:'½ of before',why:'That would be true for doubling the width b.'},{t:'the same',why:'Height matters a lot in bending.'}]},
 gens:[()=>{const F=rint(2,20)*50,L=rint(2,10)*100,b=rint(2,6)*10,h=rint(2,6)*10;const M=F*L,W=b*h*h/6;return numTask(`Cantilever: F = ${F} N at L = ${L} mm, rectangle b = ${b} mm, h = ${h} mm. Bending stress at the wall?`,M/W,{unit:'MPa',tol:0.02,dec:1,sk:'bend',hint:'M = F·L (N·mm); W = b·h²/6 (mm³); σ = M/W.',explain:`M = ${F}·${L} = ${M} N·mm; W = ${b}·${h}²/6 = ${fmt(W,0)} mm³ → σ = ${fmt(M/W,1)} MPa.`});},
  ()=>{const F=rint(1,10)*1000,L=rint(5,20)*100;return numTask(`Simply supported beam, span ${L} mm, F = ${F} N in the middle. Maximum bending moment?`,F*L/4,{unit:'N·mm',tol:0.02,dec:0,sk:'bend',hint:'Centre load on a simply supported beam: M = F·L/4.',explain:`M = ${F}·${L}/4 = ${fmt(F*L/4,0)} N·mm.`});},
  ()=>{const b=rint(2,10)*10,h=rint(2,10)*5;return numTask(`Section modulus W of a rectangle b = ${b} mm, h = ${h} mm (bending about the wide side)?`,b*h*h/6,{unit:'mm³',tol:0.02,dec:0,sk:'bend',hint:'W = b·h²/6.',explain:`W = ${b}·${h}²/6 = ${fmt(b*h*h/6,0)} mm³.`});}]});

defSkill({id:'crit',icon:'⚖',name:'Combined stress (von Mises)',short:'σ<sub>vM</sub> = √(σ² + 3τ²)',levels:['w1l2','w1l3'],
 plain:'Real parts often see several stresses at once – e.g. bending (normal stress σ) and twisting or shear (shear stress τ). A <b>failure criterion</b> turns them into one <b>equivalent stress</b> to compare with the yield strength. For ductile metals we use <b>von Mises</b>: with one normal and one shear stress, σ<sub>vM</sub> = √(σ² + 3τ²).',
 analogy:'Like a decathlon total score: ten different events combined into one number that can be compared with a record.',
 example:'σ = 120 MPa, τ = 50 MPa → σ<sub>vM</sub> = √(120² + 3·50²) = √(14 400 + 7 500) = <b>148 MPa</b>. With S<sub>y</sub> = 355 MPa: n = 355/148 = 2.4.',
 formula:'σ<sub>vM</sub> = √(σ² + 3τ²) (one normal + one shear stress) · general plane stress: √(σ₁² − σ₁σ₂ + σ₂²) · n = S<sub>y</sub>/σ<sub>vM</sub>',why:'Shear stresses also cause yielding; von Mises weights them by √3 compared with normal stress.',
 check:{q:'Pure tension σ = 100 MPa, no shear. What is σ<sub>vM</sub>?',opts:[{t:'100 MPa',ok:true,why:'With τ = 0 the equivalent stress equals σ.'},{t:'173 MPa',why:'That would be √3·100 – only for shear.'},{t:'50 MPa',why:'No halving here.'}]},
 gens:[()=>{const s=rint(4,30)*5,t=rint(2,15)*5;const v=Math.sqrt(s*s+3*t*t);return numTask(`Normal stress σ = ${s} MPa and shear stress τ = ${t} MPa act together. von Mises equivalent stress?`,v,{unit:'MPa',tol:0.02,dec:1,sk:'crit',hint:'σ<sub>vM</sub> = √(σ² + 3τ²).',explain:`√(${s}² + 3·${t}²) = ${fmt(v,1)} MPa.`});},
  ()=>{const s=rint(6,30)*5,t=rint(2,12)*5,Sy=pick([235,355,460]);const v=Math.sqrt(s*s+3*t*t);return numTask(`σ = ${s} MPa, τ = ${t} MPa, S<sub>y</sub> = ${Sy} MPa. Safety factor against yielding (von Mises)?`,Sy/v,{tol:0.02,dec:2,sk:'crit',hint:'First σ<sub>vM</sub> = √(σ² + 3τ²), then n = S<sub>y</sub>/σ<sub>vM</sub>.',explain:`σ<sub>vM</sub> = ${fmt(v,1)} MPa → n = ${fmt(Sy/v,2)}.`});},
  ()=>ch('Why do we need an "equivalent stress" at all?',[{t:'Because the yield strength comes from a simple tension test, but real parts see several stresses at once',ok:true,why:'The criterion maps a combined state onto the tension test.'},{t:'Because FEA cannot show normal stresses',why:'FEA shows all components; the criterion is about comparing with material data.'},{t:'To make the stress smaller',why:'It is not a trick to reduce stress.'}])]});

defSkill({id:'kt',icon:'🕳',name:'Stress concentration',short:'σ<sub>max</sub> = K<sub>t</sub>·σ<sub>nom</sub>',levels:['w1l5'],
 plain:'Holes, grooves, keyways and sharp corners disturb the smooth flow of force. Right at the edge the stress is much higher than the average ("nominal") stress: <b>σ<sub>max</sub> = K<sub>t</sub>·σ<sub>nom</sub></b>. K<sub>t</sub> (stress concentration factor) is read from charts: a small round hole in a wide plate gives K<sub>t</sub> ≈ 3; a sharp corner can give 4 or more; a generous radius brings it down towards 1.5.',
 analogy:'A river flowing around a rock speeds up at its sides. Force "flows" through a part the same way and crowds at the edges of a hole or notch.',
 example:'Plate with a small hole, nominal stress 50 MPa, K<sub>t</sub> = 3 → peak stress at the hole edge = <b>150 MPa</b>. That peak is where fatigue cracks start.',
 formula:'σ<sub>max</sub> = K<sub>t</sub> · σ<sub>nom</sub> · bigger radius → smaller K<sub>t</sub>',why:'Ductile parts under one static load can yield locally and survive a peak – but under repeated loads the peak starts cracks.',
 check:{q:'Which inside corner gives the LOWEST K<sub>t</sub>?',opts:[{t:'A generous rounded radius',ok:true,why:'Larger radius = smoother force flow.'},{t:'A sharp 90° corner',why:'Sharp corners give the highest concentration.'},{t:'A small saw cut at the corner',why:'That acts like a crack – very high K<sub>t</sub>.'}]},
 gens:[()=>{const s=rint(4,20)*5,K=pick([1.8,2.2,2.5,3,3.5]);return numTask(`Nominal stress ${s} MPa, K<sub>t</sub> = ${K}. Peak stress at the notch?`,K*s,{unit:'MPa',tol:0.02,dec:1,sk:'kt',hint:'Multiply the nominal stress by K<sub>t</sub>.',explain:`σ<sub>max</sub> = ${K}·${s} = ${fmt(K*s,1)} MPa.`});},
  ()=>{const F=rint(5,30)*1000,w=rint(4,10)*10,d=rint(1,3)*5,t=rint(2,4)*5,K=pick([2.3,2.5,2.7]);const sn=F/((w-d)*t);return numTask(`A plate ${w} mm wide, ${t} mm thick with a Ø${d} mm hole carries F = ${F/1000} kN. Use the net section (w − d)·t for the nominal stress and K<sub>t</sub> = ${K}. Peak stress?`,K*sn,{unit:'MPa',tol:0.03,dec:1,sk:'kt',hint:'σ<sub>nom</sub> = F/((w − d)·t), then × K<sub>t</sub>.',explain:`σ<sub>nom</sub> = ${F}/((${w}−${d})·${t}) = ${fmt(sn,1)} MPa → σ<sub>max</sub> = ${fmt(K*sn,1)} MPa.`});},
  ()=>ch('Fatigue cracks in shafts very often start…',[{t:'at keyways, shoulders and grooves – where K<sub>t</sub> is high',ok:true,why:'Stress raisers are the classic crack origins.'},{t:'in the middle of smooth sections',why:'Smooth sections have the lowest local stress.'},{t:'at the centre line of the shaft',why:'Bending stress is zero on the centre line.'}])]});

defSkill({id:'fat',icon:'🔁',name:'Fatigue',short:'S–N curve, endurance limit, Goodman',levels:['w1l5'],
 plain:'Loads that go up and down many times can crack a part at stresses far below its static strength – this is <b>fatigue</b>. The <b>S–N curve</b> tells how many cycles N a stress amplitude S survives. Steels have an <b>endurance limit</b> S<sub>e</sub> (roughly 0.4–0.5 × tensile strength for polished samples, lower for real parts): below it they last practically forever. A <b>mean stress</b> makes things worse; the <b>Goodman</b> rule combines both: 1/n = σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>ut</sub>.',
 analogy:'Bend a paperclip back and forth: it breaks after a few dozen bends although you never pulled hard. Each cycle adds a tiny bit of damage.',
 example:'Stress cycles between 50 and 250 MPa: amplitude σ<sub>a</sub> = (250−50)/2 = 100, mean σ<sub>m</sub> = (250+50)/2 = 150 MPa. With S<sub>e</sub> = 250, S<sub>ut</sub> = 600: 1/n = 100/250 + 150/600 = 0.65 → <b>n = 1.54</b>.',
 formula:'σ<sub>a</sub> = (σ<sub>max</sub> − σ<sub>min</sub>)/2 · σ<sub>m</sub> = (σ<sub>max</sub> + σ<sub>min</sub>)/2 · Goodman: 1/n = σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>ut</sub>',why:'Each load cycle grows microscopic damage at the most stressed spot; the endurance limit is the level where it stops growing (for steels).',
 check:{q:'A steel part sees ±80 MPa (no mean stress); its endurance limit is 200 MPa. Will it fail by fatigue?',opts:[{t:'No – the amplitude is well below the endurance limit',ok:true,why:'σ<sub>a</sub> = 80 < S<sub>e</sub> = 200 → n = 2.5.'},{t:'Yes – every cycled part fails eventually',why:'Steels below S<sub>e</sub> practically don\'t.'},{t:'Only if 80 MPa exceeds the yield strength',why:'Fatigue happens below yield.'}]},
 gens:[()=>{const mn=rint(0,10)*10,mx=mn+rint(4,20)*10;return numTask(`Stress cycles between ${mn} and ${mx} MPa. Stress amplitude σ<sub>a</sub>?`,(mx-mn)/2,{unit:'MPa',tol:0.01,dec:1,sk:'fat',hint:'Amplitude = half the range: (max − min)/2.',explain:`σ<sub>a</sub> = (${mx} − ${mn})/2 = ${(mx-mn)/2} MPa; mean σ<sub>m</sub> = ${(mx+mn)/2} MPa.`});},
  ()=>{const Sut=rint(10,18)*50,Se=Math.round(Sut*0.4/5)*5,sa=rint(6,20)*5,sm=rint(4,30)*5;const n=1/(sa/Se+sm/Sut);return numTask(`σ<sub>a</sub> = ${sa} MPa, σ<sub>m</sub> = ${sm} MPa, S<sub>e</sub> = ${Se} MPa, S<sub>ut</sub> = ${Sut} MPa. Goodman safety factor?`,n,{tol:0.03,dec:2,sk:'fat',hint:'1/n = σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>ut</sub> – add the two fractions, then take the reciprocal.',explain:`1/n = ${sa}/${Se} + ${sm}/${Sut} = ${fmt(sa/Se+sm/Sut,3)} → n = ${fmt(n,2)}.`});},
  ()=>ch('A fracture surface shows curved "beach marks" spreading from one point at a notch, and a small rough zone at the end. What happened?',[{t:'Fatigue: a crack grew cycle by cycle, then the rest broke suddenly',ok:true,why:'Beach marks = progressive crack growth.'},{t:'A single overload',why:'Overloads show no beach marks.'},{t:'Corrosion only',why:'Corrosion may help, but beach marks are the fatigue signature.'}])]});

defSkill({id:'fea',icon:'🔷',name:'FEA basics',short:'elements, nodes, K·u = F',levels:['w2l1','w2l3','w2l5'],
 plain:'<b>Finite element analysis</b> splits a part into many small <b>elements</b> connected at <b>nodes</b>. Each element behaves like a little spring (a bar has stiffness k = E·A/L). The computer assembles all springs into one big system <b>K·u = F</b>, solves for the node <b>displacements u</b>, and only then computes strains and stresses. Units must be consistent: with N and mm, E must be in MPa (N/mm²).',
 analogy:'Think of a mattress modelled as hundreds of small springs: push on it, and each spring takes its share. FEA does the same with your part.',
 example:'Steel bar E = 210 000 MPa, A = 100 mm², L = 1000 mm → k = 210 000·100/1000 = 21 000 N/mm. A force of 2100 N stretches it u = F/k = <b>0.1 mm</b>.',
 formula:'k = E·A/L · u = F/k · springs in series: u = F/k₁ + F/k₂',why:'Displacements are what FEA solves; stresses are derived from them – so stiffness, units and supports must be right first.',
 check:{q:'What does an FE solver compute FIRST?',opts:[{t:'The displacements of the nodes',ok:true,why:'K·u = F is solved for u; stresses follow from u.'},{t:'The safety factor',why:'That is your job afterwards.'},{t:'The stresses directly',why:'Stresses are post-processed from displacements.'}]},
 gens:[()=>{const E=pick([70000,210000]),A=rint(5,40)*10,L=rint(2,10)*100;return numTask(`Bar element: E = ${E} MPa, A = ${A} mm², L = ${L} mm. Stiffness k = EA/L?`,E*A/L,{unit:'N/mm',tol:0.02,dec:0,sk:'fea',hint:'k = E·A/L.',explain:`k = ${E}·${A}/${L} = ${fmt(E*A/L,0)} N/mm.`});},
  ()=>{const k=rint(2,20)*1000,F=rint(1,10)*500;return numTask(`A spring element with k = ${k} N/mm is loaded with F = ${F} N. Displacement?`,F/k,{unit:'mm',tol:0.02,dec:3,sk:'fea',hint:'u = F/k.',explain:`u = ${F}/${k} = ${fmt(F/k,3)} mm.`});},
  ()=>ch('Your FE model is in mm and N. Which Young\'s modulus for steel is consistent?',[{t:'210 000',ok:true,why:'N/mm² = MPa.'},{t:'210e9',why:'That is Pa – for a model in metres.'},{t:'210',why:'That is GPa – inconsistent with N and mm.'}])]});

defSkill({id:'mesh',icon:'🕸',name:'Mesh & convergence',short:'refine until results stop changing; spot singularities',levels:['w2l2'],
 plain:'A coarse <b>mesh</b> (big elements) gives rough answers. Make the elements smaller and the stress changes less and less – the result <b>converges</b>. Rule of thumb: when the change between two refinements is below ~2–5 %, the value is trustworthy. Exception: at a <b>perfectly sharp inner corner</b> the stress keeps rising with every refinement – a <b>singularity</b>. That number is not physical; model the real fillet radius or evaluate away from the corner.',
 analogy:'Pixels in a photo: more pixels show more detail, until you can no longer see a difference. But if you zoom into a drawn "infinitely sharp" point, it never gets smoother.',
 example:'Peak stress with 4, 2, 1 mm elements: 210, 228, 232 MPa. Last change = (232−228)/228 = <b>1.8 %</b> → converged. Versus 247, 338, 464 MPa: +37 % each time → singularity.',
 formula:'change = (σ<sub>fine</sub> − σ<sub>coarse</sub>)/σ<sub>coarse</sub> · converged if change < ~2–5 % · constant growth ratio = singularity',why:'An FE number is only a result once you know it does not depend on the mesh.',
 check:{q:'At a sharp inner corner the peak stress rises by ~37 % every time you halve the element size. This means…',opts:[{t:'A singularity – the peak value is meaningless',ok:true,why:'Constant growth per refinement is the fingerprint of a singularity.'},{t:'The model is converging nicely',why:'Converging values change less and less.'},{t:'The material is yielding',why:'A linear FE model knows nothing about yielding.'}]},
 gens:[()=>{const a=rint(180,260),b=a+rint(5,25),c=b+rint(1,8);return numTask(`Peak stresses for three meshes: ${a}, ${b}, ${c} MPa. What is the change (in %) between the last two?`,100*(c-b)/b,{unit:'%',abs:0.2,tol:0,dec:2,sk:'mesh',hint:'(newest − previous)/previous × 100.',explain:`(${c} − ${b})/${b} = ${fmt(100*(c-b)/b,2)} % ${(c-b)/b<0.03?'→ converged.':'→ refine once more.'}`});},
  ()=>ch('How do you get a meaningful stress at a corner that is perfectly sharp in the FE model?',[{t:'Model the real fillet radius from the drawing and refine there',ok:true,why:'With the real radius the stress converges.'},{t:'Use the finest possible mesh at the sharp corner',why:'At a singularity a finer mesh just gives a higher, still meaningless number.'},{t:'Take the average of all mesh results',why:'Averaging meaningless numbers gives a meaningless number.'}]),
  ()=>ch('Which mesh result can you trust?',[{t:'One that changes less than ~2–5 % on further refinement',ok:true,why:'That is convergence.'},{t:'The one from the finest mesh, always',why:'Not at singularities, and fine alone is not proof.'},{t:'The one that gives the lowest stress',why:'Wishful thinking.'}])]});

defSkill({id:'bc',icon:'📌',name:'Boundary conditions',short:'supports & loads decide the answer',levels:['w2l4'],
 plain:'<b>Boundary conditions</b> tell the FE model how the part is held and loaded. If nothing holds the part, it can move as a rigid body and the solver fails. If you hold it <i>too</i> rigidly (e.g. fixing a whole face that can really slide), you create false stresses. A point load on a single node gives an artificial stress peak. Always check: do the reaction forces equal the applied load?',
 analogy:'A shelf resting on pins and a shelf cast solid into concrete look the same in CAD – but they bend completely differently. The model only knows what you tell it.',
 example:'A beam fixed at the wall with 500 N at the tip: the wall reaction must be 500 N (and a moment F·L). If your model reports 350 N, a load or support is wrong.',
 formula:'Σ reactions = Σ applied loads · simply supported beam, load F at distance a from the left: R<sub>right</sub> = F·a/L, R<sub>left</sub> = F − R<sub>right</sub>',why:'Wrong supports or loads give wrong stresses – no matter how fine the mesh.',
 check:{q:'An FE model has loads but no supports at all. What happens?',opts:[{t:'The solver fails or gives nonsense – the part can move as a rigid body',ok:true,why:'Rigid-body motion makes K singular.'},{t:'It solves normally',why:'Without supports the equilibrium cannot be found.'},{t:'The stresses are just a bit higher',why:'It is not a matter of degree – it cannot be solved.'}]},
 gens:[()=>{const F=rint(2,20)*100,L=rint(5,20)*100,a=rint(1,4)*L/5;return numTask(`Simply supported beam, span ${L} mm, load F = ${F} N at a = ${a} mm from the left support. Reaction at the RIGHT support?`,F*a/L,{unit:'N',tol:0.02,dec:0,sk:'bc',hint:'Moments about the left support: R<sub>right</sub>·L = F·a.',explain:`R<sub>right</sub> = ${F}·${a}/${L} = ${fmt(F*a/L,0)} N; left = ${fmt(F-F*a/L,0)} N.`});},
  ()=>ch('Your FE model of a bracket fixes the complete bolted face (all nodes, all directions). Typical consequence?',[{t:'Too stiff: artificial stress peaks at the edge of the fixed face',ok:true,why:'Over-constraint creates stresses that the real joint does not have.'},{t:'No effect – fixed is fixed',why:'The real face can slide and lift a little.'},{t:'The model becomes unstable',why:'Too many constraints don\'t cause rigid-body motion.'}]),
  ()=>ch('What is the quickest sanity check of loads and supports in any FE run?',[{t:'Compare the sum of reaction forces with the applied load',ok:true,why:'Equilibrium must hold.'},{t:'Look at the colour plot',why:'Colours look plausible even when loads are wrong.'},{t:'Refine the mesh',why:'Mesh refinement does not fix wrong loads.'}])]});

defSkill({id:'stat',icon:'📊',name:'Statistics basics',short:'mean, scatter, why the weakest matters',levels:['w3l4'],
 plain:'Nominally identical parts are never exactly the same. The <b>mean</b> (average) tells you the typical value, the <b>standard deviation</b> s tells you the scatter. Failures happen in the weak <b>tail</b>, so a product with a high mean but large scatter can be worse than one with a lower mean and small scatter. Also, look at <b>all</b> the data – including the cases where nothing happened.',
 analogy:'The average height of a class says nothing about whether the shortest child can reach the top shelf. For safety, you care about the shortest one.',
 example:'Strengths 290, 300, 310 MPa: mean 300, s = 10 MPa. Strengths 260, 300, 340 MPa: same mean, but s = 40 MPa – the second batch contains much weaker parts.',
 formula:'mean x̄ = Σx/n · s = √(Σ(x − x̄)²/(n − 1)) · fraction = count/total',why:'Engineering decisions must account for scatter, not only averages.',
 check:{q:'Two batches both average 300 MPa. Batch A has s = 5 MPa, batch B has s = 30 MPa. Which is more likely to contain weak parts?',opts:[{t:'Batch B',ok:true,why:'Larger scatter → more parts far below the mean.'},{t:'Batch A',why:'A is very consistent.'},{t:'Both equally',why:'Same mean, different spread – not equal.'}]},
 gens:[()=>{const xs=[...Array(5)].map(()=>rint(20,40)*10);return numTask(`Test lives (hours): ${xs.join(', ')}. Mean life?`,mean(xs),{unit:'h',tol:0.01,dec:1,sk:'stat',hint:'Add all values and divide by how many there are.',explain:`(${xs.join(' + ')})/5 = ${fmt(mean(xs),1)} h.`});},
  ()=>{const n=rint(10,30),k=rint(1,n-2);return numTask(`${k} of ${n} tested parts failed before the service interval. What fraction is that (in %)?`,100*k/n,{unit:'%',abs:0.5,tol:0,dec:1,sk:'stat',hint:'fraction = count / total × 100.',explain:`${k}/${n} = ${fmt(100*k/n,1)} %.`});},
  ()=>{const m=rint(25,35)*10;const xs=[m-10,m,m+10];return numTask(`Three tests: ${xs.join(', ')} MPa. Sample standard deviation s?`,10,{unit:'MPa',tol:0.02,dec:1,sk:'stat',hint:'Mean is the middle value; deviations are −10, 0, +10. s = √(Σd²/(n − 1)).',explain:`s = √((100 + 0 + 100)/2) = 10 MPa.`});}]});

defSkill({id:'rel',icon:'✅',name:'Reliability',short:'R = 1 − F, interference z, B10',levels:['w3l2','w3l3'],
 plain:'<b>Reliability</b> R is the probability that a part survives; F = 1 − R is the probability that it has failed. <b>B10</b> is the time at which 10 % of parts have failed. When both the load and the strength scatter, failures happen where the two distributions overlap (<b>interference</b>). The safety index z = (μ<sub>S</sub> − μ<sub>L</sub>)/√(s<sub>S</sub>² + s<sub>L</sub>²) measures how far apart they are; bigger z = fewer failures (z = 3 ≈ 1 in 740, z = 4.27 ≈ 10 ppm).',
 analogy:'A weather forecast of "90 % no rain" is a reliability of 0.9. Interference: tall people (strength) and low door frames (load) – trouble only for the rare tall person meeting the rare low door.',
 example:'Strength N(400, 30), load N(250, 20) MPa → z = 150/√(30² + 20²) = 150/36.1 = <b>4.16</b> → about 16 failures per million.',
 formula:'R = 1 − F · z = (μ<sub>S</sub> − μ<sub>L</sub>)/√(s<sub>S</sub>² + s<sub>L</sub>²) · B10: 10 % failed',why:'Turning scatter into a probability lets you compare designs and costs honestly.',
 check:{q:'"B10 life = 5000 h" means…',opts:[{t:'10 % of the parts have failed by 5000 h',ok:true,why:'B10 = 10 % failed.'},{t:'Parts last 10 × 5000 h',why:'No.'},{t:'90 % have failed by 5000 h',why:'That would be B90.'}]},
 gens:[()=>{const mL=rint(20,35)*10,sL=rint(2,6)*5,mS=mL+rint(6,20)*10,sS=rint(2,6)*5;const z=(mS-mL)/Math.hypot(sS,sL);return numTask(`Load N(${mL}, ${sL}) MPa, strength N(${mS}, ${sS}) MPa. Safety index z?`,z,{tol:0.02,dec:2,sk:'rel',hint:'z = (μ<sub>S</sub> − μ<sub>L</sub>)/√(s<sub>S</sub>² + s<sub>L</sub>²).',explain:`z = ${mS-mL}/√(${sS}² + ${sL}²) = ${fmt(z,2)}.`});},
  ()=>{const F=rint(1,30);return numTask(`${F} % of a product population has failed by 2 years. Reliability at 2 years (as a ratio, e.g. 0.9)?`,1-F/100,{abs:0.005,tol:0,dec:2,sk:'rel',hint:'R = 1 − F, with F as a fraction.',explain:`R = 1 − ${F/100} = ${fmt(1-F/100,2)}.`});},
  ()=>ch('Two designs: z = 2 and z = 4. Which statement is right?',[{t:'z = 4 has far fewer failures (ppm level) than z = 2 (≈ 2 %)',ok:true,why:'The tail probability falls extremely fast with z.'},{t:'z = 4 is twice as reliable',why:'It is thousands of times fewer failures, not "twice".'},{t:'They are equal if the means are equal',why:'z includes the scatter.'}])]});

defSkill({id:'weib',icon:'📉',name:'Weibull analysis',short:'F(t) = 1 − exp[−(t/η)<sup>β</sup>], β tells how things fail',levels:['w3l1','w3l2'],
 plain:'The <b>Weibull</b> distribution describes lifetimes: F(t) = 1 − exp[−(t/η)<sup>β</sup>]. <b>η</b> (eta) is the characteristic life: 63.2 % have failed by then. <b>β</b> (beta) is the shape and tells you HOW things fail: β &lt; 1 early failures (defects, assembly), β ≈ 1 random (accidents), β &gt; 1 wear-out (fatigue, wear). Units that have not failed yet (<b>suspensions</b>) must be included in the analysis – they survived at least that long.',
 analogy:'A "personality" of how products die: babies (early defects), accidents (random) or old age (wear-out). The fix is different for each: better quality control for babies, protection for accidents, better design or maintenance for old age.',
 example:'β = 2, η = 1000 h. Probability to survive 500 h: R = exp[−(500/1000)²] = exp(−0.25) = <b>0.78</b>. B10 = η·(−ln 0.9)<sup>1/β</sup> = 1000·0.325 = 325 h.',
 formula:'R(t) = exp[−(t/η)<sup>β</sup>] · F = 1 − R · B10 = η·(−ln 0.9)<sup>1/β</sup>',why:'With β you diagnose the failure type, with η and β you predict how many will fail by a given time.',
 check:{q:'A Weibull fit gives β = 3. What kind of failures are these?',opts:[{t:'Wear-out (e.g. fatigue)',ok:true,why:'β > 1 → increasing failure rate with age.'},{t:'Early failures from defects',why:'That is β < 1.'},{t:'Purely random',why:'That is β ≈ 1.'}]},
 gens:[()=>{const b=pick([1.5,2,2.5,3]),eta=rint(10,60)*100,t=rint(2,8)*100;const R=Math.exp(-Math.pow(t/eta,b));return numTask(`Weibull β = ${b}, η = ${eta} h. Reliability at t = ${t} h?`,R,{abs:0.005,tol:0,dec:3,sk:'weib',hint:'R = exp[−(t/η)<sup>β</sup>]. Compute t/η, raise to β, change sign, take exp.',explain:`R = exp[−(${t}/${eta})<sup>${b}</sup>] = ${fmt(R,3)}.`});},
  ()=>{const b=pick([1.5,2,2.5,3]),eta=rint(10,60)*100;const B=eta*Math.pow(-Math.log(0.9),1/b);return numTask(`Weibull β = ${b}, η = ${eta} h. B10 life?`,B,{unit:'h',tol:0.02,dec:0,sk:'weib',hint:'B10 = η·(−ln 0.9)<sup>1/β</sup>; −ln 0.9 = 0.1054.',explain:`B10 = ${eta}·0.1054<sup>1/${b}</sup> = ${fmt(B,0)} h.`});},
  ()=>ch('In field data, 3 units failed and 17 are still running. How do you treat the 17?',[{t:'As suspensions – they survived at least their current age',ok:true,why:'Censored data carry information.'},{t:'Ignore them',why:'Ignoring survivors makes the product look far worse than it is.'},{t:'Count them as failures',why:'They have not failed.'}])]});

defSkill({id:'rca',icon:'🔍',name:'Root-cause tools',short:'Pareto, 5 whys, fishbone, FMEA',levels:['w3l5'],
 plain:'When things fail, find the <b>root cause</b>, not just the symptom. <b>Pareto</b>: sort problems by count – a few causes usually make most of the trouble. <b>5 whys</b> and the <b>fishbone</b> diagram help you dig from symptom to cause. <b>FMEA</b> rates each possible failure by Severity, Occurrence and Detection (1–10); RPN = S×O×D, but high-severity items always deserve attention first. And: every change to a design must be reviewed – "small" changes have caused big disasters.',
 analogy:'A doctor doesn\'t just hand out painkillers: symptoms → tests → diagnosis → treat the cause.',
 example:'Returns: 50 weld cracks, 15 porosity, 8 paint, 4 transport = 77. Weld cracks = 50/77 = <b>65 %</b> → attack them first.',
 formula:'share = count/total · RPN = S × O × D (severity first!)',why:'Limited time and money must go to the causes that matter most – and to the ones that can hurt people.',
 check:{q:'FMEA item A: S = 9, O = 3, D = 3 (RPN 81). Item B: S = 3, O = 6, D = 6 (RPN 108). Which needs action first?',opts:[{t:'A – severity 9 (safety) comes first',ok:true,why:'High severity must be addressed regardless of RPN.'},{t:'B – it has the higher RPN',why:'RPN alone can hide safety-critical items.'},{t:'Neither',why:'S = 9 needs action.'}]},
 gens:[()=>{const S=rint(2,10),O=rint(2,9),D=rint(2,9);return numTask(`FMEA: S = ${S}, O = ${O}, D = ${D}. RPN?`,S*O*D,{tol:0,abs:0,dec:0,sk:'rca',hint:'Multiply the three ratings.',explain:`RPN = ${S}·${O}·${D} = ${S*O*D}.`});},
  ()=>{const a=rint(30,60),b=rint(8,20),c=rint(3,10),d=rint(1,5);const t=a+b+c+d;return numTask(`Defect counts: cracks ${a}, porosity ${b}, paint ${c}, other ${d}. Share of cracks in %?`,100*a/t,{unit:'%',abs:0.5,tol:0,dec:1,sk:'rca',hint:'share = count / total × 100.',explain:`${a}/${t} = ${fmt(100*a/t,1)} %.`});},
  ()=>ch('Production proposes a "small" change to a welded load-carrying detail to save time. What do you do?',[{t:'Treat it as a design change: check the load path and fatigue before approving',ok:true,why:'Changes to load paths need engineering review.'},{t:'Approve – production knows best',why:'Unreviewed changes have caused major disasters.'},{t:'Reject all changes forever',why:'Changes can be good – they just need review.'}])]});

defSkill({id:'frac',icon:'⚡',name:'Cracks & fracture',short:'K = Yσ√(πa), critical crack, Paris law',levels:['w1l5'],
 plain:'Assume cracks exist. A crack of length a under stress σ has a <b>stress intensity</b> K = Y·σ·√(π·a). When K reaches the material\'s <b>fracture toughness</b> K<sub>c</sub>, the crack runs: critical length a<sub>c</sub> = (1/π)·(K<sub>c</sub>/(Yσ))². Under repeated loads a crack grows a little each cycle (<b>Paris law</b>: da/dN = C·ΔK<sup>m</sup>). Inspect often enough to find cracks before they reach a<sub>c</sub> – typically at half the crack-growth life.',
 analogy:'A chip in a car windscreen: it grows a little with each bump on the road, and one day it suddenly runs across the whole screen. Fix it while it is small.',
 example:'σ = 150 MPa, Y = 1.12, K<sub>c</sub> = 50 MPa√m → a<sub>c</sub> = (1/π)(50/(1.12·150))² = (1/π)(0.298)² = 0.0282 m = <b>28 mm</b>. Double the stress → a<sub>c</sub> becomes 4× smaller (7 mm).',
 formula:'K = Y·σ·√(πa) (a in m!) · a<sub>c</sub> = (1/π)·(K<sub>c</sub>/(Y·σ))² · da/dN = C·ΔK<sup>m</sup>',why:'Damage tolerance: you cannot prevent every crack, but you can make sure none becomes critical between inspections.',
 check:{q:'If the stress doubles, the critical crack length becomes…',opts:[{t:'4 times smaller',ok:true,why:'a<sub>c</sub> ∝ 1/σ².'},{t:'2 times smaller',why:'It goes with the square.'},{t:'unchanged',why:'σ appears in the formula.'}]},
 gens:[()=>{const s=rint(8,25)*10,Kc=rint(4,12)*10,Y=1.12;const ac=Math.pow(Kc/(Y*s),2)/Math.PI;return numTask(`σ = ${s} MPa, Y = 1.12, K<sub>c</sub> = ${Kc} MPa√m. Critical crack length a<sub>c</sub> in mm?`,ac*1000,{unit:'mm',tol:0.03,dec:1,sk:'frac',hint:'a<sub>c</sub> = (1/π)(K<sub>c</sub>/(Yσ))² gives metres – multiply by 1000 for mm.',explain:`a<sub>c</sub> = (1/π)(${Kc}/(1.12·${s}))² = ${fmt(ac,5)} m = ${fmt(ac*1000,1)} mm.`});},
  ()=>{const s=rint(5,20)*10,a=rint(1,10);const K=1.12*s*Math.sqrt(Math.PI*a/1000);return numTask(`Edge crack a = ${a} mm, σ = ${s} MPa, Y = 1.12. Stress intensity K in MPa√m?`,K,{unit:'MPa√m',tol:0.03,dec:2,sk:'frac',hint:'K = Y·σ·√(π·a) with a in METRES.',explain:`K = 1.12·${s}·√(π·${a/1000}) = ${fmt(K,2)} MPa√m.`});},
  ()=>ch('Why is the inspection interval usually about HALF the crack-growth life?',[{t:'So there are at least two chances to find a crack before it becomes critical',ok:true,why:'Inspections can miss cracks; scatter in growth rates.'},{t:'Because cracks grow twice as fast as calculated',why:'It is about detection chances.'},{t:'It is a legal rule without technical reason',why:'There is a clear technical reason.'}])]});

/* Training level → skills */
const LEVEL_SKILLS={w1l1:['mat','stress'],w1l2:['crit'],w1l3:['crit','sf'],w1l4:['bend'],w1l5:['kt','fat'],w2l1:['fea'],w2l2:['mesh'],w2l3:['fea'],w2l4:['bc'],w2l5:['fea','mesh'],w3l1:['weib'],w3l2:['rel','weib'],w3l3:['rel','stat'],w3l4:['stat'],w3l5:['rca'],boss:[]};
function skillTasks(id,n){const S=SKILLS[id];const out=[];const gs=shuffle(S.gens);for(let k=0;k<n;k++){const t=gs[k%gs.length]();t.sk=id;out.push(t);}return out;}
function levelMentor(lv){const ids=(LEVEL_SKILLS[lv.id]||[]).filter(k=>!(STORE.lessons[k]||{}).done);if(!ids.length)return '';const S=SKILLS[ids[0]];
 return mentorHTML(`New to <b>${S.name}</b>? In short: ${S.plain} <div style="margin-top:6px"><button class="btn sm" onclick="document.getElementById('modalRoot').innerHTML='';openLesson('${S.id}')">🦉 Take the 3-minute lesson first</button></div>`);}
/* ===================== WORLD 1 ===================== */
defLevel({id:'w1l1',world:1,title:'Stress–Strain Explorer',short:'Pull a tensile bar to fracture; read E, yield and UTS',
concept:`<p>In a tensile test a bar of initial area A₀ and gauge length L₀ is pulled. We plot <b>engineering stress</b> vs <b>engineering strain</b>:</p>
<div class="formula">σ = F / A₀ &nbsp;&nbsp;&nbsp; ε = ΔL / L₀</div>
<ul><li><b>Elastic region</b>: linear, Hooke's law <span class="formula" style="display:inline-block;margin:2px">σ = E·ε</span> – unloading returns to zero strain.</li>
<li><b>Yield strength S<sub>y</sub></b>: onset of plastic flow. For materials without a sharp yield point it is defined with the <b>0.2 % offset</b> line (parallel to E, shifted by ε = 0.002).</li>
<li><b>Strain hardening</b>: stress rises with plastic strain up to the <b>ultimate tensile strength S<sub>u</sub> (UTS)</b>, the maximum engineering stress.</li>
<li><b>Necking</b> starts at the UTS (Considère: dσ<sub>true</sub>/dε<sub>true</sub> = σ<sub>true</sub>); deformation localises and engineering stress falls until <b>fracture</b>.</li>
<li>Unloading from the plastic range follows a line of slope E → <b>permanent set</b>.</li></ul>
<p class="mut small">Tip: the elastic part is tiny on the full strain axis, so use the zoom inset (bottom right). Hover over the traced curve to read values.</p>`,
takeaway:'E is the slope of the elastic line, Sy marks the start of plasticity, Su is the peak of the engineering curve where necking begins.',
build(sim){
 const mats=[{n:'Structural steel',E:200,Sy:[250,420],r:[1.3,1.6],eu:[0.12,0.2],ef:[0.08,0.12]},{n:'Aluminium alloy',E:70,Sy:[180,320],r:[1.1,1.3],eu:[0.07,0.11],ef:[0.04,0.07]},{n:'Titanium alloy',E:110,Sy:[780,950],r:[1.06,1.14],eu:[0.06,0.09],ef:[0.04,0.06]},{n:'Copper alloy',E:120,Sy:[150,300],r:[1.4,1.8],eu:[0.2,0.3],ef:[0.08,0.15]}];
 const m=pick(mats);const E=m.E*1000*rnd(0.96,1.04);const Sy=round5(rnd(...m.Sy));const Su=round5(Sy*rnd(...m.r));
 const ey=Sy/E,eu=rnd(...m.eu),ef=eu+rnd(...m.ef),sf=0.8*Su;const d0=rint(8,14);const A0=Math.PI*d0*d0/4;
 function sig(e){if(e<=ey)return E*e;if(e<=eu){const s=(e-ey)/(eu-ey);return Sy+(Su-Sy)*(1-Math.pow(1-s,2.4));}if(e<=ef){const s=(e-eu)/(ef-eu);return Su-(Su-sf)*s*s;}return 0;}
 let eps=0,hov=null;
 sim.appendChild(el('div',{class:'small mut'},`Material: <b style="color:#e6ebf5">${m.n}</b> · round specimen d₀ = ${d0} mm (A₀ = ${fmt(A0,1)} mm²)`));
 const C=makeCanvas(sim,680,450),ctx=C.ctx;
 const P=plotArea(ctx,60,110,600,290,[0,ef*1.08*100],[0,Su*1.18]);
 const Pi=plotArea(ctx,420,265,220,110,[0,ey*3.5*100],[0,Sy*1.3]);
 const sl=slider(sim,'Elongation (strain)',0,1000,1,0,v=>{eps=v/1000*ef*1.02;draw();},v=>fmt(v/1000*ef*1.02*100,2)+' %');
 sim.appendChild(el('div',{class:'legend'},'Drag the slider to load the specimen. Hover the curve (main plot or zoom inset) for a σ–ε readout. Dashed line = elastic unloading path.'));
 C.hover=p=>{hov=p;draw();};
 function draw(){C.clear();const broken=eps>ef;
  // bar
  const L0=360,ex=Math.min(eps,ef)*1.6,len=L0*(1+ex),x0=340-len/2,yc=48,hh=18;
  ctx.fillStyle='#56627e';ctx.fillRect(x0-40,yc-30,40,60);ctx.fillRect(x0+len,yc-30,40,60);
  const neck=eps>eu?Math.min(1,(eps-eu)/(ef-eu)):0;const wid=hh/Math.sqrt(1+ex*0.6);
  const s=sig(Math.min(eps,ef));ctx.fillStyle=broken?'#555':heat(s/Su);
  ctx.beginPath();const N=80;for(let i=0;i<=N;i++){const x=x0+len*i/N;const u=(i/N-0.5);const w=wid*(1-0.55*neck*Math.exp(-u*u/0.004));if(broken&&Math.abs(u)<0.004)continue;i?ctx.lineTo(x,yc-w):ctx.moveTo(x,yc-w);}
  for(let i=N;i>=0;i--){const x=x0+len*i/N;const u=(i/N-0.5);const w=wid*(1-0.55*neck*Math.exp(-u*u/0.004));ctx.lineTo(x,yc+w);}ctx.closePath();ctx.fill();
  if(broken){ctx.fillStyle='#0c111b';ctx.fillRect(338,yc-hh-2,6,2*hh+4);}
  arrow(ctx,x0-45,yc,x0-85,yc,'#ffb74d',2);arrow(ctx,x0+len+45,yc,x0+len+85,yc,'#ffb74d',2);
  const phase=eps===0?'Unloaded':eps<=ey?'Elastic':eps<=eu?'Yielded – strain hardening':eps<=ef?'Necking!':'FRACTURE 💥';
  txt(ctx,phase,20,96,broken?'#ef5350':'#ffb74d','bold 13px system-ui');
  txt(ctx,`F = ${fmt(s*A0/1000,2)} kN   σ = ${fmt(s,0)} MPa`,660,96,'#c9d2e6','12px system-ui','right');
  // main plot
  P.axes('Engineering strain ε (%)','Engineering stress σ (MPa)');
  const em=Math.min(eps,ef);P.line(e=>sig(e/100),0,em*100,'#4fc3f7',2.5,500);
  if(em>ey&&!broken){const ep=em-sig(em)/E;P.line(e=>E*(e/100-ep),ep*100,em*100,'#ffb74d',1.2,10,[5,4]);txt(ctx,'permanent set ≈ '+fmt(ep*100,2)+' %',P.X(ep*100)+4,P.Y(0)-6,'#ffb74d','11px system-ui');}
  if(broken){dot(ctx,P.X(ef*100),P.Y(sf),5,'#ef5350');}
  dot(ctx,P.X(em*100),P.Y(sig(em)),4,'#fff');
  // inset
  ctx.fillStyle='#0c111b';ctx.fillRect(Pi.x-34,Pi.y-14,Pi.w+40,Pi.h+44);
  Pi.axes(null,null,{nx:4,ny:3,yoff:30});txt(ctx,'zoom: ε ≤ '+fmt(ey*350,2)+' %',Pi.x+4,Pi.y-3,'#9aa6bf','10px system-ui');
  Pi.clip();Pi.line(e=>sig(e/100),0,Math.min(em,ey*3.5)*100,'#4fc3f7',2,200);

defLevel({id:'w1l2',world:1,title:"Mohr's Circle Workshop",short:'Rotate the stress element, find principal & max shear stresses',
concept:`<p>For plane stress (σ<sub>x</sub>, σ<sub>y</sub>, τ<sub>xy</sub>) the stresses on a face rotated by θ are</p>

   for(const s of[1,-1]){const bx=dir==='x'?s*h:0,by=dir==='y'?-s*h:0;const ux=dir==='x'?s:0,uy=dir==='y'?-s:0;

  // Mohr

  const px=290,pw=370,py=20,ph=350;const span=Math.max((hi-lo)*1.25,2*R*1.25*pw/ph,40);const sxr=[(lo+hi)/2-span/2,(lo+hi)/2+span/2];const tsp=span*ph/pw;
  const P=plotArea(ctx,px,py,pw,ph,sxr,[tsp/2,-tsp/2]);// tau downward positive
  P.axes('σ (MPa)','τ (MPa, ↓ positive)',{zero:true,yoff:30});
  ctx.strokeStyle='#ba68c8';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(P.X(c),P.Y(0),R*pw/span,0,7);ctx.stroke();
  ctx.strokeStyle='#e6ebf5';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.X(sxp),P.Y(tp));ctx.lineTo(P.X(syp),P.Y(-tp));ctx.stroke();
  dot(ctx,P.X(sxp),P.Y(tp),6,'#ef5350');txt(ctx,"X'",P.X(sxp)+8,P.Y(tp)-6,'#ef5350','bold 12px system-ui');
  dot(ctx,P.X(syp),P.Y(-tp),6,'#42a5f5');txt(ctx,"Y'",P.X(syp)+8,P.Y(-tp)-6,'#42a5f5','bold 12px system-ui');

  {type:'action',q:"Use the θ slider to rotate the element to the <b>principal orientation where the x'-face carries σ₁</b> (τ = 0), then submit.",btn:'Submit current θ',onShow:()=>{S={sx,sy,txy,th:S.th};s_x.set(sx);s_y.set(sy);s_t.set(txy);draw();},

 ]};}});
defLevel({id:'w1l3',world:1,title:'Failure Criteria Duel',short:'von Mises vs Tresca, plus brittle Rankine & Coulomb–Mohr',
concept:`<p>Multi-axial stress states are compared with uniaxial strength through a <b>failure criterion</b>. In plane stress with principal stresses σ<sub>A</sub>, σ<sub>B</sub> (σ₃ = 0):</p>
<p><b>Ductile materials (yielding)</b></p>
<div class="formula">von Mises (distortion energy): σ<sub>vM</sub> = √(σ<sub>A</sub>² − σ<sub>A</sub>σ<sub>B</sub> + σ<sub>B</sub>²) ,&nbsp; n = S<sub>y</sub>/σ<sub>vM</sub></div>
<div class="formula">Tresca (max shear): σ<sub>Tr</sub> = max(|σ<sub>A</sub>|, |σ<sub>B</sub>|, |σ<sub>A</sub>−σ<sub>B</sub>|) ,&nbsp; n = S<sub>y</sub>/σ<sub>Tr</sub></div>
<p>In the σ<sub>A</sub>–σ<sub>B</sub> plane von Mises is an <b>ellipse</b>, Tresca an inscribed <b>hexagon</b> → Tresca is always equal or more conservative (max. difference 15.5 % in pure shear: τ<sub>y</sub> = 0.577 S<sub>y</sub> vs 0.5 S<sub>y</sub>).</p>
<p><b>Brittle materials (fracture)</b>, tensile strength S<sub>ut</sub> ≪ compressive strength S<sub>uc</sub>:</p>
<div class="formula">Rankine (max normal stress): σ₁ = S<sub>ut</sub> or σ₃ = −S<sub>uc</sub></div>
<div class="formula">Coulomb–Mohr (σ₁ ≥ 0 ≥ σ₃): σ₁/S<sub>ut</sub> − σ₃/S<sub>uc</sub> = 1/n</div>

build(sim){
 const Sy=round5(rnd(250,500));const Sut=round5(rnd(150,300)),Suc=round5(Sut*rnd(3,4));

 const A3=round5(Sut*rnd(0.2,0.55)),B3=-round5(Suc*rnd(0.3,0.7));const P3={a:A3,b:B3};const n3=1/(A3/Sut-B3/Suc),n3r=Math.min(Sut/A3,Suc/-B3);
 let mode='ductile',pts=[],probe=null;
 const C=makeCanvas(sim,680,450),ctx=C.ctx;
 const info=el('div',{class:'small',style:'margin-top:6px;min-height:40px'});sim.appendChild(info);
 const row=el('div',{class:'row'});const bm=el('button',{class:'btn sm'},'Switch to brittle material');row.appendChild(bm);sim.appendChild(row);
 bm.onclick=()=>{mode=mode==='ductile'?'brittle':'ductile';bm.textContent=mode==='ductile'?'Switch to brittle material':'Switch to ductile material';probe=null;draw();};
 let P;
 function draw(){C.clear();const rg=mode==='ductile'?[-1.45*Sy,1.45*Sy]:[-1.12*Suc,0.55*Suc];
  P=plotArea(ctx,60,15,400,400,rg,rg);P.axes('σA (MPa)','σB (MPa)',{zero:true});P.clip();
  const poly=(pts,col,fill)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(P.X(p[0]),P.Y(p[1])):ctx.moveTo(P.X(p[0]),P.Y(p[1])));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.stroke();};
  if(mode==='ductile'){
   ctx.beginPath();for(let i=0;i<=360;i++){const f=i*Math.PI/180,c=Math.cos(f),s=Math.sin(f),r=Sy/Math.sqrt(c*c-c*s+s*s);i?ctx.lineTo(P.X(r*c),P.Y(r*s)):ctx.moveTo(P.X(r*c),P.Y(r*s));}ctx.closePath();ctx.fillStyle='#4fc3f71a';ctx.fill();ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2.2;ctx.stroke();
   poly([[Sy,0],[Sy,Sy],[0,Sy],[-Sy,0],[-Sy,-Sy],[0,-Sy]],'#ffb74d');
   ctx.setLineDash([4,4]);ctx.strokeStyle='#ffffff40';ctx.beginPath();ctx.moveTo(P.X(-Sy*1.5),P.Y(Sy*1.5));ctx.lineTo(P.X(Sy*1.5),P.Y(-Sy*1.5));ctx.stroke();ctx.setLineDash([]);
  }else{
   poly([[-Suc,-Suc],[Sut,-Suc],[Sut,Sut],[-Suc,Sut]],'#ef5350');
   poly([[Sut,Sut],[Sut,0],[0,-Suc],[-Suc,-Suc],[-Suc,0],[0,Sut]],'#66bb6a','#66bb6a18');}
  ctx.restore();
  // legend
  const lx=478;let ly=30;const leg=(c,s)=>{ctx.fillStyle=c;ctx.fillRect(lx,ly-9,14,4);txt(ctx,s,lx+20,ly,'#c9d2e6');ly+=20;};

 }
 C.drag(p=>{if(!P.inside(p))return false;probe={a:Math.round(P.iX(p.x)),b:Math.round(P.iY(p.y))};desc();draw();},p=>{if(P.inside(p)){probe={a:Math.round(P.iX(p.x)),b:Math.round(P.iY(p.y))};desc();draw();}});
 function desc(){if(!probe){info.innerHTML='';return;}const{a,b}=probe;
  if(mode==='ductile')info.innerHTML=`Probe (σA, σB) = (${a}, ${b}) MPa → σ<sub>vM</sub> = ${fmt(vm(a,b),0)} MPa (n = ${fmt(Sy/vm(a,b),2)}), Tresca σ<sub>Tr</sub> = ${fmt(tr(a,b),0)} MPa (n = ${fmt(Sy/tr(a,b),2)})`;
  else{const s1=Math.max(a,b,0),s3=Math.min(a,b,0);const cm=s1/Sut-s3/Suc;info.innerHTML=`Probe (σA, σB) = (${a}, ${b}) MPa → σ₁ = ${s1}, σ₃ = ${s3}; Coulomb–Mohr n = ${fmt(1/cm,2)}, Rankine n = ${fmt(Math.min(s1>0?Sut/s1:Infinity,s3<0?Suc/-s3:Infinity),2)}`;}}
 const setPts=a=>{pts=a;draw();};

 const corr=lbl(c1v,c1t);

  {type:'choice',q:`Stress state <b>P1 = (σA, σB) = (${P1.a}, ${P1.b}) MPa</b> in steel with S<sub>y</sub> = ${Sy} MPa. What do the criteria predict?`,onShow:()=>{mode='ductile';setPts([{...P1,lab:'P1',col:'#ffd54f',mode:'ductile'}]);},

  tbl.querySelectorAll('tr[data-i]').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;upd();});}
 upd();
 return{tasks:[

<p><b>Mean-stress criteria</b> (Haigh diagram), safety factor n:</p>
<div class="formula">Goodman: σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>ut</sub> = 1/n<br>Gerber: nσ<sub>a</sub>/S<sub>e</sub> + (nσ<sub>m</sub>/S<sub>ut</sub>)² = 1<br>Soderberg: σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>y</sub> = 1/n</div>
<p><b>S–N curve (Basquin)</b> for 10³ ≤ N ≤ 10⁶: S = a·N<sup>b</sup>, through 0.9S<sub>ut</sub> at 10³ and S<sub>e</sub> at 10⁶:</p>
<div class="formula">b = −log₁₀(0.9S<sub>ut</sub>/S<sub>e</sub>)/3 &nbsp;&nbsp; a = (0.9S<sub>ut</sub>)²/S<sub>e</sub> &nbsp;&nbsp; N = (σ<sub>ar</sub>/a)<sup>1/b</sup></div>
<p>With mean stress use the Goodman-equivalent fully reversed amplitude <b>σ<sub>ar</sub> = σ<sub>a</sub>/(1 − σ<sub>m</sub>/S<sub>ut</sub>)</b>. If σ<sub>ar</sub> ≤ S<sub>e</sub> (n ≥ 1) → infinite life (steels).</p>`,
takeaway:'Apply Kt (Kf) to the nominal stresses, split into σa and σm, then check the Haigh diagram; if n<1 estimate life with Basquin.',
build(sim){
 let Sut,Sy,Se,dW,Kt,smax,smin,sa,sm,nG,ok=false;
 for(let k=0;k<300&&!ok;k++){Sut=round5(rnd(600,1000));Sy=round5(Sut*rnd(0.65,0.8));Se=round5(Sut*rnd(0.38,0.48));dW=Math.round(rnd(0.1,0.5)*100)/100;Kt=KtHole(dW);

 const C=makeCanvas(sim,680,520),ctx=C.ctx;
 const PK=plotArea(ctx,405,20,255,180,[0,0.65],[1.8,3.1]);const PH=plotArea(ctx,60,265,300,205,[0,Sut*1.05],[0,Se*1.45]);const PS=plotArea(ctx,440,265,220,205,[3,7],[0,Sut]);
 function draw(){C.clear();const kt=KtHole(S.dW),la=kt*(S.smax-S.smin)/2,lm=kt*(S.smax+S.smin)/2;
  // plate with Kirsch field (visual)

   ctx.fillStyle=heat(sxx/3);ctx.fillRect(x,y,4,4);}
  ctx.strokeStyle='#e6ebf5';ctx.lineWidth=1.5;ctx.strokeRect(x0,y0,x1-x0,y1-y0);dot(ctx,cx,cy,a,'#0c111b','#e6ebf5');
  for(let i=0;i<5;i++){const y=y0+12+i*34;arrow(ctx,x0-2,y,x0-16,y,'#ffb74d',1.5,5);arrow(ctx,x1+2,y,x1+16,y,'#ffb74d',1.5,5);}
  txt(ctx,'σxx field (Kirsch shape, visual)',x0,y0-8,'#9aa6bf','11px system-ui');txt(ctx,`Kt = ${fmt(kt,3)}`,cx,y1+18,'#ffd54f','bold 13px system-ui','center');
  ctx.strokeStyle='#9aa6bf';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1+22,y0);ctx.lineTo(x1+22,y1);ctx.stroke();txt(ctx,'W',x1+26,cy,'#9aa6bf');

function gsolve(A,b){const n=b.length;A=A.map(r=>r.slice());b=b.slice();for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
 for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x;}
defLevel({id:'w2l1',world:2,title:'Stiffness Matrix Assembly',short:'Assemble K from spring elements, apply BCs, solve K·u = F',
concept:`<p>The FEM turns a structure into elements connected at nodes. For a 1-D spring/bar element between nodes i and j:</p>
<div class="formula">k<sup>(e)</sup> = k · [ 1 −1 ; −1 1 ] &nbsp;&nbsp; (bar: k = EA/L)</div>
<p><b>Assembly</b>: each entry of the element matrix is <i>added</i> to the global matrix at the rows/columns of its global node numbers: k₁₁→K<sub>ii</sub>, k₁₂→K<sub>ij</sub>, k₂₁→K<sub>ji</sub>, k₂₂→K<sub>jj</sub>. Node numbering does not need to follow the geometry!</p>
<div class="formula">K · u = F</div>
<p>Before boundary conditions K is <b>singular</b> (det K = 0): the structure can translate as a rigid body. Applying <b>u = 0 at fixed nodes</b> = deleting those rows and columns. Solve the reduced system for the free displacements, then recover the <b>reactions</b> from the deleted rows: R = K<sub>row</sub>·u.</p>`,
takeaway:'Element matrices are scattered into the global matrix using the connectivity table; BCs remove rigid-body modes so K becomes invertible.',
build(sim){
 const ks=[rint(2,10)*50,rint(2,10)*50,rint(2,10)*50];const perm=shuffle([1,2,3,4]);const NN={A:perm[0],B:perm[1],C:perm[2],D:perm[3]};
 const els=[['A','B'],['B','C'],['C','D']].map((p,e)=>({e:e+1,k:ks[e],i:NN[p[0]],j:NN[p[1]],done:new Set()}));
 const ln=pick(['B','C']);const F=rint(1,5)*1000;
 const K=[0,1,2,3].map(()=>[0,0,0,0]);let selE=null,mistakes=0,fixed=new Set(),bcMode=false,solved=false;
 const Kfull=[0,1,2,3].map(()=>[0,0,0,0]);els.forEach(E=>{const i=E.i-1,j=E.j-1;Kfull[i][i]+=E.k;Kfull[j][j]+=E.k;Kfull[i][j]-=E.k;Kfull[j][i]-=E.k;});
 const free=[1,2,3,4].filter(n=>n!==NN.A&&n!==NN.D);const Fv=free.map(n=>n===NN[ln]?F:0);
 const uf=gsolve(free.map(r=>free.map(c=>Kfull[r-1][c-1])),Fv);const U=[0,0,0,0];free.forEach((n,k)=>U[n-1]=uf[k]);
 const RA=Kfull[NN.A-1].reduce((s,v,c)=>s+v*U[c],0);
 sim.appendChild(el('div',{class:'small mut'},`Three springs between two rigid walls. Stiffnesses in N/mm, force F = ${F} N at the node marked in orange. Node numbers are the <b>global</b> numbers (deliberately not in geometric order).`));
 const C=makeCanvas(sim,680,190),ctx=C.ctx;
 function draw(){C.clear();const xs=[90,250,410,570],y=95;const ord=['A','B','C','D'];
  ctx.fillStyle='#56627e';ctx.fillRect(40,45,18,100);ctx.fillRect(622,45,18,100);
  ctx.strokeStyle='#78909c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(58,y);ctx.lineTo(xs[0],y);ctx.moveTo(xs[3],y);ctx.lineTo(622,y);ctx.stroke();
  const sc=solved?Math.min(60/Math.max(...U.map(Math.abs)),1e4):0;const dx=ord.map(p=>sc*U[NN[p]-1]);
  for(let e=0;e<3;e++){const xa=xs[e]+dx[e]+12,xb=xs[e+1]+dx[e+1]-12;ctx.strokeStyle=els[e].done.size===4?'#4fc3f7':'#9aa6bf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xa,y);
   const nz=10;for(let z=1;z<nz;z++)ctx.lineTo(xa+(xb-xa)*z/nz,y+(z%2?-12:12));ctx.lineTo(xb,y);ctx.stroke();
   txt(ctx,`e${e+1}: k=${els[e].k}`,(xs[e]+xs[e+1])/2,y-26,'#c9d2e6','12px system-ui','center');
   if(solved){const f=els[e].k*(U[els[e].j-1]-U[els[e].i-1])*(NN[ord[e+1]]===els[e].j?1:-1);txt(ctx,`N=${fmt(f,0)} N`,(xs[e]+xs[e+1])/2,y+34,f>=0?'#ef5350':'#42a5f5','11px system-ui','center');}}
  ord.forEach((p,k)=>{const n=NN[p];const fx=fixed.has(n);dot(ctx,xs[k]+dx[k],y,13,fx?'#7a3236':'#24324d',p===ln?'#ffb74d':'#4fc3f7');txt(ctx,n,xs[k]+dx[k],y+1,'#fff','bold 13px system-ui','center','middle');
   if(solved)txt(ctx,'u='+fmt(U[n-1],3),xs[k]+dx[k],y+58,'#ffd54f','11px system-ui','center');});
  const k=ord.indexOf(ln);arrow(ctx,xs[k]+16,y-40,xs[k]+70,y-40,'#ffb74d',3);txt(ctx,'F = '+F+' N',xs[k]+16,y-48,'#ffb74d','bold 12px system-ui');
  if(solved)txt(ctx,'deformed shape (exaggerated); N>0 tension',340,180,'#9aa6bf','11px system-ui','center');}
 const chips=el('div',{style:'margin-top:8px'});sim.appendChild(chips);
 const msg=el('div',{class:'small',style:'min-height:22px;margin:4px 0'});
 const gridBox=el('div');sim.appendChild(gridBox);sim.appendChild(msg);
 function renderChips(){chips.innerHTML='<span class="small mut">Element connectivity table: </span>';els.forEach(E=>{const c=el('span',{class:'chip'+(selE===E?' sel':'')+(E.done.size===4?' done':'')},`e${E.e}: nodes ${E.i}–${E.j}, k=${E.k}`);
  c.onclick=()=>{if(E.done.size===4||bcMode)return;selE=E;renderChips();renderGrid();msg.innerHTML=`Element e${E.e} connects global nodes ${E.i} and ${E.j}: click the 4 cells of K where its entries [+k −k; −k +k] go.`;};chips.appendChild(c);});}
 function renderGrid(){gridBox.innerHTML='';const g=el('div',{class:'mat',style:'grid-template-columns:repeat(5,auto)'});
  g.appendChild(el('div',{class:'hdr'},'K'));for(let c=1;c<=4;c++)g.appendChild(el('div',{class:'hdr'},'u'+c));
  for(let r=1;r<=4;r++){const h=el('div',{class:'hdr',style:bcMode?'cursor:pointer;color:#ffb74d':''},(fixed.has(r)?'🔒 ':'')+'row '+r);h.onclick=()=>{if(!bcMode)return;fixed.has(r)?fixed.delete(r):fixed.add(r);renderGrid();draw();};g.appendChild(h);
   for(let c=1;c<=4;c++){const v=K[r-1][c-1];const d=el('div',{class:(fixed.has(r)||fixed.has(c))?'bc':''},v===0?'<span class="mut">0</span>':fmt(v,0));
    if(selE&&(selE.done.has(r+','+c)))d.classList.add('hl');
    d.onclick=()=>cell(r,c);g.appendChild(d);}}
  gridBox.appendChild(g);}
 function cell(r,c){if(bcMode){msg.innerHTML='Click the <b>row labels</b> to mark fixed DOFs.';return;}if(!selE){msg.innerHTML='First pick an element from the connectivity table.';return;}
  const E=selE,key=r+','+c;const ok=(r===E.i||r===E.j)&&(c===E.i||c===E.j);
  if(!ok){mistakes++;msg.innerHTML=`❌ Cell (${r},${c}) does not belong to e${E.e}: its entries only go to rows/columns ${E.i} and ${E.j}.`;return;}
  if(E.done.has(key)){msg.innerHTML='Already added.';return;}
  E.done.add(key);K[r-1][c-1]+=r===c?E.k:-E.k;msg.innerHTML=`✔ Added ${r===c?'+':'−'}${E.k} to K(${r},${c}). ${r===c?'Diagonal: +k':'Off-diagonal coupling: −k'}`;
  if(E.done.size===4){selE=null;msg.innerHTML+=` · e${E.e} fully assembled!`;}renderChips();renderGrid();draw();}
 renderChips();renderGrid();draw();
 const red=el('div',{class:'small',style:'margin-top:6px'});sim.appendChild(red);
 return{tasks:[
  {type:'action',q:'<b>Assemble the global stiffness matrix.</b> Pick an element, then click the 4 cells of K where its entries go. Repeat for all elements, then submit.',btn:'Check assembly',
   check:()=>{const all=els.every(E=>E.done.size===4);if(!all)return{ok:false,msg:'Not all elements are fully assembled yet.'};return{ok:true,partial:Math.max(0.4,1-0.15*mistakes),msg:`Assembled with ${mistakes} misplaced click(s). Note each row sums to zero → K is singular (rigid-body translation u = [1,1,1,1] gives zero force).`};},
   tries:99,explain:'Diagonal K<sub>ii</sub> = sum of stiffnesses connected to node i; off-diagonal K<sub>ij</sub> = −k of the element joining i and j (0 if not connected).'},
  {type:'action',q:'<b>Apply the boundary conditions</b>: both walls are fixed (u = 0). Click the <b>row labels</b> of the fixed DOFs, then submit.',btn:'Apply BCs',onShow:()=>{bcMode=true;selE=null;renderChips();renderGrid();msg.innerHTML='Click the row labels to lock DOFs (rows/columns are removed).';},
   check:()=>{const want=[NN.A,NN.D].sort().join();const got=[...fixed].sort().join();return{ok:want===got,msg:want===got?`Rows/columns ${NN.A} and ${NN.D} are removed; the remaining 2×2 system is non-singular.`:'Those are not (only) the nodes attached to the walls. Look at the sketch: which global numbers sit at the walls?'};},
   reveal:()=>`fixed nodes: ${NN.A} and ${NN.D}`,onDone:()=>{fixed=new Set([NN.A,NN.D]);renderGrid();draw();}},
  numTask(()=>`Reduced system (free DOFs ${free.join(', ')}):<br><span class="formula" style="display:block">[${free.map(r=>free.map(c=>Kfull[r-1][c-1]).join('  ')).join(' ; ')}] · [u${free[0]} ; u${free[1]}] = [${Fv.join(' ; ')}]</span>Solve for the <b>displacement of the loaded node ${NN[ln]}</b>.`,U[NN[ln]-1],{unit:'mm',tol:0.02,dec:4,
   explain:`Solving the 2×2 system: u${free[0]} = ${fmt(uf[0],4)} mm, u${free[1]} = ${fmt(uf[1],4)} mm.`,hint:'2×2 inverse: [a b; c d]⁻¹ = 1/(ad−bc)·[d −b; −c a]',onDone:()=>{solved=true;draw();}}),
  numTask(()=>`Recover the <b>reaction force at node ${NN.A}</b> (left wall) from row ${NN.A} of the full K: R = Σ K<sub>${NN.A}j</sub>·u<sub>j</sub>. Sign: + = pointing in +x (right).`,RA,{unit:'N',tol:0.02,dec:1,
   explain:`R<sub>${NN.A}</sub> = −k₁·u<sub>${NN.B}</sub> = ${fmt(RA,1)} N. The two wall reactions sum to −F = ${-F} N (equilibrium check!).`}),
  {type:'choice',q:'Why could K not be inverted before the boundary conditions were applied?',opts:[
   {t:'The structure could move as a rigid body – zero-energy mode, det K = 0',ok:true,why:'K·[1,1,1,1]ᵀ = 0: a rigid translation needs no force, so K has a zero eigenvalue. Every FE model must suppress all rigid-body modes (6 in 3-D).'},
   {t:'The springs had different stiffnesses',why:'Different stiffnesses are fine; singularity comes from missing supports.'},
   {t:'The node numbering was not sequential',why:'Numbering only affects bandwidth/efficiency, not singularity.'},

 ]};}});

defLevel({id:'w2l2',world:2,title:'Mesh Convergence Lab',short:'h-refinement on a plate with hole vs a singular re-entrant corner',
concept:`<p>The FE solution approaches the exact solution as elements get smaller (<b>h-refinement</b>) or higher order (<b>p-refinement</b>). Displacements converge fastest; <b>stresses</b> (derivatives of displacements) converge more slowly, so do a <b>mesh convergence study</b>: refine until the quantity of interest changes by less than ~2–5 %.</p>
<div class="formula">Plate with hole: σ<sub>peak</sub> → K<sub>t</sub>·σ<sub>nom</sub> (finite, convergent)</div>
<p>At a <b>sharp re-entrant corner</b> linear-elastic theory predicts infinite stress (Williams): σ ∝ r<sup>λ−1</sup>. For a 90° re-entrant corner (270° material wedge) λ ≈ 0.544:</p>
<div class="formula">σ ∝ r<sup>−0.456</sup> &nbsp;&nbsp; → halving the element size raises the peak by 2<sup>0.456</sup> ≈ 1.37 – forever.</div>
<p>Such <b>singularities</b> also occur at point loads, point supports and sharp contact edges. The peak value there is a mesh artefact, not a result. Model the real fillet radius, or assess the stress away from the singularity (St-Venant), or use fracture-mechanics/hot-spot methods.</p>
<p class="mut small">Note: the FE peak values in this lab come from a realistic convergence model (not a live solver).</p>`,
takeaway:'Converged stress = refine until changes are small. A value that keeps growing with refinement is a singularity – do not report it.',
build(sim){
 const dW=Math.round(rnd(0.15,0.45)*100)/100,Kt=KtHole(dW),sn=round5(rnd(60,150)),sth=Kt*sn;
 const ns=[2,4,8,16,32,64];let geo='hole',lv={hole:0,L:0};const hist={hole:{},L:{}};
 const sFE=(g,n)=>g==='hole'?sth*(1-0.6*Math.pow(2/n,1.8)):sn*1.6*Math.pow(n/2,0.456);
 const nel=(g,n)=>g==='hole'?n*Math.max(1,n/2):3*n*n;
 const C=makeCanvas(sim,680,400),ctx=C.ctx;
 const row=el('div',{class:'row'});sim.appendChild(row);
 const bC=el('button',{class:'btn'},'− Coarsen'),bR=el('button',{class:'btn pri'},'+ Refine (h/2)'),bG=el('button',{class:'btn'},'Switch to L-bracket');row.append(bC,bR,bG);
 const info=el('div',{class:'small',style:'margin-top:6px'});sim.appendChild(info);
 bR.onclick=()=>{if(lv[geo]<ns.length-1)lv[geo]++;solve();};bC.onclick=()=>{if(lv[geo]>0)lv[geo]--;solve();};
 bG.onclick=()=>{geo=geo==='hole'?'L':'hole';bG.textContent=geo==='hole'?'Switch to L-bracket':'Switch to plate with hole';solve();};
 function solve(){const n=ns[lv[geo]];hist[geo][n]=sFE(geo,n);draw();
  const ks=Object.keys(hist[geo]).map(Number).sort((a,b)=>a-b);
  info.innerHTML=`<b>${geo==='hole'?'Plate with hole':'L-bracket (sharp corner)'}</b> · σ<sub>nom</sub> = ${sn} MPa${geo==='hole'?' · d/W = '+dW:''} · history: `+ks.map((k,i)=>{const v=hist[geo][k];const p=hist[geo][ks[i-1]];return`${nel(geo,k)} el → <b>${fmt(v,1)}</b> MPa${p&&ks[i-1]===k/2?` (${v>p?'+':''}${fmt(100*(v-p)/p,1)} %)`:''}`;}).join(' · ');}
 function draw(){C.clear();const n=ns[lv[geo]];const x0=30,y0=40,S=300;
  if(geo==='hole'){const a=dW*S,m=Math.max(1,n/2);const node=(i,j)=>{const th=Math.PI/2*i/n;const ix=a*Math.cos(th),iy=a*Math.sin(th);let ox,oy;if(th<=Math.PI/4){ox=S;oy=S*Math.tan(th);}else{ox=S/Math.tan(th);oy=S;}const s=Math.pow(j/m,1.6);return[x0+ix+s*(ox-ix),y0+S-(iy+s*(oy-iy))];};
   for(let i=0;i<n;i++)for(let j=0;j<m;j++){const p=[node(i,j),node(i+1,j),node(i+1,j+1),node(i,j+1)];const cx=(p[0][0]+p[2][0])/2-x0,cy=y0+S-(p[0][1]+p[2][1])/2;const r=Math.hypot(cx,cy),th=Math.atan2(cy,cx);

defLevel({id:'w2l3',world:2,title:'Shape Functions & Element Types',short:'Linear vs quadratic interpolation, partition of unity, shear locking',
concept:`<p>Inside an element the field is interpolated from nodal values with <b>shape functions</b> N<sub>i</sub>(ξ) in natural coordinates ξ ∈ [−1, 1]:</p>
<div class="formula">u(ξ) = Σ N<sub>i</sub>(ξ)·u<sub>i</sub></div>
<div class="formula">Linear (2 nodes): N₁ = (1−ξ)/2, &nbsp;N₂ = (1+ξ)/2</div>
<div class="formula">Quadratic (3 nodes, ξ = −1, 0, +1): N₁ = ξ(ξ−1)/2, &nbsp;N₂ = 1−ξ², &nbsp;N₃ = ξ(ξ+1)/2</div>
<p>Properties: N<sub>i</sub> = 1 at its own node and 0 at the others (Kronecker-δ), and <b>Σ N<sub>i</sub> = 1</b> everywhere (partition of unity → rigid-body motion and constant strain represented exactly).</p>
<p>Linear elements have constant strain (1-D) and cannot represent curvature. A fully integrated 4-node quad (Q4) in bending keeps straight edges, which creates <b>parasitic shear strain</b> → artificially stiff: <b>shear locking</b>. Remedies: quadratic elements (Q8/20-node hex), reduced integration (+ hourglass control), incompatible modes, or several elements through thickness.</p>
<p>Compatible displacement-based elements are <b>too stiff</b>: displacements and strain energy converge from below.</p>`,
takeaway:'Shape functions interpolate nodal values; quadratic elements capture curvature and avoid shear locking in bending.',
build(sim){
 const N1=x=>(1-x)/2,N2=x=>(1+x)/2,Q1=x=>x*(x-1)/2,Q2=x=>1-x*x,Q3=x=>x*(x+1)/2;

 const x2=pick([-0.7,-0.5,-0.3,0.3,0.5,0.7]);const a2=Q1(x2);
 const tq=[Math.round(rnd(-2,2.5)*4)/4,Math.round(rnd(-2,2.5)*4)/4,Math.round(rnd(-2,2.5)*4)/4];{const av=(tq[0]+tq[2])/2;if(Math.abs(tq[1]-av)<0.75)tq[1]=av+(av>0.25?-1.25:1.25);}
 const C=makeCanvas(sim,680,450),ctx=C.ctx;
 const PS=plotArea(ctx,50,30,270,200,[-1.1,1.1],[-0.3,1.15]),PU=plotArea(ctx,390,30,270,200,[-1.1,1.1],[-3,3.5]);

  PS.line(x=>fs.reduce((s,f)=>s+f[0](x),0),-1,1,'#ffffff66',1.2,50,[4,4]);txt(ctx,'Σ Nᵢ',PS.x+PS.w-40,PS.Y(1)-6,'#ffffffaa','11px system-ui');
  PU.axes('ξ','u(ξ)',{zero:true,nx:4,ny:6,yoff:30});
  if(tgt){PU.line(x=>Q1(x)*tgt[0]+Q2(x)*tgt[1]+Q3(x)*tgt[2],-1,1,'#ef5350',2,200,[6,4]);txt(ctx,'target field',PU.x+8,PU.y+14,'#ef5350','11px system-ui');}
  PU.line(uf,-1,1,'#4fc3f7',2.5);const ns=nodes();ns.forEach((x,k)=>{const v=mode==='lin'?u[k===0?0:1]:u[k];dot(ctx,PU.X(x),PU.Y(v),8,'#ffd54f','#0c111b');txt(ctx,fmt(v,2),PU.X(x)+10,PU.Y(v)-8,'#ffd54f','11px system-ui');});
  txt(ctx,'drag the yellow nodal values',PU.x+PU.w,PU.y+PU.h+44,'#9aa6bf','10.5px system-ui','right');
  // locking illustration
  const yb=345;txt(ctx,'Pure bending of one element:',20,272,'#c9d2e6','bold 12px system-ui');
  ctx.save();ctx.translate(170,yb);ctx.strokeStyle='#66bb6a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,260,215,-Math.PI/2-0.32,-Math.PI/2+0.32);ctx.stroke();ctx.beginPath();ctx.arc(0,260,285,-Math.PI/2-0.3,-Math.PI/2+0.3);ctx.stroke();
  for(const s of[-1,1]){const a=-Math.PI/2+s*0.31;ctx.beginPath();ctx.moveTo(215*Math.cos(a),260+215*Math.sin(a));ctx.lineTo(285*Math.cos(a),260+285*Math.sin(a));ctx.stroke();}ctx.restore();
  txt(ctx,'exact: curved edges, right angles kept (γ = 0)',170,440,'#66bb6a','11.5px system-ui','center');
  ctx.save();ctx.translate(500,yb);ctx.strokeStyle='#ef5350';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-60,-25);ctx.lineTo(60,-25);ctx.lineTo(80,35);ctx.lineTo(-80,35);ctx.closePath();ctx.stroke();
  ctx.strokeStyle='#ffb74d';ctx.lineWidth=1;ctx.beginPath();ctx.arc(60,-25,14,Math.PI/2-0.32,Math.PI/2+0.0);ctx.stroke();txt(ctx,'γ ≠ 0',80,-22,'#ffb74d','11px system-ui');ctx.restore();

 const row=el('div',{class:'row'});const bl=el('button',{class:'btn sm'},'Linear element'),bq=el('button',{class:'btn sm'},'Quadratic element');row.append(bl,bq);sim.appendChild(row);
 const setMode=m=>{mode=m;bl.className='btn sm'+(m==='lin'?' pri':'');bq.className='btn sm'+(m==='quad'?' pri':'');draw();};bl.onclick=()=>setMode('lin');bq.onclick=()=>setMode('quad');
 setMode('lin');
 return{tasks:[
  numTask(`<b>Linear element</b> with nodal values u₁ = ${t1[0]}, u₂ = ${t1[1]} (set in the plot). What is u at <b>ξ = ${x1}</b>?`,a1,{abs:0.02,tol:0,onShow:()=>{u=[t1[0],t1[1],0];setMode('lin');},explain:`N₁(${x1}) = ${fmt(N1(x1),3)}, N₂ = ${fmt(N2(x1),3)} → u = ${fmt(a1,3)}. Linear interpolation = straight line between the nodes.`}),
  numTask(`<b>Quadratic element</b>: evaluate the corner shape function <b>N₁(ξ) = ξ(ξ−1)/2 at ξ = ${x2}</b>.`,a2,{abs:0.005,tol:0,dec:3,onShow:()=>{setMode('quad');},explain:`N₁(${x2}) = ${x2}·(${x2}−1)/2 = ${fmt(a2,4)}. ${a2<0?'Yes, quadratic corner functions go negative between the other nodes – that is fine.':'Corner functions of quadratic elements are not monotonic: they turn negative for ξ > 0.'}`}),
  {type:'action',q:'Drag the three nodal values of the <b>quadratic element</b> so that it reproduces the red <b>target field</b> exactly, then submit.',btn:'Submit fit',onShow:()=>{tgt=tq;u=[0,0,0];setMode('quad');},
   check:()=>{const e=Math.max(...[0,1,2].map(k=>Math.abs(u[k]-tq[k])));return{ok:e<=0.1,msg:e<=0.1?'A quadratic field is reproduced exactly by quadratic shape functions once the nodal values match.':`Max nodal deviation ${fmt(e,2)} – the curve is fully defined by its three nodal values; match each node.`};},
   reveal:()=>`nodal values ${tq.join(', ')}`,explain:'A linear element could only produce the chord between the end nodes – to capture this curvature you would need several linear elements.'},
  {type:'choice',q:'Why must the shape functions of an element sum to 1 at every point (dashed line)?',opts:[
   {t:'So that a rigid-body translation (all u<sub>i</sub> equal) is reproduced exactly without strain',ok:true,why:'If all nodes move by c, u(ξ) = c·ΣN<sub>i</sub> = c → zero strain. Without this, rigid motion would generate fake stresses; it is part of the completeness requirement for convergence.'},
   {t:'To make the stiffness matrix symmetric',why:'Symmetry comes from the energy formulation (BᵀDB), not from ΣN = 1.'},
   {t:'So that the element mass is conserved',why:'Mass matrices use N too, but the essential reason is representing rigid motion/constant states.'},

  {type:'choice',q:'A thin cantilever is meshed with <b>one layer of fully integrated linear Q4</b> elements. The tip deflection is far below the beam-theory value. Why, and what helps?',opts:[

  {type:'choice',q:'With compatible displacement-based elements, how does the computed displacement typically behave as the mesh is refined?',opts:[

defLevel({id:'w2l4',world:2,title:'Boundary Condition Detective',short:'Spot rigid-body motion, over-constraints, point loads, unit errors',
concept:`<p>Most bad FE results are not solver errors but <b>modelling errors</b>. Checklist:</p>
<ul><li><b>Under-constrained</b>: any rigid-body mode left (3 in 2-D, 6 in 3-D) → singular K ("zero pivot", "numerical singularity", huge displacements).</li>
<li><b>Over-constrained</b>: fixing more DOFs than reality (e.g. clamped faces, blocking Poisson contraction, wrong symmetry BCs) → too stiff, artificial stress peaks at supports.</li>
<li><b>Symmetry plane</b>: constrain only the displacement <i>normal</i> to the plane (and the in-plane rotations for shells/beams).</li>
<li><b>Point loads / point supports</b> on solids → singular stress (infinite in theory). Distribute the load over the real contact area; evaluate away from it (St-Venant).</li>
<li><b>Units</b>: FE codes are unit-less, so use a consistent set:</li></ul>
<div class="formula">mm – N – MPa (N/mm²) – tonne (t) – s &nbsp;&nbsp;→ steel E = 210 000, ρ = 7.85·10⁻⁹ t/mm³<br>m – N – Pa – kg – s &nbsp;&nbsp;→ steel E = 210·10⁹, ρ = 7850 kg/m³</div>
<p>Always sanity-check: reaction forces = applied loads, deformation plot plausible, hand calculation within the right order of magnitude.</p>`,
takeaway:'Constrain exactly the rigid-body modes reality constrains, avoid point loads on solids, and use a consistent unit system.',

   txt(ctx,'symmetry edges: UX = UY = 0 (all DOF fixed)',340,295,'#ef5350','12px system-ui','center');for(let k=0;k<4;k++)arrow(ctx,482,100+k*45,530,100+k*45,'#ffb74d',2);txt(ctx,'Quarter model of plate with hole',340,50,'#c9d2e6','13px system-ui','center');},
