<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress Quest – Strength, FEA &amp; Reliability</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1e2739;--line:#2c3850;--txt:#e6ebf5;--mut:#9aa6bf;--acc:#4fc3f7;--acc2:#ffb74d;--ok:#66bb6a;--bad:#ef5350;--w1:#4fc3f7;--w2:#ba68c8;--w3:#ffb74d;--star:#ffd54f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0b0f18;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px;cursor:pointer}
header h1 span{color:var(--acc2)}
header .sp{flex:1}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;transition:.15s}
.btn:hover{border-color:var(--acc);background:#243049}
.btn.pri{background:var(--acc);color:#04131c;border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:1280px;margin:0 auto;padding:18px}
.stars{color:var(--star);letter-spacing:2px}
.stars .off{color:#3a4560}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.world{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.world h2{margin:0 0 4px;font-size:19px}
.world p.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.world svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.25}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;position:relative;transition:.15s}
.lvl:hover{transform:translateX(4px);border-color:var(--acc)}
.lvl.locked{opacity:.45;cursor:not-allowed}
.lvl.locked:hover{transform:none;border-color:var(--line)}
.lvl .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b0f18;flex:none}
.lvl .t{flex:1}
.lvl .t b{display:block;font-size:14.5px}
.lvl .t small{color:var(--mut)}
.boss{margin-top:18px;background:linear-gradient(120deg,#3a1c1c,#1d2133);border:1px solid #7a3a3a;border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.boss h2{margin:0;font-size:19px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hero p{margin:0;color:var(--mut);max-width:780px}
.prog{height:8px;background:#26304a;border-radius:4px;overflow:hidden;min-width:160px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--w1),var(--w2),var(--w3))}
.levelwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.levelwrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:16px}
.lvhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lvhead h2{margin:0;font-size:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#26304a;color:var(--mut)}
canvas{width:100%;display:block;background:#0c111b;border-radius:10px;border:1px solid var(--line);touch-action:none}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}
.ctrl input[type=range]{width:100%}
.ctrl output{min-width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.task .q{font-size:15px;margin-bottom:10px}
.task .q b{color:var(--acc2)}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ansrow input{background:#0c111b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;width:150px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{text-align:left}
.choices .btn.right{border-color:var(--ok);background:#1d3a24}
.choices .btn.wrong{border-color:var(--bad);background:#3a1d1f}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.fb.ok{display:block;background:#18301f;border:1px solid #2f6a3a}
.fb.bad{display:block;background:#33191b;border:1px solid #7a3236}
.fb.info{display:block;background:#1a2640;border:1px solid #2f4a7a}
.tprog{display:flex;gap:5px;margin-bottom:10px}
.tprog i{flex:1;height:6px;border-radius:3px;background:#26304a}
.tprog i.done{background:var(--ok)}.tprog i.half{background:var(--acc2)}.tprog i.miss{background:var(--bad)}.tprog i.cur{background:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal h2{margin-top:0}
.formula{background:#0c111b;border-left:3px solid var(--acc2);padding:8px 12px;border-radius:6px;margin:8px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:16.5px;overflow-x:auto}
.mut{color:var(--mut)}
.small{font-size:13px}
table.dt{border-collapse:collapse;font-size:13px;width:100%}
table.dt td,table.dt th{border:1px solid var(--line);padding:3px 6px;text-align:right}
table.dt th{background:#212b40;color:var(--mut)}
.mat{display:inline-grid;gap:3px;margin:6px 0}
.mat div{min-width:58px;height:34px;display:grid;place-items:center;background:#0c111b;border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.mat div:hover{border-color:var(--acc)}
.mat div.hl{background:#173247;border-color:var(--acc)}
.mat div.bc{background:#3a1d1f;color:#a77}
.mat .hdr{background:none;border:none;color:var(--mut);cursor:default}
.chip{display:inline-block;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;margin:3px;font-size:13px;user-select:none}
.chip.sel{border-color:var(--acc);background:#173247}
.chip.done{opacity:.4;cursor:default}
.gloss{columns:2 420px;column-gap:18px}
.gloss .card{break-inside:avoid;margin-bottom:16px}
.gloss .formula{font-size:15px}
.secttl{margin:20px 0 10px;font-size:18px}
.results{text-align:center}
.results .big{font-size:46px;color:var(--star);letter-spacing:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243049;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;z-index:60}
.legend{font-size:12.5px;color:var(--mut);margin-top:6px}
.legend b{font-weight:600}
svg text{font-family:system-ui,sans-serif}
.dlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
select{background:#0c111b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
</style>
</head>
<body>
<header>
  <h1 id="logo" title="Back to map">⚙ Stress <span>Quest</span></h1>
  <div class="sp"></div>
  <span id="hdrStars" class="stars"></span>
  <button class="btn" id="bMap">🗺 Map</button>
  <button class="btn" id="bGloss">📘 Cheat sheet</button>
  <button class="btn" id="bSet">⚙</button>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<script>
"use strict";
/* ================= Utilities ================= */
const $=s=>document.querySelector(s);
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='style')e.style.cssText=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(x,d){if(d==null)d=2;if(!isFinite(x))return '∞';const a=Math.abs(x);if(a!==0&&(a>=1e6||a<1e-3))return x.toExponential(Math.max(1,d));return (+x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}
function sig(x,n){if(x===0)return 0;const p=Math.pow(10,n-1-Math.floor(Math.log10(Math.abs(x))));return Math.round(x*p)/p;}
const round5=x=>Math.round(x/5)*5;
function erf(x){// Abramowitz-Stegun 7.1.26 (|err|<1.5e-7)
 const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
 const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function PhiInv(p){// Acklam's algorithm
 const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
 b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
 c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549671671163525e+00,4.374664141464968e+00,2.938163982698783e+00],
 d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
 const pl=0.02425;let q,r;
 if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gammaFn(z){// Lanczos
 if(z<0.5)return Math.PI/(Math.sin(Math.PI*z)*gammaFn(1-z));z-=1;const g=7,p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
 let x=p[0];for(let i=1;i<g+2;i++)x+=p[i]/(z+i);const t=z+g+0.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x;}
function linreg(xs,ys){const n=xs.length;let sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}const m=(n*sxy-sx*sy)/(n*sxx-sx*sx);return{m,b:(sy-m*sx)/n};}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const stdev=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));};

/* ================= Canvas helpers ================= */
function makeCanvas(parent,W,H){
 const cv=el('canvas');const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=W+'/'+H;
 parent.appendChild(cv);const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 const C={cv,ctx,W,H,
  pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};},
  clear(){ctx.clearRect(0,0,W,H);},
  drag(down,move,up){let act=false;
   cv.addEventListener('pointerdown',e=>{const p=C.pos(e);if(down(p)!==false){act=true;cv.setPointerCapture(e.pointerId);e.preventDefault();}});
   cv.addEventListener('pointermove',e=>{const p=C.pos(e);if(act)move(p);else if(C.hover)C.hover(p);});
   cv.addEventListener('pointerup',e=>{if(act){act=false;up&&up();}});
   cv.addEventListener('pointerleave',()=>{if(!act&&C.hover)C.hover(null);});}
 };return C;}
function plotArea(ctx,x,y,w,h,xr,yr){
 const P={x,y,w,h,xr,yr,
  X:v=>x+(v-xr[0])/(xr[1]-xr[0])*w, Y:v=>y+h-(v-yr[0])/(yr[1]-yr[0])*h,
  iX:px=>xr[0]+(px-x)/w*(xr[1]-xr[0]), iY:py=>yr[0]+(y+h-py)/h*(yr[1]-yr[0]),
  inside:p=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h,
  axes(xl,yl,opt){opt=opt||{};ctx.save();ctx.strokeStyle='#2c3850';ctx.fillStyle='#9aa6bf';ctx.font='11px system-ui';ctx.lineWidth=1;
   const xt=opt.xt||niceTicks(xr[0],xr[1],opt.nx||6),yt=opt.yt||niceTicks(yr[0],yr[1],opt.ny||5);
   ctx.textAlign='center';ctx.textBaseline='top';
   xt.forEach(t=>{const px=P.X(t);ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px,y+h);ctx.stroke();ctx.fillText(opt.xf?opt.xf(t):fmtTick(t),px,y+h+4);});
   ctx.textAlign='right';ctx.textBaseline='middle';
   yt.forEach(t=>{const py=P.Y(t);ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x+w,py);ctx.stroke();ctx.fillText(opt.yf?opt.yf(t):fmtTick(t),x-4,py);});
   ctx.strokeStyle='#56627e';ctx.lineWidth=1.3;
   if(Math.min(...xr)<=0&&Math.max(...xr)>=0&&opt.zero){ctx.beginPath();ctx.moveTo(P.X(0),y);ctx.lineTo(P.X(0),y+h);ctx.stroke();}
   if(Math.min(...yr)<=0&&Math.max(...yr)>=0&&opt.zero){ctx.beginPath();ctx.moveTo(x,P.Y(0));ctx.lineTo(x+w,P.Y(0));ctx.stroke();}
   ctx.strokeRect(x,y,w,h);
   ctx.fillStyle='#c9d2e6';ctx.font='12px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';
   if(xl)ctx.fillText(xl,x+w/2,y+h+30);
   if(yl){ctx.save();ctx.translate(x-(opt.yoff||38),y+h/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText(yl,0,0);ctx.restore();}
   ctx.restore();},
  line(fn,a,b,col,lw,n,dash){n=n||300;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||2;if(dash)ctx.setLineDash(dash);ctx.beginPath();let st=false;
   for(let i=0;i<=n;i++){const t=a+(b-a)*i/n,v=fn(t);if(!isFinite(v)){st=false;continue;}const px=P.X(t),py=P.Y(v);if(!st){ctx.moveTo(px,py);st=true;}else ctx.lineTo(px,py);}ctx.stroke();ctx.restore();},
  clip(){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();}
 };return P;}
function niceTicks(a,b,n){if(a>b){const t=a;a=b;b=t;}const span=b-a;let st=Math.pow(10,Math.floor(Math.log10(span/n)));const e=span/n/st;st*=e>5?10:e>2?5:e>1?2:1;const out=[];for(let t=Math.ceil(a/st)*st;t<=b+1e-9*span;t+=st)out.push(+t.toFixed(10));return out;}
function fmtTick(t){const a=Math.abs(t);if(a!==0&&(a>=1e5||a<1e-3))return t.toExponential(0);return +t.toFixed(4)+'';}
function dot(ctx,x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function txt(ctx,s,x,y,col,font,al,bl){ctx.fillStyle=col||'#e6ebf5';ctx.font=font||'12px system-ui';ctx.textAlign=al||'left';ctx.textBaseline=bl||'alphabetic';ctx.fillText(s,x,y);}
function arrow(ctx,x1,y1,x2,y2,col,lw,hs){hs=hs||8;ctx.save();ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=lw||2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));ctx.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));ctx.closePath();ctx.fill();ctx.restore();}
function heat(t){// 0..1 -> blue-green-yellow-red
 t=clamp(t,0,1);const stops=[[0,[30,60,200]],[0.25,[30,170,230]],[0.5,[60,200,90]],[0.75,[240,220,40]],[1,[230,40,40]]];
 for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){const[a,c1]=stops[i-1],[b,c2]=stops[i];const f=(t-a)/(b-a);return`rgb(${c1.map((c,k)=>Math.round(c+(c2[k]-c)*f)).join(',')})`;}return'rgb(230,40,40)';}

/* slider row helper: returns input element */
function slider(parent,label,min,max,step,val,onInput,fmtFn){
 let g=parent.querySelector(':scope > .ctrl');if(!g){g=el('div',{class:'ctrl'});parent.appendChild(g);}
 const lab=el('label',null,label),inp=el('input',{type:'range',min,max,step,value:val}),out=el('output');
 const f=fmtFn||(v=>v);const upd=()=>{out.textContent=f(+inp.value);};upd();
 inp.addEventListener('input',()=>{upd();onInput(+inp.value);});
 g.append(lab,inp,out);inp.set=v=>{inp.value=v;upd();};return inp;}

/* ================= Persistence ================= */
const SKEY='stressQuest_v1';
let STORE={levels:{},unlockAll:false,seenIntro:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&s.levels)STORE=Object.assign(STORE,s);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(STORE));}catch(e){}}
function starsFor(score){return score>=90?3:score>=70?2:score>=40?1:0;}
function starHTML(n,max){max=max||3;let s='';for(let i=0;i<max;i++)s+=i<n?'★':'<span class="off">★</span>';return`<span class="stars">${s}</span>`;}
function totalStars(){return Object.values(STORE.levels).reduce((s,l)=>s+(l.stars||0),0);}

/* ================= Registry ================= */
const WORLDS=[
 {id:1,name:'World 1 · Strength Theory',sub:'Stress–strain, Mohr, failure criteria, beams, fatigue',col:'var(--w1)',icon:'🏗'},
 {id:2,name:'World 2 · Finite Element Method',sub:'Stiffness matrices, meshes, elements, BCs, results',col:'var(--w2)',icon:'🔷'},
 {id:3,name:'World 3 · Statistics for Failure Analysis',sub:'Weibull, reliability, interference, confidence, RCA',col:'var(--w3)',icon:'📊'}];
const LEVELS=[];
function defLevel(o){LEVELS.push(o);}
function isUnlocked(lv){if(STORE.unlockAll)return true;
 if(lv.id==='boss'){return Object.values(STORE.levels).filter(l=>l.stars>0).length>=8;}
 const ws=LEVELS.filter(l=>l.world===lv.world);const i=ws.indexOf(lv);if(i<=0)return true;const prev=STORE.levels[ws[i-1].id];return !!(prev&&prev.stars>0);}

/* ================= Modal & toast ================= */
function modal(html,buttons){const root=$('#modalRoot');root.innerHTML='';const m=el('div',{class:'modal'});const b=el('div',{class:'box'},html);const r=el('div',{class:'row',style:'justify-content:flex-end;margin-top:16px'});
 (buttons||[{t:'OK',pri:true}]).forEach(bt=>{r.appendChild(el('button',{class:'btn'+(bt.pri?' pri':''),onclick:()=>{root.innerHTML='';bt.fn&&bt.fn();}},bt.t));});
 b.appendChild(r);m.appendChild(b);root.appendChild(m);return b;}
function toast(s){const t=el('div',{class:'toast'},s);document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ================= Task runner ================= */
// task types: num {q, ans()/ans, tol (rel), abs, unit, explain}, choice {q, opts:[{t,ok,why}]}, action {q, btn, check()->{ok,msg,partial}}
function numTask(q,ans,o){o=o||{};return Object.assign({type:'num',q,ans},o);}
function runTasks(box,tasks,onFinish){
 let i=0;const res=[];
 const val=v=>typeof v==='function'?v():v;
 function bar(){const b=el('div',{class:'tprog'});tasks.forEach((t,k)=>{const s=k<res.length?(res[k]>=0.99?'done':res[k]>0?'half':'miss'):k===i?'cur':'';b.appendChild(el('i',{class:s}));});return b;}
 function render(){
  const t=tasks[i];box.innerHTML='';if(t.onShow)t.onShow();
  box.appendChild(bar());const tk=el('div',{class:'task'});box.appendChild(tk);
  tk.appendChild(el('div',{class:'q'},`<span class="tag">Task ${i+1}/${tasks.length}</span> `+val(t.q)));
  const area=el('div');tk.appendChild(area);const fb=el('div',{class:'fb'});tk.appendChild(fb);
  const nx=el('div',{class:'row'});tk.appendChild(nx);
  let attempts=0,finished=false;const tries=t.tries||2;
  const explain=()=>t.explain?'<div style="margin-top:6px" class="small">💡 '+val(t.explain)+'</div>':'';
  function done(score,cls,msg){finished=true;res.push(score);fb.className='fb '+cls;fb.innerHTML=msg+explain();
   area.querySelectorAll('button,input').forEach(b=>b.disabled=true);if(t.onDone)t.onDone(score);
   nx.appendChild(el('button',{class:'btn pri',onclick:()=>{i++;if(i<tasks.length)render();else finish();}},i<tasks.length-1?'Next task ▶':'Finish level ✔'));
   box.replaceChild(bar(),box.firstChild);}
  function grade(r){if(finished)return;attempts++;
   if(r.ok){const sc=(attempts===1?1:0.5)*(r.partial==null?1:r.partial);done(sc,'ok','✅ <b>Correct!</b> '+(r.msg||'')+(attempts>1?' <span class="mut">(half credit – 2nd try)</span>':''));}
   else if(attempts<tries){fb.className='fb bad';fb.innerHTML='❌ '+(r.msg||'Not quite.')+' <span class="mut">Try once more (half credit).</span>';}
   else done(0,'bad','❌ '+(r.msg||'Not quite.')+(t.type!=='choice'&&t.ans!=null?` <br>The answer is <b>${fmt(val(t.ans),t.dec==null?3:t.dec)}${t.unit?' '+t.unit:''}</b>.`:'')+(t.reveal?' '+val(t.reveal):''));}
  if(t.type==='num'){
   const r=el('div',{class:'ansrow'});const inp=el('input',{type:'text',inputmode:'decimal',placeholder:'your answer'});const b=el('button',{class:'btn pri'},'Check');
   r.append(inp);if(t.unit)r.append(el('span',{class:'mut'},t.unit));r.append(b);area.appendChild(r);
   const go=()=>{const v=parseFloat(inp.value.replace(',','.'));if(!isFinite(v)){fb.className='fb info';fb.textContent='Please enter a number.';return;}
    const a=val(t.ans);const tol=Math.max((t.tol==null?0.03:t.tol)*Math.abs(a),t.abs||0);const err=Math.abs(v-a);
    if(t.logtol){const ok=Math.abs(Math.log10(Math.abs(v)/Math.abs(a)))<=t.logtol&&v*a>0;grade({ok,msg:ok?`Exact value ≈ ${fmt(a,3)}${t.unit?' '+t.unit:''}.`:`Your value is off by a factor of ${fmt(Math.max(v/a,a/v),2)}.`});return;}
    if(err<=tol)grade({ok:true,msg:`Exact value: ${fmt(a,t.dec==null?3:t.dec)}${t.unit?' '+t.unit:''}.`});
    else{let m='Not quite.';if(Math.abs(v+a)<=tol)m='Check the sign!';else if(a!==0&&[1e3,1e-3,1e6,1e-6].some(f=>Math.abs(v*f-a)<=tol))m='Magnitude off by a power of 1000 – check your units!';else if(err<=3*tol)m='Close, but outside the tolerance (±'+fmt(tol,3)+').';else m+=v>a?' Your value is too high.':' Your value is too low.';
     if(t.hint)m+=' <i>Hint: '+val(t.hint)+'</i>';grade({ok:false,msg:m});}};
   b.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});setTimeout(()=>inp.focus({preventScroll:true}),30);
  }else if(t.type==='choice'){
   const c=el('div',{class:'choices'});area.appendChild(c);const opts=t.noShuffle?t.opts:shuffle(t.opts);
   opts.forEach(o=>{const b=el('button',{class:'btn'},o.t);c.appendChild(b);b.onclick=()=>{if(finished)return;
    if(o.ok){b.classList.add('right');grade({ok:true,msg:o.why||''});}
    else{b.classList.add('wrong');b.disabled=true;grade({ok:false,msg:o.why||'That is not right.'});if(finished){[...c.children].forEach((bb,k)=>{if(opts[k].ok)bb.classList.add('right');});fb.innerHTML+='<br>Correct answer: <b>'+opts.find(x=>x.ok).t+'</b>';}}};});
  }else if(t.type==='action'){
   const b=el('button',{class:'btn pri'},t.btn||'Submit');area.appendChild(b);b.onclick=()=>grade(t.check());
   if(t.extra)area.appendChild(t.extra);
  }
 }
 function finish(){const score=Math.round(100*res.reduce((a,b)=>a+b,0)/tasks.length);onFinish(score);}
 render();
}

defLevel({id:'w1l1',world:1,title:'Stress–Strain Explorer',short:'Pull a tensile bar to fracture; read E, yield and UTS',
concept:`<p>In a tensile test a bar of initial area A₀ and gauge length L₀ is pulled. We plot <b>engineering stress</b> vs <b>engineering strain</b>:</p>
<div class="formula">σ = F / A₀ &nbsp;&nbsp;&nbsp; ε = ΔL / L₀</div>
<ul><li><b>Elastic region</b>: linear, Hooke's law <span class="formula" style="display:inline-block;margin:2px">σ = E·ε</span> – unloading returns to zero strain.</li>
<li><b>Yield strength S<sub>y</sub></b>: onset of plastic flow. For materials without a sharp yield point it is defined with the <b>0.2 % offset</b> line (parallel to E, shifted by ε = 0.002).</li>
<li><b>Strain hardening</b>: stress rises with plastic strain up to the <b>ultimate tensile strength S<sub>u</sub> (UTS)</b>, the maximum engineering stress.</li>
<li><b>Necking</b> starts at the UTS (Considère: dσ<sub>true</sub>/dε<sub>true</sub> = σ<sub>true</sub>); deformation localises and engineering stress falls until <b>fracture</b>.</li>
<li>Unloading from the plastic range follows a line of slope E → <b>permanent set</b>.</li></ul>
<p class="mut small">Tip: the elastic part is tiny on the full strain axis, so use the zoom inset (bottom right). Hover over the traced curve to read values.</p>`,
takeaway:'E is the slope of the elastic line, Sy marks the start of plasticity, Su is the peak of the engineering curve where necking begins.',
build(sim){
 const mats=[{n:'Structural steel',E:200,Sy:[250,420],r:[1.3,1.6],eu:[0.12,0.2],ef:[0.08,0.12]},{n:'Aluminium alloy',E:70,Sy:[180,320],r:[1.1,1.3],eu:[0.07,0.11],ef:[0.04,0.07]},{n:'Titanium alloy',E:110,Sy:[780,950],r:[1.06,1.14],eu:[0.06,0.09],ef:[0.04,0.06]},{n:'Copper alloy',E:120,Sy:[150,300],r:[1.4,1.8],eu:[0.2,0.3],ef:[0.08,0.15]}];
 const m=pick(mats);const E=m.E*1000*rnd(0.96,1.04);const Sy=round5(rnd(...m.Sy));const Su=round5(Sy*rnd(...m.r));
 const ey=Sy/E,eu=rnd(...m.eu),ef=eu+rnd(...m.ef),sf=0.8*Su;const d0=rint(8,14);const A0=Math.PI*d0*d0/4;
 function sig(e){if(e<=ey)return E*e;if(e<=eu){const s=(e-ey)/(eu-ey);return Sy+(Su-Sy)*(1-Math.pow(1-s,2.4));}if(e<=ef){const s=(e-eu)/(ef-eu);return Su-(Su-sf)*s*s;}return 0;}
 let eps=0,hov=null;
 sim.appendChild(el('div',{class:'small mut'},`Material: <b style="color:#e6ebf5">${m.n}</b> · round specimen d₀ = ${d0} mm (A₀ = ${fmt(A0,1)} mm²)`));
 const C=makeCanvas(sim,680,450),ctx=C.ctx;
 const P=plotArea(ctx,60,110,600,290,[0,ef*1.08*100],[0,Su*1.18]);
 const Pi=plotArea(ctx,420,265,220,110,[0,ey*3.5*100],[0,Sy*1.3]);
 const sl=slider(sim,'Elongation (strain)',0,1000,1,0,v=>{eps=v/1000*ef*1.02;draw();},v=>fmt(v/1000*ef*1.02*100,2)+' %');
 sim.appendChild(el('div',{class:'legend'},'Drag the slider to load the specimen. Hover the curve (main plot or zoom inset) for a σ–ε readout. Dashed line = elastic unloading path.'));
 C.hover=p=>{hov=p;draw();};
 function draw(){C.clear();const broken=eps>ef;
  // bar
  const L0=360,ex=Math.min(eps,ef)*1.6,len=L0*(1+ex),x0=340-len/2,yc=48,hh=18;
  ctx.fillStyle='#56627e';ctx.fillRect(x0-40,yc-30,40,60);ctx.fillRect(x0+len,yc-30,40,60);
  const neck=eps>eu?Math.min(1,(eps-eu)/(ef-eu)):0;const wid=hh/Math.sqrt(1+ex*0.6);
  const s=sig(Math.min(eps,ef));ctx.fillStyle=broken?'#555':heat(s/Su);
  ctx.beginPath();const N=80;for(let i=0;i<=N;i++){const x=x0+len*i/N;const u=(i/N-0.5);const w=wid*(1-0.55*neck*Math.exp(-u*u/0.004));if(broken&&Math.abs(u)<0.004)continue;i?ctx.lineTo(x,yc-w):ctx.moveTo(x,yc-w);}
  for(let i=N;i>=0;i--){const x=x0+len*i/N;const u=(i/N-0.5);const w=wid*(1-0.55*neck*Math.exp(-u*u/0.004));ctx.lineTo(x,yc+w);}ctx.closePath();ctx.fill();
  if(broken){ctx.fillStyle='#0c111b';ctx.fillRect(338,yc-hh-2,6,2*hh+4);}
  arrow(ctx,x0-45,yc,x0-85,yc,'#ffb74d',2);arrow(ctx,x0+len+45,yc,x0+len+85,yc,'#ffb74d',2);
  const phase=eps===0?'Unloaded':eps<=ey?'Elastic':eps<=eu?'Yielded – strain hardening':eps<=ef?'Necking!':'FRACTURE 💥';
  txt(ctx,phase,20,96,broken?'#ef5350':'#ffb74d','bold 13px system-ui');
  txt(ctx,`F = ${fmt(s*A0/1000,2)} kN   σ = ${fmt(s,0)} MPa`,660,96,'#c9d2e6','12px system-ui','right');
  // main plot
  P.axes('Engineering strain ε (%)','Engineering stress σ (MPa)');
  const em=Math.min(eps,ef);P.line(e=>sig(e/100),0,em*100,'#4fc3f7',2.5,500);
  if(em>ey&&!broken){const ep=em-sig(em)/E;P.line(e=>E*(e/100-ep),ep*100,em*100,'#ffb74d',1.2,10,[5,4]);txt(ctx,'permanent set ≈ '+fmt(ep*100,2)+' %',P.X(ep*100)+4,P.Y(0)-6,'#ffb74d','11px system-ui');}
  if(broken){dot(ctx,P.X(ef*100),P.Y(sf),5,'#ef5350');}
  dot(ctx,P.X(em*100),P.Y(sig(em)),4,'#fff');
  // inset
  ctx.fillStyle='#0c111b';ctx.fillRect(Pi.x-34,Pi.y-14,Pi.w+40,Pi.h+44);
  Pi.axes(null,null,{nx:4,ny:3,yoff:30});txt(ctx,'zoom: ε ≤ '+fmt(ey*350,2)+' %',Pi.x+4,Pi.y-3,'#9aa6bf','10px system-ui');
  Pi.clip();Pi.line(e=>sig(e/100),0,Math.min(em,ey*3.5)*100,'#4fc3f7',2,200);
  if(em>ey)Pi.line(e=>E*(e/100-0.002),0.2,Math.min(ey*3.5,0.002+Sy*1.3/E)*100,'#7986cb',1,20,[3,3]);ctx.restore();
  if(em>ey)txt(ctx,'0.2 % offset',Pi.X(0.2)+4,Pi.Y(Sy*0.15),'#7986cb','10px system-ui');
  // hover readout
  if(hov){let Q=null;if(Pi.inside(hov))Q=Pi;else if(P.inside(hov))Q=P;
   if(Q){const e=Q.iX(hov.x)/100;if(e<=em&&e>=0){const sv=sig(e);ctx.strokeStyle='#ffffff55';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(Q.X(e*100),Q.y+Q.h);ctx.lineTo(Q.X(e*100),Q.Y(sv));ctx.lineTo(Q.x,Q.Y(sv));ctx.stroke();ctx.setLineDash([]);
     dot(ctx,Q.X(e*100),Q.Y(sv),4,'#ffd54f');const lab=`ε=${fmt(e*100,Q===Pi?3:2)}%  σ=${fmt(sv,0)} MPa`;ctx.fillStyle='#000c';ctx.fillRect(hov.x+8,hov.y-24,lab.length*6.3,18);txt(ctx,lab,hov.x+12,hov.y-11,'#ffd54f','11.5px system-ui');}}}
 }
 draw();
 return{tasks:[
  numTask('Pull the bar until it breaks, then read the <b>yield strength S<sub>y</sub></b> (the knee of the curve – use the zoom inset).',Sy,{unit:'MPa',tol:0.06,dec:0,explain:`Yielding starts where the curve departs from the straight Hooke line: S<sub>y</sub> ≈ ${Sy} MPa. For a gradual knee you would use the 0.2 % offset line.`}),
  numTask('Read the <b>ultimate tensile strength S<sub>u</sub></b>.',Su,{unit:'MPa',tol:0.03,dec:0,explain:'S<sub>u</sub> is the maximum of the <i>engineering</i> curve. Beyond it, the true stress in the neck keeps rising but the load falls because the area shrinks.'}),
  numTask("Determine <b>Young's modulus E</b> from the elastic slope in the zoom inset (σ/ε).",E/1000,{unit:'GPa',tol:0.08,dec:0,explain:`E = σ/ε in the linear part ≈ ${fmt(E/1000,0)} GPa (${m.n}). Remember ε in % → divide by 100!`,hint:'E = σ / ε, with ε as a pure number (0.1 % = 0.001), then convert MPa → GPa.'}),
  numTask(`What is the <b>maximum force</b> this d₀ = ${d0} mm specimen can carry?`,Su*A0/1000,{unit:'kN',tol:0.03,explain:`F<sub>max</sub> = S<sub>u</sub>·A₀ = ${Su} MPa × ${fmt(A0,1)} mm² = ${fmt(Su*A0/1000,2)} kN (MPa·mm² = N).`}),
  {type:'choice',q:'At which point does <b>necking</b> begin?',opts:[{t:'At the ultimate tensile strength (maximum load)',ok:true,why:'Necking (plastic instability) starts at maximum load: strain hardening can no longer compensate the area reduction (Considère criterion).'},{t:'At the yield strength',why:'At yield the bar still deforms uniformly; hardening stabilises the deformation.'},{t:'At fracture',why:'Fracture ends the neck formation – it starts much earlier, at the maximum load.'},{t:'At the proportional limit',why:'The proportional limit is the end of linear elasticity – long before any instability.'}]}
 ]};}});

defLevel({id:'w1l2',world:1,title:"Mohr's Circle Workshop",short:'Rotate the stress element, find principal & max shear stresses',
concept:`<p>For plane stress (σ<sub>x</sub>, σ<sub>y</sub>, τ<sub>xy</sub>) the stresses on a face rotated by θ are</p>
<div class="formula">σ<sub>x'</sub> = (σ<sub>x</sub>+σ<sub>y</sub>)/2 + (σ<sub>x</sub>−σ<sub>y</sub>)/2·cos2θ + τ<sub>xy</sub>·sin2θ<br>τ<sub>x'y'</sub> = −(σ<sub>x</sub>−σ<sub>y</sub>)/2·sin2θ + τ<sub>xy</sub>·cos2θ</div>
<p>All these states lie on <b>Mohr's circle</b> with</p>
<div class="formula">C = (σ<sub>x</sub>+σ<sub>y</sub>)/2 &nbsp;&nbsp; R = √[((σ<sub>x</sub>−σ<sub>y</sub>)/2)² + τ<sub>xy</sub>²]<br>σ<sub>1,2</sub> = C ± R &nbsp;&nbsp; τ<sub>max,in-plane</sub> = R &nbsp;&nbsp; tan 2θ<sub>p</sub> = 2τ<sub>xy</sub>/(σ<sub>x</sub>−σ<sub>y</sub>)</div>
<p>A rotation θ of the element is a rotation 2θ on the circle. On principal planes τ = 0. Remember the <b>third principal stress σ₃ = 0</b> in plane stress: absolute max shear is</p>
<div class="formula">τ<sub>abs,max</sub> = max(|σ₁−σ₂|, |σ₁|, |σ₂|) / 2</div>
<p class="mut small">Plot convention here: τ plotted <b>downward-positive</b>, so element and circle rotate in the same sense (counter-clockwise for +θ).</p>`,
takeaway:'σ1,2 = C ± R; the principal planes have zero shear; when σ1 and σ2 have the same sign, the out-of-plane shear (σ1/2) governs.',
build(sim){
 let sx,sy,txy;do{sx=rint(-12,16)*10;sy=(Math.random()<0.5?rint(1,12):rint(-10,12))*10;if(Math.random()<0.5&&sx<0)sx=-sx;txy=rint(-16,16)*5;}while(Math.abs(txy)<15||Math.abs(sx-sy)<20);
 const G={sx,sy,txy};const C0=(sx+sy)/2,R0=Math.hypot((sx-sy)/2,txy),s1=C0+R0,s2=C0-R0;const thp=0.5*Math.atan2(2*txy,sx-sy)*180/Math.PI;
 const tabs=Math.max(Math.abs(s1-s2),Math.abs(s1),Math.abs(s2))/2;
 let S={sx,sy,txy,th:0};
 sim.appendChild(el('div',{class:'small mut'},`Task state: <b style="color:#e6ebf5">σx = ${sx} MPa, σy = ${sy} MPa, τxy = ${txy} MPa</b>`));
 const C=makeCanvas(sim,680,400),ctx=C.ctx;
 const tr=th=>{const a=(S.sx-S.sy)/2,c=(S.sx+S.sy)/2,t=th*Math.PI/90;return{sxp:c+a*Math.cos(t)+S.txy*Math.sin(t),syp:c-a*Math.cos(t)-S.txy*Math.sin(t),tp:-a*Math.sin(t)+S.txy*Math.cos(t)};};
 function draw(){C.clear();const{sxp,syp,tp}=tr(S.th);
  // element
  const cx=135,cy=200,h=55,th=-S.th*Math.PI/180;// screen y down -> ccw is negative
  ctx.save();ctx.translate(cx,cy);ctx.rotate(th);
  ctx.fillStyle='#24324d';ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.fillRect(-h,-h,2*h,2*h);ctx.strokeRect(-h,-h,2*h,2*h);
  const sc=v=>Math.sign(v)*(12+Math.min(45,Math.abs(v)*0.22));
  const nArrow=(v,dir)=>{if(Math.abs(v)<0.5)return;const L=sc(v);const col=v>0?'#ef5350':'#42a5f5';

defLevel({id:'w1l3',world:1,title:'Failure Criteria Duel',short:'von Mises vs Tresca, plus brittle Rankine & Coulomb–Mohr',
concept:`<p>Multi-axial stress states are compared with uniaxial strength through a <b>failure criterion</b>. In plane stress with principal stresses σ<sub>A</sub>, σ<sub>B</sub> (σ₃ = 0):</p>

<div class="formula">Rankine (max normal stress): σ₁ = S<sub>ut</sub> or σ₃ = −S<sub>uc</sub></div>
<div class="formula">Coulomb–Mohr (σ₁ ≥ 0 ≥ σ₃): σ₁/S<sub>ut</sub> − σ₃/S<sub>uc</sub> = 1/n</div>

 const A3=round5(Sut*rnd(0.2,0.55)),B3=-round5(Suc*rnd(0.3,0.7));const P3={a:A3,b:B3};const n3=1/(A3/Sut-B3/Suc),n3r=Math.min(Sut/A3,Suc/-B3);

  ctx.restore();

  if(mode==='ductile'){txt(ctx,'Ductile steel: Sy = '+Sy+' MPa',lx,ly,'#e6ebf5','bold 12px system-ui');ly+=22;leg('#4fc3f7','von Mises ellipse');leg('#ffb74d','Tresca hexagon');txt(ctx,'dashed: pure shear line σB = −σA',lx,ly,'#9aa6bf','11px system-ui');ly+=20;}

 C.drag(p=>{if(!P.inside(p))return false;probe={a:Math.round(P.iX(p.x)),b:Math.round(P.iY(p.y))};desc();draw();},p=>{if(P.inside(p)){probe={a:Math.round(P.iX(p.x)),b:Math.round(P.iY(p.y))};desc();draw();}});

build(sim){

  const feas=secs.filter(s=>Mmax*1e6/s.W<=sa);if(feas.length<3||feas.length>secs.length-3)continue;best=feas.reduce((a,b)=>a.m<b.m?a:b);

 const C=makeCanvas(sim,680,470),ctx=C.ctx;const X0=70,X1=520;const bx=x=>X0+(X1-X0)*x/L;

defLevel({id:'w2l1',world:2,title:'Stiffness Matrix Assembly',short:'Assemble K from spring elements, apply BCs, solve K·u = F',
concept:`<p>The FEM turns a structure into elements connected at nodes. For a 1-D spring/bar element between nodes i and j:</p>
<div class="formula">k<sup>(e)</sup> = k · [ 1 −1 ; −1 1 ] &nbsp;&nbsp; (bar: k = EA/L)</div>
<p><b>Assembly</b>: each entry of the element matrix is <i>added</i> to the global matrix at the rows/columns of its global node numbers: k₁₁→K<sub>ii</sub>, k₁₂→K<sub>ij</sub>, k₂₁→K<sub>ji</sub>, k₂₂→K<sub>jj</sub>. Node numbering does not need to follow the geometry!</p>
<div class="formula">K · u = F</div>
<p>Before boundary conditions K is <b>singular</b> (det K = 0): the structure can translate as a rigid body. Applying <b>u = 0 at fixed nodes</b> = deleting those rows and columns. Solve the reduced system for the free displacements, then recover the <b>reactions</b> from the deleted rows: R = K<sub>row</sub>·u.</p>`,
takeaway:'Element matrices are scattered into the global matrix using the connectivity table; BCs remove rigid-body modes so K becomes invertible.',
build(sim){
 const ks=[rint(2,10)*50,rint(2,10)*50,rint(2,10)*50];const perm=shuffle([1,2,3,4]);const NN={A:perm[0],B:perm[1],C:perm[2],D:perm[3]};
 const els=[['A','B'],['B','C'],['C','D']].map((p,e)=>({e:e+1,k:ks[e],i:NN[p[0]],j:NN[p[1]],done:new Set()}));
 const ln=pick(['B','C']);const F=rint(1,5)*1000;
 const K=[0,1,2,3].map(()=>[0,0,0,0]);let selE=null,mistakes=0,fixed=new Set(),bcMode=false,solved=false;
 const Kfull=[0,1,2,3].map(()=>[0,0,0,0]);els.forEach(E=>{const i=E.i-1,j=E.j-1;Kfull[i][i]+=E.k;Kfull[j][j]+=E.k;Kfull[i][j]-=E.k;Kfull[j][i]-=E.k;});
 const free=[1,2,3,4].filter(n=>n!==NN.A&&n!==NN.D);const Fv=free.map(n=>n===NN[ln]?F:0);
 const uf=gsolve(free.map(r=>free.map(c=>Kfull[r-1][c-1])),Fv);const U=[0,0,0,0];free.forEach((n,k)=>U[n-1]=uf[k]);
 const RA=Kfull[NN.A-1].reduce((s,v,c)=>s+v*U[c],0);
 sim.appendChild(el('div',{class:'small mut'},`Three springs between two rigid walls. Stiffnesses in N/mm, force F = ${F} N at the node marked in orange. Node numbers are the <b>global</b> numbers (deliberately not in geometric order).`));
 const C=makeCanvas(sim,680,190),ctx=C.ctx;
 function draw(){C.clear();const xs=[90,250,410,570],y=95;const ord=['A','B','C','D'];
  ctx.fillStyle='#56627e';ctx.fillRect(40,45,18,100);ctx.fillRect(622,45,18,100);

  const sc=solved?Math.min(60/Math.max(...U.map(Math.abs)),1e4):0;const dx=ord.map(p=>sc*U[NN[p]-1]);
  for(let e=0;e<3;e++){const xa=xs[e]+dx[e]+12,xb=xs[e+1]+dx[e+1]-12;ctx.strokeStyle=els[e].done.size===4?'#4fc3f7':'#9aa6bf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xa,y);
   const nz=10;for(let z=1;z<nz;z++)ctx.lineTo(xa+(xb-xa)*z/nz,y+(z%2?-12:12));ctx.lineTo(xb,y);ctx.stroke();
   txt(ctx,`e${e+1}: k=${els[e].k}`,(xs[e]+xs[e+1])/2,y-26,'#c9d2e6','12px system-ui','center');
   if(solved){const f=els[e].k*(U[els[e].j-1]-U[els[e].i-1])*(NN[ord[e+1]]===els[e].j?1:-1);txt(ctx,`N=${fmt(f,0)} N`,(xs[e]+xs[e+1])/2,y+34,f>=0?'#ef5350':'#42a5f5','11px system-ui','center');}}
  ord.forEach((p,k)=>{const n=NN[p];const fx=fixed.has(n);dot(ctx,xs[k]+dx[k],y,13,fx?'#7a3236':'#24324d',p===ln?'#ffb74d':'#4fc3f7');txt(ctx,n,xs[k]+dx[k],y+1,'#fff','bold 13px system-ui','center','middle');
   if(solved)txt(ctx,'u='+fmt(U[n-1],3),xs[k]+dx[k],y+58,'#ffd54f','11px system-ui','center');});
  const k=ord.indexOf(ln);arrow(ctx,xs[k]+16,y-40,xs[k]+70,y-40,'#ffb74d',3);txt(ctx,'F = '+F+' N',xs[k]+16,y-48,'#ffb74d','bold 12px system-ui');
  if(solved)txt(ctx,'deformed shape (exaggerated); N>0 tension',340,180,'#9aa6bf','11px system-ui','center');}
 const chips=el('div',{style:'margin-top:8px'});sim.appendChild(chips);
 const msg=el('div',{class:'small',style:'min-height:22px;margin:4px 0'});
 const gridBox=el('div');sim.appendChild(gridBox);sim.appendChild(msg);
 function renderChips(){chips.innerHTML='<span class="small mut">Element connectivity table: </span>';els.forEach(E=>{const c=el('span',{class:'chip'+(selE===E?' sel':'')+(E.done.size===4?' done':'')},`e${E.e}: nodes ${E.i}–${E.j}, k=${E.k}`);
  c.onclick=()=>{if(E.done.size===4||bcMode)return;selE=E;renderChips();renderGrid();msg.innerHTML=`Element e${E.e} connects global nodes ${E.i} and ${E.j}: click the 4 cells of K where its entries [+k −k; −k +k] go.`;};chips.appendChild(c);});}
 function renderGrid(){gridBox.innerHTML='';const g=el('div',{class:'mat',style:'grid-template-columns:repeat(5,auto)'});
  g.appendChild(el('div',{class:'hdr'},'K'));for(let c=1;c<=4;c++)g.appendChild(el('div',{class:'hdr'},'u'+c));
  for(let r=1;r<=4;r++){const h=el('div',{class:'hdr',style:bcMode?'cursor:pointer;color:#ffb74d':''},(fixed.has(r)?'🔒 ':'')+'row '+r);h.onclick=()=>{if(!bcMode)return;fixed.has(r)?fixed.delete(r):fixed.add(r);renderGrid();draw();};g.appendChild(h);
   for(let c=1;c<=4;c++){const v=K[r-1][c-1];const d=el('div',{class:(fixed.has(r)||fixed.has(c))?'bc':''},v===0?'<span class="mut">0</span>':fmt(v,0));

 function cell(r,c){if(bcMode){msg.innerHTML='Click the <b>row labels</b> to mark fixed DOFs.';return;}if(!selE){msg.innerHTML='First pick an element from the connectivity table.';return;}

  if(E.done.size===4){selE=null;msg.innerHTML+=` · e${E.e} fully assembled!`;}renderChips();renderGrid();draw();}
 renderChips();renderGrid();draw();
 const red=el('div',{class:'small',style:'margin-top:6px'});sim.appendChild(red);
 return{tasks:[
  {type:'action',q:'<b>Assemble the global stiffness matrix.</b> Pick an element, then click the 4 cells of K where its entries go. Repeat for all elements, then submit.',btn:'Check assembly',
   check:()=>{const all=els.every(E=>E.done.size===4);if(!all)return{ok:false,msg:'Not all elements are fully assembled yet.'};return{ok:true,partial:Math.max(0.4,1-0.15*mistakes),msg:`Assembled with ${mistakes} misplaced click(s). Note each row sums to zero → K is singular (rigid-body translation u = [1,1,1,1] gives zero force).`};},
   tries:99,explain:'Diagonal K<sub>ii</sub> = sum of stiffnesses connected to node i; off-diagonal K<sub>ij</sub> = −k of the element joining i and j (0 if not connected).'},
  {type:'action',q:'<b>Apply the boundary conditions</b>: both walls are fixed (u = 0). Click the <b>row labels</b> of the fixed DOFs, then submit.',btn:'Apply BCs',onShow:()=>{bcMode=true;selE=null;renderChips();renderGrid();msg.innerHTML='Click the row labels to lock DOFs (rows/columns are removed).';},
   check:()=>{const want=[NN.A,NN.D].sort().join();const got=[...fixed].sort().join();return{ok:want===got,msg:want===got?`Rows/columns ${NN.A} and ${NN.D} are removed; the remaining 2×2 system is non-singular.`:'Those are not (only) the nodes attached to the walls. Look at the sketch: which global numbers sit at the walls?'};},
   reveal:()=>`fixed nodes: ${NN.A} and ${NN.D}`,onDone:()=>{fixed=new Set([NN.A,NN.D]);renderGrid();draw();}},
  numTask(()=>`Reduced system (free DOFs ${free.join(', ')}):<br><span class="formula" style="display:block">[${free.map(r=>free.map(c=>Kfull[r-1][c-1]).join('  ')).join(' ; ')}] · [u${free[0]} ; u${free[1]}] = [${Fv.join(' ; ')}]</span>Solve for the <b>displacement of the loaded node ${NN[ln]}</b>.`,U[NN[ln]-1],{unit:'mm',tol:0.02,dec:4,
   explain:`Solving the 2×2 system: u${free[0]} = ${fmt(uf[0],4)} mm, u${free[1]} = ${fmt(uf[1],4)} mm.`,hint:'2×2 inverse: [a b; c d]⁻¹ = 1/(ad−bc)·[d −b; −c a]',onDone:()=>{solved=true;draw();}}),
  numTask(()=>`Recover the <b>reaction force at node ${NN.A}</b> (left wall) from row ${NN.A} of the full K: R = Σ K<sub>${NN.A}j</sub>·u<sub>j</sub>. Sign: + = pointing in +x (right).`,RA,{unit:'N',tol:0.02,dec:1,
   explain:`R<sub>${NN.A}</sub> = −k₁·u<sub>${NN.B}</sub> = ${fmt(RA,1)} N. The two wall reactions sum to −F = ${-F} N (equilibrium check!).`}),

defLevel({id:'w2l2',world:2,title:'Mesh Convergence Lab',short:'h-refinement on a plate with hole vs a singular re-entrant corner',
concept:`<p>The FE solution approaches the exact solution as elements get smaller (<b>h-refinement</b>) or higher order (<b>p-refinement</b>). Displacements converge fastest; <b>stresses</b> (derivatives of displacements) converge more slowly, so do a <b>mesh convergence study</b>: refine until the quantity of interest changes by less than ~2–5 %.</p>
<div class="formula">Plate with hole: σ<sub>peak</sub> → K<sub>t</sub>·σ<sub>nom</sub> (finite, convergent)</div>
<p>At a <b>sharp re-entrant corner</b> linear-elastic theory predicts infinite stress (Williams): σ ∝ r<sup>λ−1</sup>. For a 90° re-entrant corner (270° material wedge) λ ≈ 0.544:</p>
<div class="formula">σ ∝ r<sup>−0.456</sup> &nbsp;&nbsp; → halving the element size raises the peak by 2<sup>0.456</sup> ≈ 1.37 – forever.</div>
<p>Such <b>singularities</b> also occur at point loads, point supports and sharp contact edges. The peak value there is a mesh artefact, not a result. Model the real fillet radius, or assess the stress away from the singularity (St-Venant), or use fracture-mechanics/hot-spot methods.</p>
<p class="mut small">Note: the FE peak values in this lab come from a realistic convergence model (not a live solver).</p>`,
takeaway:'Converged stress = refine until changes are small. A value that keeps growing with refinement is a singularity – do not report it.',
build(sim){
 const dW=Math.round(rnd(0.15,0.45)*100)/100,Kt=KtHole(dW),sn=round5(rnd(60,150)),sth=Kt*sn;
 const ns=[2,4,8,16,32,64];let geo='hole',lv={hole:0,L:0};const hist={hole:{},L:{}};
 const sFE=(g,n)=>g==='hole'?sth*(1-0.6*Math.pow(2/n,1.8)):sn*1.6*Math.pow(n/2,0.456);

 const C=makeCanvas(sim,680,400),ctx=C.ctx;

 const bC=el('button',{class:'btn'},'− Coarsen'),bR=el('button',{class:'btn pri'},'+ Refine (h/2)'),bG=el('button',{class:'btn'},'Switch to L-bracket');row.append(bC,bR,bG);
 const info=el('div',{class:'small',style:'margin-top:6px'});sim.appendChild(info);
 bR.onclick=()=>{if(lv[geo]<ns.length-1)lv[geo]++;solve();};bC.onclick=()=>{if(lv[geo]>0)lv[geo]--;solve();};
 bG.onclick=()=>{geo=geo==='hole'?'L':'hole';bG.textContent=geo==='hole'?'Switch to L-bracket':'Switch to plate with hole';solve();};
 function solve(){const n=ns[lv[geo]];hist[geo][n]=sFE(geo,n);draw();
  const ks=Object.keys(hist[geo]).map(Number).sort((a,b)=>a-b);

 function draw(){C.clear();const n=ns[lv[geo]];const x0=30,y0=40,S=300;
  if(geo==='hole'){const a=dW*S,m=Math.max(1,n/2);const node=(i,j)=>{const th=Math.PI/2*i/n;const ix=a*Math.cos(th),iy=a*Math.sin(th);let ox,oy;if(th<=Math.PI/4){ox=S;oy=S*Math.tan(th);}else{ox=S/Math.tan(th);oy=S;}const s=Math.pow(j/m,1.6);return[x0+ix+s*(ox-ix),y0+S-(iy+s*(oy-iy))];};
   for(let i=0;i<n;i++)for(let j=0;j<m;j++){const p=[node(i,j),node(i+1,j),node(i+1,j+1),node(i,j+1)];const cx=(p[0][0]+p[2][0])/2-x0,cy=y0+S-(p[0][1]+p[2][1])/2;const r=Math.hypot(cx,cy),th=Math.atan2(cy,cx);
    const q=a*a/(r*r),c2=Math.cos(2*th),s2=Math.sin(2*th);const srr=0.5*(1-q)+0.5*(1+3*q*q-4*q)*c2,stt=0.5*(1+q)-0.5*(1+3*q*q)*c2,trt=-0.5*(1-3*q*q+2*q)*s2;const c=Math.cos(th),s=Math.sin(th);
    const v=(srr*c*c+stt*s*s-2*trt*s*c)/3*(sFE('hole',n)/sth);ctx.beginPath();p.forEach((P,k)=>k?ctx.lineTo(...P):ctx.moveTo(...P));ctx.closePath();ctx.fillStyle=heat(v);ctx.fill();ctx.strokeStyle='#0008';ctx.lineWidth=n>32?0.4:0.8;ctx.stroke();}
   txt(ctx,'Quarter model (2 symmetry planes)',x0,y0-14,'#9aa6bf','11px system-ui');for(let k=0;k<5;k++)arrow(ctx,x0+S+4,y0+20+k*65,x0+S+24,y0+20+k*65,'#ffb74d',1.5,6);
   ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;dot(ctx,x0,y0+S-a,4,'#ffd54f');txt(ctx,'peak',x0+6,y0+S-a-6,'#ffd54f','11px system-ui');}
  else{const h=S/2/n;for(let i=0;i<2*n;i++)for(let j=0;j<2*n;j++){if(i>=n&&j>=n)continue;const cx=(i+0.5)*h,cy=(j+0.5)*h;const r=Math.hypot(cx-S/2,cy-S/2)/S;const v=0.25*Math.pow(r/0.5,-0.456)*Math.pow(n/2,0)*0.9;
    ctx.fillStyle=heat(Math.min(1,v*(1+0.15*Math.log2(n))));ctx.fillRect(x0+i*h,y0+S-(j+1)*h,h,h);ctx.strokeStyle='#0008';ctx.lineWidth=n>32?0.3:0.8;ctx.strokeRect(x0+i*h,y0+S-(j+1)*h,h,h);}
   ctx.fillStyle='#56627e';ctx.fillRect(x0,y0+S,S,8);for(let k=0;k<4;k++)arrow(ctx,x0+S/2+10+k*35,y0+S/2-4,x0+S/2+10+k*35,y0+S/2-28,'#ffb74d',1.5,6);
   dot(ctx,x0+S/2,y0+S/2,4,'#ffd54f');txt(ctx,'sharp re-entrant corner',x0+S/2+6,y0+S/2+16,'#ffd54f','11px system-ui');txt(ctx,'L-bracket, fixed base, load on arm',x0,y0-14,'#9aa6bf','11px system-ui');}
  txt(ctx,`${nel(geo,n)} elements · peak σ = ${fmt(sFE(geo,n),1)} MPa`,x0,y0+S+30,'#e6ebf5','bold 13px system-ui');
  // convergence plot

  ctx.setLineDash([6,4]);ctx.strokeStyle='#66bb6a';ctx.beginPath();ctx.moveTo(P.x,P.Y(sth));ctx.lineTo(P.x+P.w,P.Y(sth));ctx.stroke();ctx.setLineDash([]);

  [['hole','#4fc3f7'],['L','#ef5350']].forEach(([g,col])=>{const ks=Object.keys(hist[g]).map(Number).sort((a,b)=>a-b);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ks.forEach((k,i)=>{const x=P.X(ns.indexOf(k)+1),y=P.Y(hist[g][k]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ks.forEach(k=>dot(ctx,P.X(ns.indexOf(k)+1),P.Y(hist[g][k]),4,col));});
  txt(ctx,'● hole',P.x+6,P.y+14,'#4fc3f7','11px system-ui');txt(ctx,'● L-corner',P.x+56,P.y+14,'#ef5350','11px system-ui');txt(ctx,'n per quarter arc / side',P.x+P.w/2,P.y+P.h+44,'#9aa6bf','10px system-ui','center');
 }
 solve();
 return{tasks:[
  numTask(`First the target: what is the <b>theoretical peak stress</b> at the hole (d/W = ${dW}, σ<sub>nom</sub> = ${sn} MPa on the net section)?`,sth,{unit:'MPa',tol:0.03,dec:1,explain:`K<sub>t</sub> = ${fmt(Kt,3)} → σ<sub>peak</sub> = ${fmt(sth,1)} MPa (green dashed line).`,hint:'Kt = 3 − 3.13(d/W) + 3.66(d/W)² − 1.53(d/W)³'}),
  {type:'action',q:'Refine the <b>plate-with-hole</b> mesh step by step until the peak stress changes by <b>less than 2 %</b> from the previous level. Submit at the first level that satisfies this.',btn:'Submit converged mesh',onShow:()=>{if(geo!=='hole')bG.click();},
   check:()=>{if(geo!=='hole')return{ok:false,msg:'Switch back to the plate with hole.'};const n=ns[lv.hole],p=hist.hole[n/2];if(!p)return{ok:false,msg:'You need the result of the previous (coarser) level to judge convergence – refine step by step.'};const ch=Math.abs(hist.hole[n]-p)/hist.hole[n];
    if(ch>=0.02)return{ok:false,msg:`Change from the previous level is ${fmt(100*ch,1)} % – not converged yet.`};if(hist.hole[n/4]&&Math.abs(hist.hole[n/2]-hist.hole[n/4])/hist.hole[n/2]<0.02)return{ok:true,partial:0.7,msg:'Converged – though one level coarser was already enough (extra cost for nothing).'};
    return{ok:true,msg:`Change ${fmt(100*ch,2)} % < 2 %. Peak ${fmt(hist.hole[n],1)} MPa vs theory ${fmt(sth,1)} MPa (${fmt(100*(hist.hole[n]-sth)/sth,1)} %).`};},
   reveal:'Converged at 32 elements around the quarter arc.',explain:'The FE peak approaches K<sub>t</sub>σ<sub>nom</sub> from below; stresses need finer meshes than displacements, especially where gradients are steep.'},
  {type:'choice',q:'Now switch to the <b>L-bracket</b> and refine it several times. What happens to the corner peak stress?',onShow:()=>{if(geo!=='L')bG.click();},opts:[

defLevel({id:'w2l3',world:2,title:'Shape Functions & Element Types',short:'Linear vs quadratic interpolation, partition of unity, shear locking',
concept:`<p>Inside an element the field is interpolated from nodal values with <b>shape functions</b> N<sub>i</sub>(ξ) in natural coordinates ξ ∈ [−1, 1]:</p>
<div class="formula">u(ξ) = Σ N<sub>i</sub>(ξ)·u<sub>i</sub></div>
<div class="formula">Linear (2 nodes): N₁ = (1−ξ)/2, &nbsp;N₂ = (1+ξ)/2</div>
<div class="formula">Quadratic (3 nodes, ξ = −1, 0, +1): N₁ = ξ(ξ−1)/2, &nbsp;N₂ = 1−ξ², &nbsp;N₃ = ξ(ξ+1)/2</div>
<p>Properties: N<sub>i</sub> = 1 at its own node and 0 at the others (Kronecker-δ), and <b>Σ N<sub>i</sub> = 1</b> everywhere (partition of unity → rigid-body motion and constant strain represented exactly).</p>
<p>Linear elements have constant strain (1-D) and cannot represent curvature. A fully integrated 4-node quad (Q4) in bending keeps straight edges, which creates <b>parasitic shear strain</b> → artificially stiff: <b>shear locking</b>. Remedies: quadratic elements (Q8/20-node hex), reduced integration (+ hourglass control), incompatible modes, or several elements through thickness.</p>
<p>Compatible displacement-based elements are <b>too stiff</b>: displacements and strain energy converge from below.</p>`,
takeaway:'Shape functions interpolate nodal values; quadratic elements capture curvature and avoid shear locking in bending.',
build(sim){
 const N1=x=>(1-x)/2,N2=x=>(1+x)/2,Q1=x=>x*(x-1)/2,Q2=x=>1-x*x,Q3=x=>x*(x+1)/2;
 let mode='lin',u=[1,2,0.5],tgt=null;
 const t1=[Math.round(rnd(-2,3)*2)/2,Math.round(rnd(-2,3)*2)/2];if(t1[0]===t1[1])t1[1]+=1;const x1=Math.round(rnd(-0.9,0.9)*10)/10||0.3;const a1=N1(x1)*t1[0]+N2(x1)*t1[1];
 const x2=pick([-0.7,-0.5,-0.3,0.3,0.5,0.7]);const a2=Q1(x2);
 const tq=[Math.round(rnd(-2,2.5)*4)/4,Math.round(rnd(-2,2.5)*4)/4,Math.round(rnd(-2,2.5)*4)/4];{const av=(tq[0]+tq[2])/2;if(Math.abs(tq[1]-av)<0.75)tq[1]=av+(av>0.25?-1.25:1.25);}
 const C=makeCanvas(sim,680,450),ctx=C.ctx;
 const PS=plotArea(ctx,50,30,270,200,[-1.1,1.1],[-0.3,1.15]),PU=plotArea(ctx,390,30,270,200,[-1.1,1.1],[-3,3.5]);
 const nodes=()=>mode==='lin'?[-1,1]:[-1,0,1];
 const uf=x=>mode==='lin'?N1(x)*u[0]+N2(x)*u[1]:Q1(x)*u[0]+Q2(x)*u[1]+Q3(x)*u[2];
 function draw(){C.clear();
  PS.axes('ξ','Nᵢ(ξ)',{zero:true,nx:4,ny:4,yoff:30});const fs=mode==='lin'?[[N1,'#4fc3f7','N₁'],[N2,'#ffb74d','N₂']]:[[Q1,'#4fc3f7','N₁'],[Q2,'#66bb6a','N₂ (mid)'],[Q3,'#ffb74d','N₃']];
  fs.forEach(([f,c,l],k)=>{PS.line(f,-1,1,c,2.2);txt(ctx,l,PS.x+10+k*70,PS.y+14,c,'12px system-ui');});
  PS.line(x=>fs.reduce((s,f)=>s+f[0](x),0),-1,1,'#ffffff66',1.2,50,[4,4]);txt(ctx,'Σ Nᵢ',PS.x+PS.w-40,PS.Y(1)-6,'#ffffffaa','11px system-ui');
  PU.axes('ξ','u(ξ)',{zero:true,nx:4,ny:6,yoff:30});
  if(tgt){PU.line(x=>Q1(x)*tgt[0]+Q2(x)*tgt[1]+Q3(x)*tgt[2],-1,1,'#ef5350',2,200,[6,4]);txt(ctx,'target field',PU.x+8,PU.y+14,'#ef5350','11px system-ui');}
  PU.line(uf,-1,1,'#4fc3f7',2.5);const ns=nodes();ns.forEach((x,k)=>{const v=mode==='lin'?u[k===0?0:1]:u[k];dot(ctx,PU.X(x),PU.Y(v),8,'#ffd54f','#0c111b');txt(ctx,fmt(v,2),PU.X(x)+10,PU.Y(v)-8,'#ffd54f','11px system-ui');});
  txt(ctx,'drag the yellow nodal values',PU.x+PU.w,PU.y+PU.h+44,'#9aa6bf','10.5px system-ui','right');
  // locking illustration
  const yb=345;txt(ctx,'Pure bending of one element:',20,272,'#c9d2e6','bold 12px system-ui');
  ctx.save();ctx.translate(170,yb);ctx.strokeStyle='#66bb6a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,260,215,-Math.PI/2-0.32,-Math.PI/2+0.32);ctx.stroke();ctx.beginPath();ctx.arc(0,260,285,-Math.PI/2-0.3,-Math.PI/2+0.3);ctx.stroke();
  for(const s of[-1,1]){const a=-Math.PI/2+s*0.31;ctx.beginPath();ctx.moveTo(215*Math.cos(a),260+215*Math.sin(a));ctx.lineTo(285*Math.cos(a),260+285*Math.sin(a));ctx.stroke();}ctx.restore();
  txt(ctx,'exact: curved edges, right angles kept (γ = 0)',170,440,'#66bb6a','11.5px system-ui','center');
  ctx.save();ctx.translate(500,yb);ctx.strokeStyle='#ef5350';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-60,-25);ctx.lineTo(60,-25);ctx.lineTo(80,35);ctx.lineTo(-80,35);ctx.closePath();ctx.stroke();
  ctx.strokeStyle='#ffb74d';ctx.lineWidth=1;ctx.beginPath();ctx.arc(60,-25,14,Math.PI/2-0.32,Math.PI/2+0.0);ctx.stroke();txt(ctx,'γ ≠ 0',80,-22,'#ffb74d','11px system-ui');ctx.restore();
  txt(ctx,'Q4: straight edges → spurious shear strain → locking',500,440,'#ef5350','11.5px system-ui','center');}
 let dragK=-1;
 C.drag(p=>{dragK=-1;nodes().forEach((x,k)=>{const v=mode==='lin'?u[k===0?0:1]:u[k];if(Math.hypot(p.x-PU.X(x),p.y-PU.Y(v))<14)dragK=k;});if(dragK<0)return false;},
  p=>{const v=clamp(Math.round(PU.iY(p.y)*20)/20,-3,3.5);if(mode==='lin')u[dragK===0?0:1]=v;else u[dragK]=v;draw();},()=>{dragK=-1;});
 const row=el('div',{class:'row'});const bl=el('button',{class:'btn sm'},'Linear element'),bq=el('button',{class:'btn sm'},'Quadratic element');row.append(bl,bq);sim.appendChild(row);
 const setMode=m=>{mode=m;bl.className='btn sm'+(m==='lin'?' pri':'');bq.className='btn sm'+(m==='quad'?' pri':'');draw();};bl.onclick=()=>setMode('lin');bq.onclick=()=>setMode('quad');
 setMode('lin');
 return{tasks:[
  numTask(`<b>Linear element</b> with nodal values u₁ = ${t1[0]}, u₂ = ${t1[1]} (set in the plot). What is u at <b>ξ = ${x1}</b>?`,a1,{abs:0.02,tol:0,onShow:()=>{u=[t1[0],t1[1],0];setMode('lin');},explain:`N₁(${x1}) = ${fmt(N1(x1),3)}, N₂ = ${fmt(N2(x1),3)} → u = ${fmt(a1,3)}. Linear interpolation = straight line between the nodes.`}),
  numTask(`<b>Quadratic element</b>: evaluate the corner shape function <b>N₁(ξ) = ξ(ξ−1)/2 at ξ = ${x2}</b>.`,a2,{abs:0.005,tol:0,dec:3,onShow:()=>{setMode('quad');},explain:`N₁(${x2}) = ${x2}·(${x2}−1)/2 = ${fmt(a2,4)}. ${a2<0?'Yes, quadratic corner functions go negative between the other nodes – that is fine.':'Corner functions of quadratic elements are not monotonic: they turn negative for ξ > 0.'}`}),
  {type:'action',q:'Drag the three nodal values of the <b>quadratic element</b> so that it reproduces the red <b>target field</b> exactly, then submit.',btn:'Submit fit',onShow:()=>{tgt=tq;u=[0,0,0];setMode('quad');},
   check:()=>{const e=Math.max(...[0,1,2].map(k=>Math.abs(u[k]-tq[k])));return{ok:e<=0.1,msg:e<=0.1?'A quadratic field is reproduced exactly by quadratic shape functions once the nodal values match.':`Max nodal deviation ${fmt(e,2)} – the curve is fully defined by its three nodal values; match each node.`};},
   reveal:()=>`nodal values ${tq.join(', ')}`,explain:'A linear element could only produce the chord between the end nodes – to capture this curvature you would need several linear elements.'},
  {type:'choice',q:'Why must the shape functions of an element sum to 1 at every point (dashed line)?',opts:[
   {t:'So that a rigid-body translation (all u<sub>i</sub> equal) is reproduced exactly without strain',ok:true,why:'If all nodes move by c, u(ξ) = c·ΣN<sub>i</sub> = c → zero strain. Without this, rigid motion would generate fake stresses; it is part of the completeness requirement for convergence.'},
   {t:'To make the stiffness matrix symmetric',why:'Symmetry comes from the energy formulation (BᵀDB), not from ΣN = 1.'},
   {t:'So that the element mass is conserved',why:'Mass matrices use N too, but the essential reason is representing rigid motion/constant states.'},
   {t:'It is only a numerical convenience',why:'It is a convergence requirement (completeness).'}]},
  {type:'choice',q:'A thin cantilever is meshed with <b>one layer of fully integrated linear Q4</b> elements. The tip deflection is far below the beam-theory value. Why, and what helps?',opts:[
   {t:'Shear locking – use quadratic elements (or reduced integration with hourglass control / incompatible modes)',ok:true,why:'Straight-edged Q4 elements cannot bend without parasitic shear, which absorbs energy and stiffens the model, worst for slender elements.'},
   {t:'Hourglassing – switch to full integration',why:'Hourglassing (too flexible, zero-energy modes) is the problem of REDUCED integration; this model is too stiff.'},
   {t:'Volumetric locking – it only happens for rubber',why:'Volumetric locking is for ν → 0.5 (incompressible); steel bending gives shear locking.'},
   {t:'The load is too small for linear elements',why:'Linear analysis scales with load – the ratio to beam theory is load-independent.'}]},
  {type:'choice',q:'With compatible displacement-based elements, how does the computed displacement typically behave as the mesh is refined?',opts:[
   {t:'Increases toward the exact value (the FE model is too stiff – lower bound)',ok:true,why:'Restricting the displacement field to the element basis adds constraints → stiffer model → strain energy and displacements converge from below.'},
   {t:'Decreases toward the exact value (model too flexible)',why:'Only special formulations (e.g. some hybrid/reduced-integrated ones) behave too flexible.'},
   {t:'Is independent of mesh size',why:'Only if the exact solution lies in the element space (e.g. constant strain).'},
   {t:'Oscillates randomly',why:'Convergence of a well-posed linear FE model is monotonic in energy.'}]}
 ]};}});

defLevel({id:'w2l4',world:2,title:'Boundary Condition Detective',short:'Spot rigid-body motion, over-constraints, point loads, unit errors',
concept:`<p>Most bad FE results are not solver errors but <b>modelling errors</b>. Checklist:</p>
<ul><li><b>Under-constrained</b>: any rigid-body mode left (3 in 2-D, 6 in 3-D) → singular K ("zero pivot", "numerical singularity", huge displacements).</li>
<li><b>Over-constrained</b>: fixing more DOFs than reality (e.g. clamped faces, blocking Poisson contraction, wrong symmetry BCs) → too stiff, artificial stress peaks at supports.</li>
<li><b>Symmetry plane</b>: constrain only the displacement <i>normal</i> to the plane (and the in-plane rotations for shells/beams).</li>
<li><b>Point loads / point supports</b> on solids → singular stress (infinite in theory). Distribute the load over the real contact area; evaluate away from it (St-Venant).</li>
<li><b>Units</b>: FE codes are unit-less, so use a consistent set:</li></ul>
<div class="formula">mm – N – MPa (N/mm²) – tonne (t) – s &nbsp;&nbsp;→ steel E = 210 000, ρ = 7.85·10⁻⁹ t/mm³<br>m – N – Pa – kg – s &nbsp;&nbsp;→ steel E = 210·10⁹, ρ = 7850 kg/m³</div>
<p>Always sanity-check: reaction forces = applied loads, deformation plot plausible, hand calculation within the right order of magnitude.</p>`,
takeaway:'Constrain exactly the rigid-body modes reality constrains, avoid point loads on solids, and use a consistent unit system.',
build(sim){
 const C=makeCanvas(sim,680,330),ctx=C.ctx;const msgBox=el('div',{class:'small',style:'margin-top:8px;font-family:monospace;background:#0c111b;padding:8px;border-radius:8px;border:1px solid #2c3850'});sim.appendChild(msgBox);
 const tri=(x,y)=>{ctx.fillStyle='#9aa6bf';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-10,y+16);ctx.lineTo(x+10,y+16);ctx.closePath();ctx.fill();};
 const roll=(x,y)=>{tri(x,y);dot(ctx,x-5,y+20,3,'#9aa6bf');dot(ctx,x+5,y+20,3,'#9aa6bf');};
 const hatch=(x,y,h,side)=>{ctx.fillStyle='#56627e';ctx.fillRect(side<0?x-12:x,y,12,h);ctx.strokeStyle='#9aa6bf';for(let k=0;k<h;k+=10){ctx.beginPath();ctx.moveTo(side<0?x-12:x+12,y+k);ctx.lineTo(side<0?x-20:x+20,y+k+8);ctx.stroke();}};
 const cases=shuffle([
  {draw(){ctx.fillStyle='#24324d';ctx.fillRect(160,120,360,90);ctx.strokeStyle='#4fc3f7';ctx.strokeRect(160,120,360,90);roll(200,210);roll(480,210);arrow(ctx,520,165,600,165,'#ffb74d',3);txt(ctx,'F (horizontal)',560,150,'#ffb74d','12px system-ui','center');txt(ctx,'Plate on two rollers (only UY fixed), horizontal load',340,90,'#c9d2e6','13px system-ui','center');},
   log:'*** ERROR: Zero pivot at node 1287, DOF UX. Matrix is singular.\n*** WARNING: displacement magnitude 3.4e+12 mm',
   q:'The solver aborts. What is wrong and what is the fix?',opts:[['Rigid-body motion in x (and rotation) is unrestrained – add a constraint in x at one support (pin instead of roller)',1,'Rollers only fix UY. Nothing resists the horizontal load: K is singular in that direction.'],['The mesh is too coarse near the rollers',0,'Mesh density never causes a zero pivot of this kind.'],['The load is too large for a linear analysis',0,'Linear analysis scales with any load; singularity is a constraint issue.'],['Switch to quadratic elements',0,'Element order does not remove a rigid-body mode.']]},
  {draw(){ctx.fillStyle='#24324d';ctx.fillRect(140,130,400,60);ctx.strokeStyle='#4fc3f7';ctx.strokeRect(140,130,400,60);hatch(140,120,80,-1);hatch(540,120,80,1);txt(ctx,'all DOF fixed',120,225,'#ef5350','12px system-ui','center');txt(ctx,'UX = +0.5 mm, UY = UZ = 0 on whole face',560,225,'#ef5350','12px system-ui','center');txt(ctx,'Tensile bar: both end faces fully clamped',340,90,'#c9d2e6','13px system-ui','center');},
   log:'Max. von Mises at both ends 38 % higher than F/A; σy ≠ 0 near the faces. Test specimen showed uniform stress.',
   q:'Stress peaks appear at both clamped faces. Diagnosis?',opts:[['Over-constraint: the clamped faces block the Poisson contraction – constrain only the axial DOF (plus minimal rigid-body restraints)',1,'Real grips/loads let the section contract; fully fixing the faces creates artificial transverse stresses.'],['Under-constraint: the bar can rotate',0,'Both faces are completely fixed – there is no free rigid-body mode.'],['The material should be nonlinear',0,'The issue appears in a purely elastic model; it is caused by BCs.'],['Units are wrong',0,'Units would scale everything, not create local end peaks.']]},
  {draw(){ctx.fillStyle='#24324d';ctx.fillRect(140,140,400,70);ctx.strokeStyle='#4fc3f7';ctx.strokeRect(140,140,400,70);hatch(140,130,90,-1);arrow(ctx,400,60,400,138,'#ffb74d',3);dot(ctx,400,140,4,'#ffd54f');txt(ctx,'F on ONE node',410,80,'#ffb74d','12px system-ui');txt(ctx,'3-D solid cantilever, single-node force',340,40,'#c9d2e6','13px system-ui','center');},
   log:'Mesh 2 mm: σmax = 410 MPa at load node\nMesh 1 mm: σmax = 690 MPa\nMesh 0.5 mm: σmax = 1170 MPa (Sy = 355 MPa!)',
   q:'The stress at the load node keeps rising with refinement. What should you do?',opts:[['Distribute the force as a pressure/traction over the real contact area and evaluate stresses away from the load point',1,'A point force on a solid gives infinite theoretical stress (singularity). Far from it (St-Venant) the results are valid.'],['Use the finest mesh value and redesign for 1170 MPa',0,'That value is a mesh artefact and would increase further.'],['Switch to plastic material so the peak stops',0,'This hides the singularity behind plasticity; the load modelling itself is unphysical.'],['Coarsen the mesh at the load',0,'Arbitrary result; does not fix the cause.']]},
  {draw(){ctx.fillStyle='#24324d';ctx.fillRect(140,140,400,40);ctx.strokeStyle='#4fc3f7';ctx.strokeRect(140,140,400,40);hatch(140,130,60,-1);arrow(ctx,540,90,540,138,'#ffb74d',3);
   txt(ctx,'Geometry: mm   Force: 500 N   E = 210e9   ν = 0.3',340,240,'#ffd54f','13px monospace','center');txt(ctx,'Steel cantilever 400 × 40 × 20 mm',340,60,'#c9d2e6','13px system-ui','center');},
   log:'Tip deflection = 4.06e-6 mm\nHand calc (FL³/3EI): ≈ 4.1 mm',
   q:'Deflection is a factor of 10⁶ too small. What is the fix?',opts:[['Use consistent units: in mm–N–MPa enter E = 210 000 (N/mm²)',1,'E = 210e9 is in Pa (N/m²); with mm and N the code reads N/mm², so the beam became 10⁶ times too stiff.'],['Convert the force to kN',0,'That would make it worse/inconsistent: forces must be in N for the mm–N–MPa set.'],['Refine the mesh',0,'A factor 10⁶ is never a discretisation error.'],['Use a nonlinear solver',0,'The problem is the input data, not linearity.']]},
  {draw(){ctx.fillStyle='#24324d';ctx.beginPath();ctx.moveTo(280,250);ctx.arc(200,250,80,0,-Math.PI/2,true);ctx.lineTo(200,80);ctx.lineTo(480,80);ctx.lineTo(480,250);ctx.closePath();ctx.fill();ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
   for(let k=0;k<6;k++){tri(290+k*35,252);}for(let k=0;k<4;k++){ctx.save();ctx.translate(198,100+k*20);ctx.rotate(Math.PI/2);tri(0,0);ctx.restore();}
   txt(ctx,'symmetry edges: UX = UY = 0 (all DOF fixed)',340,295,'#ef5350','12px system-ui','center');for(let k=0;k<4;k++)arrow(ctx,482,100+k*45,530,100+k*45,'#ffb74d',2);txt(ctx,'Quarter model of plate with hole',340,50,'#c9d2e6','13px system-ui','center');},
   log:'Peak stress at hole = 1.9·σnom (expected Kt ≈ 2.5)\nDisplacements much smaller than hand calculation.',
   q:'The quarter model looks too stiff. What is wrong?',opts:[['Wrong symmetry BCs: on a symmetry plane fix only the displacement normal to it (UY = 0 on the x-edge, UX = 0 on the y-edge)',1,'Fixing both DOFs glues the edges, preventing in-plane sliding/contraction that the full plate allows.'],['The model needs no constraints at all thanks to symmetry',0,'Symmetry BCs are exactly what removes the rigid-body modes – but only normal components.'],['Use a full model; symmetry is never allowed',0,'Symmetry is valid when geometry, material, loads and BCs are symmetric – just constrain correctly.'],['The hole is too coarse',0,'Even a coarse mesh would not make displacements far too small.']]},
  {draw(){ctx.fillStyle='#24324d';ctx.beginPath();ctx.moveTo(220,120);ctx.lineTo(460,120);ctx.lineTo(460,160);ctx.lineTo(300,160);ctx.lineTo(300,240);ctx.lineTo(220,240);ctx.closePath();ctx.fill();ctx.strokeStyle='#4fc3f7';ctx.stroke();txt(ctx,'Free–free modal analysis (no supports)',340,70,'#c9d2e6','13px system-ui','center');},
   log:'Mode 1–6: 0.0001 … 0.003 Hz\nMode 7: 412.8 Hz\nMode 8: 655.1 Hz',
   q:'A colleague says the first six "almost zero" frequencies prove the model is broken. Is it?',opts:[['No – an unsupported 3-D body has exactly 6 rigid-body modes at ~0 Hz; the first elastic mode is mode 7',1,'This is the expected (and a useful) check: 6 zero modes confirm the model is connected and has no extra mechanisms.'],['Yes – add supports, modal analysis cannot run free–free',0,'Free–free modal analyses are standard (e.g. for correlation with hammer tests).'],['Yes – the mesh has unconnected parts',0,'Unconnected parts would give MORE than 6 zero modes.'],['The units of density are wrong',0,'Density errors scale all frequencies, they do not create exactly 6 zero modes.']]}]).slice(0,5);
 let cur=0;function show(i){cur=i;C.clear();ctx.lineWidth=1;cases[i].draw();txt(ctx,'Case '+(i+1)+' / '+cases.length,12,20,'#9aa6bf','12px system-ui');msgBox.innerHTML='<b>Solver / post-processing log:</b><br>'+cases[i].log.replace(/\n/g,'<br>');}
 show(0);
 return{tasks:cases.map((c,i)=>({type:'choice',q:`<b>Case ${i+1}.</b> `+c.q,onShow:()=>show(i),opts:c.opts.map(o=>({t:o[0],ok:!!o[1],why:o[2]}))}))};}});
defLevel({id:'w2l5',world:2,title:'Results Interpretation',short:'Averaged vs unaveraged stresses, which stress for which criterion',
concept:`<p>FE stresses are computed at integration (Gauss) points inside each element and are <b>discontinuous</b> between elements. Post-processors extrapolate them to nodes and show either:</p>
<ul><li><b>Unaveraged (element nodal)</b> – each element shows its own values → jumps between elements.</li>
<li><b>Averaged (nodal)</b> – values of all elements sharing a node are averaged → smooth, nicer, but can hide errors.</li></ul>
<div class="formula">σ<sub>node,avg</sub> = (1/m) Σ σ<sub>node</sub><sup>(e)</sup> &nbsp;&nbsp; jump = max − min over the m elements</div>
<p>A large difference between averaged and unaveraged values signals <b>discretisation error → refine</b>. Never average across <b>material or thickness boundaries</b> or across parts – stresses are physically discontinuous there.</p>
<p><b>Which stress for which check?</b></p>
<ul><li>Ductile metals, static strength: <b>von Mises</b> (or Tresca) vs S<sub>y</sub>.</li>
<li>Brittle materials (cast iron, ceramics, glass): <b>max principal</b> σ₁ vs S<sub>ut</sub> (Coulomb–Mohr if compression matters).</li>
<li>Fatigue: principal-stress ranges / critical-plane methods (von Mises loses the sign of mean stress!).</li>
<li>Displacements converge faster than stresses; judge convergence on stresses.</li></ul>`,
takeaway:'Compare averaged and unaveraged plots to estimate mesh error; pick the stress measure that matches the failure mechanism.',
build(sim){
 const nx=8,ny=5;const vals=[];const f=(x,y)=>90+170*Math.exp(-(Math.pow((x-nx)/3.2,2)+Math.pow(y/2.2,2)));
 for(let i=0;i<nx;i++){vals.push([]);for(let j=0;j<ny;j++)vals[i].push(f(i+0.5,j+0.5)*(1+0.12*((i+j)%2?1:-1)));}
 const NI=5,NJ=2;// node N at grid point (5,2) shared by elements (4,1),(5,1),(4,2),(5,2)
 const base=round5(rnd(150,210));const four=[base+rint(-6,6)*5,base+rint(-6,6)*5,base+rint(-6,6)*5,base+rint(-6,6)*5];
 if(Math.max(...four)-Math.min(...four)<30)four[0]+=40;
 [[4,1],[5,1],[4,2],[5,2]].forEach(([i,j],k)=>vals[i][j]=four[k]);
 const avg=mean(four);let show='un';
 const nodeAvg=(I,J)=>{const a=[];for(const[di,dj]of[[-1,-1],[0,-1],[-1,0],[0,0]]){const i=I+di,j=J+dj;if(i>=0&&j>=0&&i<nx&&j<ny)a.push(vals[i][j]);}return mean(a);};
 const C=makeCanvas(sim,680,360),ctx=C.ctx;const x0=40,y0=30,h=60;const lo=80,hi=280;
 function draw(){C.clear();
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const X=x0+i*h,Y=y0+(ny-1-j)*h;
   if(show==='un'){ctx.fillStyle=heat((vals[i][j]-lo)/(hi-lo));ctx.fillRect(X,Y,h,h);}
   else{const a=nodeAvg(i,j),b=nodeAvg(i+1,j),c=nodeAvg(i+1,j+1),d=nodeAvg(i,j+1);const s=8;for(let p=0;p<s;p++)for(let q=0;q<s;q++){const u=(p+0.5)/s,v=(q+0.5)/s;const val=a*(1-u)*(1-v)+b*u*(1-v)+c*u*v+d*(1-u)*v;ctx.fillStyle=heat((val-lo)/(hi-lo));ctx.fillRect(X+p*h/s,Y+h-(q+1)*h/s,h/s+0.5,h/s+0.5);}}
   ctx.strokeStyle='#0c111b';ctx.lineWidth=1;ctx.strokeRect(X,Y,h,h);}
  [[4,1],[5,1],[4,2],[5,2]].forEach(([i,j])=>{const X=x0+i*h,Y=y0+(ny-1-j)*h;txt(ctx,show==='un'?fmt(vals[i][j],0):'',X+h/2,Y+h/2,'#000','bold 13px system-ui','center','middle');});

 const row=el('div',{class:'row'});const bu=el('button',{class:'btn sm pri'},'Unaveraged'),ba=el('button',{class:'btn sm'},'Averaged');row.append(bu,ba);sim.appendChild(row);

 sim.appendChild(el('div',{class:'legend'},'Coarse linear-element mesh near a stress raiser (right edge loaded). Values = von Mises stress extrapolated to node N from each of its 4 elements.'));

 return{tasks:[
