   O(st=>`Offer the ${st.f.bar&&st.f.bar.ok?'compliant barrel you selected':'compliant option'} for ${pn*10} bar, re-qualify with a 1.5× proof test and a pressure-cycle fatigue test of the welds/ports; the current cylinder stays rated at ${p0*10} bar`,1,'Clear limits, verified design, documented re-rating.',{t:-5},null,st=>st.f.bar&&st.f.bar.ok?'The re-rated cylinder passes proof and 1 million cycle impulse tests. Henrik orders 400 units. Your re-rating note becomes the template for the product line.':'Your recommendation was right, but the barrel you chose earlier does not meet the rule – the design review catches it and a second iteration costs two weeks.'),
   O(`Confirm ${pn*10} bar for the existing cylinder – burst pressure is still ${fmt(pb/pn,1)}× higher`,0.1,'Burst margin is not the criterion; the bore stress exceeds the fatigue-based rule and the proof test would load the bore close to yield.',{s:-30},null,'After 8 months of service several barrels show bore cracks at the port cross-bore, starting from a stress concentration you never checked at the new pressure. A recall of 400 cylinders follows.'),
   O('Refuse – the cylinder was never designed for it',0.35,'Safe, but you lose a customer when a compliant solution exists.',{c:-10},null,'Henrik buys from a competitor who offers a re-rated design within two weeks.'),
   O('Confirm, but reduce the proof test to 1.25× so the test stays below yield',0,'Weakening the verification to pass the test defeats its purpose.',{s:-35},null,'An external audit finds the non-standard proof test; the certification body suspends the product approval.')]}],
 debrief:{chain:['Check the geometry class: D/t < 20 ⇒ thick-wall (Lamé).','Peak hoop stress, radial and axial stress at the bore → von Mises.','Compare with rules at rated AND proof pressure.','Know which stress a weld efficiency applies to (circumferential weld ↔ axial stress).','Burst is a sanity check, not the design criterion for cyclic pressure.'],
  concepts:[['von Mises equivalent stress','w1l3'],['Mohr / principal stresses','w1l2'],['Fatigue at stress raisers','w1l5']],
  pitfalls:['Using pD/2t for thick tubes (unconservative at the bore).','Ignoring cross-bores and ports (K<sub>t</sub> 2–4 under pressure).','"Same part, more pressure" requests without re-qualification.','Proof tests are verification, not a design margin to be negotiated.'],
  history:'<b>Grover Shoe Factory, Brockton (USA), 20 March 1905.</b> A boiler explosion destroyed the factory and killed 58 people. Disasters like this led to boiler laws and to the first ASME Boiler Code (1914/1915) – the origin of today\'s pressure-equipment codes with their design factors, joint efficiencies and mandatory hydrostatic tests.'}};}});

/* ---------- CASE 5: bolted joint ---------- */
defCase({id:'c5',icon:'🔧',title:'Bolts That Keep Breaking',level:2,domains:['s','t'],inspired:'Junker\'s loosening research (1969)',
teaser:'M12 bolts on a vibrating screen fail every few weeks. Maintenance wants stronger bolts. Is that the fix?',
build(){
 const At=84.3,Sp=600,Fp=Sp*At,Fi=0.75*Fp,K=0.2,d=12,Tspec=K*Fi*d/1000;const Tres=rint(15,25);const Fl=Tres*1000/(K*d);const kb=rint(35,45)*10,km=rint(150,180)*10;const C=kb/(kb+km);
 const P=rint(30,36)*1000;const P0=Fl/(1-C);const sep=P>P0;const saL=sep?(P-Fl)/(2*At):C*P/(2*At);const saOK=C*P/(2*At);const Se=129;const smOK=(Fi+C*P/2)/At,si=Fi/At;const nOK=Se*(830-si)/(830*saOK+Se*(smOK-si));
 return{brief:{avatar:'🧑‍🏭',who:'Dana Okafor',role:'Maintenance lead, quarry',quote:'The M12 bolts on the screen deck break every few weeks. We just put in new 8.8 bolts each time. Can we switch to 12.9 – they are 50 % stronger, right?',
  story:`<p>A vibrating screen deck is clamped to the side frame with M12 class 8.8 bolts (A<sub>t</sub> = 84.3 mm², proof strength 600 MPa, rolled threads). Each bolt sees an external tensile load cycling between 0 and <b>${fmt(P/1000,1)} kN</b> at 16 Hz. Spec: tighten to ${fmt(Tspec,0)} N·m (K = 0.2) for a preload of 0.75·F<sub>p</sub>.</p>`,
  sketch:(c)=>{c.fillStyle='#56627e';c.fillRect(160,60,320,40);c.fillRect(160,100,320,40);for(const x of[230,320,410]){c.fillStyle='#b0bec5';c.fillRect(x-7,40,14,120);c.fillRect(x-16,32,32,10);c.fillRect(x-16,158,32,12);}
   c.strokeStyle='#ef5350';c.lineWidth=2;c.beginPath();c.moveTo(310,142);c.lineTo(330,138);c.stroke();txt(c,'fracture at first engaged thread',340,190,'#ef5350','11px system-ui');arrow(c,560,120,560,60,'#ffb74d',2);arrow(c,560,60,560,120,'#ffb74d',2);txt(c,'0 … '+fmt(P/1000,1)+' kN @16 Hz',500,40,'#ffb74d','11px system-ui');txt(c,'screen deck / side frame',165,215,'#9aa6bf','11px system-ui');}},
 steps:[
  {type:'decide',title:'Hypothesis',q:'Fracture surfaces show beach marks starting at the first engaged thread, and several remaining nuts turned easily by hand. What is your leading hypothesis?',opts:[
   O('Fatigue of the bolts because the preload has been lost (joint loosening) – the bolt then sees the full load cycle',1,'Loose nuts + fatigue fractures at the most stressed thread = classic preload loss.'),
   O('Bolts too weak – static overload',0.1,'Static overload shows necking/ductile fracture, not beach marks.'),
   O('Bad bolt batch from the supplier',0.3,'Possible, but it doesn\'t explain the loose nuts, and failures repeat with new batches.'),
   O('Hydrogen embrittlement',0.15,'Class 8.8 is rarely susceptible; and loosening is observed – a mechanical explanation is far more likely.')]},
  {type:'request',title:'Investigation',q:'What do you check/measure?',items:[
   R('Residual (break-loose) torque on the remaining bolts',1,'Direct indicator of remaining preload.'),R('Tightening procedure actually used (tool, lubrication, sequence)',1,'Impact wrenches without control and dry vs oiled threads change preload by ±30 % or more.'),R('Joint drawing: grip length, plate stiffness, slip surfaces',1,'Needed for the joint stiffness and to check for transverse slip.'),R('Bolt material certificates',0.5,'Cheap to check; rules out the "bad batch" theory.'),R('Colour of the bolt coating',0,'Irrelevant.'),R('Who ordered the bolts',0,'Irrelevant.')],
   evidence:{h:'Measurements',html:tbl([['Residual (break-loose) torque','≈ '+Tres+' N·m (spec '+fmt(Tspec,0)+' N·m)'],['Tightening','impact wrench, "until tight", no torque control'],['Stiffness (from drawing)','bolt k<sub>b</sub> = '+kb+' kN/mm, clamped members k<sub>m</sub> = '+km+' kN/mm'],['Certificates','8.8 within spec'],['Bolt fatigue limit (rolled, 8.8)','S<sub>e</sub> ≈ 129 MPa (alternating, thread effect included)']])}},
  {type:'compute',title:'Remaining preload',q:`Estimate the remaining preload from the residual torque with T = K·F<sub>i</sub>·d (K = 0.2, d = 12 mm).`,ans:Fl/1000,unit:'kN',tol:0.03,dec:2,explain:`F<sub>i</sub> ≈ ${Tres}/(0.2·0.012) = ${fmt(Fl/1000,2)} kN vs intended 0.75·F<sub>p</sub> = ${fmt(Fi/1000,1)} kN. (Break-loose torque is only an approximate indicator – but the order of magnitude is clear.)`},
  {type:'compute',title:'Joint constant',q:'Compute the joint (load) factor C = k<sub>b</sub>/(k<sub>b</sub> + k<sub>m</sub>).',ans:C,tol:0.02,dec:3,explain:`C = ${kb}/(${kb}+${km}) = ${fmt(C,3)}: while the joint stays clamped the bolt sees only ${fmt(100*C,0)} % of the external load change.`},
  {type:'compute',title:'Separation',q:'At which external load P<sub>0</sub> does the joint <b>separate</b> with the remaining preload? P<sub>0</sub> = F<sub>i</sub>/(1 − C).',ans:P0/1000,unit:'kN',tol:0.03,dec:2,explain:`P<sub>0</sub> = ${fmt(Fl/1000,2)}/(1 − ${fmt(C,3)}) = ${fmt(P0/1000,2)} kN ${sep?'< '+fmt(P/1000,1)+' kN → the joint opens every cycle and the bolt carries the full external load.':'> '+fmt(P/1000,1)+' kN → still clamped, but with little margin.'}`},
  {type:'compute',title:'Bolt stress amplitude',ref:'w1l5',q:`Compute the bolt's <b>alternating stress</b> σ<sub>a</sub> in the loosened state (${sep?'separated: bolt load cycles between F<sub>i</sub> and P':'clamped: σ<sub>a</sub> = C·P/(2A<sub>t</sub>)'}).`,ans:saL,unit:'MPa',tol:0.03,dec:1,explain:`σ<sub>a</sub> = ${sep?`(${fmt(P/1000,1)} − ${fmt(Fl/1000,2)}) kN/(2·84.3 mm²)`:`C·P/(2A<sub>t</sub>)`} = ${fmt(saL,1)} MPa vs S<sub>e</sub> ≈ 129 MPa. With the specified preload (no separation): σ<sub>a</sub> = C·P/(2A<sub>t</sub>) = ${fmt(saOK,1)} MPa – ${fmt(saL/saOK,1)}× lower, and the bolt Goodman factor n = S<sub>e</sub>(S<sub>ut</sub> − σ<sub>i</sub>)/(S<sub>ut</sub>σ<sub>a</sub> + S<sub>e</sub>(σ<sub>m</sub> − σ<sub>i</sub>)) = ${fmt(nOK,2)}.`},
  {type:'decide',title:'Corrective action',q:'Which corrective action do you implement?',opts:[
   O('Controlled tightening to the specified preload (calibrated torque or torque-angle, defined lubrication), stop the loosening (check for transverse slip; increase clamp length/preload or use a verified locking method), and re-check preload after run-in',1,'Restores the mechanism that protects the bolt – preload – and attacks the loosening cause.',{c:-5,t:-5}),
   O('Switch to 12.9 bolts, same tightening method',0.2,'The thread fatigue limit grows far less than the static strength (≈162–190 vs 129 MPa), and if the preload is lost again the bolt still sees the full load cycle.',{c:-5,s:-15}),
   O('Add split spring (lock) washers',0.15,'Transverse-vibration (Junker) tests have shown that split spring washers provide little resistance to self-loosening.',{s:-15}),
   O('Thread-locking adhesive only, keep the impact wrench',0.45,'Adhesive helps against rotation, but without controlled preload the joint may still separate and the bolts still fatigue.',{s:-5})]},
  {type:'final',title:'Report to maintenance',q:'Your summary to Dana:',opts:[
   O('Root cause: preload loss → joint separation → full load cycles on the bolts → thread fatigue. Fix: controlled tightening + anti-loosening design + preload audit after 50 h; 12.9 bolts are not needed.',1,'Correct chain, actionable fix, verification step.',{},null,'With controlled tightening and a preload audit, no bolt has failed in 14 months. Dana saves the cost of the weekly bolt changes and the unplanned stops.'),
   O('Install 12.9 bolts and keep everything else',0.1,'Treats the symptom.',{s:-25},null,'The 12.9 bolts last about twice as long – then they start failing too. One breaks during operation, the deck shifts, and the screen is damaged. Root cause still open.'),
   O('Replace bolts every 2 weeks preventively',0.3,'Expensive and still not addressing the cause; a bolt may fail between changes.',{c:-20},null,'Maintenance cost doubles, and a bolt still fails between changes after a period of heavy production.'),
   O('Weld the deck to the frame',0.2,'Welding a vibrating structure creates new fatigue-critical weld details and prevents maintenance.',{s:-10,t:-10},null,'Six months later fatigue cracks appear at the weld toes of the new joint – harder to repair than bolts.')]}],
 debrief:{chain:['Fatigue fracture + loose nuts ⇒ preload loss.','Measure what is left (residual torque) and how it was tightened.','Joint diagram: C = k<sub>b</sub>/(k<sub>b</sub>+k<sub>m</sub>); separation at P<sub>0</sub> = F<sub>i</sub>/(1−C).','Clamped joint: bolt sees C·ΔP. Separated: full ΔP → fatigue.','Fix preload and loosening; stronger bolts only treat the symptom.'],
  concepts:[['Fatigue, Goodman','w1l5'],['Stiffness & springs in series/parallel','w2l1'],['Root-cause tools','w3l5']],
  pitfalls:['"Stronger bolt" reflex – fatigue strength of threads hardly scales with grade.','Torque ≠ preload: friction scatter makes torque-only tightening ±25–30 %.','Lock washers of doubtful effectiveness against transverse vibration.','Not re-checking preload after settling/run-in.'],
  history:'<b>Self-loosening research (Junker, 1969).</b> Gerhard Junker showed with transverse vibration tests that bolted joints loosen mainly when the joint surfaces slip sideways, and that sufficient preload is the primary defence. His test method is standardised today (e.g. DIN 65151) and is used to evaluate locking devices.'}};}});
/* ---------- CASE 6: warranty with censored Weibull data ---------- */
defCase({id:'c6',icon:'📉',title:'How Long Can We Warrant It?',level:3,domains:['t'],inspired:'Weibull (1951) life-data analysis',
teaser:'Field data from 20 drive units from a cargo e-bike rental fleet – some failed, most still running. Marketing wants a 3-year warranty. Finance wants numbers.',
build(){
 const N=20;let items,fit,F,beta0,eta0;
 for(let g=0;g<3000;g++){beta0=pick([1.8,2.5,3.2]);eta0=rint(35,55)*100;items=[...Array(N)].map(()=>{const age=rint(8,50)*100;const T=Math.round(eta0*Math.pow(-Math.log(Math.random()),1/beta0));return T<age?{t:Math.max(50,T),f:true}:{t:age,f:false};}).sort((a,b)=>a.t-b.t);
  const nf=items.filter(i=>i.f).length;if(nf<6||nf>10||!items[0]||new Set(items.map(i=>i.t)).size<N)continue;
  let prev=0;items.forEach((it,k)=>{it.rr=N-k;if(it.f){it.O=(it.rr*prev+N+1)/(it.rr+1);prev=it.O;it.F=(it.O-0.3)/(N+0.4);}});
  const fs=items.filter(i=>i.f);const r=linreg(fs.map(i=>Math.log(i.t)),fs.map(i=>Math.log(-Math.log(1-i.F))));fit={b:r.m,e:Math.exp(-r.b/r.m)};
  const cf=x=>x<0.9?0:x<1.2?1:2;if(cf(fit.b)!==cf(beta0)||cf(fit.b)===1)continue;if(items.findIndex((it,k)=>it.f&&k>0&&items.slice(0,k).some(x=>!x.f))<0)continue;break;}
 const ask=items.findIndex((it,k)=>it.f&&items.slice(0,k).some(x=>!x.f));const A=items[ask];const prevO=(()=>{let p=0;for(let k=0;k<ask;k++)if(items[k].f)p=items[k].O;return p;})();
 const Ft=t=>1-Math.exp(-Math.pow(t/fit.e,fit.b));const B10=fit.e*Math.pow(-Math.log(0.9),1/fit.b);const inf=fit.b<1;
 const tstar=fit.e*Math.pow(-Math.log(0.97),1/fit.b);const ratio=pick([rnd(1.25,1.75),rnd(2.25,2.75)]);const use=Math.round(tstar/ratio/50)*50;const yrsOK=Math.floor(tstar/use);
 const w=[1,2,3].map(y=>({y,F:Ft(y*use)}));
 const table=tbl([['#',...items.map((_,k)=>k+1)],['hours',...items.map(i=>i.t)],['status',...items.map(i=>i.f?'<b style="color:#ef5350">F</b>':'<span class="mut">S</span>')]]);
 return{brief:{avatar:'👩‍💼',who:'Lea Hoffmann',role:'Product manager, e-bike drive units',quote:'Competitors give 3 years. Can we? Finance says expected warranty claims must stay below 3 % of units sold. Here is the field data from our pilot fleet.',
  story:`<p>20 drive units in a rental-fleet pilot, installed at different times. <b>F</b> = failed (bearing seizure) at that running time; <b>S</b> = still running at that age (suspension). Average use ≈ <b>${use} h per year</b>.</p>`,data:table},
 steps:[
  {type:'decide',title:'Censored data',q:'Most units have not failed yet. How do you treat them in the Weibull analysis?',opts:[
   O('As suspensions (right-censored): they survived at least that long – adjust the ranks of the failures accordingly',1,'Suspensions carry information ("survived to t") and must be included, e.g. with Johnson\'s adjusted ranks or maximum likelihood.'),
   O('Ignore them and analyse only the failures',0.1,'Ignoring survivors makes the product look much worse (all units appear to fail by the last failure time) – heavily pessimistic and biased.',{c:-10}),
   O('Count them as failures at their current age',0,'Treating survivors as failures is even more pessimistic and plainly wrong.',{c:-15}),
   O('Wait until all units have failed',0.2,'Statistically clean but useless for a business decision – could take years.',{t:-30})]},
  {type:'compute',title:'Adjusted rank',ref:'w3l1',q:()=>`Johnson/Abernethy adjusted rank: O<sub>i</sub> = [r·O<sub>prev</sub> + (N + 1)]/(r + 1), with r = reverse rank (number of units with time ≥ this one). Compute O for the failure at <b>${A.t} h</b> (item #${ask+1}, r = ${A.rr}; previous adjusted rank O<sub>prev</sub> = ${fmt(prevO,4)}).`,ans:A.O,abs:0.01,tol:0,dec:3,explain:`O = (${A.rr}·${fmt(prevO,4)} + 21)/(${A.rr}+1) = ${fmt(A.O,3)} – not simply ${Math.round(prevO)+1}, because suspensions before it "might have failed" earlier. Median rank F = (O − 0.3)/(N + 0.4) = ${fmt(A.F,4)}.`,
   evidence:{h:'Weibull plot (rank regression, adjusted ranks)',html:`Fit: <b>β = ${fmt(fit.b,2)}</b>, <b>η = ${fmt(fit.e,0)} h</b> (failures only plotted; suspensions enter through the ranks).`,H:230,draw:(c)=>{const fs=items.filter(i=>i.f);const xr=[Math.log(fs[0].t)-0.6,Math.log(Math.max(fit.e*1.3,fs[fs.length-1].t))+0.3];const P=plotArea(c,70,15,540,170,xr,[-4.6,1.5]);
     P.axes('time (h, log)','F (%)',{xt:niceTicks(Math.exp(xr[0]),Math.exp(xr[1]),5).filter(v=>v>0).map(Math.log),xf:v=>fmt(Math.exp(v),0),yt:[0.01,0.05,0.1,0.3,0.632,0.9,0.99].map(f=>Math.log(-Math.log(1-f))),yf:v=>fmt(100*(1-Math.exp(-Math.exp(v))),0),yoff:40});
     P.clip();P.line(x=>fit.b*(x-Math.log(fit.e)),xr[0],xr[1],'#66bb6a',2,2);c.restore();fs.forEach(i=>dot(c,P.X(Math.log(i.t)),P.Y(Math.log(-Math.log(1-i.F))),5,'#ffb74d','#0c111b'));}}},
  {type:'decide',title:'Failure mode',q:`The fit gives β = ${fmt(fit.b,2)}. What does it tell you about the bearing failures?`,opts:[
   O('β < 1: early failures (infant mortality) – typically assembly/installation damage, contamination or manufacturing defects',inf?1:0,inf?'Decreasing hazard: the failures cluster early and are not wear-out.':'β > 1 here – the hazard increases with age.'),
   O('β ≈ 1: purely random failures',0.1,'β is clearly away from 1.'),
   O('β > 1: wear-out (fatigue of the rolling contacts, lubricant degradation)',inf?0:1,inf?'β < 1 here – that is not a wear-out pattern.':'Increasing hazard – classic for bearing fatigue (β ≈ 1.5–3).')]},
  {type:'compute',title:'B10 life',ref:'w3l2',q:'Compute the B10 life from the fit.',ans:B10,unit:'h',tol:0.03,dec:0,explain:`B10 = η(−ln 0.9)<sup>1/β</sup> = ${fmt(B10,0)} h ≈ ${fmt(B10/use,1)} years of average use.`},
  {type:'compute',title:'Expected claims',q:`What fraction of units is expected to fail within a <b>2-year</b> warranty (${2*use} h)? Give it in %.`,ans:100*w[1].F,unit:'%',abs:0.3,tol:0,dec:2,explain:`F(${2*use}) = 1 − exp[−(${2*use}/${fmt(fit.e,0)})<sup>${fmt(fit.b,2)}</sup>] = ${fmt(100*w[1].F,2)} %. 1 year: ${fmt(100*w[0].F,2)} %, 3 years: ${fmt(100*w[2].F,2)} %.`},
  {type:'decide',title:'Warranty period',q:'Finance rule: expected claims ≤ 3 % of units. Which warranty do you recommend (longest that meets the rule)?',opts:w.map(x=>({t:`${x.y} year${x.y>1?'s':''}`,q:x.y===yrsOK?1:x.y<yrsOK?0.5:0.05,fb:`Expected claims ${fmt(100*x.F,2)} % ${x.F<=0.03?'≤':'>'} 3 %. ${x.y===yrsOK?'Longest compliant period.':x.y<yrsOK?'Compliant, but you give away a market advantage.':'Exceeds the budget.'}`,fx:x.F<=0.03?{}:{c:-30},set:{wy:x.y}}))},
  {type:'final',title:'Recommendation',q:'Your recommendation to Lea:',opts:inf?[
   O(`Warranty ${yrsOK} year(s). The failures are EARLY failures (β < 1): investigate assembly/installation and contamination, introduce an end-of-line run-in test and supplier audit – this can lower claims more than any design change.`,1,'Matches the statistics to the right action.',{},null,`Teardown of the failed units shows dented raceways from a press-fit tool with wrong support. After fixing the fixture and adding a run-in test, the next cohort shows almost no early failures – the 3-year warranty becomes possible a year later.`),
   O(`Warranty ${yrsOK} year(s). Redesign with a bigger bearing for longer fatigue life.`,0.3,'A bigger bearing addresses wear-out, but β < 1 indicates early defects; the root cause would remain.',{c:-15},null,'The bigger bearing costs €4 per unit and changes nothing – the early failures continue, because their cause was the assembly process.'),
   O('Grant 3 years to match competitors; claims will be absorbed',0.05,'Ignores the data and the finance rule.',{c:-30},null,'Warranty costs run at 2–3× budget and the product line misses its profit target.')]:[
   O(`Warranty ${yrsOK} year(s), B10 = ${fmt(B10,0)} h. Failures are WEAR-OUT (β > 1): extend life by design (bearing size/lubrication) if 3 years is a must; re-check with more field data.`,1,'Correct limit + correct type of corrective action.',{},null,`Engineering upgrades the bearing and grease; a bench test shows a ~2× B10 improvement. The next model year launches with a 3-year warranty within the 3 % budget.`),
   O(`Warranty ${yrsOK} year(s). Add an end-of-line burn-in test to screen out bad units.`,0.3,'Burn-in removes EARLY failures; with β > 1 it only consumes life of good units.',{c:-10},null,'The burn-in adds cost and slightly shortens field life – claims don\'t drop.'),
   O('Grant 3 years to match competitors; claims will be absorbed',0.05,'Ignores the data and the finance rule.',{c:-30},null,'Warranty costs run at 2–3× budget and the product line misses its profit target.')]}],
 debrief:{chain:['Use all the data: survivors are suspensions, not missing data.','Adjusted ranks (or MLE) → Weibull plot → β, η.','β diagnoses the failure type and therefore the right corrective action.','Reliability metrics (B10, F(t)) translate directly into warranty cost.','Decide with the business rule, state assumptions, plan to update with more data.'],
  concepts:[['Weibull plot, median ranks','w3l1'],['R(t), B10','w3l2'],['Pareto / root cause','w3l5']],
  pitfalls:['Dropping suspensions (pessimistic) or counting them as failures.','Extrapolating far beyond the data (3 years from units mostly < 1 year).','Applying burn-in to wear-out failures, or design upgrades to manufacturing defects.','Small samples: β and η have wide confidence bounds – plan to re-fit as data accumulates.'],
  history:'<b>Waloddi Weibull (1951)</b> published "A statistical distribution function of wide applicability" in the Journal of Applied Mechanics. Its flexibility (β from infant mortality to wear-out) and its usefulness for small samples made it the standard in reliability engineering and warranty analysis.'}};}});

/* ---------- CASE 7: supplier qualification ---------- */
defCase({id:'c7',icon:'⚖',title:'Two Suppliers, One Bracket',level:2,domains:['t','s'],inspired:'MIL-HDBK-5 / MMPDS design allowables',
teaser:'Supplier A is cheaper and has the higher average strength. Supplier B is boring and consistent. Purchasing wants A. You decide.',
build(){
 let A,B,sA,sB,mA,mB,muL,sL,zA,zB;const gen=(m,s)=>[...Array(10)].map(()=>Math.round(m+s*randn()));
 for(let g=0;g<400;g++){A=gen(rnd(295,310),rnd(18,24));B=gen(0,1);const mb=mean(A)-rnd(10,20);B=gen(mb,rnd(7,10));mA=mean(A);sA=stdev(A);mB=mean(B);sB=stdev(B);muL=rint(38,42)*5;sL=rint(12,16);
  zA=(mA-muL)/Math.hypot(sA,sL);zB=(mB-muL)/Math.hypot(sB,sL);if(zA<3.9&&zB>4.5&&mA>mB+5)break;}
 const bA=mA-2.355*sA,bB=mB-2.355*sB;const PfA=1-Phi(zA),PfB=1-Phi(zB);const vol=200000;
 return{brief:{avatar:'🧑‍💻',who:'Tom Becker',role:'Purchasing',quote:`Supplier A is €0.70 cheaper per bracket AND has the higher average strength. 200,000 brackets a year – that's €140k. Easy decision, right?`,
  story:`<p>Cast aluminium bracket, static failure governed by tensile strength. Each supplier sent 10 test coupons from production. Field load stress (measured): <b>μ<sub>L</sub> = ${muL} MPa, σ<sub>L</sub> = ${sL} MPa</b>. A bracket failure costs about €5,000 (warranty + recall exposure). Requirement: probability of failure ≤ 10 ppm.</p>`,
  data:tbl([['Supplier A (MPa)',...A],['Supplier B (MPa)',...B]])+`<p class="small">A: x̄ = ${fmt(mA,1)}, s = ${fmt(sA,2)} · B: x̄ = ${fmt(mB,1)}, s = ${fmt(sB,2)} (n = 10 each)</p>`},
 steps:[
  {type:'decide',title:'Comparison metric',q:'How should the two suppliers be compared for strength?',opts:[
   O('By a statistic that covers the lower tail – a tolerance-bound allowable (B-basis) and the stress–strength reliability',1,'Failures happen in the tails, so the comparison must account for scatter.'),
   O('By the mean strength',0.1,'The mean says nothing about the weakest parts that fail.'),
   O('By the lowest of the 10 test values',0.4,'Better than the mean, but the minimum of 10 is a very noisy statistic and says nothing about the population tail.'),
   O('By the highest test value',0,'Irrelevant to failures.')]},
  {type:'compute',title:'B-basis A',ref:'w3l4',q:'Compute the B-basis allowable for supplier A: x̄ − k<sub>B</sub>·s, k<sub>B</sub> = 2.355 (n = 10).',ans:bA,unit:'MPa',tol:0.015,dec:1,explain:`A: ${fmt(mA,1)} − 2.355·${fmt(sA,2)} = ${fmt(bA,1)} MPa. B: ${fmt(mB,1)} − 2.355·${fmt(sB,2)} = <b>${fmt(bB,1)} MPa</b> – supplier B has the higher allowable despite its lower mean.`},
  {type:'compute',title:'Interference, supplier A',ref:'w3l3',q:'Compute the safety index z for supplier A: z = (x̄ − μ<sub>L</sub>)/√(s² + σ<sub>L</sub>²).',ans:zA,tol:0.02,dec:3,explain:`z<sub>A</sub> = ${fmt(mA-muL,1)}/${fmt(Math.hypot(sA,sL),2)} = ${fmt(zA,3)} → P<sub>f</sub> = ${fmt(PfA*1e6,1)} ppm. Supplier B: z = ${fmt(zB,3)} → P<sub>f</sub> = ${fmt(PfB*1e6,2)} ppm.`},
  {type:'compute',title:'Expected failures',q:'How many field failures per year do you expect with supplier A (200,000 parts/year)?',ans:PfA*vol,logtol:0.08,unit:'failures/yr',explain:`${fmt(PfA*1e6,1)} ppm × 200,000 = ${fmt(PfA*vol,1)} failures/yr → ≈ €${fmt(PfA*vol*5000,0)} per year. Supplier B: ${fmt(PfB*vol,2)} failures/yr.`},
  {type:'decide',title:'Supplier choice',q:'Which supplier strategy do you approve?',opts:[
   O('Supplier B – meets the 10 ppm requirement with margin',1,`P<sub>f</sub> ${fmt(PfB*1e6,2)} ppm ≤ 10 ppm; the €140k price difference is smaller than A's expected failure cost of ≈ €${fmt(PfA*vol*5000,0)}/yr, and B is compliant.`,{c:-5}),
   O('Supplier A – cheaper and stronger on average',PfA*1e6<=10?0.7:0.05,`P<sub>f</sub> = ${fmt(PfA*1e6,1)} ppm ${PfA*1e6<=10?'≤':'>'} 10 ppm.`,PfA*1e6<=10?{}:{s:-30}),
   O('Supplier A, but require 100 % proof testing of every bracket at a load above the critical tail',0.6,'Proof testing truncates the weak tail and can be valid – but adds cost, test equipment, and risk of damaging good parts; it needs a validated proof level.',{c:-15,t:-10}),
   O('Split 50/50 between A and B',0.25,'Halves the exposure but still violates the requirement for the A share.',{s:-15})]},
  {type:'final',title:'Memo to purchasing',q:'Your memo to Tom:',opts:[
   O(`Choose B. A's higher mean comes with 2–3× larger scatter: its B-basis is ${fmt(bA,0)} vs ${fmt(bB,0)} MPa and its predicted failure rate (${fmt(PfA*1e6,0)} ppm) violates the 10 ppm requirement. Ask A for a process-capability improvement plan if we want a second source.`,1,'Quantified, explains WHY (scatter), and leaves a door open for A.',{},null,`Supplier B is nominated. Six months later A presents an improved casting process (s down to 9 MPa) and qualifies as second source. Field failures: zero so far.`),
   O('Choose A – €140k per year saving.',0.05,'',{c:-30,s:-30},null,`In the first year ${Math.max(2,Math.round(PfA*vol*rnd(0.7,1.4)))} brackets fail in the field. One failure causes a machine to tip over during service; the recall and legal costs far exceed the savings.`),
   O('Ask both suppliers for 50 more coupons before deciding',0.55,'More data narrows the uncertainty (smaller k-factor), but the evidence is already clear and the program waits.',{t:-20},null,'The additional tests confirm the result six weeks later; the launch slips accordingly.')]}],
 debrief:{chain:['Failures live in the lower tail – compare distributions, not means.','Tolerance-bound allowables (B-basis) include sample-size uncertainty.','Stress–strength interference turns scatter into a failure probability.','Expected cost of failure vs price difference → business case.','Recommend, quantify, and give the losing supplier a path to improve.'],
  concepts:[['B-basis allowables','w3l4'],['Stress–strength interference','w3l3'],['Normal distributions','w3l4']],
  pitfalls:['Choosing by mean strength ("A is stronger").','Treating 10 coupons as the truth – the sample statistics themselves scatter.','Assuming normality in the far tail without checking (casting defects create fat lower tails).','Ignoring load scatter.'],
  history:'<b>Design allowables.</b> The US aerospace handbook MIL-HDBK-5 (today continued as MMPDS) defined A-basis (99 % of the population with 95 % confidence) and B-basis (90 %/95 %) values; A-basis is typically required for single-load-path structure and B-basis for redundant structure. The idea – design against a statistically bounded lower tail rather than an average – is now common across industries.'}};}});
/* ---------- CASE 8: the arctic contract ---------- */
defCase({id:'c8',icon:'❄',title:'The Arctic Contract',level:2,domains:['t','s'],inspired:'Challenger 1986 · Liberty ships',
teaser:'A compressor skid for a site where winter starts happen at −30 °C. The data you need is already on a manager\'s slide – just not all of it.',
build(){
 let S;for(let g=0;g<300;g++){S=[...Array(24)].map(()=>{const T=rint(4,30);const p=1/(1+Math.exp((T-11)/2.5));const n=Math.random()<p?rint(1,3):(Math.random()<0.1?1:0);return{T,n};}).sort((a,b)=>a.T-b.T);
  const warm=S.filter(s=>s.T>=20&&s.n>0).length,cold=S.filter(s=>s.T<15&&s.n>0).length,coldN=S.filter(s=>s.T<15).length;if(warm>=2&&warm<=3&&cold>=4&&coldN>=6&&coldN-cold>=1)break;}
 const below=S.filter(s=>s.T<15),above=S.filter(s=>s.T>=15);const fb=below.filter(s=>s.n>0).length/below.length,fa=above.filter(s=>s.n>0).length/above.length;
 const T27=rint(-2,10),Cw=14,Tm=T27+Cw*0.6983;const CV=T=>4+58*(1+Math.tanh((T-Tm)/Cw));const temps=[-40,-30,-20,-10,0,10,20];const pts=temps.map(T=>({T,E:Math.max(2,CV(T)+rnd(-3,3))}));
 const inc=S.filter(s=>s.n>0);
 return{brief:{avatar:'👨‍💼',who:'Jens Larsen',role:'Sales director',quote:'The client wants the standard compressor skid at their new site in northern Norway – cold starts down to −30 °C. We have 24 start-ups of field history and "temperature is not a factor" – see my slide. Can you sign off by Friday?',
  story:'<p>Concerns: (1) the elastomer shaft seals – leak incidents have occurred on start-up; (2) the skid base frame is welded from S355<b>JR</b> plate (impact tested at +20 °C only).</p>',
  data:`<p class="small"><b>Jens' slide:</b> "Start-ups with seal leak incidents" (only starts that had incidents)</p>`+tbl([['Ambient (°C)',...inc.map(s=>s.T)],['Incidents',...inc.map(s=>s.n)]])},
  sh:220,sketch:(c)=>{const P=plotArea(c,60,15,550,160,[0,32],[0,3.5]);P.axes('ambient temperature at start-up (°C)','incidents',{ny:4,yoff:34});inc.forEach(s=>dot(c,P.X(s.T),P.Y(s.n),6,'#ef5350','#0c111b'));c.fillStyle='#9aa6bf';c.font='12px system-ui';c.fillText('"No obvious trend"',P.X(20),P.Y(3.2));},
 steps:[
  {type:'request',title:'What data?',q:'Before judging the slide, what do you request? (select all you need)',items:[
   R('All 24 start-ups, including those with ZERO incidents, with ambient temperature',1,'The starts without incidents carry the information – without them no trend can be seen.'),
   R('Seal material datasheet incl. low-temperature limit (e.g. TR10 / glass transition)',1,'Elastomers lose resilience near their glass transition – a physical mechanism to check.'),
   R('Charpy impact data for the base-frame steel at low temperature',1,'Needed for the second concern.'),
   R('Paint specification of the skid',0,'Irrelevant to the failure modes.',2),
   R('The sales margin of the contract',0,'Not an engineering input.',1)],
   evidence:{h:'All start-ups (incl. zero-incident starts)',html:'Full data set from the commissioning logs.',H:220,draw:(c)=>{const P=plotArea(c,60,15,550,160,[0,32],[-0.3,3.5]);P.axes('ambient temperature at start-up (°C)','incidents',{yt:[0,1,2,3],yoff:34});S.forEach(s=>dot(c,P.X(s.T),P.Y(s.n),6,s.n?'#ef5350':'#66bb6a','#0c111b'));c.strokeStyle='#ffb74d';c.setLineDash([5,4]);c.beginPath();c.moveTo(P.X(15),15);c.lineTo(P.X(15),175);c.stroke();c.setLineDash([]);}}},
  {type:'compute',title:'Incident rate when cold',q:'From the full data: what fraction of start-ups below 15 °C had at least one incident? (in %)',ans:100*fb,unit:'%',abs:1,tol:0,dec:1,explain:`Below 15 °C: ${below.filter(s=>s.n>0).length}/${below.length} = ${fmt(100*fb,1)} %. At or above 15 °C: ${above.filter(s=>s.n>0).length}/${above.length} = ${fmt(100*fa,1)} %. The trend is obvious once the zero-incident starts are included.`},
  {type:'decide',title:'Seals at −30 °C',q:`The coldest start in the history was ${S[0].T} °C. The client needs −30 °C. What do you recommend for the seals?`,opts:[
   O('Do not extrapolate: specify low-temperature seals qualified (tested) below −30 °C and/or keep the seal area heated before start',1,`The requirement is ${S[0].T+30} °C outside the experience base, in the direction where incidents increase.`,{c:-5}),
   O('Fine – the incidents were only leaks, not failures',0,'A leak at −30 °C can become a blow-by of process gas; the trend points the wrong way.',{s:-30}),
   O('Increase the start-up inspection frequency',0.2,'Inspection does not prevent a seal from losing resilience on start.',{s:-15}),
   O('Ask for more data at warm temperatures',0.1,'Warm data cannot tell you how the seal behaves at −30 °C.',{t:-5})]},
  {type:'compute',title:'Charpy transition',ref:'w1l1',q:'Charpy V-notch tests on the frame plate (new evidence). Read/estimate the temperature at which the impact energy is 27 J (°C).',ans:T27,abs:4,tol:0,dec:0,unit:'°C',onShow:(st)=>st.addEv({h:'Charpy V tests, S355JR frame plate',html:tbl([['T (°C)',...pts.map(p=>p.T)],['KV (J)',...pts.map(p=>fmt(p.E,0))]]),H:210,draw:(c)=>{const P=plotArea(c,60,15,550,150,[-45,25],[0,130]);P.axes('test temperature (°C)','KV (J)',{yoff:34});P.line(CV,-45,25,'#66bb6a',2);c.strokeStyle='#ffb74d';c.setLineDash([5,4]);c.beginPath();c.moveTo(60,P.Y(27));c.lineTo(610,P.Y(27));c.stroke();c.setLineDash([]);pts.forEach(p=>dot(c,P.X(p.T),P.Y(p.E),5,'#4fc3f7','#0c111b'));}}),
   explain:`T<sub>27J</sub> ≈ ${T27} °C. Below this the steel behaves in a brittle manner – at −30 °C the impact energy is only ≈ ${fmt(CV(-30),0)} J.`},
  {type:'decide',title:'Frame steel',q:'Minimum design metal temperature −30 °C. Which frame material do you specify?',opts:[
   O('S355NL (normalized, impact tested to 27 J at −50 °C)',1,'Margin below the design temperature – the usual choice for low-temperature service.',{c:-8}),
   O('S355J2 (27 J at −20 °C)',0.35,'Tested 10 °C above the design temperature – insufficient on its own; thickness and stress level would need a fracture assessment.',{c:-3}),
   O('Keep S355JR – the frame stress is low',0.05,'Brittle fracture can occur at low nominal stresses when a flaw or weld defect is present.',{s:-30}),
   O('Keep S355JR but use thicker plate',0,'Thicker plate is generally WORSE for brittle fracture (higher constraint, lower toughness).',{s:-30,c:-5})]},
  {type:'final',title:'Sign-off',q:'Your answer to Jens by Friday:',opts:[
   O('Conditional yes: low-temperature-qualified seals + seal-area preheating, frame in S355NL, both verified by a cold-start test of a prototype; delivery +6 weeks.',1,'Engineering facts drive the commitment.',{t:-10,c:-8},null,'The first winter brings a −34 °C cold snap. The skid starts without leaks; the client orders three more units.'),
   O('Yes, as is – the history shows no problems.',0,'',{s:-40},null,'At the first −28 °C start the shaft seal leaks gas, the skid trips and a crack is found in a frame weld at a bracket. The site is shut down for three weeks; the contract penalty is enforced.'),
   O('No – we cannot operate below 4 °C.',0.35,'Safe but unhelpful: the problems are solvable with known measures.',{c:-20},null,'The client goes to a competitor who offers an arctic package.')]}],
 debrief:{chain:['Ask for the complete data set – including the "nothing happened" cases.','Plot the full data → trend becomes visible.','Do not extrapolate beyond experience in the direction of increasing risk.','Material toughness is temperature dependent: read the transition curve.','Specify qualified materials and verify with a test.'],
  concepts:[['Stress–strain, ductility & toughness','w1l1'],['Root-cause toolbox (data, trends)','w3l5'],['Scatter & confidence','w3l4']],
  pitfalls:['Selection bias: looking only at failures.','Extrapolation outside the tested range.','Assuming low stress = no brittle fracture risk.','Thicker plate as a "fix" for brittle fracture.'],
  history:'<b>Challenger (1986):</b> On the eve of the launch, O-ring erosion/blow-by data were discussed mainly for flights that had incidents; including flights without incidents shows a clear temperature trend. The launch took place at about 2 °C (36 °F), far colder than any previous launch (coldest ≈ 12 °C / 53 °F); an O-ring seal in a solid rocket booster field joint failed. <b>Liberty ships & the T2 tanker Schenectady (1943):</b> many welded wartime ships suffered brittle fractures, especially in cold water; the Schenectady broke in two while moored at the fitting-out pier. The investigations helped establish the role of the ductile–brittle transition and notch toughness (Charpy) requirements.'}};}});

/* ---------- CASE 9: cabin cutout ---------- */
defCase({id:'c9',icon:'✈',title:'A Window in the Cabin',level:3,domains:['s','f'],inspired:'de Havilland Comet 1954 · Aloha 243 1988',
teaser:'A pressurized fuselage needs a cutout for an antenna window. The draftsman drew square corners. You have one design review to get it right.',
build(){
 const p=rint(55,60)/1000,R=rint(18,20)/10,t=rint(14,18)/10;const sh=p*R*1000/t;const Kts=4.2,Ktr=2.6;const A=1000,b=-0.15;
 const Ns=Math.pow(Kts*sh/A,1/b),Nr=Math.pow(Ktr*sh/A,1/b);const Kc=rint(90,110),Y=1.12;const sl=Ktr*sh;const ac=(1/Math.PI)*Math.pow(Kc/(Y*sl),2);
 const a0=0.005,Cp=2e-11,m=3;const Np=(Math.pow(a0,1-m/2)-Math.pow(ac,1-m/2))/(Cp*Math.pow(Y*sl*Math.sqrt(Math.PI),m)*(m/2-1));const fl=rint(3,5);
 return{brief:{avatar:'👩‍✈️',who:'Dr. Mara Okafor',role:'Chief of structures',quote:'We need a cutout in the pressurized cabin for an antenna window. The draft has square corners with a small radius. Tell me if this will live – the aircraft will see about '+fl+' flights a day for 25 years.',
  story:`<p>Cylindrical cabin, radius R = <b>${R} m</b>, skin t = <b>${t} mm</b>, cabin pressure differential p = <b>${fmt(p*1000,0)} kPa</b> – one pressure cycle per flight. Corner options: small radius (K<sub>t</sub> ≈ ${Kts}) or generously rounded (K<sub>t</sub> ≈ ${Ktr}).</p><p class="small">Local S–N curve of the alloy (max stress, R≈0): S<sub>max</sub> = ${A}·N<sup>${b}</sup> MPa. Crack data: K<sub>c</sub> = ${Kc} MPa√m, Paris da/dN = 2·10<sup>−11</sup>(ΔK)<sup>3</sup> m/cycle, Y = 1.12. NDI can reliably detect cracks ≥ 5 mm.</p>`},
  sh:210,sketch:(c)=>{c.strokeStyle='#4fc3f7';c.lineWidth=2;c.strokeRect(60,40,240,130);c.fillStyle='#9aa6bf';c.font='12px system-ui';c.fillText('skin panel',70,60);c.strokeStyle='#ef5350';c.strokeRect(140,80,80,50);c.fillText('square-ish corner',120,150);
   c.strokeStyle='#4fc3f7';c.strokeRect(350,40,240,130);c.strokeStyle='#66bb6a';c.beginPath();c.roundRect?c.roundRect(430,80,80,50,18):c.rect(430,80,80,50);c.stroke();c.fillText('rounded corner',430,150);
   c.fillStyle='#ffb74d';c.fillText('⟵ hoop stress σ = pR/t ⟶',230,195);},
 steps:[
  {type:'decide',title:'Governing load case',q:'Which failure mode governs the cutout design?',opts:[
   O('Fatigue from the pressurization cycle every flight, concentrated at the cutout corners',1,'One cycle per flight, ~'+fl*365*25+' cycles in 25 years – at a stress concentration.'),
   O('Static burst at maximum pressure',0.3,'Must be checked, but with ample margin the cyclic loading governs.'),
   O('Buckling of the skin',0.15,'Pressurized skin is in tension; buckling is not the issue here.'),
   O('Thermal stresses from the window',0.05,'Secondary.')]},
  {type:'compute',title:'Hoop stress',q:'Nominal hoop stress σ = pR/t (MPa).',ans:sh,unit:'MPa',tol:0.02,dec:1,explain:`σ = ${fmt(p,3)} MPa·${R*1000} mm/${t} mm = ${fmt(sh,1)} MPa.`},
  {type:'compute',title:'Corner life (draft)',ref:'w1l5',q:`Estimate the crack-initiation life at the small-radius corner: S<sub>max</sub> = K<sub>t</sub>σ = ${Kts}·σ; N = (S<sub>max</sub>/${A})<sup>1/${b}</sup>.`,ans:Ns,logtol:0.1,unit:'flights',explain:`S<sub>max</sub> = ${fmt(Kts*sh,0)} MPa → N ≈ ${fmt(Ns,0)} flights ≈ ${fmt(Ns/(fl*365),1)} years. With rounded corners (K<sub>t</sub> ${Ktr}): ${fmt(Nr,0)} flights ≈ ${fmt(Nr/(fl*365),1)} years.`},
  {type:'decide',title:'Corner design',q:'What do you change?',opts:[
   O('Generously rounded corners plus a bonded/riveted doubler around the cutout, and a damage-tolerance (crack growth) assessment',1,'Lower K<sub>t</sub>, lower local stress, and a plan for the cracks that will still appear.',{c:-5}),
   O('Rounded corners only',0.6,'Big improvement, but without a doubler and damage-tolerance plan the life is still limited.'),
   O('Thicker skin on the whole fuselage',0.25,'Works but adds a lot of weight; the problem is local.',{c:-20}),
   O('Keep square corners, use a higher-strength alloy',0.05,'High-strength alloys rarely have proportionally better fatigue and often worse toughness.',{s:-25})]},
  {type:'compute',title:'Critical crack length',q:`Even with rounded corners, cracks may start. Critical length a<sub>c</sub> = (1/π)(K<sub>c</sub>/(Yσ<sub>loc</sub>))², with conservative local stress σ<sub>loc</sub> = ${Ktr}σ. Give a<sub>c</sub> in mm.`,ans:ac*1000,unit:'mm',tol:0.03,dec:1,explain:`σ<sub>loc</sub> = ${fmt(sl,0)} MPa → a<sub>c</sub> = (1/π)(${Kc}/(1.12·${fmt(sl,0)}))² = ${fmt(ac*1000,1)} mm.`},
  {type:'compute',title:'Crack growth',q:'Paris-law cycles from a detectable 5 mm crack to a<sub>c</sub> (constant ΔK coefficient, ΔK = Yσ<sub>loc</sub>√(πa)): N = [a₀<sup>−1/2</sup> − a<sub>c</sub><sup>−1/2</sup>]/[C(Yσ√π)³·½].',ans:Np,tol:0.08,dec:0,unit:'flights',explain:`N = ${fmt(Np,0)} flights ≈ ${fmt(Np/(fl*365),1)} years of service.`},
  {type:'decide',title:'Inspection interval',q:'Which NDI inspection interval do you propose for the cutout corners?',opts:[
   O(`About N/2 = ${fmt(Np/2,0)} flights – at least two inspection chances before a crack becomes critical`,1,'Standard damage-tolerance logic: inspect at a fraction of the crack-growth life.'),
   O(`Every ${fmt(Np,0)} flights (= crack-growth life)`,0.2,'Only one chance, and no margin for scatter or a missed crack.',{s:-20}),
   O(`Every ${fmt(Np/10,0)} flights`,0.6,'Safe, but very costly in downtime.',{c:-15}),
   O('No inspection needed with rounded corners',0,'Cracks can still initiate (scatter, corrosion, manufacturing damage).',{s:-30})]},
  {type:'final',title:'Design review',q:'Your conclusion for Dr. Okafor:',opts:[
   O('Approve with rounded corners + doubler, damage-tolerance inspection programme at the cutout, and a full-scale cyclic pressure test of a representative fuselage section (with corrosion prevention at joints).',1,'',{c:-10,t:-10},null,'The full-scale test runs to three design lifetimes; a small crack found at a rivet in test leads to a minor detail change before service. In service, inspections find no critical cracks.'),
   O('Approve the draft – static strength has a factor of 2.',0,'',{s:-50},null,'After a few years the first aircraft develops a crack from the cutout corner that grows unnoticed to critical length – an explosive decompression. The fleet is grounded.'),
   O('Approve with rounded corners; no test needed, the hand calc is enough.',0.45,'Hand calcs miss multi-site and manufacturing effects that a full-scale test reveals.',{s:-15},null,'In service, cracks are found at rivet rows near the doubler earlier than predicted; an expensive inspection and repair programme follows.')]}],
 debrief:{chain:['Identify the cyclic load (pressurization) and the stress raisers.','Nominal stress (pR/t) × K<sub>t</sub> → local stress → S–N life.','Reduce K<sub>t</sub> and local stress (geometry, doubler).','Assume cracks exist: critical crack size and crack-growth life.','Inspection interval from crack-growth life; validate by full-scale test.'],
  concepts:[['Kt and S–N curves','w1l5'],['Biaxial stress (hoop/axial)','w1l2'],['Equivalent stress & failure criteria','w1l3']],
  pitfalls:['Designing for static strength only.','Sharp corners at cutouts.','Assuming "no cracks" – damage tolerance assumes they exist.','Multi-site fatigue at rivet rows; corrosion accelerating crack growth.'],
  history:'<b>de Havilland Comet (1954):</b> after two Comet 1 aircraft broke up in flight, a full-scale water-tank pressure test of a fuselage ended in a fatigue failure originating at a corner of a cutout – in the investigation of the lost aircraft, attention focused on the ADF window cutout in the cabin roof. It established full-scale fatigue testing and contributed to the move to damage-tolerant design. <b>Aloha Airlines 243 (1988):</b> a Boeing 737 with about 89,680 flight cycles lost a large section of its upper fuselage in flight; multi-site fatigue cracking, aggravated by corrosion and disbonding at lap joints, led to new ageing-aircraft inspection programmes.'}};}});

/* ---------- CASE 10: welded brackets ---------- */
defCase({id:'c10',icon:'🔩',title:'Cracks at the Weld Toe',level:2,domains:['t','s'],inspired:'Hyatt Regency 1981 (design changes)',
teaser:'Vibrating screen machines come back with cracked brackets. Production has a quick fix ready. Is it a fix?',
build(){
 const cats=[['Weld toe crack at gusset end',rint(40,60)],['Lack of fusion',rint(10,18)],['Porosity',rint(6,9)],['Bolt-hole fretting',rint(3,5)],['Corrosion',rint(2,3)],['Transport damage',rint(1,2)]];const tot=cats.reduce((s,c)=>s+c[1],0);const share=100*cats[0][1]/tot;
 const ds=rint(55,65),FAT=71,cyc=1.2e6,life=8*cyc;const NL=FAT2=>2e6*Math.pow(FAT2/ds,3);const N0=NL(FAT);
 const opts=[{t:'Burr-grind the weld toes only (FAT 71 × 1.3 = 92)',F:Math.min(1.3*FAT,112),q:0},{t:'Tapered gusset end with radius transition (FAT 90) + toe grinding (×1.3, capped at FAT 112)',F:Math.min(1.3*90,112),q:0},{t:'Production proposal: replace continuous fillet with stitch (intermittent) welds',F:56,q:0},{t:'Thicker bracket plate: Δσ reduced by 20 %, detail stays FAT 71',F:FAT/0.8,q:0}];
 opts.forEach(o=>{o.N=NL(o.F);o.ok=o.N>=life;});const gOK=opts[1].N;
 const fm=[['Weld toe fatigue crack → bracket breaks, screen deck drops',9,6,7],['Paint damage',3,8,4],['Bolt loosening → noise',5,5,5],['Porosity (cosmetic)',2,6,6]];
 return{brief:{avatar:'👷',who:'Marco Rossi',role:'Production manager',quote:'We have cracked brackets coming back. Our welders say continuous welds distort the bracket – let\'s switch to stitch welds, it\'s faster too. Can you approve the drawing change today?',
  story:`<p>Vibrating screen machine; the deck hangs on welded steel brackets. Service: ≈ ${fmt(cyc/1e6,1)}·10⁶ stress cycles per year, design life 8 years (= ${fmt(life/1e6,1)}·10⁶ cycles). Field-return inspection results:</p>`,data:tbl(cats.map(c=>[c[0],c[1]]),['Finding','Count'])},
 steps:[
  {type:'compute',title:'Pareto',ref:'w3l5',q:'What share of all findings is the top category? (%)',ans:share,unit:'%',abs:1,tol:0,dec:1,explain:`${cats[0][1]}/${tot} = ${fmt(share,1)} % – the vital few.`},
  {type:'decide',title:'Next step',q:'What is your next investigation step?',opts:[
   O('Root-cause analysis on the top category: fractography of returned brackets, strain-gauge measurement of the stress range, fishbone/5-whys',1,'Focus effort where the failures are, with physical evidence.',{t:-5}),
   O('Approve the stitch-weld change – production knows best',0,'A design change without analysis – exactly how disasters start.',{s:-25}),
   O('Increase final inspection of all welds',0.3,'Catches defects like lack of fusion, but the dominant crack is fatigue at a geometric detail.',{c:-10}),
   O('FMEA brainstorm on all failure modes before looking at parts',0.45,'Useful later; first understand the dominant mode.')],
   evidence:{h:'Lab report',html:`Fractography: beach marks, crack initiation at the <b>weld toe at the gusset end</b> – classic fatigue. Strain gauges: nominal stress range Δσ = <b>${ds} MPa</b> at the detail. IIW detail category for this gusset end: <b>FAT 71</b> (Δσ at 2·10⁶ cycles, slope m = 3).`}},
  {type:'compute',title:'Fatigue life as built',ref:'w1l5',q:'Life of the as-built detail: N = 2·10⁶·(FAT/Δσ)³ cycles.',ans:N0,tol:0.03,dec:0,unit:'cycles',explain:`N = 2·10⁶·(71/${ds})³ = ${fmt(N0,0)} cycles ≈ ${fmt(N0/cyc,1)} years – matches the field cracks.`},
  {type:'decide',title:'Drawing change',q:'Which design change do you approve? (design life 8 years)',opts:opts.map((o,i)=>({t:o.t,q:i===1?1:i===0?0.4:i===3?0.35:0,fb:`N = 2·10⁶·(${fmt(o.F,0)}/${ds})³ = ${fmt(o.N,0)} cycles = ${fmt(o.N/cyc,1)} years ${o.ok?'≥':'<'} 8 years.${i===2?' Stitch welds create many weld start/stop points – a WORSE detail (lower FAT), not a better one.':''}`,fx:o.ok?{c:-5}:{s:-20}}))},
  {type:'compute',title:'Improved life',q:'Life of the tapered + ground detail (FAT capped at 112).',ans:gOK,tol:0.03,dec:0,unit:'cycles',explain:`N = 2·10⁶·(112/${ds})³ = ${fmt(gOK,0)} cycles = ${fmt(gOK/cyc,1)} years ≥ 8 years.`},
  {type:'decide',title:'FMEA priority',q:'In the follow-up FMEA (S/O/D), which item must get the highest priority?',noShuffle:false,opts:fm.map((f,i)=>({t:`${f[0]} (S${f[1]} O${f[2]} D${f[3]}, RPN ${f[1]*f[2]*f[3]})`,q:i===0?1:i===1?0.2:0.3,fb:i===0?'Highest severity AND highest RPN – safety-critical.':'Lower severity. The weld-toe crack (S9: the deck can drop) has both the highest severity and the highest RPN – it comes first. In general, high-severity items get priority even when their RPN is not the highest.'}))},
  {type:'final',title:'Answer to production',q:'Your answer to Marco:',opts:[
   O('Reject the stitch-weld change. Approve tapered gusset ends + toe grinding as a controlled design change (with drawing, weld procedure and a strain-gauge check on the first unit); retrofit field units at next service.',1,'Every change to a load path gets an engineering review.',{c:-10},null,'Retrofitted machines run without cracks; distortion is solved with a weld sequence fixture instead of stitch welds.'),
   O('Approve stitch welds – faster production.',0,'',{s:-40,c:-20},null,'Cracks now appear within months at the stitch ends; a bracket fails and the screen deck drops during operation. A costly recall follows.'),
   O('Keep the design, just replace cracked brackets under warranty.',0.2,'',{c:-30},null,'Warranty costs climb every year; the root cause stays in the design.')]}],
 debrief:{chain:['Pareto: find the vital few.','Physical evidence: fractography + measured stress range.','Classify the detail (IIW FAT) and compute life.','Evaluate design options quantitatively – including the ones proposed by others.','Control every design change through engineering review; prioritise by severity.'],
  concepts:[['Pareto, fishbone & FMEA','w3l5'],['S–N curves & slope','w1l5'],['Hot-spot stresses in FE','w2l5']],
  pitfalls:['Approving "small" production-driven changes without checking the load path.','Stitch welds in fatigue-loaded structures.','Improving a detail without checking that the new life meets the requirement.','Ranking by RPN alone and ignoring severity.'],
  history:'<b>Hyatt Regency walkway collapse, Kansas City (1981):</b> the original design hung the walkways from continuous rods; during detailing this was changed to two offset rods, which doubled the load on the fourth-floor box-beam connection. The connection failed and 114 people died. The disaster is a standard lesson on reviewing design changes – especially ones proposed to simplify fabrication.'}};}});
/* ---------- INTRO CASE i1: rod ---------- */
defCase({id:'i1',icon:'🪝',title:'Will This Rod Hold?',level:1,domains:['s'],inspired:'Hyatt Regency 1981 (check the whole load path)',intro:true,
teaser:'A workshop wants to hang a chain hoist from one threaded steel rod. Is the M8 rod they have good enough? Your first real calculation: force → stress → safety factor.',
build(){
 const m=rint(8,18)*25,F=m*g9,Sy=240,nReq=5;const rods=[['M6',20.1],['M8',36.6],['M10',58.0],['M12',84.3],['M16',157]].map(([n,A])=>({n,A,s:F/A,sf:Sy*A/F}));
 const best=rods.find(r=>r.sf>=nReq);const p=rods[1];
 return{brief:{avatar:'🧔',who:'Ben Okoye',role:'Owner of a small engine workshop',quote:`We want to lift engines of up to ${m} kg with a chain hoist hanging from a single threaded rod screwed into the ceiling beam. I have M8 rods lying around. Good enough?`,
  story:`<p>The rod is steel of property class 4.6 – yield strength <b>S<sub>y</sub> = 240 MPa</b>. Because people work under the load, the workshop's rule is a <b>safety factor of at least ${nReq}</b> against yielding. For threaded rods the load-carrying area is the <b>stress area A<sub>s</sub></b> (a bit smaller than the nominal circle, because of the thread).</p>`,
  data:tbl(rods.map(r=>[r.n,fmt(r.A,1)]),['Rod','Stress area A<sub>s</sub> (mm²)'])},
  sh:200,sketch:(c)=>{c.fillStyle='#3c4a62';c.fillRect(200,18,240,22);txt(c,'ceiling beam',450,34,'#9aa6bf');c.strokeStyle='#cfd8dc';c.lineWidth=4;c.beginPath();c.moveTo(320,40);c.lineTo(320,110);c.stroke();txt(c,'threaded rod',332,80,'#4fc3f7');
   c.fillStyle='#ffb74d';c.fillRect(300,110,40,26);txt(c,'hoist',350,128,'#ffb74d');c.strokeStyle='#9aa6bf';c.lineWidth=2;c.beginPath();c.moveTo(320,136);c.lineTo(320,160);c.stroke();c.fillStyle='#6d7a96';c.fillRect(280,160,80,32);txt(c,`engine ${m} kg`,370,182,'#e6ebf5');arrow(c,250,150,250,190,'#ef5350',2);txt(c,'F = m·g',190,175,'#ef5350');},
 steps:[
  {type:'decide',title:'What decides?',sk:'stress',h1:'Think of the snow and skis: what matters is how concentrated the force is.',q:'What decides whether the rod is strong enough?',opts:[
   O('The stress in the rod (force divided by its stress area) compared with the steel\'s strength',1,'Exactly – the same force is harmless in a thick rod and dangerous in a thin one.'),
   O('Only the weight – the hoist is rated for 500 kg, so it is fine',0.15,'The hoist rating says nothing about the rod that holds the hoist.'),
   O('The length of the rod',0.1,'For a rod in tension the length changes the stretch, not the stress.'),
   O('The colour of the zinc coating',0,'Coatings protect against rust, not overload.')]},
  {type:'compute',title:'Force',sk:'stress',q:`What force does the ${m} kg engine pull on the rod? (g = 9.81 m/s²)`,ans:F,unit:'N',tol:0.02,dec:0,fm:'F = m·g',h1:'Mass (kg) is not a force. Multiply by g to get newtons.',explain:`F = ${m}·9.81 = ${fmt(F,0)} N (≈ ${fmt(F/1000,2)} kN).`},
  {type:'compute',title:'Stress in M8',sk:'stress',q:'Compute the tensile stress in the M8 rod.',ans:p.s,unit:'MPa',tol:0.02,dec:1,fm:'σ = F / A<sub>s</sub>  (N / mm² = MPa)',look:'Data sheet: stress area of M8.',h1:'Divide the force (N) by the M8 stress area (mm²).',explain:`σ = ${fmt(F,0)} N / 36.6 mm² = ${fmt(p.s,1)} MPa.`},
  {type:'compute',title:'Safety factor M8',sk:'sf',q:'Safety factor of the M8 rod against yielding?',ans:p.sf,tol:0.03,dec:2,fm:'n = S<sub>y</sub> / σ',h1:'Strength on top, stress below.',explain:`n = 240 / ${fmt(p.s,1)} = ${fmt(p.sf,2)}.`},
  {type:'decide',title:'Is M8 OK?',sk:'sf',q:`The rule asks for n ≥ ${nReq}. Is the M8 rod acceptable?`,opts:[
   O(`No – n = ${fmt(p.sf,2)} is below the required ${nReq}`,1,'The rod would probably hold the static weight, but the margin for jerks, wear and flaws is too small for a load above people.'),
   O('Yes – n is above 1, so it holds',0.1,`n > 1 only means it holds on paper today. The rule (n ≥ ${nReq}) exists for jerks when the chain snaps tight, thread damage and corrosion.`,{s:-20}),
   O('Cannot be decided without FEA',0.1,'A simple rod in tension is a textbook hand calculation – no FEA needed.',{t:-5})]},
  {type:'decide',title:'Choose the rod',sk:'sf',h1:'Compute n = S<sub>y</sub>·A<sub>s</sub>/F for each size and take the smallest one with n ≥ 5.',q:'Which rod do you recommend? (smallest size that meets the rule)',noShuffle:true,opts:rods.map(r=>({t:`${r.n} (A<sub>s</sub> = ${fmt(r.A,1)} mm²)`,q:r===best?1:r.sf>=nReq?0.6:0.05,fb:`σ = ${fmt(r.s,1)} MPa → n = ${fmt(r.sf,2)} ${r.sf>=nReq?'≥':'<'} ${nReq}. ${r===best?'Smallest compliant size.':r.sf>=nReq?'Safe, but bigger than necessary.':'Does not meet the rule.'}`,fx:r.sf>=nReq?{c:-2}:{s:-25}}))},
  {type:'final',title:'Advice to Ben',sk:'sf',q:'Your advice:',opts:[
   O(`Use an ${best.n} rod (n ≈ ${fmt(best.sf,1)}), and also check the ceiling beam, the anchor/nut and the hoist rating – mark the maximum load on the hoist.`,1,'Whole load path checked, clear limit for users.',{},null,`Ben installs the ${best.n} rod; a local structural engineer confirms the beam. Two years later the hoist is still lifting engines every week.`),
   O('Use the M8 – it holds the weight with n above 1.',0.05,'',{s:-40},null,'A few months later, a jerk when an engine slips on the chain overloads the M8 rod; it yields at the thread and the engine drops onto the workbench. Luckily nobody is under it.'),
   O('Use the biggest rod you can find, no calculation needed.',0.4,'Safe, but without a calculation you cannot say how safe – and the beam may still be the weak link.',{c:-10},null,'The M16 rod holds – but the anchor in the ceiling beam had never been checked. It is fine this time.')]}],
 debrief:{chain:['Turn the mass into a force: F = m·g.','Find the area that really carries the load (thread stress area).','Stress σ = F/A, then safety factor n = S<sub>y</sub>/σ.','Compare with the required n and pick the smallest compliant size.','Check the whole load path – rod, nut, anchor, beam.'],
  concepts:[['Stress, strength & stress–strain','w1l1'],['Failure criteria & safety','w1l3']],
  pitfalls:['Using kg as if it were a force (forgetting g = 9.81).','Using the nominal diameter instead of the thread stress area.','Thinking n > 1 is "safe enough" – rules ask for margins for good reasons.','Checking one part and forgetting the connection it hangs from.'],
  history:'<b>Hyatt Regency, Kansas City (1981):</b> the hotel\'s walkways hung from steel rods. A change in the detailing made one connection carry twice the intended load; the connection failed and 114 people died. The lesson for every hanging load: check the whole load path, and review every design change.'}};}});

/* ---------- INTRO CASE i2: bookshelf ---------- */
defCase({id:'i2',icon:'📚',title:'Why Did the Bookshelf Sag?',level:1,domains:['s'],inspired:'Galileo\'s beam (1638)',intro:true,
teaser:'A student\'s shelf smiles at him every morning. Will it break? Bigger board or a support in the middle? Learn the difference between strength and stiffness.',
build(){
 const L=rint(8,10)*100,b=250,h=pick([16,18]),q=rint(6,9)*5;const w=q*g9/1000,M=w*L*L/8,W=b*h*h/6,sig=M/W,E=2500,I=b*h*h*h/12,del=5*w*Math.pow(L,4)/(384*E*I),fs=12;
 const dThick=del*Math.pow(h/25,3),dMid=del/16,dOak=del*E/11000;
 return{brief:{avatar:'🧑‍🎓',who:'Jonas',role:'Student, proud owner of 300 books',quote:'My shelf sags like a smile in the middle. Will it break one day? Should I buy a thicker board, or add a bracket in the middle?',
  story:`<p>The shelf is a particleboard plank, <b>${L} mm</b> long between the two shelf pins, <b>${b} mm</b> deep and <b>${h} mm</b> thick, full of books – about <b>${q} kg per metre</b>. The plank simply rests on the pins (simply supported).</p>`,
  data:tbl([['Particleboard stiffness E','2 500 MPa'],['Particleboard bending strength','≈ 12 MPa'],['"Looks OK" sag limit','L/300 = '+fmt(L/300,1)+' mm']])},
  sh:180,sketch:(c)=>{c.fillStyle='#6d5a43';c.beginPath();c.moveTo(120,60);c.quadraticCurveTo(320,110,520,60);c.lineTo(520,75);c.quadraticCurveTo(320,125,120,75);c.closePath();c.fill();
   for(let k=0;k<22;k++){const x=135+k*17;const y=60+25*(1-Math.pow((x+6-320)/200,2))-31;c.fillStyle=['#4fc3f7','#ba68c8','#ffb74d','#66bb6a'][k%4];c.fillRect(x,y,12,32);}
   dot(c,120,82,6,'#9aa6bf');dot(c,520,82,6,'#9aa6bf');txt(c,`L = ${L} mm`,280,150,'#9aa6bf');txt(c,'sag δ',330,128,'#ef5350');arrow(c,320,75,320,100,'#ef5350',2);},
 steps:[
  {type:'decide',title:'Sag or break?',sk:'mat',h1:'Is a bendy thing always a weak thing? Think of a rubber band.',q:'Jonas mixes up two questions. Which statement is right?',opts:[
   O('Sagging is about stiffness (how much it deflects); breaking is about strength (stress vs material strength). Check both.',1,'Two different properties, two different calculations.'),
   O('A shelf that sags is about to break',0.1,'Not necessarily: a stiffness problem is not a strength problem.'),
   O('Sagging does not matter at all',0.2,'Big sag looks bad, books slide, and wood-based boards creep – the sag grows over months.')]},
  {type:'compute',title:'Load per mm',sk:'stress',q:`The books weigh ${q} kg per metre. What is the load w in N per <b>mm</b> of shelf?`,ans:w,unit:'N/mm',tol:0.02,dec:3,fm:'w = (kg per m)·9.81 / 1000  (N/m → N/mm)',h1:'First kg → N (× 9.81), then per metre → per millimetre (÷ 1000).',explain:`w = ${q}·9.81/1000 = ${fmt(w,3)} N/mm.`},
  {type:'compute',title:'Bending moment',sk:'bend',q:'Maximum bending moment in the middle of the shelf (evenly spread load, simply supported)?',ans:M,unit:'N·mm',tol:0.02,dec:0,fm:'M = w·L²/8',h1:'Use w from the last step and L in mm.',explain:`M = ${fmt(w,3)}·${L}²/8 = ${fmt(M,0)} N·mm.`},
  {type:'compute',title:'Bending stress',sk:'bend',q:'Bending stress in the board?',ans:sig,unit:'MPa',tol:0.03,dec:2,fm:'σ = M/W · W = b·h²/6 (b = depth of the shelf, h = thickness)',h1:'The board bends about its thin side: h = thickness, b = depth.',explain:`W = ${b}·${h}²/6 = ${fmt(W,0)} mm³ → σ = ${fmt(M,0)}/${fmt(W,0)} = ${fmt(sig,2)} MPa.`},
  {type:'decide',title:'Will it break?',sk:'sf',q:'Particleboard bending strength ≈ 12 MPa. Will the shelf break?',opts:[
   O(`No – σ ≈ ${fmt(sig,1)} MPa gives a safety factor of about ${fmt(fs/sig,1)}`,1,'The board is strong enough. The problem is something else.'),
   O('Yes – it is sagging, so it is failing',0.05,'Sag is not failure. The stress is well below the strength.'),
   O('Impossible to say without a lab test',0.2,'A simple beam calculation answers this well.')]},
  {type:'compute',title:'How much sag?',sk:'mat',q:'Compute the sag in the middle: δ = 5·w·L⁴/(384·E·I), with I = b·h³/12.',ans:del,unit:'mm',tol:0.04,dec:1,fm:'δ = 5·w·L⁴/(384·E·I) · I = b·h³/12 (mm⁴) · E = 2500 MPa',h1:'Compute I first (thickness cubed!), then plug everything in N and mm.',explain:`I = ${b}·${h}³/12 = ${fmt(I,0)} mm⁴ → δ = 5·${fmt(w,3)}·${L}⁴/(384·2500·${fmt(I,0)}) = ${fmt(del,1)} mm – much more than L/300 = ${fmt(L/300,1)} mm.`},
  {type:'decide',title:'The fix',sk:'bend',h1:'Sag grows with L⁴ and shrinks with h³ and E. Which change attacks the biggest exponent?',q:'Which fix reduces the sag most effectively and cheaply?',opts:[
   O('A bracket in the middle (two spans of L/2)',1,`Sag ∝ L⁴: halving the span gives at least 16× less sag → about ${fmt(dMid,1)} mm or less. Cheap and very effective.`),
   O('A 25 mm board of the same particleboard',0.75,`I ∝ h³: (${h}/25)³ → about ${fmt(dThick,1)} mm. Works, but you need a new board.`,{c:-5}),
   O('Solid oak of the same thickness (E ≈ 11 000 MPa)',0.6,`About ${fmt(dOak,1)} mm – 4.4× stiffer material, but expensive.`,{c:-10}),
   O('Flip the board upside down',0.15,'It straightens for a while, then creeps back. It treats the symptom, not the cause.'),
   O('Stronger screws in the shelf pins',0,'The pins are not the problem; the board is too flexible.')]},
  {type:'final',title:'Advice to Jonas',sk:'bend',q:'Your advice:',opts:[
   O('It will not break, but it is too flexible: add a middle bracket (or a thicker board). Put the heaviest books near the supports. Particleboard creeps, so the sag would keep growing.',1,'',{},null,'Jonas adds a €3 bracket. The shelf is straight – and stays straight a year later.'),
   O('It will break soon – throw it away.',0.1,'',{c:-15},null,'Jonas buys a new shelf of the same kind. It sags just like the old one.'),
   O('Nothing to do – it won\'t break.',0.35,'',{},null,'True, it doesn\'t break – but particleboard creeps: after a year the sag has roughly doubled and the books slide to the middle.')]}],
 debrief:{chain:['Separate strength (will it break?) from stiffness (how much does it bend?).','Load → bending moment M = wL²/8 → stress σ = M/W → compare with strength.','Sag δ = 5wL⁴/(384EI): span to the 4th power, thickness to the 3rd.','Choose the fix that attacks the biggest exponent: shorter span.'],
  concepts:[['Beam bending','w1l4'],['Stiffness and E','w1l1']],
  pitfalls:['Treating sag as a strength problem.','Forgetting that W = bh²/6 and I = bh³/12 depend strongly on thickness.','Mixing N/m and N/mm.','Ignoring creep in wood-based boards and plastics.'],
  history:'<b>Galileo Galilei</b> analysed the breaking strength of a cantilever beam in his <i>Two New Sciences</i> (1638) – one of the first attempts at a beam theory. His stress distribution was not correct; the beam theory we use today (Euler–Bernoulli) was developed in the 18th century.'}};}});

/* ---------- INTRO CASE i3: which part fails first ---------- */
defCase({id:'i3',icon:'🛴',title:'Which Part Fails First?',level:1,domains:['t'],inspired:'everyday reliability',intro:true,
teaser:'Two suppliers of e-scooter folding hinges. One has the better average lifetime. The fleet manager wants the better one. Averages can lie – find out how.',
build(){
 let X,Y;const T=40;for(let g=0;g<500;g++){Y=[...Array(6)].map(()=>Math.round(60+5*randn()));X=[...Array(4)].map(()=>Math.round(88+6*randn())).concat([rint(18,30),rint(22,36)]);X=shuffle(X);
  if(Math.min(...Y)>T+5&&X.filter(x=>x<T).length===2&&mean(X)>mean(Y)+3)break;}
 const mX=mean(X),mY=mean(Y),early=100*X.filter(x=>x<T).length/6;
 return{brief:{avatar:'👩‍💼',who:'Aylin Demir',role:'Fleet manager, e-scooter sharing',quote:'Supplier X\'s hinges last longer on average – the test lab says so. Let\'s order 5,000 from X. Agreed?',

function applyCaseMeta(id,K){const M=CASE_META[id];if(!M)return;K.steps.forEach(s=>{const m=M[s.title];if(m)for(const k in m)if(s[k]==null)s[k]=m[k];});}
/* ===================== LEARNING PATH, LESSONS, SKILLS MAP, REVIEW ===================== */
const PATH=[['lesson','stress'],['lesson','sf'],['case','i1'],['lesson','mat'],['lesson','bend'],['case','i2'],['lesson','stat'],['case','i3'],
 ['lesson','crit'],['case','c2'],['lesson','kt'],['lesson','fat'],['case','c1'],['case','c5'],['lesson','fea'],['lesson','mesh'],['lesson','bc'],['case','c3'],['case','c4'],
 ['lesson','rel'],['case','c7'],['case','c8'],['lesson','weib'],['case','c6'],['lesson','rca'],['case','c10'],['lesson','frac'],['case','c9'],['boss','boss']].map(([t,id],k)=>({t,id,k}));
const CASE_NEEDS={i1:['stress','sf'],i2:['mat','bend'],i3:['stat'],c2:['crit'],c1:['kt','fat'],c5:['fat'],c3:['fea','mesh','bc'],c4:['crit'],c7:['rel'],c8:['stat','mat'],c6:['weib'],c10:['rca'],c9:['frac']};
CASES.sort((a,b)=>PATH.findIndex(n=>n.id===a.id)-PATH.findIndex(n=>n.id===b.id));
const lessonDone=id=>!!(STORE.lessons[id]||{}).done;
const caseDone=id=>(STORE.cases[id]||{}).best!=null;
function nodeTitle(n){return n.t==='lesson'?SKILLS[n.id].name:n.t==='case'?(CASES.find(c=>c.id===n.id)||{}).title:'Failure Review Board';}
function nodeDone(n){return n.t==='lesson'?lessonDone(n.id):n.t==='case'?caseDone(n.id):((STORE.levels.boss||{}).stars>0);}
function nodeUnlocked(n){if(STORE.unlockAll)return true;if(n.t==='boss')return isUnlocked(LEVELS.find(l=>l.id==='boss'));
 const prev=PATH.slice(0,n.k).filter(x=>x.t===n.t);if(n.t==='lesson')return !prev.length||nodeDone(prev[prev.length-1]);
 const needs=(CASE_NEEDS[n.id]||[]).every(lessonDone);return needs&&(!prev.length||nodeDone(prev[prev.length-1]));}
function caseUnlocked(id){const n=PATH.find(x=>x.id===id&&x.t==='case');return n?nodeUnlocked(n):true;}
function lockReason(n){if(n.t==='case'){const miss=(CASE_NEEDS[n.id]||[]).filter(k=>!lessonDone(k)).map(k=>SKILLS[k].name);const prev=PATH.slice(0,n.k).filter(x=>x.t==='case').pop();
  return (miss.length?'Needs the lesson'+(miss.length>1?'s':'')+': '+miss.join(', ')+'. ':'')+(prev&&!nodeDone(prev)?'Close "'+nodeTitle(prev)+'" first. ':'')+'(Or enable "unlock everything" in ⚙.)';}
 if(n.t==='lesson'){const prev=PATH.slice(0,n.k).filter(x=>x.t==='lesson').pop();return 'Finish the lesson "'+nodeTitle(prev)+'" first (or enable "unlock everything" in ⚙).';}
 return 'Unlocks after 6 lessons, 4 cases or stars in 8 training levels.';}
function nextPathNode(){return PATH.find(n=>!nodeDone(n)&&nodeUnlocked(n)&&n.t!=='boss')||null;}
function openPathNode(n){if(!nodeUnlocked(n)){toast('🔒 '+lockReason(n));return;}if(n.t==='lesson')openLesson(n.id);else if(n.t==='case')startCase(CASES.find(c=>c.id===n.id));else openLevel('boss');}
function seenSkills(){return SKILL_ORDER.filter(k=>(STORE.lessons[k]||{}).seen||skillState(k).n>0);}
function practiceNext(){const s=seenSkills().filter(k=>skillState(k).m<90).sort((a,b)=>skillState(a).m-skillState(b).m);return s[0]||null;}
function dueSkills(){const now=Date.now();return seenSkills().filter(k=>{const s=skillState(k);return s.n>0&&(s.due<=now||s.m<50);}).sort((a,b)=>skillState(a).m-skillState(b).m);}

  <div class="small mut">📗 Lessons ${nL}/${SKILL_ORDER.length} · 📁 Cases ${nC}/${CASES.length} · ★ Training ${totalStars()}/${LEVELS.length*3}</div><div class="prog" style="max-width:420px"><i style="width:${100*(nL+nC)/(SKILL_ORDER.length+CASES.length)}%"></i></div>`);w.appendChild(mid);

 else rt.appendChild(el('div',{class:'small'},'🏆 Path complete! Try the optional Review Board or replay cases in Expert mode.'));
 if(pn){const b=el('button',{class:'btn'},`🎯 Practice next: ${SKILLS[pn].icon} ${SKILLS[pn].name}`);b.onclick=()=>startPractice([pn],5,'Practice: '+SKILLS[pn].name);rt.appendChild(b);}
 if(due.length){const b=el('button',{class:'btn',id:'reviewBtn'},`🔁 Review (${due.length} skill${due.length>1?'s':''} due)`);b.onclick=startReview;rt.appendChild(b);}
 const mp=el('div',{class:'small mut'},'Difficulty: ');mp.appendChild(modePicker(showMap));rt.appendChild(mp);
 app.appendChild(el('div',{class:'sechead',id:'path'},'<h2>🧭 Learning path</h2><span class="small mut">Lessons 📗 teach a concept with an everyday example; cases 📁 put it to work on a real problem. Hover or tap dotted words for a definition.</span>'));
 const g=el('div',{class:'path'});app.appendChild(g);
 PATH.forEach(n=>{const done=nodeDone(n),un=nodeUnlocked(n),isNext=nx&&n===nx;const ic=n.t==='lesson'?SKILLS[n.id].icon:n.t==='case'?(CASES.find(c=>c.id===n.id)||{}).icon:'🐉';
  const sub=n.t==='lesson'?SKILLS[n.id].short:n.t==='case'?((STORE.cases[n.id]||{}).best!=null?'best '+STORE.cases[n.id].best+'% '+'★'.repeat(STORE.cases[n.id].stars||0):'case · '+'●'.repeat((CASES.find(c=>c.id===n.id)||{}).level||1)):'optional challenge';
  const d=el('div',{class:`pnode ${n.t}${done?' done':''}${un?'':' locked'}${isNext?' next':''}`,'data-node':n.t+':'+n.id},`<div class="pi">${done?'✓':un?n.k+1:'🔒'}</div><div class="k">${n.t==='lesson'?'📗 Lesson':n.t==='case'?'📁 Case':'🐉 Boss'} ${ic||''}</div><b>${nodeTitle(n)}</b><div class="small mut">${sub}</div>`);
  d.onclick=()=>openPathNode(n);g.appendChild(d);});
 renderCaseHome(app);renderTraining(app);}

 right.appendChild(el('div',{class:'steptitle'},'Practice'));right.appendChild(el('p',{class:'mut'},'Read Ada\'s explanation and answer the quick check first – then three practice questions appear here. Hints are on the 💡 button, the calculator on 🧮.'));
 if(S.levels&&S.levels.length){const r=el('div',{class:'row small'},'Want more? Training: ');S.levels.forEach(l=>{const L=LEVELS.find(x=>x.id===l);if(L)r.appendChild(el('button',{class:'btn sm',onclick:()=>openLevel(l)},L.title));});right.appendChild(r);}
 mentorBlock(left,S,()=>startLessonPractice(id,right),{intro:`Hi, I'm Ada! 👋 This lesson is about <b>${S.name}</b>. Read it at your own pace – the dotted words explain themselves when you hover or tap.`,btn:'Great – let\'s practise ▶'});}
function startLessonPractice(id,box){const S=SKILLS[id];box.innerHTML='';box.appendChild(el('div',{class:'steptitle'},'Practice · 3 questions'));const tb=el('div');box.appendChild(tb);
 runTasks(tb,skillTasks(id,3),score=>{const prev=STORE.lessons[id]||{};STORE.lessons[id]=Object.assign(prev,{seen:true,done:true,best:Math.max(prev.best||0,score)});save();updHeader();celebrate();
  const nx=nextPathNode();const m=skillState(id).m;
  modal(`<div class="results"><h2>Lesson complete! 🎉</h2>${mentorHTML(score>=67?'Excellent – you\'ve got the idea. Now let\'s use it on something real.':'Well done for working through it! Mistakes are how we learn – the next case will practise it again, and hints are always there.')}<p>Practice score: <b>${score}%</b></p><p>${S.icon} ${S.name}: <b>${masteryName(m)}</b> (${m}%)</p></div>`,
   [{t:'Back to the path',fn:showMap},...(nx?[{t:'Next: '+nodeTitle(nx)+' ▶',pri:true,fn:()=>openPathNode(nx)}]:[])]);},{sk:id,finishLabel:'Finish lesson ✔'});}

function startPractice(ids,n,title){cleanup();CUR_LEVEL=null;const app=$('#app');app.innerHTML='';window.scrollTo(0,0);
 const head=el('div',{class:'lvhead'});head.appendChild(el('button',{class:'btn sm',onclick:showMap},'◀ Home'));head.appendChild(el('h2',null,'🎯 '+title));head.appendChild(el('button',{class:'btn sm',onclick:showSkills},'🧠 Skills map'));app.appendChild(head);
 const wrap=el('div',{class:'levelwrap'});const left=el('div',{class:'card'}),right=el('div',{class:'card'});wrap.append(left,right);app.appendChild(wrap);
 left.appendChild(el('div',null,mentorHTML(ids.length>1?'Quick review! Short questions on the skills that are due or still a bit shaky. Spaced repetition makes knowledge stick.':`Let's strengthen <b>${SKILLS[ids[0]].name}</b>. Need a reminder first? Open the formula card below.`)));
 ids.forEach(k=>left.appendChild(el('div',{class:'formula'},`${SKILLS[k].icon} <b>${SKILLS[k].name}:</b> ${SKILLS[k].formula}`)));
 left.appendChild(el('div',{class:'row',style:'margin-top:8px'},''));ids.forEach(k=>left.lastChild.appendChild(el('button',{class:'btn sm',onclick:()=>openLesson(k)},'📗 Lesson: '+SKILLS[k].name)));
 const tasks=[];for(let i=0;i<n;i++){const k=ids[i%ids.length];tasks.push(skillTasks(k,1)[0]);}
 runTasks(right,shuffle(tasks),score=>{celebrate();modal(`<div class="results"><h2>${score>=80?'Superb! 🏆':score>=50?'Nice work! 👍':'Good effort! 🌱'}</h2><p>Score: <b>${score}%</b></p>${ids.map(k=>{const m=skillState(k).m;return `<div style="text-align:left;margin:6px 0">${SKILLS[k].icon} ${SKILLS[k].name}<div class="mbar"><i style="width:${m}%;background:${masteryCol(m)}"></i></div><span class="lvlname">${masteryName(m)} · ${m}%</span></div>`;}).join('')}</div>`,
  [{t:'Skills map',fn:showSkills},{t:'Back to the path',pri:true,fn:showMap}]);},{finishLabel:'Finish ✔'});}
function startReview(){let ids=dueSkills();if(!ids.length)ids=seenSkills().sort((a,b)=>skillState(a).m-skillState(b).m);if(!ids.length)ids=['stress'];startPractice(ids.slice(0,4),5,'Review session');}

function showSkills(){cleanup();CUR_LEVEL=null;updHeader();const app=$('#app');app.innerHTML='';window.scrollTo(0,0);
 const head=el('div',{class:'lvhead'});head.appendChild(el('button',{class:'btn sm',onclick:showMap},'◀ Home'));head.appendChild(el('h2',null,'🧠 Skills map'));app.appendChild(head);
 const pn=practiceNext(),due=dueSkills();const avg=Math.round(mean(SKILL_ORDER.map(k=>skillState(k).m)));
 const top=el('div',{class:'welcome',id:'skillTop'});top.appendChild(el('div',{style:'font-size:48px'},'🦉'));
 top.appendChild(el('div',{style:'flex:1;min-width:260px'},`<b>Overall mastery: ${avg}%</b><div class="mbar" style="max-width:420px"><i style="width:${avg}%;background:linear-gradient(90deg,var(--w1),var(--w2),var(--w3))"></i></div><div class="small">${pn?`My suggestion: practise <b>${SKILLS[pn].icon} ${SKILLS[pn].name}</b> next (${skillState(pn).m}%).`:'Start with the first lesson on the learning path – your skills will grow here as you answer questions.'}${due.length?` · ${due.length} skill${due.length>1?'s are':' is'} due for review.`:''}</div><div class="small mut">Mastery grows with every correct answer in lessons, cases, training and reviews. Levels: New → Learning → Practising (40 %) → Proficient (70 %) → Mastered (90 %).</div>`));
 const rr=el('div',{class:'row'});if(pn)rr.appendChild(el('button',{class:'btn pri',onclick:()=>startPractice([pn],5,'Practice: '+SKILLS[pn].name)},'🎯 Practice '+SKILLS[pn].name));if(due.length||seenSkills().length)rr.appendChild(el('button',{class:'btn',onclick:startReview},'🔁 Review session'));top.appendChild(rr);app.appendChild(top);
 const g=el('div',{class:'skillgrid'});app.appendChild(g);
 SKILL_ORDER.forEach(k=>{const S=SKILLS[k],s=skillState(k);const isDue=due.includes(k);
  const c=el('div',{class:'skill','data-skill':k},`<div class="row" style="justify-content:space-between"><h3>${S.icon} ${S.name}</h3>${isDue?'<span class="tag" style="color:#ffb74d">due</span>':''}</div><div class="small mut">${S.short}</div><div class="mbar"><i style="width:${s.m}%;background:${masteryCol(s.m)}"></i></div><div class="lvlname">${masteryName(s.m)} · ${s.m}% · ${s.n} answer${s.n===1?'':'s'}${lessonDone(k)?' · 📗 lesson done':''}</div>`);
  const r=el('div',{class:'row',style:'margin-top:8px'});r.appendChild(el('button',{class:'btn sm',onclick:()=>openLesson(k)},'📗 Lesson'));r.appendChild(el('button',{class:'btn sm',onclick:()=>startPractice([k],5,'Practice: '+S.name)},'🎯 Practice'));
  (S.levels||[]).forEach(l=>{const L=LEVELS.find(x=>x.id===l);if(L)r.appendChild(el('button',{class:'btn sm',title:'Training level',onclick:()=>openLevel(l)},'🏋 '+L.title));});c.appendChild(r);g.appendChild(c);});}
/* ===================== INIT ===================== */
$('#bMap').onclick=showMap;$('#logo').onclick=showMap;$('#bGloss').onclick=showGlossary;$('#bSet').onclick=settings;$('#bSkills').onclick=showSkills;$('#bCalc').onclick=()=>calcOpen();$('#modeBadge').onclick=settings;
tipInit();calcInit();updModeBadge();
showMap();
if(!STORE.seenIntro){STORE.seenIntro=true;save();const box=modal(`<h2>⚙ Welcome to Stress Quest</h2>${mentorHTML("Hi, I'm Ada! I'll be your mentor. Stress Quest teaches how engineers make sure things don't break – from <b>what stress is</b> up to fatigue, FEA and failure statistics. You don't need any prior knowledge.")}
<ol><li><b>🧭 Learning path</b> – short lessons (plain words, an everyday analogy, a tiny worked example, a quick check) alternate with <b>📁 cases</b>: real engineering problems where you make the decisions.</li>
<li><b>💡 Hints</b> in every step: a nudge → the formula and why → a worked substitution. <b>🧮</b> calculator always available; answer boxes also accept expressions like 5000/78.5.</li>
<li><b>🧠 Skills map</b> – watch your mastery grow, get "practise next" suggestions and short review sessions.</li>
<li><b>🏋 Training grounds</b> and an optional <b>🐉 Review Board</b> for extra practice.</li></ol>
<p><b>Choose your difficulty</b> (you can change it anytime in ⚙):</p><div id="introModes"></div><p class="small mut" id="introModeDesc">${MODES[MODE()].desc}</p>`,[{t:"Let's go!",pri:true}]);
 const slot=box.querySelector('#introModes');const fill=()=>{slot.innerHTML='';slot.appendChild(modePicker(()=>{fill();showMap();}));box.querySelector('#introModeDesc').textContent=MODES[MODE()].desc;};fill();}
</script>
