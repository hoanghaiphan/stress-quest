<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress Quest – Strength, FEA &amp; Reliability</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1e2739;--line:#2c3850;--txt:#e6ebf5;--mut:#9aa6bf;--acc:#4fc3f7;--acc2:#ffb74d;--ok:#66bb6a;--bad:#ef5350;--w1:#4fc3f7;--w2:#ba68c8;--w3:#ffb74d;--star:#ffd54f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0b0f18;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px;cursor:pointer}
header h1 span{color:var(--acc2)}
header .sp{flex:1}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;transition:.15s}
.btn:hover{border-color:var(--acc);background:#243049}
.btn.pri{background:var(--acc);color:#04131c;border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:1280px;margin:0 auto;padding:18px}
.stars{color:var(--star);letter-spacing:2px}
.stars .off{color:#3a4560}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.world{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.world h2{margin:0 0 4px;font-size:19px}
.world p.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.world svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.25}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;position:relative;transition:.15s}
.lvl:hover{transform:translateX(4px);border-color:var(--acc)}
.lvl.locked{opacity:.45;cursor:not-allowed}
.lvl.locked:hover{transform:none;border-color:var(--line)}
.lvl .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b0f18;flex:none}
.lvl .t{flex:1}
.lvl .t b{display:block;font-size:14.5px}
.lvl .t small{color:var(--mut)}
.boss{margin-top:18px;background:linear-gradient(120deg,#3a1c1c,#1d2133);border:1px solid #7a3a3a;border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.boss h2{margin:0;font-size:19px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hero p{margin:0;color:var(--mut);max-width:780px}
.prog{height:8px;background:#26304a;border-radius:4px;overflow:hidden;min-width:160px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--w1),var(--w2),var(--w3))}
.levelwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.levelwrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:16px}
.lvhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lvhead h2{margin:0;font-size:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#26304a;color:var(--mut)}
canvas{width:100%;display:block;background:#0c111b;border-radius:10px;border:1px solid var(--line);touch-action:none}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}
.ctrl input[type=range]{width:100%}
.ctrl output{min-width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.task .q{font-size:15px;margin-bottom:10px}
.task .q b{color:var(--acc2)}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ansrow input{background:#0c111b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;width:150px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{text-align:left}
.choices .btn.right{border-color:var(--ok);background:#1d3a24}
.choices .btn.wrong{border-color:var(--bad);background:#3a1d1f}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.fb.ok{display:block;background:#18301f;border:1px solid #2f6a3a}
.fb.bad{display:block;background:#33191b;border:1px solid #7a3236}
.fb.info{display:block;background:#1a2640;border:1px solid #2f4a7a}
.tprog{display:flex;gap:5px;margin-bottom:10px}
.tprog i{flex:1;height:6px;border-radius:3px;background:#26304a}
.tprog i.done{background:var(--ok)}.tprog i.half{background:var(--acc2)}.tprog i.miss{background:var(--bad)}.tprog i.cur{background:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal h2{margin-top:0}
.formula{background:#0c111b;border-left:3px solid var(--acc2);padding:8px 12px;border-radius:6px;margin:8px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:16.5px;overflow-x:auto}
.mut{color:var(--mut)}
.small{font-size:13px}
table.dt{border-collapse:collapse;font-size:13px;width:100%}
table.dt td,table.dt th{border:1px solid var(--line);padding:3px 6px;text-align:right}
table.dt th{background:#212b40;color:var(--mut)}
.mat{display:inline-grid;gap:3px;margin:6px 0}
.mat div{min-width:58px;height:34px;display:grid;place-items:center;background:#0c111b;border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.mat div:hover{border-color:var(--acc)}
.mat div.hl{background:#173247;border-color:var(--acc)}
.mat div.bc{background:#3a1d1f;color:#a77}
.mat .hdr{background:none;border:none;color:var(--mut);cursor:default}
.chip{display:inline-block;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;margin:3px;font-size:13px;user-select:none}
.chip.sel{border-color:var(--acc);background:#173247}
.chip.done{opacity:.4;cursor:default}
.gloss{columns:2 420px;column-gap:18px}
.gloss .card{break-inside:avoid;margin-bottom:16px}
.gloss .formula{font-size:15px}
.secttl{margin:20px 0 10px;font-size:18px}
.results{text-align:center}
.results .big{font-size:46px;color:var(--star);letter-spacing:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243049;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;z-index:60}
.legend{font-size:12.5px;color:var(--mut);margin-top:6px}
.legend b{font-weight:600}
svg text{font-family:system-ui,sans-serif}
.dlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
select{background:#0c111b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.casecard{background:linear-gradient(160deg,#1c2436,#141a28);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.casecard:hover{transform:translateY(-3px);border-color:var(--acc2)}
.casecard .ct{display:flex;gap:10px;align-items:center}.casecard .ic{font-size:30px}
.casecard h3{margin:0;font-size:15.5px}.casecard p{margin:0;color:var(--mut);font-size:13px}
.dtag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid}
.dtag.s{color:var(--w1);border-color:var(--w1)}.dtag.f{color:var(--w2);border-color:var(--w2)}.dtag.t{color:var(--w3);border-color:var(--w3)}
.casehero{background:radial-gradient(circle at 15% 20%,#2a3550,#141a28 70%);border:1px solid #3a4560;border-radius:16px;padding:20px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.casehero h2{margin:0 0 6px;font-size:24px}.casehero p{margin:0;color:#c9d2e6;max-width:820px}
.stake{display:flex;gap:12px;background:#0c111b;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.stake .av{font-size:38px;line-height:1}.stake .who{font-size:12.5px;color:var(--mut)}.stake .quote{font-style:italic;margin-top:4px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-bottom:10px}
.meter{height:9px;background:#26304a;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;transition:width .4s}
.evlog{margin-top:10px}.evlog .ev{background:#0c111b;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.evlog .ev h4{margin:0 0 4px;font-size:13px;color:var(--acc)}
.req label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer;font-size:14px;background:var(--panel2)}
.req label:hover{border-color:var(--acc)}
.qual{font-weight:700}.qual.g{color:var(--ok)}.qual.m{color:var(--acc2)}.qual.b{color:var(--bad)}
.debrief .card{margin-bottom:14px}.debrief ol li,.debrief ul li{margin:4px 0}
.outcome{border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid}
.outcome.g{background:#16301f;border-color:#2f6a3a}.outcome.m{background:#33291a;border-color:#7a5f2f}.outcome.b{background:#33191b;border-color:#7a3236}
.history{background:#1a2133;border:1px solid #3a4560;border-left:4px solid var(--acc2);border-radius:10px;padding:12px}
.steptitle{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--acc2);margin-bottom:4px}

/* ===== Learning layer ===== */
.mentor{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#15273d,#1a2236);border:1px solid #2f4d6e;border-radius:14px;padding:12px 14px;margin:8px 0}
.mentor .av{font-size:42px;line-height:1}
.mentor .name{font-size:12px;color:var(--acc);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.mentor .say{font-size:14.5px}
.lsec{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.lsec h4{margin:0 0 4px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.6px}
.formula{background:#122033;border-left:3px solid var(--acc);padding:7px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.focus{background:#2a2412;border-left:3px solid var(--acc2);padding:6px 10px;border-radius:8px;margin:6px 0;font-size:13.5px}
.hints{margin-top:10px}
.hints .hint{background:#1d2a1d;border:1px solid #35603a;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.hints .hint b.blank{display:inline-block;min-width:28px;text-align:center;background:#35603a;border-radius:5px}
.hintbtn{border-color:#35603a!important;color:#a5d6a7!important}
.mcrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.struck{text-decoration:line-through;opacity:.45}
.btn.glow{box-shadow:0 0 0 2px var(--ok)}
.req label.glow{outline:2px solid var(--ok);border-radius:8px}
.req label.struck span{text-decoration:line-through;opacity:.5}
.term{border-bottom:1px dotted var(--acc);cursor:help}
#tip{position:fixed;z-index:90;max-width:330px;background:#0b1422;border:1px solid var(--acc);border-radius:10px;padding:8px 11px;font-size:13px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);color:var(--txt)}
#tip b{color:var(--acc)}
#calc{position:fixed;right:16px;bottom:16px;z-index:60;width:300px;background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:12px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#calc input{width:100%;box-sizing:border-box;background:#0d1422;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px;font:15px ui-monospace,monospace}
#calc .res{font:18px ui-monospace,monospace;margin:8px 0;color:var(--ok);min-height:22px}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#calc .keys button{padding:5px 0;font-size:13px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .btn.on{border-color:var(--acc);background:#16324a}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;counter-reset:pn}
.pnode{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 44px;cursor:pointer;min-height:58px;transition:.15s}
.pnode:hover{border-color:var(--acc)}
.pnode .pi{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#26304a}
.pnode.lesson .pi{background:#1e3a2a}.pnode.case .pi{background:#3a2e17}.pnode.boss .pi{background:#3a1e2e}
.pnode.done{border-color:#2f6a3a}.pnode.done .pi{background:var(--ok);color:#08130a}
.pnode.locked{opacity:.45;cursor:not-allowed}
.pnode.next{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(255,183,77,.35);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,183,77,.12)}}
.pnode .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.pnode b{display:block;font-size:14px}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.skill h3{margin:0;font-size:15px}
.mbar{height:10px;border-radius:6px;background:#26304a;overflow:hidden;margin:6px 0 3px}
.mbar i{display:block;height:100%;border-radius:6px}
.lvlname{font-size:12px;color:var(--mut)}
.welcome{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,#17283d,#22203a);border:1px solid #33456a;border-radius:16px;padding:16px 18px;margin-bottom:16px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}.sechead h2{margin:0}
details.dsheet{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px}
details.dsheet summary{cursor:pointer;color:var(--acc);font-size:14px}
details.ev summary{cursor:pointer}
.whyall{margin-top:8px;font-size:13px}.whyall li{margin:4px 0}
.party{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.party i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.lockcase{opacity:.5}
</style>
</head>
<body>
<header>
  <h1 id="logo" title="Back to map">⚙ Stress <span>Quest</span></h1>
  <div class="sp"></div>
  <span id="hdrStars" class="stars"></span>
  <span id="modeBadge" class="tag" style="cursor:pointer" title="Difficulty mode – click to change"></span>
  <button class="btn" id="bMap">🏠 Home</button>
  <button class="btn" id="bSkills">🧠 Skills</button>
  <button class="btn" id="bCalc" title="Calculator">🧮</button>
  <button class="btn" id="bGloss">📘 Cheat sheet</button>
  <button class="btn" id="bSet">⚙</button>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<script>
"use strict";
/* ================= Utilities ================= */
const $=s=>document.querySelector(s);
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='style')e.style.cssText=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
let NICE_NUM=false;/* Learner mode: case scenario numbers rounded to 2 significant digits */
function rnd(a,b){const v=a+Math.random()*(b-a);if(!NICE_NUM)return v;const lo=Math.min(a,b),hi=Math.max(a,b);for(const n of[2,3]){const r=sig(v,n);if(r>=lo&&r<=hi)return r;}return v;}
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(x,d){if(d==null)d=2;if(!isFinite(x))return '∞';const a=Math.abs(x);if(a!==0&&(a>=1e6||a<1e-3))return x.toExponential(Math.max(1,d));return (+x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}
function sig(x,n){if(x===0)return 0;const p=Math.pow(10,n-1-Math.floor(Math.log10(Math.abs(x))));return Math.round(x*p)/p;}
const round5=x=>Math.round(x/5)*5;
function erf(x){// Abramowitz-Stegun 7.1.26 (|err|<1.5e-7)
 const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
 const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function PhiInv(p){// Acklam's algorithm
 const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
 b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
 c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549671671163525e+00,4.374664141464968e+00,2.938163982698783e+00],
 d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
 const pl=0.02425;let q,r;
 if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gammaFn(z){// Lanczos
 if(z<0.5)return Math.PI/(Math.sin(Math.PI*z)*gammaFn(1-z));z-=1;const g=7,p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
 let x=p[0];for(let i=1;i<g+2;i++)x+=p[i]/(z+i);const t=z+g+0.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x;}
function linreg(xs,ys){const n=xs.length;let sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}const m=(n*sxy-sx*sy)/(n*sxx-sx*sx);return{m,b:(sy-m*sx)/n};}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const stdev=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));};

/* ================= Canvas helpers ================= */
function makeCanvas(parent,W,H){
 const cv=el('canvas');const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=W+'/'+H;
 parent.appendChild(cv);const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 const C={cv,ctx,W,H,
  pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};},
  clear(){ctx.clearRect(0,0,W,H);},
  drag(down,move,up){let act=false;
   cv.addEventListener('pointerdown',e=>{const p=C.pos(e);if(down(p)!==false){act=true;cv.setPointerCapture(e.pointerId);e.preventDefault();}});
   cv.addEventListener('pointermove',e=>{const p=C.pos(e);if(act)move(p);else if(C.hover)C.hover(p);});
   cv.addEventListener('pointerup',e=>{if(act){act=false;up&&up();}});
   cv.addEventListener('pointerleave',()=>{if(!act&&C.hover)C.hover(null);});}
 };return C;}
function plotArea(ctx,x,y,w,h,xr,yr){
 const P={x,y,w,h,xr,yr,
  X:v=>x+(v-xr[0])/(xr[1]-xr[0])*w, Y:v=>y+h-(v-yr[0])/(yr[1]-yr[0])*h,
  iX:px=>xr[0]+(px-x)/w*(xr[1]-xr[0]), iY:py=>yr[0]+(y+h-py)/h*(yr[1]-yr[0]),
  inside:p=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h,
  axes(xl,yl,opt){opt=opt||{};ctx.save();ctx.strokeStyle='#2c3850';ctx.fillStyle='#9aa6bf';ctx.font='11px system-ui';ctx.lineWidth=1;
   const xt=opt.xt||niceTicks(xr[0],xr[1],opt.nx||6),yt=opt.yt||niceTicks(yr[0],yr[1],opt.ny||5);
   ctx.textAlign='center';ctx.textBaseline='top';
   xt.forEach(t=>{const px=P.X(t);ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px,y+h);ctx.stroke();ctx.fillText(opt.xf?opt.xf(t):fmtTick(t),px,y+h+4);});
   ctx.textAlign='right';ctx.textBaseline='middle';
   yt.forEach(t=>{const py=P.Y(t);ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x+w,py);ctx.stroke();ctx.fillText(opt.yf?opt.yf(t):fmtTick(t),x-4,py);});
   ctx.strokeStyle='#56627e';ctx.lineWidth=1.3;
   if(Math.min(...xr)<=0&&Math.max(...xr)>=0&&opt.zero){ctx.beginPath();ctx.moveTo(P.X(0),y);ctx.lineTo(P.X(0),y+h);ctx.stroke();}
   if(Math.min(...yr)<=0&&Math.max(...yr)>=0&&opt.zero){ctx.beginPath();ctx.moveTo(x,P.Y(0));ctx.lineTo(x+w,P.Y(0));ctx.stroke();}
   ctx.strokeRect(x,y,w,h);
   ctx.fillStyle='#c9d2e6';ctx.font='12px system-ui';ctx.textAlign='center';ctx.textBaseline='bottom';
   if(xl)ctx.fillText(xl,x+w/2,y+h+30);
   if(yl){ctx.save();ctx.translate(x-(opt.yoff||38),y+h/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText(yl,0,0);ctx.restore();}
   ctx.restore();},
  line(fn,a,b,col,lw,n,dash){n=n||300;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||2;if(dash)ctx.setLineDash(dash);ctx.beginPath();let st=false;
   for(let i=0;i<=n;i++){const t=a+(b-a)*i/n,v=fn(t);if(!isFinite(v)){st=false;continue;}const px=P.X(t),py=P.Y(v);if(!st){ctx.moveTo(px,py);st=true;}else ctx.lineTo(px,py);}ctx.stroke();ctx.restore();},
  clip(){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();}
 };return P;}
function niceTicks(a,b,n){if(a>b){const t=a;a=b;b=t;}const span=b-a;let st=Math.pow(10,Math.floor(Math.log10(span/n)));const e=span/n/st;st*=e>5?10:e>2?5:e>1?2:1;const out=[];for(let t=Math.ceil(a/st)*st;t<=b+1e-9*span;t+=st)out.push(+t.toFixed(10));return out;}
function fmtTick(t){const a=Math.abs(t);if(a!==0&&(a>=1e5||a<1e-3))return t.toExponential(0);return +t.toFixed(4)+'';}
function dot(ctx,x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function txt(ctx,s,x,y,col,font,al,bl){ctx.fillStyle=col||'#e6ebf5';ctx.font=font||'12px system-ui';ctx.textAlign=al||'left';ctx.textBaseline=bl||'alphabetic';ctx.fillText(s,x,y);}
function arrow(ctx,x1,y1,x2,y2,col,lw,hs){hs=hs||8;ctx.save();ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=lw||2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));ctx.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));ctx.closePath();ctx.fill();ctx.restore();}
function heat(t){// 0..1 -> blue-green-yellow-red
 t=clamp(t,0,1);const stops=[[0,[30,60,200]],[0.25,[30,170,230]],[0.5,[60,200,90]],[0.75,[240,220,40]],[1,[230,40,40]]];
 for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){const[a,c1]=stops[i-1],[b,c2]=stops[i];const f=(t-a)/(b-a);return`rgb(${c1.map((c,k)=>Math.round(c+(c2[k]-c)*f)).join(',')})`;}return'rgb(230,40,40)';}

/* slider row helper: returns input element */
function slider(parent,label,min,max,step,val,onInput,fmtFn){
 let g=parent.querySelector(':scope > .ctrl');if(!g){g=el('div',{class:'ctrl'});parent.appendChild(g);}
 const lab=el('label',null,label),inp=el('input',{type:'range',min,max,step,value:val}),out=el('output');
 const f=fmtFn||(v=>v);const upd=()=>{out.textContent=f(+inp.value);};upd();
 inp.addEventListener('input',()=>{upd();onInput(+inp.value);});
 g.append(lab,inp,out);inp.set=v=>{inp.value=v;upd();};return inp;}

function starsFor(score){return score>=90?3:score>=70?2:score>=40?1:0;}
function starHTML(n,max){max=max||3;let s='';for(let i=0;i<max;i++)s+=i<n?'★':'<span class="off">★</span>';return`<span class="stars">${s}</span>`;}
function totalStars(){return Object.values(STORE.levels).reduce((s,l)=>s+(l.stars||0),0);}

function isUnlocked(lv){if(STORE.unlockAll)return true;
 if(lv.id==='boss'){return Object.values(STORE.levels).filter(l=>l.stars>0).length>=8||Object.values(STORE.cases).filter(c=>c.best!=null).length>=4||Object.values(STORE.lessons).filter(l=>l.done).length>=6;}
 const ws=LEVELS.filter(l=>l.world===lv.world);const i=ws.indexOf(lv);if(i<=0)return true;const prev=STORE.levels[ws[i-1].id];return !!(prev&&prev.stars>0);}

function modal(html,buttons){const root=$('#modalRoot');root.innerHTML='';const m=el('div',{class:'modal'});const b=el('div',{class:'box'},html);const r=el('div',{class:'row',style:'justify-content:flex-end;margin-top:16px'});

// task types: num {q, ans()/ans, tol (rel), abs, unit, explain, hint, sk}, choice {q, opts:[{t,ok,why}]}, action {q, btn, check()->{ok,msg,partial}}
function numTask(q,ans,o){o=o||{};return Object.assign({type:'num',q,ans},o);}
let CUR_LEVEL=null;
function showConcept(){if(CUR_LEVEL)modal(`<h2>📖 ${CUR_LEVEL.title}</h2>${CUR_LEVEL.concept}`);}
function runTasks(box,tasks,onFinish,opt){opt=opt||{};
 let i=0;const res=[];
 const val=v=>typeof v==='function'?v():v;
 function bar(){const b=el('div',{class:'tprog'});tasks.forEach((t,k)=>{const s=k<res.length?(res[k]>=0.99?'done':res[k]>0?'half':'miss'):k===i?'cur':'';b.appendChild(el('i',{class:s}));});return b;}
 function render(){
  const t=tasks[i];box.innerHTML='';if(t.onShow)t.onShow();
  const sk=t.sk||opt.sk||((CUR_LEVEL&&typeof LEVEL_SKILLS!=='undefined'&&LEVEL_SKILLS[CUR_LEVEL.id])||[])[0];const SK=typeof SKILLS!=='undefined'?SKILLS[sk]:null;
  box.appendChild(bar());const tk=el('div',{class:'task'});box.appendChild(tk);
  tk.appendChild(el('div',{class:'q'},`<span class="tag">Task ${i+1}/${tasks.length}</span> `+val(t.q)));
  const area=el('div');tk.appendChild(area);const fb=el('div',{class:'fb'});tk.appendChild(fb);
  const hb=el('div');tk.appendChild(hb);
  const nx=el('div',{class:'row'});tk.appendChild(nx);
  let attempts=0,finished=false;const tries=isExpert()?1:(t.tries||(isLearner()&&t.type==='action'?3:2));let hl=null;
  const explain=()=>t.explain?'<div style="margin-top:6px" class="small">💡 '+val(t.explain)+'</div>':'';
  function done(score,cls,msg){finished=true;score*=hintFactor(hl?hl.used():0);res.push(score);fb.className='fb '+cls;fb.innerHTML=msg+explain();
   area.querySelectorAll('button,input').forEach(b=>b.disabled=true);if(hl&&hl.disable)hl.disable();if(t.onDone)t.onDone(score);if(sk)addMastery(sk,score);
   nx.appendChild(el('button',{class:'btn pri',onclick:()=>{i++;if(i<tasks.length)render();else finish();}},i<tasks.length-1?'Next task ▶':(opt.finishLabel||'Finish level ✔')));
   box.replaceChild(bar(),box.firstChild);}
  function grade(r){if(finished)return;attempts++;
   if(r.ok){const sc=(attempts===1?1:0.5)*(r.partial==null?1:r.partial);done(sc,'ok','✅ <b>Correct!</b> '+(r.msg||'')+(attempts>1?' <span class="mut">(half credit – 2nd try)</span>':''));}
   else if(attempts<tries){fb.className='fb bad';fb.innerHTML='❌ '+(r.msg||'Not quite.')+' <span class="mut">Try once more'+(isLearner()?'':' (half credit)')+'.</span>';if(r.after)r.after();}
   else done(0,'bad','❌ '+(r.msg||'Not quite.')+(t.type!=='choice'&&t.ans!=null?` <br>The answer is <b>${fmt(val(t.ans),t.dec==null?3:t.dec)}${t.unit?' '+t.unit:''}</b>.`:'')+(t.reveal?' '+val(t.reveal):''));}
  const formulaTier=()=>(SK?`<div class="formula">📐 ${SK.formula}</div><div class="small">${SK.why}</div>`:'')+(CUR_LEVEL?' <button class="btn sm" onclick="showConcept()">📖 Open the concept card</button>':'');
  if(t.type==='num'){
   const r=el('div',{class:'ansrow'});const inp=el('input',{type:'text',inputmode:'decimal',placeholder:isLearner()?'number or expression, e.g. 5000/78.5':'your answer'});const b=el('button',{class:'btn pri'},'Check');
   r.append(inp);if(t.unit)r.append(el('span',{class:'mut'},t.unit));r.append(b);if(!isExpert())r.append(el('button',{class:'btn sm',title:'Calculator',onclick:()=>calcOpen(inp)},'🧮'));area.appendChild(r);
   const mcBox=el('div');area.appendChild(mcBox);
   const showMC=()=>{if(!isLearner()||finished||mcBox.childNodes.length)return;const a=val(t.ans);mcBox.appendChild(el('div',{class:'small mut',style:'margin-top:8px'},'🛟 Stuck? Type a new answer – or pick one of these:'));const row=el('div',{class:'mcrow'});
    mcOptions(a,t.dec).forEach(o=>{const bb=el('button',{class:'btn sm'},o.t+(t.unit?' '+t.unit:''));bb.onclick=()=>{bb.classList.add(o.ok?'right':'wrong');grade({ok:o.ok,msg:o.ok?'Good pick!':'That was not it.'});};row.appendChild(bb);});mcBox.appendChild(row);};
   const go=()=>{const v=parseAnswer(inp.value);if(!isFinite(v)){fb.className='fb info';fb.style.display='block';fb.textContent='Please enter a number (or an expression like 2*3.5).';return;}
    const a=val(t.ans);const j=judgeSmart(v,a,t);
    if(j.ok)grade({ok:true,msg:`Exact value: ${fmt(a,t.dec==null?3:t.dec)}${t.unit?' '+t.unit:''}.`});
    else grade({ok:false,msg:j.msg+(t.hint&&!isLearner()?' <i>Hint: '+val(t.hint)+'</i>':''),after:showMC});};
   b.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});setTimeout(()=>inp.focus({preventScroll:true}),30);
   hl=hintLadder(hb,[()=>t.hint?val(t.hint):`Write down what is given (with units) and what is asked${t.unit?' – the answer is in <b>'+t.unit+'</b>':''}. Which relation from the concept card connects them?`,
    formulaTier,()=>t.explain?'Worked solution path: '+maskAnswer(val(t.explain),val(t.ans),t.dec)+' <span class="mut">– finish the last step yourself.</span>':`The answer is roughly ${fmt(sig(val(t.ans),1),3)}${t.unit?' '+t.unit:''} – now compute it precisely.`]);
  }else if(t.type==='choice'){
   const c=el('div',{class:'choices'});area.appendChild(c);const opts=t.noShuffle?t.opts:shuffle(t.opts);const btns=[];
   opts.forEach(o=>{const b=el('button',{class:'btn'},o.t);btns.push(b);c.appendChild(b);b.onclick=()=>{if(finished)return;
    if(o.ok){b.classList.add('right');grade({ok:true,msg:o.why||''});}
    else{b.classList.add('wrong');b.disabled=true;grade({ok:false,msg:o.why||'That is not right.'});if(finished){[...c.children].forEach((bb,k)=>{if(opts[k].ok)bb.classList.add('right');});fb.innerHTML+='<br>Correct answer: <b>'+opts.find(x=>x.ok).t+'</b>';}}};});
   const strike=n=>{let k=0;const out=[];opts.forEach((o,j)=>{if(!o.ok&&k<n&&!btns[j].disabled){btns[j].disabled=true;btns[j].classList.add('struck');k++;out.push(o);}});return out;};
   hl=hintLadder(hb,[()=>t.hint?val(t.hint):'Read each option and ask: does it agree with the concept card? Eliminate options that contradict it.',
    ()=>{const g=strike(1);return 'One option is out: <i>'+(g[0]?g[0].t:'')+'</i>'+(g[0]&&g[0].why?' – '+g[0].why:'')+'<br>'+formulaTier();},
    ()=>{const left=opts.filter((o,j)=>!btns[j].disabled).length;strike(Math.max(0,left-2));return 'Only two options remain – one of them is right.';}]);
  }else if(t.type==='action'){
   const b=el('button',{class:'btn pri'},t.btn||'Submit');area.appendChild(b);b.onclick=()=>grade(t.check());
   if(t.extra)area.appendChild(t.extra);
   hl=hintLadder(hb,[()=>t.hint?val(t.hint):'Use the interactive picture on the left: move the controls until the condition in the question is met, then submit.',formulaTier,
    ()=>t.explain?maskAnswer(val(t.explain),t.ans!=null?val(t.ans):NaN,t.dec):'Compare your picture with the worked example in the concept card (📖) – the key relation is there.']);
  }
 }
 function finish(){const score=Math.round(100*res.reduce((a,b)=>a+b,0)/tasks.length);onFinish(score);}
 render();
}

/* ---------- safe expression parser (answer boxes + calculator) ---------- */
function evalExpr(src){let s=String(src).toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt').replace(/π/g,'pi');
 let i=0;const err=()=>{throw new Error('parse');};
 const F={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs,sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),tan:x=>Math.tan(x*Math.PI/180)};
 function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const w=term();v=o==='+'?v+w:v-w;}return v;}
 function term(){let v=unary();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const w=unary();v=o==='*'?v*w:v/w;}return v;}
 function unary(){if(s[i]==='-'){i++;return -unary();}if(s[i]==='+'){i++;return unary();}return power();}
 function power(){const b=atom();if(s[i]==='^'){i++;return Math.pow(b,unary());}return b;}
 function atom(){if(s[i]==='('){i++;const v=expr();if(s[i]!==')')err();i++;return v;}
  const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/.exec(s.slice(i));if(m){i+=m[0].length;return parseFloat(m[0]);}
  const f=/^(sqrt|ln|log|exp|abs|sin|cos|tan)\(/.exec(s.slice(i));if(f){i+=f[1].length;return F[f[1]](atom());}
  if(s.slice(i,i+2)==='pi'){i+=2;return Math.PI;}err();}
 const v=expr();if(i!==s.length)err();return v;}
function parseAnswer(str){const t=String(str||'').trim();if(!t)return NaN;if(/^[-+]?\d*[.,]?\d+(e[-+]?\d+)?$/i.test(t))return parseFloat(t.replace(',','.'));try{return evalExpr(t);}catch(e){return NaN;}}

/* ---------- smart numeric judging with unit-mistake detection ---------- */
function judgeSmart(v,a,o){o=o||{};const L=isLearner(),exact=(o.tol===0&&!o.abs&&!o.logtol);
 let tol=Math.max((o.tol==null?0.03:o.tol)*Math.abs(a),o.abs||0);if(L&&!exact)tol=Math.max(tol,0.05*Math.abs(a),(o.abs||0)*1.5);
 let ok;if(o.logtol){const lt=L?Math.max(o.logtol,0.05):o.logtol;ok=v*a>0&&Math.abs(Math.log10(v/a))<=lt;}else ok=Math.abs(v-a)<=tol+1e-12;
 if(ok)return{ok:true,msg:''};const m=mistakeMsg(v,a,o.unit,tol);return{ok:false,msg:m.msg,unit:m.unit};}
function mistakeMsg(v,a,unit,tol){const u=String(unit||'').replace(/<[^>]+>/g,'');if(!a||!isFinite(v))return{msg:'Not quite.'};const r=v/a;const near=(f,e)=>Math.abs(r/f-1)<=(e||0.06);
 const U=(msg)=>({msg:'🔎 <b>Unit check:</b> '+msg,unit:true});
 if(near(-1))return{msg:'Check the sign! The size is right but the sign is flipped (tension +, compression −).'};
 if(/MPa/.test(u)){if(near(1e6))return U('your value is 1,000,000× too big – it looks like <b>Pa</b> (N/m²). 1 MPa = 10⁶ Pa = 1 N/mm².');
  if(near(1e-6))return U('your value is 1,000,000× too small – did you mix <b>m² and mm²</b>? (1 m² = 10⁶ mm²). With N and mm you get MPa directly.');
  if(near(1e3))return U('1000× too big – <b>kPa instead of MPa</b>, or a length in mm where m was needed (N·mm vs N·m)?');
  if(near(1e-3))return U('1000× too small – did you use <b>kN instead of N</b> (1 kN = 1000 N), or GPa / m instead of mm?');}
 if(/^mm/.test(u)){if(near(1e-3))return U('looks like <b>metres</b> – the answer is asked in mm (1 m = 1000 mm).');if(near(0.1))return U('looks like <b>cm</b> – the answer is asked in mm (1 cm = 10 mm).');if(near(1e3))return U('1000× too big – µm instead of mm, or a stress in Pa somewhere?');}
 if(/kN/.test(u)){if(near(1e3))return U('looks like <b>N</b> – the answer is asked in kN (divide by 1000).');if(near(1/9.81,0.03)||near(1e3/9.81,0.03))return U('looks like a <b>mass</b>. Force = mass × g (9.81 m/s²).');}
 if(u==='N'){if(near(1/9.81,0.03))return U('that is the <b>mass in kg</b>. Weight force F = m·g = m × 9.81 m/s² (in N).');if(near(1e-3))return U('looks like <b>kN</b> – the answer is asked in N (× 1000).');}
 if(/N·mm/.test(u)&&near(1e-3))return U('looks like <b>N·m</b> – the answer is asked in N·mm (× 1000).');
 if(/N·m$/.test(u)&&near(1e3))return U('looks like <b>N·mm</b> – the answer is asked in N·m (÷ 1000).');
 if(u==='%'){if(near(0.01))return U('you entered a <b>fraction</b> – multiply by 100 to get %.');}
 else if(!u&&near(100))return U('that looks like a <b>percentage</b> – enter it as a plain ratio (e.g. 0.25, not 25).');
 if(near(1e3)||near(1e-3))return U('off by a factor of 1000 – check unit prefixes (k, M) and mm vs m.');
 if(near(1e6)||near(1e-6))return U('off by 10⁶ – check mm² vs m² or Pa vs MPa.');
 if(near(9.81,0.03)||near(1/9.81,0.03))return U('off by g = 9.81 – mixing up mass (kg) and force (N)? F = m·g.');
 if(near(2,0.04)||near(0.5,0.04))return{msg:'Off by exactly a factor of 2 – diameter vs radius? one side vs both? amplitude vs range?'};
 if(near(4,0.04)||near(0.25,0.04))return{msg:'Off by a factor of 4 – did you use r instead of d in A = πd²/4 (or the other way round)?'};
 if(near(100,0.03)||near(0.01,0.03))return{msg:'Off by 100 – percent vs fraction?'};
 if(near(10,0.03)||near(0.1,0.03))return{msg:'Off by a factor of 10 – a decimal slip or cm vs mm?'};
 if(Math.abs(v-a)<=3*tol)return{msg:'Very close! Just outside the tolerance – check your rounding of intermediate values.'};
 return{msg:'Not quite – your value is '+(v>a?'too high':'too low')+'.'};}

/* ---------- glossary tooltips ---------- */
const TERMS=[
 ['von Mises','An "equivalent stress": it combines several stresses (pull, push, shear) into one number you can compare with the yield strength of a ductile metal. σ<sub>vM</sub> = √(σ² + 3τ²) for one normal and one shear stress.'],
 ['Tresca','A yield criterion based on the largest shear stress. Slightly more conservative than von Mises.'],
 ['Kt','Stress concentration factor: how many times higher the peak stress at a hole, notch or corner is than the average ("nominal") stress. σ<sub>max</sub> = K<sub>t</sub>·σ<sub>nom</sub>.'],
 ['Kf','Fatigue notch factor: the "effective" Kt for fatigue, a bit lower than Kt for small, sharp notches.'],
 ['stress concentration','A local rise in stress at holes, notches, sharp corners or cracks – the force "crowds" around the obstacle.'],
 ['endurance limit','For steels: the stress amplitude below which a part can survive (practically) unlimited load cycles. Symbol S<sub>e</sub>.'],
 ['fatigue','Failure caused by many repeated load cycles, at stresses below the static strength. Think of bending a paperclip back and forth.'],
 ['Goodman','A straight-line rule that combines alternating and mean stress for fatigue: σ<sub>a</sub>/S<sub>e</sub> + σ<sub>m</sub>/S<sub>ut</sub> = 1/n.'],
 ['S–N curve','Stress amplitude (S) versus number of cycles to failure (N), usually on log scales. Lower stress → longer life.'],
 ['B10','The time (or number of cycles) by which 10 % of a population has failed. A common reliability target for bearings and products.'],
 ['B-basis','A conservative "design allowable": a value that 90 % of the population exceeds, with 95 % confidence.'],
 ['Weibull','A statistical distribution for lifetimes: F(t) = 1 − exp[−(t/η)<sup>β</sup>]. Its shape β tells you HOW things fail.'],
 ['β','Weibull shape parameter (beta): β < 1 early failures, β ≈ 1 random failures, β > 1 wear-out.'],
 ['η','Weibull characteristic life (eta): the time by which 63.2 % have failed.'],
 ['suspension','A unit that has NOT failed yet when the data were collected ("censored" data). It still carries information: it survived at least that long.'],
 ['mesh','The pattern of small elements an FE model is divided into. Finer mesh → more detail, but more computing time.'],
 ['element','A small piece of an FE model (like a brick in a wall). Elements are connected at nodes.'],
 ['node','A point where FE elements connect. The computer solves for the displacement of every node.'],
 ['boundary condition','How an FE model is held (supports) and loaded. Wrong boundary conditions = wrong answer, no matter how fine the mesh.'],
 ['singularity','A point (e.g. a perfectly sharp inner corner) where the computed stress grows without limit as the mesh is refined. The number is not physical.'],
 ['convergence','The FE result stops changing (much) when the mesh is refined further – then you can trust the number.'],
 ['FEA','Finite element analysis: a computer method that splits a part into many small elements to compute stresses and deflections.'],
 ['safety factor','Strength divided by the actual stress (n = S/σ). n = 2 means the part could carry twice the load before failing.'],
 ['yield strength','The stress at which a metal starts to deform permanently (it does not spring back). Symbol S<sub>y</sub>.'],
 ['tensile strength','The highest stress a material can carry in a tensile test before it breaks. Symbol S<sub>ut</sub> or R<sub>m</sub>.'],
 ['MPa','Megapascal: 1 MPa = 1 N/mm² = 10⁶ Pa. The everyday unit for stresses in engineering.'],
 ['bending moment','Force × lever arm (N·mm). It is what makes a beam bend; the stress is σ = M/W.'],
 ['section modulus','W – how well a cross-section resists bending stress. For a rectangle W = b·h²/6 (height counts twice!).'],
 ['moment of inertia','I – how stiff a cross-section is in bending. For a rectangle I = b·h³/12 (height counts three times!).'],
 ['Young\'s modulus','E – the stiffness of a material: stress per unit strain. Steel ≈ 210 000 MPa, aluminium ≈ 70 000 MPa.'],
 ['strain','Relative stretch: change in length ÷ original length (no unit). ε = σ/E in the elastic range.'],
 ['preload','The tension built into a bolt when you tighten it. It clamps the joint and protects the bolt from fatigue.'],
 ['Charpy','A pendulum impact test on a notched bar. The absorbed energy (J) shows how tough (not brittle) a steel is at a given temperature.'],
 ['Paris law','Crack growth per cycle: da/dN = C·(ΔK)<sup>m</sup>. Bigger stress range or longer crack → faster growth.'],
 ['fracture toughness','K<sub>c</sub> – the resistance of a material to an existing crack. When K = Yσ√(πa) reaches K<sub>c</sub>, the crack runs.'],
 ['hoop stress','The "around" stress in the wall of a pressurised pipe or cylinder: σ = pR/t for thin walls.'],
 ['FMEA','Failure Mode and Effects Analysis: list what can go wrong, rate Severity, Occurrence and Detection (1–10), and act on the worst first.'],
 ['RPN','Risk priority number in FMEA: S × O × D. Always look at high Severity too, not only the RPN.'],
 ['Pareto','The 80/20 idea: a few causes produce most of the problems. Sort categories by count and attack the biggest first.'],
 ['standard deviation','A measure of scatter: how far values typically are from the mean. Small = consistent, large = unpredictable.'],
 ['reliability','The probability that a part survives (does not fail) for a given time under given conditions. R = 1 − F.'],
 ['interference','Stress–strength interference: failures happen where the "load" and "strength" distributions overlap.'],
 ['median rank','An estimate of the fraction failed for the i-th failure in a sample: F ≈ (i − 0.3)/(n + 0.4).'],
 ['Lamé','Exact formulas for stresses in thick-walled cylinders; the hoop stress is highest at the inner surface.'],
 ['joint constant','C = k<sub>b</sub>/(k<sub>b</sub> + k<sub>m</sub>): the share of an external load change that the bolt "feels" while the joint stays clamped.']];
[['suspensions','suspension'],['elements','element'],['nodes','node'],['boundary conditions','boundary condition'],['singularities','singularity'],['stress concentrations','stress concentration'],['safety factors','safety factor']].forEach(([a,b])=>{const d=TERMS.find(x=>x[0]===b);if(d)TERMS.push([a,d[1]]);});
const TERM_MAP={};TERMS.forEach(([t,d])=>TERM_MAP[t.toLowerCase()]=d);
const TERM_RE=new RegExp('(^|[^\\wα-ω])('+TERMS.map(([t])=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')(?=$|[^\\wα-ω])','i');
function annotate(root){if(!root||!root.querySelectorAll)return;const used=new Set([...root.querySelectorAll('.term')].map(x=>x.dataset.term));
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('button,input,textarea,select,option,canvas,script,style,.term,h1,h2,h3,#tip,#calc,summary,.tprog,header,.pnode,.casecard,.lvl,.mcrow'))return NodeFilter.FILTER_REJECT;return TERM_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP;}});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{const m=TERM_RE.exec(n.nodeValue);if(!m)return;const term=m[2],key=term.toLowerCase();if(used.has(key))return;used.add(key);
  const start=m.index+m[1].length;const after=n.splitText(start);after.nodeValue.length>term.length&&after.splitText(term.length);
  const sp=document.createElement('span');sp.className='term';sp.dataset.term=key;sp.tabIndex=0;after.parentNode.replaceChild(sp,after);sp.textContent=term;});}
function tipInit(){if($('#tip'))return;const t=el('div',{id:'tip'});document.body.appendChild(t);
 const show=(sp)=>{const d=TERM_MAP[sp.dataset.term];if(!d)return;t.innerHTML=`<b>${sp.textContent}</b> – ${d}`;t.style.display='block';const r=sp.getBoundingClientRect();
  let x=Math.min(window.innerWidth-345,Math.max(8,r.left));let y=r.bottom+6;if(y+120>window.innerHeight)y=Math.max(8,r.top-t.offsetHeight-6);t.style.left=x+'px';t.style.top=y+'px';};
 document.addEventListener('mouseover',e=>{const sp=e.target.closest&&e.target.closest('.term');if(sp)show(sp);});
 document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.term'))t.style.display='none';});
 document.addEventListener('click',e=>{const sp=e.target.closest&&e.target.closest('.term');if(sp)show(sp);else t.style.display='none';},true);
 document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('term'))show(e.target);});
 let pending=false;const obs=new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;obs.disconnect();try{annotate($('#app'));annotate($('#modalRoot'));}finally{watch();}});});
 const watch=()=>{obs.observe($('#app'),{childList:true,subtree:true});obs.observe($('#modalRoot'),{childList:true,subtree:true});};watch();}
