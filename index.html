defLevel({id:'w2l5',world:2,title:'Results Interpretation',short:'Averaged vs unaveraged stresses, which stress for which criterion',
concept:`<p>FE stresses are computed at integration (Gauss) points inside each element and are <b>discontinuous</b> between elements. Post-processors extrapolate them to nodes and show either:</p>
<ul><li><b>Unaveraged (element nodal)</b> – each element shows its own values → jumps between elements.</li>
<li><b>Averaged (nodal)</b> – values of all elements sharing a node are averaged → smooth, nicer, but can hide errors.</li></ul>
<div class="formula">σ<sub>node,avg</sub> = (1/m) Σ σ<sub>node</sub><sup>(e)</sup> &nbsp;&nbsp; jump = max − min over the m elements</div>
<p>A large difference between averaged and unaveraged values signals <b>discretisation error → refine</b>. Never average across <b>material or thickness boundaries</b> or across parts – stresses are physically discontinuous there.</p>
<p><b>Which stress for which check?</b></p>
<ul><li>Ductile metals, static strength: <b>von Mises</b> (or Tresca) vs S<sub>y</sub>.</li>
<li>Brittle materials (cast iron, ceramics, glass): <b>max principal</b> σ₁ vs S<sub>ut</sub> (Coulomb–Mohr if compression matters).</li>
<li>Fatigue: principal-stress ranges / critical-plane methods (von Mises loses the sign of mean stress!).</li>
<li>Displacements converge faster than stresses; judge convergence on stresses.</li></ul>`,
takeaway:'Compare averaged and unaveraged plots to estimate mesh error; pick the stress measure that matches the failure mechanism.',
build(sim){
 const nx=8,ny=5;const vals=[];const f=(x,y)=>90+170*Math.exp(-(Math.pow((x-nx)/3.2,2)+Math.pow(y/2.2,2)));
 for(let i=0;i<nx;i++){vals.push([]);for(let j=0;j<ny;j++)vals[i].push(f(i+0.5,j+0.5)*(1+0.12*((i+j)%2?1:-1)));}
 const NI=5,NJ=2;// node N at grid point (5,2) shared by elements (4,1),(5,1),(4,2),(5,2)
 const base=round5(rnd(150,210));const four=[base+rint(-6,6)*5,base+rint(-6,6)*5,base+rint(-6,6)*5,base+rint(-6,6)*5];
 if(Math.max(...four)-Math.min(...four)<30)four[0]+=40;
 [[4,1],[5,1],[4,2],[5,2]].forEach(([i,j],k)=>vals[i][j]=four[k]);
 const avg=mean(four);let show='un';
 const nodeAvg=(I,J)=>{const a=[];for(const[di,dj]of[[-1,-1],[0,-1],[-1,0],[0,0]]){const i=I+di,j=J+dj;if(i>=0&&j>=0&&i<nx&&j<ny)a.push(vals[i][j]);}return mean(a);};
 const C=makeCanvas(sim,680,360),ctx=C.ctx;const x0=40,y0=30,h=60;const lo=80,hi=280;
 function draw(){C.clear();
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const X=x0+i*h,Y=y0+(ny-1-j)*h;
   if(show==='un'){ctx.fillStyle=heat((vals[i][j]-lo)/(hi-lo));ctx.fillRect(X,Y,h,h);}
   else{const a=nodeAvg(i,j),b=nodeAvg(i+1,j),c=nodeAvg(i+1,j+1),d=nodeAvg(i,j+1);const s=8;for(let p=0;p<s;p++)for(let q=0;q<s;q++){const u=(p+0.5)/s,v=(q+0.5)/s;const val=a*(1-u)*(1-v)+b*u*(1-v)+c*u*v+d*(1-u)*v;ctx.fillStyle=heat((val-lo)/(hi-lo));ctx.fillRect(X+p*h/s,Y+h-(q+1)*h/s,h/s+0.5,h/s+0.5);}}
   ctx.strokeStyle='#0c111b';ctx.lineWidth=1;ctx.strokeRect(X,Y,h,h);}
  [[4,1],[5,1],[4,2],[5,2]].forEach(([i,j])=>{const X=x0+i*h,Y=y0+(ny-1-j)*h;txt(ctx,show==='un'?fmt(vals[i][j],0):'',X+h/2,Y+h/2,'#000','bold 13px system-ui','center','middle');});
  const Nx=x0+NI*h,Ny=y0+(ny-NJ)*h;dot(ctx,Nx,Ny,6,'#fff','#000');txt(ctx,'N',Nx+8,Ny-8,'#fff','bold 13px system-ui');
  if(show==='av')txt(ctx,fmt(nodeAvg(NI,NJ),1),Nx+10,Ny+16,'#fff','bold 13px system-ui');
  ctx.fillStyle='#ffb74d';for(let k=0;k<ny;k++)arrow(ctx,x0+nx*h+4,y0+k*h+h/2,x0+nx*h+30,y0+k*h+h/2,'#ffb74d',1.5,6);
  for(let k=0;k<=40;k++){ctx.fillStyle=heat(k/40);ctx.fillRect(600,y0+300-k*7,24,7.5);}txt(ctx,hi+' MPa',630,y0+8,'#c9d2e6','11px system-ui');txt(ctx,lo+' MPa',630,y0+300,'#c9d2e6','11px system-ui');
  txt(ctx,show==='un'?'UNAVERAGED (element) stresses – note the jumps':'AVERAGED (nodal) stresses – smooth contour',x0,y0+ny*h+25,'#e6ebf5','bold 13px system-ui');}
 const row=el('div',{class:'row'});const bu=el('button',{class:'btn sm pri'},'Unaveraged'),ba=el('button',{class:'btn sm'},'Averaged');row.append(bu,ba);sim.appendChild(row);
 bu.onclick=()=>{show='un';bu.className='btn sm pri';ba.className='btn sm';draw();};ba.onclick=()=>{show='av';ba.className='btn sm pri';bu.className='btn sm';draw();};
 sim.appendChild(el('div',{class:'legend'},'Coarse linear-element mesh near a stress raiser (right edge loaded). Values = von Mises stress extrapolated to node N from each of its 4 elements.'));
 draw();
 return{tasks:[
  numTask(`The four elements around node N report ${four.join(', ')} MPa at N. What does the <b>averaged nodal plot</b> show at N?`,avg,{unit:'MPa',tol:0.01,dec:1,explain:`Average = (${four.join(' + ')})/4 = ${fmt(avg,1)} MPa. Toggle "Averaged" to see it.`}),
  numTask('What is the <b>stress jump</b> (max − min of the element values) at node N, as a percentage of the averaged value?',100*(Math.max(...four)-Math.min(...four))/avg,{unit:'%',tol:0.03,dec:1,explain:`(${Math.max(...four)} − ${Math.min(...four)})/${fmt(avg,1)} = ${fmt(100*(Math.max(...four)-Math.min(...four))/avg,1)} %. Many analysts treat jumps above ~10 % in critical regions as "mesh not fine enough".`}),
  {type:'choice',q:'What does such a large jump at N tell you?',opts:[
   {t:'Discretisation error is large there – refine the mesh (the averaged plot looks smoother than the truth)',ok:true,why:'In the exact solution the stress is continuous in homogeneous material; jumps measure how far the FE field is from it.'},
   {t:'The material is yielding at N',why:'The analysis is linear – the jump is a numerical, not physical, effect.'},
   {t:'Nothing – the averaged value is always exact',why:'Averaging hides error; it does not remove it.'},
   {t:'The load is applied incorrectly',why:'Not necessarily; it shows the mesh is too coarse for the local gradient.'}]},
  {type:'choice',q:'A weld joins a steel bracket and an aluminium plate (different materials, same mesh). Should nodal stresses be averaged across the interface?',opts:[
   {t:'No – stresses are physically discontinuous at material boundaries; average per part/material only',ok:true,why:'Different stiffness means different stress at the same strain: averaging would mix two real, different values.'},
   {t:'Yes – averaging always improves accuracy',why:'Averaging across real discontinuities produces wrong values on both sides.'},
   {t:'Only if the elements are quadratic',why:'Element order does not matter here – the physics is discontinuous.'}]},
  {type:'choice',q:'Static strength check of a <b>ductile steel</b> shaft: which result do you compare with S<sub>y</sub>?',opts:[
   {t:'von Mises equivalent stress',ok:true,why:'Yielding of ductile metals is governed by distortion energy (von Mises) – or Tresca for a conservative check.'},
   {t:'Maximum principal stress',why:'That is for brittle fracture.'},
   {t:'σ<sub>xx</sub> in the global coordinate system',why:'A component depends on the coordinate system; failure criteria need invariants.'},
   {t:'Total displacement',why:'Displacement is a stiffness check, not a strength check.'}]},
  {type:'choice',q:'Same model, but the part is <b>grey cast iron</b> (brittle). Which result is decisive in tension regions?',opts:[
   {t:'Maximum principal stress σ₁ vs S<sub>ut</sub> (Coulomb–Mohr when compression is significant)',ok:true,why:'Brittle materials fail by tensile fracture driven by the largest normal stress.'},
   {t:'von Mises vs S<sub>ut</sub>',why:'von Mises is insensitive to the sign (tension/compression) – fatal for brittle materials with S<sub>uc</sub> ≫ S<sub>ut</sub>.'},
   {t:'Tresca vs S<sub>y</sub>',why:'Cast iron has no distinct yield point; it fractures.'},
   {t:'Minimum principal stress',why:'Compression is the strong direction of brittle materials.'}]}
 ]};}});

defLevel({id:'w3l1',world:3,title:'Weibull Lab',short:'Median ranks, Weibull probability plot, read β and η',
concept:`<p>The 2-parameter <b>Weibull distribution</b> is the workhorse for life data:</p>
<div class="formula">F(t) = 1 − exp[−(t/η)<sup>β</sup>] &nbsp;&nbsp; R(t) = 1 − F(t)</div>
<p>β = <b>shape</b> (slope), η = <b>scale</b> (characteristic life: F(η) = 63.2 % for any β). Taking logs twice linearises it:</p>
<div class="formula">ln[−ln(1 − F)] = β·ln t − β·ln η &nbsp;&nbsp; → straight line, slope β, crosses F = 63.2 % at t = η</div>
<p>To plot n sorted failure times we estimate F with <b>median ranks</b> (Bernard's approximation):</p>
<div class="formula">F<sub>i</sub> ≈ (i − 0.3) / (n + 0.4)</div>
<p><b>Bathtub curve</b> interpretation of β:</p>
<ul><li>β &lt; 1: decreasing failure rate – <b>infant mortality</b> (manufacturing defects, burn-in helps)</li>
<li>β ≈ 1: constant failure rate – <b>random</b> failures (exponential distribution, MTTF = η)</li>
<li>β &gt; 1: increasing failure rate – <b>wear-out</b> (fatigue β≈2–4, preventive replacement makes sense)</li></ul>`,
takeaway:'Median ranks → Weibull plot → slope β (failure mode type), F = 63.2 % crossing → η.',
build(sim){
 const n=8;let t,beta0,eta0,fit;
 for(let k=0;k<200;k++){beta0=pick([0.6,0.7,1.0,2.0,2.8,3.5]);eta0=Math.round(rnd(800,6000)/10)*10;
  const us=shuffle([...Array(n)].map((_,i)=>(i+rnd(0.15,0.85))/n));t=us.map(u=>Math.round(eta0*Math.pow(-Math.log(1-u),1/beta0))).filter(v=>v>0).sort((a,b)=>a-b);
  if(t.length<n||new Set(t).size<n)continue;const F=t.map((_,i)=>(i+1-0.3)/(n+0.4));const r=linreg(t.map(Math.log),F.map(f=>Math.log(-Math.log(1-f))));fit={beta:r.m,eta:Math.exp(-r.b/r.m)};
  const b=fit.beta;if((b>0.82&&b<0.95)||(b>1.12&&b<1.3))continue;const cf=x=>x<0.95?0:x<=1.12?1:2;if(cf(b)!==cf(beta0))continue;break;}
 const Fr=t.map((_,i)=>(i+1-0.3)/(n+0.4));const cat=fit.beta<0.95?'inf':fit.beta<=1.12?'rand':'wear';
 const X=t.map(Math.log),Y=Fr.map(f=>Math.log(-Math.log(1-f)));
 let showRank3=false,showFit=false,showReadout=false;
 const xr=[Math.floor(Math.log10(t[0])*2)/2*Math.LN10-0.2,Math.ceil(Math.log10(t[n-1])*2)/2*Math.LN10+0.2];
 const C=makeCanvas(sim,680,420),ctx=C.ctx;const P=plotArea(ctx,70,20,420,340,xr,[Math.log(-Math.log(0.99)),Math.log(-Math.log(0.01))]);
 let L=[{x:xr[0]+0.25*(xr[1]-xr[0]),y:-3},{x:xr[0]+0.75*(xr[1]-xr[0]),y:-2.2}];let hov=null;
 const line=()=>{const m=(L[1].y-L[0].y)/(L[1].x-L[0].x);return{beta:m,eta:Math.exp(L[0].x-L[0].y/m)};};
 const tbl=el('div',{style:'margin-top:6px'});
 function table(){tbl.innerHTML='<table class="dt"><tr><th>i</th>'+t.map((_,i)=>`<td>${i+1}</td>`).join('')+'</tr><tr><th>t (h)</th>'+t.map(v=>`<td>${v}</td>`).join('')+'</tr><tr><th>F<sub>i</sub> median rank</th>'+Fr.map((f,i)=>`<td>${i===2&&!showRank3?'<b style="color:#ffb74d">?</b>':fmt(f,3)}</td>`).join('')+'</tr></table>';}
 function draw(){C.clear();const Fticks=[0.01,0.02,0.05,0.1,0.2,0.3,0.5,0.632,0.8,0.9,0.95,0.99];
  const xt=[];for(let d=Math.floor(xr[0]/Math.LN10);d<=Math.ceil(xr[1]/Math.LN10);d++)for(const mm of[1,2,5])if(Math.log(mm*10**d)>=xr[0]&&Math.log(mm*10**d)<=xr[1])xt.push(Math.log(mm*10**d));
  P.axes('time t (h, log scale)','unreliability F (%)',{xt,xf:v=>fmt(Math.exp(v),0),yt:Fticks.map(f=>Math.log(-Math.log(1-f))),yf:v=>fmt(100*(1-Math.exp(-Math.exp(v))),1),yoff:46});
  ctx.strokeStyle='#ffd54f66';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(P.x,P.Y(0));ctx.lineTo(P.x+P.w,P.Y(0));ctx.stroke();ctx.setLineDash([]);txt(ctx,'63.2 %',P.x+P.w+4,P.Y(0)+4,'#ffd54f','11px system-ui');
  P.clip();
  if(showFit){const f=x=>fit.beta*(x-Math.log(fit.eta));P.line(f,xr[0],xr[1],'#66bb6a',1.5,2,[6,4]);}
  const m=(L[1].y-L[0].y)/(L[1].x-L[0].x);ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(P.X(xr[0]),P.Y(L[0].y+m*(xr[0]-L[0].x)));ctx.lineTo(P.X(xr[1]),P.Y(L[0].y+m*(xr[1]-L[0].x)));ctx.stroke();
  L.forEach(p=>dot(ctx,P.X(p.x),P.Y(p.y),8,'#4fc3f7','#fff'));
  X.forEach((x,i)=>{if(i===2&&!showRank3)return;dot(ctx,P.X(x),P.Y(Y[i]),5,'#ffb74d','#0c111b');});
  ctx.restore();
  const lx=505;txt(ctx,`n = ${n} failures`,lx,40,'#e6ebf5','bold 12px system-ui');txt(ctx,'● data (median ranks)',lx,62,'#ffb74d');txt(ctx,'━ your line (drag handles)',lx,82,'#4fc3f7');if(showFit)txt(ctx,'┅ least-squares fit',lx,102,'#66bb6a');
  if(showReadout){const l=line();txt(ctx,`your line: β = ${fmt(l.beta,2)}`,lx,135,'#4fc3f7','bold 12px system-ui');txt(ctx,`η = ${fmt(l.eta,0)} h`,lx+66,153,'#4fc3f7','bold 12px system-ui');}
  if(!showRank3)txt(ctx,'(point 3 appears once its rank is known)',lx,190,'#9aa6bf','10.5px system-ui');
  if(hov&&P.inside(hov)){const tt=Math.exp(P.iX(hov.x)),FF=1-Math.exp(-Math.exp(P.iY(hov.y)));const lab=`t=${fmt(tt,0)} h, F=${fmt(100*FF,1)} %`;ctx.fillStyle='#000c';ctx.fillRect(hov.x+8,hov.y-24,lab.length*6.4,18);txt(ctx,lab,hov.x+12,hov.y-11,'#ffd54f','11.5px system-ui');}}
 let dk=-1;C.hover=p=>{hov=p;draw();};
 C.drag(p=>{dk=-1;L.forEach((q,k)=>{if(Math.hypot(p.x-P.X(q.x),p.y-P.Y(q.y))<14)dk=k;});if(dk<0)return false;},p=>{hov=p;const nx=clamp(P.iX(p.x),xr[0],xr[1]),ny=clamp(P.iY(p.y),-4.6,1.5);const o=L[1-dk];if(Math.abs(nx-o.x)<0.05)return;L[dk]={x:nx,y:ny};draw();});
 sim.appendChild(tbl);table();draw();
 const catTxt={inf:'β < 1: infant mortality (decreasing failure rate)',rand:'β ≈ 1: random failures (constant failure rate)',wear:'β > 1: wear-out (increasing failure rate)'};
 return{tasks:[
  numTask(`Compute the <b>median rank F₃</b> of the 3rd failure (n = ${n}) with Bernard's approximation.`,Fr[2],{abs:0.002,tol:0,dec:4,explain:`F₃ = (3 − 0.3)/(${n} + 0.4) = ${fmt(Fr[2],4)}. Median ranks avoid F = 0 or 1 at the ends of the sample.`,onDone:()=>{showRank3=true;table();draw();}}),
  {type:'action',q:'Drag the two blue handles to fit a <b>straight line through the data points</b> (by eye, like on Weibull paper). Submit when happy.',btn:'Submit my fit',
   check:()=>{const l=line();const eb=Math.abs(l.beta-fit.beta)/fit.beta,ee=Math.abs(l.eta-fit.eta)/fit.eta;const ok=eb<=0.2&&ee<=0.12;
    return{ok,msg:ok?`Good fit! Your β = ${fmt(l.beta,2)} (LSQ ${fmt(fit.beta,2)}), η = ${fmt(l.eta,0)} h (LSQ ${fmt(fit.eta,0)} h).`:`Your line deviates too much (slope ${fmt(100*eb,0)} %, η ${fmt(100*ee,0)} % off the least-squares fit). Balance the points on both sides of the line.`};},
   onDone:()=>{showFit=true;draw();},reveal:'The green dashed least-squares line is shown now.',explain:'Rank regression (least squares on the linearised plot) is the standard analytic version of the eye-fit.'},
  numTask('Read the <b>shape parameter β</b> from the slope of the fitted (green) line. (Hover the plot for t and F readouts; slope = Δ ln(−ln(1−F)) / Δ ln t.)',fit.beta,{tol:0.12,dec:2,explain:`β ≈ ${fmt(fit.beta,2)} (true population value used to simulate: ${beta0}). With only ${n} points, β is uncertain by easily ±30 % – confidence bounds matter!`}),
  numTask('Read the <b>characteristic life η</b> (where the line crosses F = 63.2 %).',fit.eta,{unit:'h',tol:0.08,dec:0,explain:`η ≈ ${fmt(fit.eta,0)} h. At t = η, F = 1 − e⁻¹ = 63.2 % regardless of β.`,onDone:()=>{showReadout=true;draw();}}),
  {type:'choice',q:'What failure behaviour does this β indicate?',opts:['inf','rand','wear'].map(c=>({t:catTxt[c],ok:c===cat,why:`β ≈ ${fmt(fit.beta,2)}.`})),explain:'Bathtub curve: early failures (β<1) → useful-life random failures (β≈1) → wear-out (β>1).'},
  {type:'choice',q:'For which β does <b>scheduled preventive replacement</b> of a still-working part reduce failures?',opts:[
   {t:'Only β > 1 (wear-out): the failure rate increases with age',ok:true,why:'Replacing an aged part with a new one lowers the hazard only if the hazard increases with age.'},
   {t:'β < 1: replacing removes defects',why:'With β < 1 a new part is MORE likely to fail than a run-in one – replacement increases failures (burn-in/screening is the remedy).'},
   {t:'β = 1: random failures are prevented by maintenance',why:'Constant hazard: an old part is as good as new; replacement wastes money.'},
   {t:'Any β – replacement always helps',why:'Only for an increasing hazard.'}]}
 ]};}});

defLevel({id:'w3l2',world:3,title:'Reliability & B10 Life',short:'R(t), hazard rate, B-lives, MTTF and series systems',
concept:`<div class="formula">R(t) = exp[−(t/η)<sup>β</sup>] &nbsp;&nbsp; f(t) = (β/η)(t/η)<sup>β−1</sup>·e<sup>−(t/η)<sup>β</sup></sup> &nbsp;&nbsp; h(t) = f/R = (β/η)(t/η)<sup>β−1</sup></div>
<p><b>B<sub>p</sub> life</b>: time by which p % of the population has failed (bearings: B10 = L10):</p>
<div class="formula">B<sub>p</sub> = η·[−ln(1 − p/100)]<sup>1/β</sup> &nbsp;&nbsp; e.g. B10 = η·(0.10536)<sup>1/β</sup></div>
<div class="formula">MTTF = η·Γ(1 + 1/β)</div>
<p><b>Series system</b> (all k components must survive): R<sub>sys</sub> = Π R<sub>i</sub> = R<sup>k</sup> for identical parts. Parallel (redundant): R<sub>sys</sub> = 1 − Π(1 − R<sub>i</sub>).</p>
<p class="mut small">Γ(1.5) = 0.8862, Γ(1.333) = 0.8930, Γ(1.25) = 0.9064, Γ(1.4) = 0.8873, Γ(1.667) = 0.9027, Γ(2) = 1.</p>`,
takeaway:'B10 is far below η for small β; series systems are weaker than their weakest component.',
build(sim){
 const beta=pick([1.5,2,2.5,3,0.8,1.2]);const eta=Math.round(rnd(1000,8000)/100)*100;const t0=Math.round(eta*rnd(0.2,0.7)/50)*50;
 const R=t=>Math.exp(-Math.pow(t/eta,beta)),f=t=>beta/eta*Math.pow(t/eta,beta-1)*R(t),hz=t=>beta/eta*Math.pow(t/eta,beta-1);
 const B10=eta*Math.pow(-Math.log(0.9),1/beta),mttf=eta*gammaFn(1+1/beta);const target=pick([0.95,0.98,0.9]);const tT=eta*Math.pow(-Math.log(target),1/beta);const k=pick([3,4,5,6]);
 let tc=0;
 sim.appendChild(el('div',{class:'small mut'},`Component life: Weibull <b style="color:#e6ebf5">β = ${beta}, η = ${eta} h</b>`));
 const C=makeCanvas(sim,680,400),ctx=C.ctx;const tm=eta*2.2;
 const PR=plotArea(ctx,60,20,330,330,[0,tm],[0,1.05]),PF=plotArea(ctx,460,20,200,140,[0,tm],[0,Math.max(...[...Array(80)].map((_,i)=>f(tm*(i+0.5)/80)))*1.15]);
 const hmax=Math.min(hz(tm),hz(tm*0.02)*1.0+hz(tm));const PH=plotArea(ctx,460,215,200,135,[0,tm],[0,Math.max(hz(tm),hz(tm*0.03),beta/eta*1.2)]);
 function draw(){C.clear();PR.axes('t (h)','R(t)',{nx:4,ny:5});PR.line(R,0,tm,'#66bb6a',2.5);
  if(showB){ctx.setLineDash([4,4]);ctx.strokeStyle='#ffb74d';ctx.beginPath();ctx.moveTo(PR.X(0),PR.Y(0.9));ctx.lineTo(PR.X(B10),PR.Y(0.9));ctx.lineTo(PR.X(B10),PR.Y(0));ctx.stroke();ctx.setLineDash([]);txt(ctx,'B10',PR.X(B10)+4,PR.Y(0.05),'#ffb74d','bold 11px system-ui');}
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(PR.X(tc),PR.Y(0));ctx.lineTo(PR.X(tc),PR.Y(1.05));ctx.stroke();dot(ctx,PR.X(tc),PR.Y(R(tc)),5,'#4fc3f7','#fff');
  txt(ctx,`t = ${fmt(tc,0)} h`,PR.X(tc)+(tc>tm*0.6?-6:6),PR.y+16,'#4fc3f7','12px system-ui',tc>tm*0.6?'right':'left');txt(ctx,`R = ${fmt(R(tc),4)}`,PR.X(tc)+(tc>tm*0.6?-6:6),PR.y+32,'#4fc3f7','bold 12px system-ui',tc>tm*0.6?'right':'left');
  PF.axes(null,'f(t)',{nx:3,ny:2,yf:v=>v.toExponential(0),yoff:44});PF.line(f,tm*0.002,tm,'#ba68c8',2);txt(ctx,'pdf',PF.x+PF.w-4,PF.y+14,'#ba68c8','11px system-ui','right');
  PH.axes('t (h)','h(t)',{nx:3,ny:2,yf:v=>v.toExponential(0),yoff:44});PH.clip();PH.line(hz,tm*0.002,tm,'#ef5350',2);ctx.restore();txt(ctx,beta>1?'hazard ↑ wear-out':beta<1?'hazard ↓ infant mortality':'constant hazard',PH.x+PH.w-4,PH.y+14,'#ef5350','11px system-ui','right');}
 let showB=false;
 const sl=slider(sim,'time t (h)',0,tm,tm/1000,0,v=>{tc=v;draw();},v=>fmt(v,0)+' h');draw();
 return{tasks:[
  numTask(`What is the <b>reliability R(t)</b> at t = ${t0} h?`,R(t0),{abs:0.005,tol:0,dec:4,explain:`R = exp[−(${t0}/${eta})<sup>${beta}</sup>] = ${fmt(R(t0),4)}. You can verify with the time slider.`}),
  numTask('Compute the <b>B10 life</b>.',B10,{unit:'h',tol:0.03,dec:0,explain:`B10 = ${eta}·(−ln 0.9)<sup>1/${beta}</sup> = ${fmt(B10,0)} h = ${fmt(100*B10/eta,1)} % of η.`,onDone:()=>{showB=true;draw();}}),
  {type:'action',q:`A customer requires <b>R = ${target}</b>. Drag the time slider to the <b>longest mission time</b> that still achieves it, then submit.`,btn:'Submit mission time',
   check:()=>{const ok=Math.abs(R(tc)-target)<=0.004;return{ok,msg:ok?`t ≈ ${fmt(tc,0)} h (exact ${fmt(tT,0)} h) – this is the B${fmt(100*(1-target),0)} life.`:`At t = ${fmt(tc,0)} h, R = ${fmt(R(tc),4)}. ${R(tc)>target?'You can go longer.':'Too long – reliability is below target.'}`};},reveal:()=>`t = ${fmt(tT,0)} h`},
  numTask('Compute the <b>mean time to failure</b> MTTF = η·Γ(1 + 1/β).',mttf,{unit:'h',tol:0.03,dec:0,explain:`Γ(1 + 1/${beta}) = ${fmt(gammaFn(1+1/beta),4)} → MTTF = ${fmt(mttf,0)} h. Note R(MTTF) = ${fmt(R(mttf),3)} – the "mean life" is not a safe life!`,hint:'Use the Γ values on the concept card (or Γ(x) via a calculator).'}),
  numTask(`A machine uses <b>${k} identical components in series</b>. What is the system reliability at t = ${t0} h?`,Math.pow(R(t0),k),{abs:0.005,tol:0,dec:4,explain:`R<sub>sys</sub> = R(t)<sup>${k}</sup> = ${fmt(R(t0),4)}<sup>${k}</sup> = ${fmt(Math.pow(R(t0),k),4)}. For Weibull parts in series: η<sub>sys</sub> = η·k<sup>−1/β</sup>, same β.`})
 ]};}});

defLevel({id:'w3l3',world:3,title:'Stress–Strength Interference',short:'Overlapping load & strength distributions; reach a reliability target cheaply',
concept:`<p>Both the applied stress L and the strength S scatter. Failure occurs when L &gt; S. For independent normal distributions the margin M = S − L is normal too:</p>
<div class="formula">μ<sub>M</sub> = μ<sub>S</sub> − μ<sub>L</sub> &nbsp;&nbsp; σ<sub>M</sub> = √(σ<sub>S</sub>² + σ<sub>L</sub>²)</div>
<div class="formula">z = (μ<sub>S</sub> − μ<sub>L</sub>) / √(σ<sub>S</sub>² + σ<sub>L</sub>²) &nbsp;&nbsp;&nbsp; R = Φ(z) &nbsp;&nbsp; P<sub>f</sub> = 1 − Φ(z)</div>
<p>Handy values: Φ(1.28) = 0.90, Φ(1.645) = 0.95, Φ(2.326) = 0.99, Φ(3.09) = 0.999, Φ(3.72) = 0.9999.</p>
<p>The <b>central safety factor</b> μ<sub>S</sub>/μ<sub>L</sub> alone says little: the same factor can give 99.99 % or 90 % reliability depending on the scatter. Reducing scatter (process control, inspection, better load knowledge) can be cheaper than adding strength.</p>`,
takeaway:'z = (μS − μL)/√(σS² + σL²) — reliability depends on both margin and scatter.',
build(sim){
 const muL=round5(rnd(200,350)),sL=round5(rnd(15,40)),Rt=pick([0.99,0.999,0.9999]);const zt=PhiInv(Rt);
 const cost=(m,s)=>0.1*m+400/s;
 let best=Infinity,bm,bs;for(let m=muL;m<=muL+400;m+=5)for(let s=8;s<=60;s++){if((m-muL)/Math.hypot(s,sL)>=zt&&cost(m,s)<best){best=cost(m,s);bm=m;bs=s;}}
 const m0=muL+round5(rnd(1.2,2.0)*sL),s0=rint(20,45);const z0=(m0-muL)/Math.hypot(s0,sL);
 let S={m:m0,s:s0};
 sim.appendChild(el('div',{class:'small mut'},`Load stress: <b style="color:#e6ebf5">μ<sub>L</sub> = ${muL} MPa, σ<sub>L</sub> = ${sL} MPa</b> (fixed by the application). Strength: adjustable. Part cost = 0.10 €/MPa · μ<sub>S</sub> + 400/σ<sub>S</sub> € (tight scatter needs costly process control).`));
 const C=makeCanvas(sim,680,360),ctx=C.ctx;const info=el('div',{class:'small',style:'margin-top:6px'});sim.appendChild(info);
 const npdf=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
 function draw(){C.clear();const xmax=Math.max(muL+4*sL,S.m+4*S.s,muL+450),xmin=Math.max(0,muL-4*sL);const ym=Math.max(npdf(0,0,sL),npdf(0,0,S.s))*1.15;
  const P=plotArea(ctx,60,20,600,280,[xmin,xmax],[0,ym]);P.axes('stress / strength (MPa)','probability density',{ny:4,yf:v=>v.toExponential(0),yoff:46});
  ctx.beginPath();ctx.moveTo(P.X(xmin),P.Y(0));for(let i=0;i<=400;i++){const x=xmin+(xmax-xmin)*i/400;ctx.lineTo(P.X(x),P.Y(Math.min(npdf(x,muL,sL),npdf(x,S.m,S.s))));}ctx.lineTo(P.X(xmax),P.Y(0));ctx.closePath();ctx.fillStyle='#ef535088';ctx.fill();
  P.line(x=>npdf(x,muL,sL),xmin,xmax,'#ffb74d',2.5);P.line(x=>npdf(x,S.m,S.s),xmin,xmax,'#4fc3f7',2.5);
  txt(ctx,'Load L',P.X(muL),P.Y(npdf(muL,muL,sL))-6,'#ffb74d','bold 12px system-ui','center');txt(ctx,'Strength S',P.X(S.m),P.Y(npdf(S.m,S.m,S.s))-6,'#4fc3f7','bold 12px system-ui','center');
  txt(ctx,'red: interference zone (not the failure probability itself!)',P.x+P.w,P.y+14,'#ef5350','11px system-ui','right');
  const z=(S.m-muL)/Math.hypot(S.s,sL),R=Phi(z),c=cost(S.m,S.s);
  info.innerHTML=`z = <b>${fmt(z,3)}</b> · R = <b>${R>0.99999?fmt(R,7):fmt(R,5)}</b> · P<sub>f</sub> = ${fmt((1-R)*1e6,1)} ppm · central SF μ<sub>S</sub>/μ<sub>L</sub> = ${fmt(S.m/muL,2)} · cost = <b>${fmt(c,2)} €</b>`;}
 slider(sim,'μS strength mean (MPa)',muL,muL+400,5,m0,v=>{S.m=v;draw();},v=>v+' MPa');slider(sim,'σS strength std (MPa)',8,60,1,s0,v=>{S.s=v;draw();},v=>v+' MPa');
 draw();
 return{tasks:[
  numTask(`For the <b>initial design</b> (μ<sub>S</sub> = ${m0}, σ<sub>S</sub> = ${s0} MPa): compute the safety index <b>z</b>.`,z0,{tol:0.02,dec:3,explain:`z = (${m0} − ${muL})/√(${s0}² + ${sL}²) = ${m0-muL}/${fmt(Math.hypot(s0,sL),2)} = ${fmt(z0,3)}.`}),
  numTask('What is the corresponding <b>reliability R</b> = Φ(z)?',Phi(z0),{abs:0.003,tol:0,dec:4,explain:`Φ(${fmt(z0,2)}) = ${fmt(Phi(z0),4)} → ${fmt((1-Phi(z0))*100,2)} % of parts fail – even though μ<sub>S</sub>/μ<sub>L</sub> = ${fmt(m0/muL,2)}.`}),
  {type:'action',q:`Design task: reach <b>R ≥ ${Rt}</b> (z ≥ ${fmt(zt,3)}) at <b>minimum cost</b> (within 3 % of the optimum). Use both sliders, then submit.`,btn:'Submit design',
   check:()=>{const z=(S.m-muL)/Math.hypot(S.s,sL),c=cost(S.m,S.s);if(z<zt-1e-9)return{ok:false,msg:`R = ${fmt(Phi(z),5)} < ${Rt}. Increase the margin or reduce scatter.`};
    if(c>best*1.03)return{ok:false,msg:`Reliable, but ${fmt(c,2)} € is more than 3 % above the achievable minimum. Try trading strength against scatter.`};return{ok:true,msg:`Cost ${fmt(c,2)} € (optimum ≈ ${fmt(best,2)} € at μ<sub>S</sub> ≈ ${bm}, σ<sub>S</sub> ≈ ${bs} MPa).`};},
   reveal:()=>`optimum ≈ ${fmt(best,2)} € at μ<sub>S</sub> = ${bm}, σ<sub>S</sub> = ${bs} MPa`,explain:'Both very low scatter (expensive control) and huge margins (expensive material) are costly – the optimum balances them.'},
  {type:'choice',q:'Two designs both have a central safety factor μ<sub>S</sub>/μ<sub>L</sub> = 1.5. What can you say about their reliability?',opts:[
   {t:'Nothing definite – it depends on the scatter of load and strength (z)',ok:true,why:'With small σ the reliability may be 0.99999; with large σ maybe only 0.9. The safety factor hides the statistics.'},
   {t:'Both have the same reliability',why:'Only the mean ratio is the same; z also depends on σ<sub>S</sub> and σ<sub>L</sub>.'},
   {t:'Both are 100 % reliable since SF > 1',why:'Distributions overlap – failures are possible whenever the tails interfere.'},
   {t:'Reliability = 1 − 1/SF = 33 %',why:'No such relation exists.'}]}
 ]};}});
defLevel({id:'w3l4',world:3,title:'Scatter, Confidence & Allowables',short:'Log-normal fatigue data, confidence intervals, B-basis, outliers',
concept:`<p>Fatigue lives at one stress level scatter over a factor of 3–10. log₁₀N is usually close to <b>normal</b> → N is <b>log-normal</b> (positive, right-skewed, multiplicative effects). So do statistics on x = log₁₀N.</p>
<div class="formula">x̄ = Σx<sub>i</sub>/n &nbsp;&nbsp; s = √[Σ(x<sub>i</sub> − x̄)²/(n − 1)]</div>
<p><b>Confidence interval of the mean</b> (95 %, two-sided):</p>
<div class="formula">x̄ ± t<sub>0.975, n−1</sub> · s/√n &nbsp;&nbsp; (n = 10: t = 2.262)</div>
<p><b>Design allowables</b> cover the population, not just the mean (one-sided tolerance limits):</p>
<div class="formula">B-basis: 90 % of the population exceeds it, with 95 % confidence → x<sub>B</sub> = x̄ − k<sub>B</sub>·s (n = 10: k<sub>B</sub> = 2.355)<br>A-basis: 99 % / 95 % → x<sub>A</sub> = x̄ − k<sub>A</sub>·s (n = 10: k<sub>A</sub> = 3.981)</div>
<p><b>Outliers</b> – Grubbs' test: G = max|x<sub>i</sub> − x̄|/s; for n = 10, α = 0.05 (two-sided) G<sub>crit</sub> = 2.290. A statistical outlier is a <i>question</i>, not a licence to delete: inspect the fracture surface (defect? wrong test?) first.</p>`,
takeaway:'Work in log-life; the mean ± CI describes the average, tolerance-based A/B allowables protect the population.',
build(sim){
 const n=10,mu=rnd(5.0,5.8),sd=rnd(0.12,0.25);let x=[...Array(n)].map(()=>mu+sd*randn());const out=Math.random()<0.5;
 if(out)x[rint(0,n-1)]=mu-sd*rnd(4.2,5.5);
 x=x.map(v=>Math.round(v*1000)/1000);let xb,s,G,gi;
 const recalc=()=>{xb=mean(x);s=stdev(x);gi=0;x.forEach((v,i)=>{if(Math.abs(v-xb)>Math.abs(x[gi]-xb))gi=i;});G=Math.abs(x[gi]-xb)/s;};recalc();
 if(!out&&G>2.2){/* keep clean data clearly non-outlier */const k=gi;x[k]=Math.round((xb+(x[k]-xb)*0.6)*1000)/1000;recalc();}
 const isOut=G>2.290;const tv=2.262,kB=2.355;const ciL=xb-tv*s/Math.sqrt(n),ciU=xb+tv*s/Math.sqrt(n),xB=xb-kB*s;
 let showCI=false,showB=false,showOut=false;
 sim.appendChild(el('div',{class:'small mut'},`Constant-amplitude fatigue test, ${n} specimens at the same stress level. Statistics are done on x = log₁₀N.`));
 const C=makeCanvas(sim,680,330),ctx=C.ctx;
 const tb=el('div',{style:'margin-top:6px'});sim.appendChild(tb);
 tb.innerHTML='<table class="dt"><tr><th>#</th>'+x.map((_,i)=>`<td>${i+1}</td>`).join('')+'</tr><tr><th>N (cycles)</th>'+x.map(v=>`<td>${fmt(Math.pow(10,v),0)}</td>`).join('')+'</tr><tr><th>x = log₁₀N</th>'+x.map(v=>`<td>${v.toFixed(3)}</td>`).join('')+`</tr></table><div class="small" style="margin-top:6px">Sample statistics of x: <b>x̄ = ${xb.toFixed(4)}</b>, <b>s = ${s.toFixed(4)}</b> (n = ${n})</div>`;
 function draw(){C.clear();const lo=Math.min(...x,xb-4*s)-0.1,hi=Math.max(...x,xb+3.5*s)+0.1;const P=plotArea(ctx,60,20,600,240,[lo,hi],[0,1/(s*Math.sqrt(2*Math.PI))*1.25]);
  P.axes('x = log₁₀ N','density',{ny:3,yoff:40});
  P.line(v=>Math.exp(-0.5*((v-xb)/s)**2)/(s*Math.sqrt(2*Math.PI)),lo,hi,'#4fc3f7',2.2);
  if(showCI){ctx.fillStyle='#66bb6a33';ctx.fillRect(P.X(ciL),P.y,P.X(ciU)-P.X(ciL),P.h);txt(ctx,'95 % CI of mean',P.X(ciU)+4,P.y+14,'#66bb6a','11px system-ui');}
  if(showB){ctx.strokeStyle='#ef5350';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P.X(xB),P.y);ctx.lineTo(P.X(xB),P.y+P.h);ctx.stroke();txt(ctx,'B-basis',P.X(xB)+4,P.y+30,'#ef5350','bold 11px system-ui');}
  x.forEach((v,i)=>dot(ctx,P.X(v),P.Y(0)-10-((i*7)%4)*9,6,i===gi&&isOut&&showOut?'#ef5350':'#ffb74d','#0c111b'));
  ctx.strokeStyle='#ffffff88';ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(P.X(xb),P.y);ctx.lineTo(P.X(xb),P.y+P.h);ctx.stroke();ctx.setLineDash([]);txt(ctx,'x̄',P.X(xb)+4,P.y+48,'#fff');
  txt(ctx,`N axis: 10^x  (x̄ → ${fmt(Math.pow(10,xb),0)} cycles)`,P.x+P.w,P.y+P.h+44,'#9aa6bf','11px system-ui','right');}
 draw();
 return{tasks:[
  numTask('Compute the <b>lower bound of the 95 % confidence interval</b> of the mean log-life x̄.',ciL,{abs:0.01,tol:0,dec:3,explain:`x̄ − t·s/√n = ${xb.toFixed(4)} − 2.262·${s.toFixed(4)}/√10 = ${ciL.toFixed(3)} → ${fmt(Math.pow(10,ciL),0)} cycles. This bounds the <i>mean</i> life only.`,onDone:()=>{showCI=true;draw();}}),
  numTask('Compute the <b>B-basis allowable life</b> in cycles: N<sub>B</sub> = 10^(x̄ − 2.355·s).',Math.pow(10,xB),{unit:'cycles',logtol:0.01,explain:`x<sub>B</sub> = ${xb.toFixed(4)} − 2.355·${s.toFixed(4)} = ${xB.toFixed(3)} → N<sub>B</sub> = ${fmt(Math.pow(10,xB),0)} cycles – a factor ${fmt(Math.pow(10,xb-xB),1)} below the median life. (Tolerance ±2.3 %)`,onDone:()=>{showB=true;draw();}}),
  {type:'choice',q:'What exactly does a <b>B-basis</b> value guarantee?',opts:[
   {t:'At least 90 % of the population exceeds it, stated with 95 % confidence',ok:true,why:'Two percentages: population coverage (90 %) and confidence in the estimate from a finite sample (95 %). A-basis: 99 %/95 %.'},
   {t:'The mean value with 95 % confidence',why:'That is a confidence bound on the mean, not a tolerance bound on the population.'},
   {t:'90 % of the specimens in this test exceeded it',why:'It is about the population, inferred from the sample including sampling uncertainty.'},
   {t:'10 % probability of failure at the mean life',why:'At the median life 50 % have failed.'}]},
  numTask('Grubbs test: compute <b>G = max|x<sub>i</sub> − x̄| / s</b> for the most extreme specimen.',G,{tol:0.02,dec:3,onDone:()=>{showOut=true;draw();},explain:`Most extreme: specimen #${gi+1}, x = ${x[gi].toFixed(3)} → G = ${fmt(Math.abs(x[gi]-xb),4)}/${s.toFixed(4)} = ${fmt(G,3)}.`}),
  {type:'choice',q:`With G<sub>crit</sub> = 2.290 (n = 10, α = 0.05), is specimen #${gi+1} a statistical outlier, and what do you do?`,opts:[
   {t:'Yes (G > G_crit) – investigate the specimen (fractography, test log) before deciding to exclude it',ok:isOut,why:`G = ${fmt(G,3)}${isOut?' > ':' < '}2.290.`},
   {t:'No (G ≤ G_crit) – keep it; the scatter is consistent with a normal sample',ok:!isOut,why:`G = ${fmt(G,3)}${isOut?' > ':' < '}2.290.`},
   {t:'Yes – delete it immediately to get a nicer allowable',ok:false,why:'Never delete without a physical reason: an early failure may reveal a real defect population (e.g. inclusions) that also exists in service parts!'}],
   explain:isOut?'An early failure 4–5 s below the mean often points to a different failure mechanism (e.g. pore or inclusion initiation). If it is real, the "outlier" may be the most important data point.':'Apparent extremes are expected in small samples; only a test result plus a physical explanation justifies exclusion.'},
  {type:'choice',q:'Why are fatigue lives usually analysed as <b>log-normal</b> (or Weibull) rather than normal?',opts:[
   {t:'Lives are positive and right-skewed, spreading over decades; log₁₀N is approximately normal',ok:true,why:'Multiplicative scatter sources (defect size, surface, microstructure) produce log-normal behaviour; a normal fit could even predict negative lives.'},
   {t:'Because the normal distribution has no standard deviation',why:'It does – but symmetric scatter does not match fatigue data.'},
   {t:'Because log-normal always gives longer lives',why:'The choice is about fitting the data shape, not about optimism.'},
   {t:'Fatigue lives are discrete counts',why:'Cycle counts are large; discreteness is irrelevant.'}]}
 ]};}});

defLevel({id:'w3l5',world:3,title:'Root Cause Toolbox',short:'Pareto chart, fishbone (Ishikawa 6M), FMEA RPN & severity',
concept:`<p><b>Pareto principle</b>: ~80 % of the problems come from ~20 % of the causes. Sort causes by frequency (or cost), plot bars in descending order with a cumulative-% line, attack the "vital few" first.</p>
<p><b>Fishbone (Ishikawa) diagram</b>: brainstorm potential causes of an effect, grouped by the <b>6M</b>: Man (people), Machine, Method, Material, Measurement, Mother Nature (environment). Then verify the likely ones with data (5 Whys, tests).</p>
<p><b>FMEA</b> (Failure Mode and Effects Analysis) rates each failure mode 1–10:</p>
<div class="formula">RPN = S × O × D &nbsp;&nbsp; (Severity × Occurrence × Detection; high D = hard to detect)</div>

/* ===================== GLOSSARY ===================== */
const GLOSSARY=`
<h3 class="secttl" style="color:var(--w1)">🏗 Strength theory</h3><div class="gloss">
<div class="card"><h3>Stress, strain, Hooke</h3><div class="formula">σ = F/A₀ &nbsp; ε = ΔL/L₀ &nbsp; σ = Eε &nbsp; G = E/(2(1+ν))</div><p class="small">Sy: 0.2 % offset yield; Su: max engineering stress, necking starts there. Steel E ≈ 200–210 GPa, Al ≈ 70 GPa, Ti ≈ 110 GPa.</p></div>
<div class="card"><h3>Stress transformation / Mohr</h3><div class="formula">C = (σx+σy)/2 &nbsp; R = √(((σx−σy)/2)² + τxy²)<br>σ₁,₂ = C ± R &nbsp; tan2θp = 2τxy/(σx−σy)<br>τabs = max(|σ₁−σ₂|,|σ₁|,|σ₂|)/2 (σ₃=0)</div></div>
<div class="card"><h3>Failure criteria</h3><div class="formula">von Mises: σvM = √(σA² − σAσB + σB²)<br>3-D: σvM = √(½[(σ₁−σ₂)²+(σ₂−σ₃)²+(σ₃−σ₁)²])<br>Tresca: σ₁ − σ₃ = Sy/n<br>Coulomb–Mohr: σ₁/Sut − σ₃/Suc = 1/n<br>Rankine: σ₁ = Sut, σ₃ = −Suc</div></div>
<div class="card"><h3>Beams</h3><div class="formula">dM/dx = V, dV/dx = −q &nbsp; σ = My/I, σmax = M/W<br>SS + P at a: Mmax = Pa(L−a)/L (PL/4 midspan)<br>Cantilever + P at tip: Mmax = PL<br>I_rect = bh³/12, W = bh²/6 &nbsp; I_round = πD⁴/64, W = πD³/32<br>δ_cantilever = PL³/(3EI) &nbsp; δ_SS,mid = PL³/(48EI)</div></div>
<div class="card"><h3>Notches & fatigue</h3><div class="formula">σmax = Kt σnom &nbsp; Kf = 1 + q(Kt − 1)<br>Hole in plate (net): Kt ≈ 3 − 3.13r + 3.66r² − 1.53r³, r = d/W<br>σa = (σmax−σmin)/2, σm = (σmax+σmin)/2, R = σmin/σmax<br>Goodman: σa/Se + σm/Sut = 1/n<br>Gerber: nσa/Se + (nσm/Sut)² = 1<br>Soderberg: σa/Se + σm/Sy = 1/n<br>Basquin: S = aN^b, a = (0.9Sut)²/Se, b = −log(0.9Sut/Se)/3<br>Se' ≈ 0.5 Sut (steel, Sut ≤ 1400 MPa) × Marin factors</div></div></div>
<h3 class="secttl" style="color:var(--w2)">🔷 Finite element method</h3><div class="gloss">
<div class="card"><h3>Stiffness & assembly</h3><div class="formula">k⁽ᵉ⁾ = (EA/L)[1 −1; −1 1] &nbsp; K u = F<br>K = Σ (scatter k⁽ᵉ⁾ via connectivity)<br>Reactions: R = K_row · u</div><p class="small">K singular until all rigid-body modes are suppressed (3 in 2-D, 6 in 3-D).</p></div>
<div class="card"><h3>Shape functions</h3><div class="formula">Linear: N₁ = (1−ξ)/2, N₂ = (1+ξ)/2<br>Quadratic: N₁ = ξ(ξ−1)/2, N₂ = 1−ξ², N₃ = ξ(ξ+1)/2<br>u = Σ Nᵢuᵢ, ΣNᵢ = 1, ε = B u, K = ∫Bᵀ D B dV</div><p class="small">Q4 full integration locks in bending → use quadratic / reduced integration with hourglass control / incompatible modes.</p></div>
<div class="card"><h3>Convergence & singularities</h3><p class="small">Refine until the quantity of interest changes &lt; 2–5 %. Displacements converge faster than stresses; compatible elements are too stiff (lower bound). Singularities (sharp re-entrant corners, point loads/supports): σ ∝ r^(λ−1), 90° corner λ ≈ 0.544 → ×1.37 per halving.</p></div>
<div class="card"><h3>Modelling checklist</h3><p class="small">Units: mm–N–MPa–t–s (E_steel = 210 000, ρ = 7.85e−9) or m–N–Pa–kg–s. Symmetry planes: constrain the normal DOF only. Avoid over-constraint (Poisson). Distribute loads. Check reactions = loads. Free-free modal: 6 zero modes.</p></div>
<div class="card"><h3>Results</h3><p class="small">Averaged vs unaveraged: big differences = discretisation error. Never average across materials/parts. Ductile static: von Mises vs Sy. Brittle: σ₁ vs Sut. Fatigue: principal ranges/critical plane.</p></div></div>

<div class="card"><h3>Weibull</h3><div class="formula">F(t) = 1 − exp[−(t/η)^β] &nbsp; R = 1 − F<br>h(t) = (β/η)(t/η)^(β−1)<br>ln(−ln(1−F)) = β ln t − β ln η<br>Median rank: Fᵢ = (i−0.3)/(n+0.4)<br>Bp = η[−ln(1−p)]^(1/β) &nbsp; MTTF = ηΓ(1+1/β)</div><p class="small">β&lt;1 infant mortality · β≈1 random · β&gt;1 wear-out; F(η) = 63.2 %.</p></div>

const qNeuber=(r,sa)=>1/(1+sa/Math.sqrt(r));
const marinSe=(Sut,d)=>4.51*Math.pow(Sut,-0.265)*(d<=51?1.24*Math.pow(d,-0.107):1.51*Math.pow(d,-0.157))*0.5*Sut;
defCase({id:'c1',icon:'🔩',title:'The Broken Agitator Shaft',level:2,domains:['s','t'],inspired:'Eschede ICE 1998 (fatigue of rotating parts)',
teaser:'A mixer shaft snapped at its keyway days after a "harmless" impeller upgrade. The plant wants it running again by Monday.',
build(){
 const d=pick([50,55,60]),rpm=rint(6,12)*10,P=pick([5.5,7.5,11]);const Sut=625,Sy=530,Se=marinSe(Sut,d);const Kfs=2.0;
 const T=9550*P/rpm;const tau=16*T*1e3/(Math.PI*d**3);const smv=Math.sqrt(3)*Kfs*tau;const Z=Math.PI*d**3/32;
 const KtR={0.25:2.9,1:2.2,2.5:1.8};const saC45=0.36,sa42=0.18;const Kf=(r,s)=>1+qNeuber(r,s)*(KtR[r]-1);
 let M,sa,n,N,days,Mold;for(let k=0;k<400;k++){const nt=rnd(0.72,0.9);sa=(1/nt-smv/Sut)*Se/Kf(0.25,saC45);M=sa*Z/1e6;n=1/(Kf(0.25,saC45)*sa/Se+smv/Sut);
  const sar=Kf(0.25,saC45)*sa/(1-smv/Sut);const b=-Math.log10(0.9*Sut/Se)/3,a=(0.9*Sut)**2/Se;N=Math.pow(sar/a,1/b);days=N/(rpm*1440);if(days>=2&&days<=40)break;}
 M=Math.round(M*100)/100;sa=M*1e6/Z;const Kf0=Kf(0.25,saC45);n=1/(Kf0*sa/Se+smv/Sut);{const sar=Kf0*sa/(1-smv/Sut);const b=-Math.log10(0.9*Sut/Se)/3,a=(0.9*Sut)**2/Se;N=Math.pow(sar/a,1/b);}
 Mold=Math.round(M*rnd(0.5,0.6)*100)/100;const obsDays=Math.max(2,Math.round(N/(rpm*1440)*rnd(0.7,1.4)));
 const nOf=(r,mat,dd)=>{const Sx=mat==='42'?1000:625;const Sex=marinSe(Sx,dd);const kf=1+qNeuber(r,mat==='42'?sa42:saC45)*(KtR[r]-1);const s=M*1e6/(Math.PI*dd**3/32);const sm=Math.sqrt(3)*Kfs*16*T*1e3/(Math.PI*dd**3);return 1/(kf*s/Sex+sm/Sx);};
 const pk=[{k:'A',t:'New shaft to the same drawing (C45 / AISI 1045, sharp keyseat)',r:0.25,m:'45',d,cost:1,c:-2,tt:-2},{k:'B',t:'Same steel, keyseat with ground 2.5 mm corner radius',r:2.5,m:'45',d,cost:2,c:-5,tt:-5},{k:'C',t:'42CrMo4 Q&T (Sut 1000 MPa), same sharp keyseat',r:0.25,m:'42',d,cost:3,c:-8,tt:-6},{k:'D',t:'42CrMo4 Q&T + 2.5 mm keyseat radius',r:2.5,m:'42',d,cost:4,c:-10,tt:-8},{k:'E',t:`Increase keyway diameter to ${d+10} mm (new hub + impeller bore), C45, sharp keyseat`,r:0.25,m:'45',d:d+10,cost:8,c:-25,tt:-25}];
 pk.forEach(p=>p.n=nOf(p.r,p.m,p.d));const need=1.3;const pass=pk.filter(p=>p.n>=need);const cheapest=pass.length?pass.reduce((a,b)=>a.cost<b.cost?a:b):null;
 pk.forEach(p=>p.q=p===cheapest?1:p.n>=need?0.65:p.n>=1.1?0.35:0.05);
 const ntab=()=>tbl(pk.map(p=>[p.k+': '+p.t,fmt(p.n,2),'€'.repeat(p.cost)]),['Option','Goodman n','cost']);
 return{brief:{avatar:'👷‍♀️',who:'Marta Kowalski',role:'Plant manager, specialty chemicals',quote:`Mixer R-12 broke its shaft ${obsDays} days after we fitted the bigger impeller. I have a spare shaft from the same drawing in stock – can we just put it in and restart on Monday? Or was it a bad batch of steel?`,
  story:`<p>The agitator in reactor R-12 ran for six years without trouble. Process engineering then fitted a larger impeller to improve mixing. The shaft fractured at the <b>keyway of the gearbox output hub</b> after ${obsDays} days. The side load on the overhung impeller produces a bending moment that <b>rotates relative to the shaft</b>, while the motor torque is steady.</p>`,
  sketch:(c,W,H)=>{c.strokeStyle='#9aa6bf';c.lineWidth=2;c.strokeRect(220,70,200,160);c.fillStyle='#4fc3f722';c.fillRect(222,120,196,108);c.fillStyle='#56627e';c.fillRect(290,10,60,40);c.fillRect(300,50,40,22);txt(c,'motor + gearbox',360,30,'#9aa6bf','11px system-ui');
   c.fillStyle='#b0bec5';c.fillRect(314,72,12,140);c.fillStyle='#ffb74d';c.fillRect(280,205,80,8);c.fillRect(270,200,10,18);c.fillRect(360,200,10,18);txt(c,'new, larger impeller',380,212,'#ffb74d','11px system-ui');
   dot(c,320,80,9,null,'#ef5350');txt(c,'⚡ fracture at hub keyway',340,92,'#ef5350','bold 12px system-ui');arrow(c,250,190,300,190,'#4fc3f7',2);txt(c,'hydraulic side load F',160,186,'#4fc3f7','11px system-ui');
   txt(c,`shaft Ø${d} mm at keyway, ${rpm} rpm`,20,240,'#c9d2e6','12px system-ui');},
  data:tbl([['Shaft material (drawing)','AISI 1045 / C45 cold drawn, S<sub>ut</sub> = 625 MPa, S<sub>y</sub> = 530 MPa'],['Drive','P = '+P+' kW at '+rpm+' rpm (steady)'],['Bending moment at keyway','old impeller ≈ '+fmt(Mold,2)+' kN·m · <b>new impeller ≈ '+fmt(M,2)+' kN·m</b> (from vendor side-load data)'],['Design rule','fatigue safety factor n ≥ 1.3 for shafts with known loads']])},
 steps:[
  {type:'decide',title:'First move',q:'The broken shaft is lying on the workshop floor. What do you do first?',opts:[
   O('Secure both fracture halves (protect the surfaces), photograph them, and collect the operating history before anything else',1,'Evidence first. The fracture surface is the single most informative piece of data – and it is easily destroyed.',{t:-3}),
   O('Clean the fracture surfaces with a wire brush so the features are easier to see',0,'Brushing destroys beach marks, striations and origin features. Fractographers clean only with soft methods (solvents, replicas) – if at all.',{s:-10}),

   O('Send a sample to the lab for chemistry and hardness only',0.5,'Material checks are useful, but they skip the fracture surface, which tells you the failure mechanism.',{c:-5})],
   evidence:{h:'Fracture surface photo (sketch)',html:'Origin at the <b>keyseat corner</b>; smooth zone with curved <b>beach marks</b> covering ~85 % of the section; small rough final-fracture zone opposite the keyway; no necking, no 45° helix.',H:220,draw:(c,W,H)=>{const cx=320,cy=110,R=90;dot(c,cx,cy,R,'#3c4a62','#9aa6bf');c.fillStyle='#0c111b';c.fillRect(cx-14,cy-R-2,28,22);
    c.save();c.beginPath();c.arc(cx,cy,R-1,0,7);c.clip();for(let k=1;k<=7;k++){c.strokeStyle='#cfd8dc'+(k%2?'aa':'55');c.lineWidth=1.3;c.beginPath();c.arc(cx-14,cy-R+20,k*22,0.05*Math.PI,0.95*Math.PI);c.stroke();}
    c.fillStyle='#7a6a55';c.beginPath();c.arc(cx+15,cy+R-18,26,0,7);c.fill();c.restore();c.fillStyle='#0c111b';c.fillRect(cx-14,cy-R-2,28,22);dot(c,cx-14,cy-R+20,4,'#ef5350');txt(c,'origin',cx-70,cy-R+22,'#ef5350','11px system-ui');txt(c,'final fracture',cx+48,cy+R-6,'#ffb74d','11px system-ui');txt(c,'beach marks',cx+60,cy-20,'#cfd8dc','11px system-ui');}}},
  {type:'decide',title:'Mechanism',q:'Look at the fracture surface sketch now in the case file. What failure mechanism is this?',opts:[
   O('Fatigue under rotating bending, initiated at the keyseat corner (stress raiser); small final zone → moderate nominal stress',1,'Beach marks + a single origin at a notch + a small final-fracture zone are the textbook signature of fatigue at a modest nominal stress.'),
   O('Ductile overload in torsion',0.05,'Torsional overload of a ductile shaft gives a flat, smeared shear surface perpendicular to the axis with twisting – no beach marks.'),
   O('Brittle fracture from an impact',0.05,'Brittle fracture shows chevron/river marks over the whole surface and no progressive beach marks.'),
   O('Hydrogen embrittlement of the steel',0.15,'Possible in principle, but nothing here points to it (no intergranular facets, no plating or acid exposure), and beach marks show slow progressive growth.')]},
  {type:'request',title:'Data request',q:'Which additional information do you request? (Each request costs a little time/money.)',items:[
   R('Keyseat drawing and measured corner radius on the broken shaft',1,'Key: the local stress concentration controls fatigue initiation.'),R('Impeller side-load data / bending moment for old and new impeller',1,'The load change is the obvious suspect.'),R('Material certificate + hardness check of the broken shaft',1,'Rules out (or confirms) the "bad steel" hypothesis cheaply.'),R('Vibration and alignment records of the drive',0.5,'Useful: misalignment adds bending. Nice to have.'),R('Paint specification of the vessel',0,'Irrelevant to a shaft fracture.'),R('Names of the operators on shift when it broke',0,'Blame-oriented and irrelevant: fatigue developed over days.')],
   evidence:{h:'Lab and drawing results',html:tbl([['Hardness / chemistry','within spec for C45 cold drawn (S<sub>ut</sub> ≈ 625 MPa) – <b>no material defect</b>'],['Keyseat corner radius (measured)','<b>r ≈ 0.25 mm</b> (end-milled, sharp)'],['K<sub>t</sub> bending, keyseat (chart)','r = 0.25 mm: 2.9 · r = 1.0 mm: 2.2 · r = 2.5 mm: 1.8'],['Notch sensitivity (Neuber)','q = 1/(1 + √a/√r), √a = 0.36 √mm (C45), 0.18 √mm (42CrMo4 Q&T)'],['Corrected endurance limit','S<sub>e</sub> = '+fmt(Se,0)+' MPa (machined, size factor for Ø'+d+')'],['Steady torque, mean stress','T = 9550·P/n = '+fmt(T,0)+' N·m → σ′<sub>m</sub> = √3·K<sub>fs</sub>·τ<sub>m</sub> = '+fmt(smv,1)+' MPa (K<sub>fs</sub> = 2.0)']])}},
  {type:'compute',title:'Nominal bending stress',ref:'w1l4',q:`Compute the <b>nominal alternating bending stress</b> at the keyway for the new impeller: σ<sub>a</sub> = 32M/(πd³), M = ${fmt(M,2)} kN·m, d = ${d} mm. (Rotating bending → fully reversed.)`,ans:sa,unit:'MPa',tol:0.03,dec:1,explain:`σ<sub>a</sub> = 32·${fmt(M*1e6,0)}/(π·${d}³) = ${fmt(sa,1)} MPa. With the old impeller it was only ${fmt(Mold*1e6/Z,1)} MPa.`},
  {type:'compute',title:'Fatigue notch factor',ref:'w1l5',q:'Compute the fatigue notch factor K<sub>f</sub> = 1 + q(K<sub>t</sub> − 1) for the as-found keyseat (r = 0.25 mm, C45).',ans:Kf0,tol:0.03,dec:3,explain:`q = 1/(1 + 0.36/√0.25) = ${fmt(qNeuber(0.25,saC45),3)} → K<sub>f</sub> = 1 + ${fmt(qNeuber(0.25,saC45),3)}·1.9 = ${fmt(Kf0,3)}.`,hint:'√0.25 = 0.5'},
  {type:'compute',title:'Goodman check',ref:'w1l5',q:`Compute the <b>Goodman fatigue safety factor</b>: n = 1/(K<sub>f</sub>σ<sub>a</sub>/S<sub>e</sub> + σ′<sub>m</sub>/S<sub>ut</sub>), with S<sub>e</sub> = ${fmt(Se,0)}, σ′<sub>m</sub> = ${fmt(smv,1)}, S<sub>ut</sub> = 625 MPa.`,ans:n,tol:0.04,dec:3,explain:`n = 1/(${fmt(Kf0*sa,1)}/${fmt(Se,0)} + ${fmt(smv,1)}/625) = ${fmt(n,3)} < 1 → finite life. With the old impeller: n = ${fmt(1/(Kf0*Mold*1e6/Z/Se+smv/Sut),2)} (infinite life – that is why it ran six years).`},
  {type:'compute',title:'Life estimate',q:`Estimate the life with Basquin (S = aN<sup>b</sup>, through 0.9S<sub>ut</sub> at 10³ and S<sub>e</sub> at 10⁶), using σ<sub>ar</sub> = K<sub>f</sub>σ<sub>a</sub>/(1 − σ′<sub>m</sub>/S<sub>ut</sub>). How many <b>cycles</b>?`,ans:N,logtol:0.15,unit:'cycles',explain:`σ<sub>ar</sub> = ${fmt(Kf0*sa/(1-smv/Sut),1)} MPa → N ≈ ${fmt(N,0)} cycles ≈ ${fmt(N/(rpm*1440),1)} days at ${rpm} rpm. Observed: ${obsDays} days – consistent within normal fatigue scatter. The model explains the failure.`,hint:'b = −log10(0.9Sut/Se)/3, a = (0.9Sut)²/Se, N = (σar/a)^(1/b)'},
  {type:'decide',title:'Redesign',q:`Pick the redesign package. Requirement: n ≥ ${need} with the new impeller, at the lowest cost. (The options' safety factors are not shown – use your judgment, then see the numbers.)`,opts:pk.map(p=>({t:p.t+' '+'€'.repeat(p.cost),q:p.q,fb:`${p.k}: n = ${fmt(p.n,2)}. ${p.n>=need?(p===cheapest?'Meets the rule at the lowest cost.':'Meets the rule but costs more than necessary.'):'Does not meet n ≥ '+need+'.'}<br>${ntab()}`,fx:{c:p.c,t:p.tt,s:p.n>=need?0:-25},set:{rd:p}})),
   after:'Notch radius and material strength work together: stronger steels are MORE notch sensitive, so a high-strength steel with a sharp keyseat gains little.'},
  {type:'final',title:'Report to the plant manager',q:'Write your recommendation to Marta. Which conclusion do you sign?',opts:[
   O('Root cause = design change: the bigger impeller raised the rotating bending stress above the fatigue strength of the sharp keyseat. Install the redesigned shaft, add a management-of-change fatigue check for process modifications, and inspect the sister agitators.',1,'Clear causal chain, corrective AND preventive actions.',{c:-3},null,st=>st.f.rd&&st.f.rd.n>=1.3?`The redesigned shaft (${st.f.rd.t}, n = ${fmt(st.f.rd.n,2)}) has now run 18 months without a crack. Your MoC rule caught a similar change on reactor R-14 before it failed. Marta forwards your report to the corporate engineering standards group.`:`You signed the right root cause, but the shaft package you chose has n = ${fmt(st.f.rd.n,2)} < 1.3. Ultrasonic inspection at the first shutdown finds a 3 mm crack at the keyseat – caught in time, but a second redesign costs another week of production.`),
   O('Root cause = bad batch of steel. File a claim with the steel supplier and install the spare shaft.',0,'The lab found the steel within spec, and the timing (failure days after a load increase) points to the design change.',{s:-30,c:-15},null,`The spare shaft breaks after ${Math.max(2,Math.round(obsDays*rnd(0.7,1.3)))} days – this time damaging the impeller and the vessel lining. The supplier's lab confirms the steel was fine; the claim is rejected. Unplanned downtime: three weeks.`),
   O('Go back to the old impeller until a redesigned shaft is available, then implement the redesign.',0.65,'Safe interim measure (old impeller: infinite life) – but you lose the process improvement for weeks; better to combine with a fast-tracked redesign.',{t:-10},null,'The plant runs safely at reduced mixing performance for six weeks until the new shaft arrives. Product quality complaints rise slightly in that period. Safe – but a faster, decisive redesign would have saved money.'),
   O('Reduce the agitator speed by 15 % and keep the same shaft design.',0.3,'Side load scales roughly with speed² (−28 % moment), which may bring n close to 1, but it is an untested operating point and process performance suffers.',{s:-10},null,'At reduced speed the shaft survives longer, but a routine ultrasonic check four months later finds a crack at the keyseat. Mixing quality was off-spec the whole time. The root cause was never fixed.')]}],
 debrief:{chain:['Preserve the evidence – the fracture surface tells the mechanism.','Beach marks + notch origin + small final zone ⇒ fatigue at moderate nominal stress, not overload or bad material.','Check the material anyway (cheap, rules out a hypothesis) – it was fine.','Quantify: σ = 32M/πd³, K<sub>f</sub> = 1 + q(K<sub>t</sub> − 1), Goodman with steady torsional mean stress.','The model reproduces the observed life → root cause confirmed: a load increase from a process change on a sharp keyseat.','Fix the design (radius + material) and the process (management of change).'],
  concepts:[['Kt, Kf, Goodman, Basquin','w1l5'],['Bending stress σ = M/W','w1l4'],['Stress–strain & UTS','w1l1'],['Root-cause tools','w3l5']],
  pitfalls:['Blaming the material first – most service fatigue failures are design/load problems; material defects are the minority.','Cleaning or fitting the fracture halves together – destroys the evidence.','Upgrading to a stronger steel without fixing the notch: higher-strength steels are more notch-sensitive.','"It ran for six years" – irrelevant once the load changed. Every process change touching loads needs a fatigue check (management of change).','Forgetting that a load fixed in space produces fully reversed stress in a rotating shaft.'],
  history:'<b>Eschede, Germany, 3 June 1998.</b> An ICE 1 high-speed train derailed after a steel tyre of a resilient (rubber-sprung) wheel broke by fatigue; 101 people died. The resilient wheel had been adopted to reduce vibration, and investigators criticised that its fatigue behaviour under real service loads had not been adequately validated, and that inspections did not detect the growing crack. Rotating parts accumulate millions of cycles – any design change needs a fatigue re-assessment.'}};}});

build(){
 const th=pick([45,60]),DAF=1.25,Sy=355,Nd=3,all=Sy/Nd,h=70,dh=30;const lugs=[[12,80],[15,100],[20,120],[25,160]].map(([t,w])=>({t,w,mass:t*w*(h+w/2)*7.85e-6}));
 const vmOf=(S,L,flip)=>{const V=S*Math.sin(th*Math.PI/180),H=S*Math.cos(th*Math.PI/180);const A=L.t*L.w;const W=flip?L.w*L.t*L.t/6:L.t*L.w*L.w/6;const sn=V/A+H*h/W,ta=H/A;return{V,H,A,W,sn,ta,vm:Math.sqrt(sn*sn+3*ta*ta)};};
 let m,S;for(let k=0;k<300;k++){m=rint(6,16)/2;S=DAF*m*1000*9.81/(2*Math.sin(th*Math.PI/180));if(vmOf(S,lugs[0]).vm>all*1.15&&lugs.slice(1).some(L=>vmOf(S,L).vm<=all))break;}
 const r0=vmOf(S,lugs[0]),rflip=vmOf(S,lugs[0],true);const best=lugs.find(L=>vmOf(S,L).vm<=all);const net=S/(2*(best.w/2-dh/2)*best.t);
 return{brief:{avatar:'🧑‍💼',who:'Jonas Berg',role:'Project manager',quote:`The ${fmt(m,1)} t pump skid ships tomorrow at 7:00. Our junior designer welded on two 12 mm lugs, they look massive. Can you sign the lifting certificate tonight?`,
  story:`<p>The skid will be lifted by a crane with a <b>two-leg sling</b>, each leg at <b>${th}° to the horizontal</b>. Two lugs, one at each end, symmetric centre of gravity. Lug plate S355 (S<sub>y</sub> = 355 MPa), welded to the skid frame, pin hole Ø${dh} mm at height h = ${h} mm above the weld.</p><p>Company rule (in the spirit of ASME BTH-1 Design Category B): dynamic factor <b>1.25</b> on the static load, design factor <b>N<sub>d</sub> = 3</b> on yield → allowable equivalent stress ${fmt(all,1)} MPa.</p>`,
  sketch:(c)=>{c.fillStyle='#56627e';c.fillRect(140,170,360,50);txt(c,'pump skid',320,200,'#e6ebf5','bold 13px system-ui','center');
   for(const x of[170,470]){c.fillStyle='#ffb74d';c.fillRect(x-12,130,24,40);dot(c,x,142,6,'#0c111b');}
   const yH=30,xH=320;c.strokeStyle='#9aa6bf';c.lineWidth=2;c.beginPath();c.moveTo(170,142);c.lineTo(xH,yH);c.lineTo(470,142);c.stroke();dot(c,xH,yH,6,'#9aa6bf');
   txt(c,th+'°',205,140,'#4fc3f7','bold 13px system-ui');txt(c,'crane hook',xH+10,yH-6,'#9aa6bf','11px system-ui');txt(c,'lug 12 × 80 mm',470,120,'#ffb74d','11px system-ui');
   c.strokeStyle='#4fc3f7';c.beginPath();c.moveTo(170,142);c.lineTo(240,142);c.stroke();}},
 steps:[
  {type:'decide',title:'Design load',q:'Which force must <b>each lug</b> be designed for?',opts:[
   O(`DAF·m·g / (2·sin ${th}°) along the sling leg`,1,'Each leg carries half the weight vertically; the inclined leg force is larger by 1/sin θ, and the dynamic factor covers hoisting accelerations.'),
   O('m·g / 2 (half the weight, vertical)',0.1,'Ignores the sling angle (inclined legs carry MORE than half the weight) and the dynamic factor – unconservative.',{s:-15}),
   O(`DAF·m·g / (2·cos ${th}°)`,0.1,'Wrong trigonometry: the vertical component is S·sin θ (angle measured from the horizontal).',{s:-10}),
   O('DAF·m·g (full weight on one lug, just in case)',0.45,'Very conservative; it may make sense for uncertain centre of gravity, but here the lift is symmetric – it oversizes the lugs.',{c:-5})]},
  {type:'compute',title:'Sling force',q:`Compute the design sling force per lug S = 1.25·m·g/(2 sin ${th}°) with m = ${fmt(m,1)} t.`,ans:S/1000,unit:'kN',tol:0.02,dec:2,explain:`S = 1.25·${m*1000}·9.81/(2·${fmt(Math.sin(th*Math.PI/180),3)}) = ${fmt(S/1000,2)} kN. Components: vertical V = ${fmt(r0.V/1000,2)} kN, horizontal H = ${fmt(r0.H/1000,2)} kN.`},
  {type:'decide',title:'Lug orientation',q:'In which orientation must the lug plates be welded relative to the sling?',opts:[
   O('Plate plane in line with the sling leg (in-plane loading)',1,`The horizontal component then bends the plate about its strong axis (W = t·w²/6 = ${fmt(r0.W,0)} mm³).`),
   O('Plate plane perpendicular to the sling (so the sling pulls across the plate)',0,`Out-of-plane bending about the weak axis: W = w·t²/6 = ${fmt(rflip.W,0)} mm³ → σ<sub>vM</sub> ≈ ${fmt(rflip.vm,0)} MPa! A classic cause of bent or torn-off lugs.`,{s:-25}),
   O('Orientation does not matter for a round pin hole',0.1,'It matters enormously: strong vs weak axis bending differs by (w/t)² in section modulus.',{s:-10})]},
  {type:'compute',title:'Check the proposed lug',ref:'w1l3',q:`For the proposed 12 × 80 mm lug: compute the equivalent stress at the weld (outer fibre, conservative): σ = V/A + H·h/W, τ = H/A, <b>σ<sub>vM</sub> = √(σ² + 3τ²)</b>.`,ans:r0.vm,unit:'MPa',tol:0.03,dec:1,explain:`A = ${r0.A} mm², W = ${r0.W} mm³: σ = ${fmt(r0.V/r0.A,1)} + ${fmt(r0.H*h/r0.W,1)} = ${fmt(r0.sn,1)} MPa, τ = ${fmt(r0.ta,1)} MPa → σ<sub>vM</sub> = ${fmt(r0.vm,1)} MPa vs allowable ${fmt(all,1)} MPa.`},
  {type:'decide',title:'Verdict on the proposed lug',q:`σ<sub>vM</sub> = ${fmt(r0.vm,0)} MPa${r0.vm<Sy?' is below the yield strength of 355 MPa':''}. Jonas says: "So it holds, right? It doesn't even yield!"`,opts:[
   O(`Reject: ${fmt(r0.vm,0)} MPa exceeds the allowable S<sub>y</sub>/N<sub>d</sub> = ${fmt(all,0)} MPa – the design factor exists for dynamic effects, side pulls, weld defects and misuse`,1,'Design factors in lifting standards are not optional "extra safety" – they cover known uncertainties of lifting operations.'),
   O('Accept: below yield is below yield',0,'Below yield in the ideal load case, but lifting standards demand a margin of 3 on yield for good reasons (shock loads, sling angle errors, weld quality).',{s:-30}),
   O('Accept, but tell the crane operator to lift slowly',0.1,'Operational instructions cannot replace a structural margin.',{s:-20})]},
  {type:'decide',title:'Choose the lug',q:'Pick the lightest standard lug that satisfies σ<sub>vM</sub> ≤ allowable (same h = 70 mm, Ø30 hole).',opts:lugs.map(L=>{const r=vmOf(S,L);const ok=r.vm<=all;return{t:`${L.t} × ${L.w} mm plate (${fmt(L.mass,2)} kg)`,q:L===best?1:ok?0.6:0.05,fb:`σ<sub>vM</sub> = ${fmt(r.vm,1)} MPa ${ok?'≤':'>'} ${fmt(all,1)} MPa. ${L===best?'Lightest compliant lug.':ok?'Compliant but heavier (and more weld) than needed.':'Not compliant.'}`,fx:ok?{c:L===best?-2:-5}:{s:-25}};})},
  {type:'compute',title:'Net section at the hole',q:`For the ${best.t} × ${best.w} mm lug (outer radius R = ${best.w/2} mm around the Ø${dh} hole) compute the average <b>net-section tension</b> σ = S / (2(R − d/2)·t).`,ans:net,unit:'MPa',tol:0.03,dec:1,explain:`σ = ${fmt(S,0)}/(2·(${best.w/2} − ${dh/2})·${best.t}) = ${fmt(net,1)} MPa. Pin-loaded eyes also need bearing, tear-out and (for repeated lifts) fatigue checks – the hole edge has K<sub>t</sub> ≈ 2–3+.`},
  {type:'final',title:'Lifting certificate',q:'What do you sign tonight?',opts:[
   O(`Approve the ${best.t} × ${best.w} mm lugs with full-penetration welds, NDT of the welds, and a proof-load test before the first lift; tell Jonas the 12 mm lugs must be replaced`,1,'Compliant design plus verification of the as-built welds – the professional answer, even if the shipment moves a few hours.',{t:-8},null,'The welding shop replaces the lugs overnight; MPI shows one weld toe undercut which is ground out. The proof load test passes, the skid ships at 13:00 instead of 7:00. Six years later the same skid is lifted again during a plant relocation – still certified.'),
   O('Sign for the original 12 mm lugs – the shipment is more important and stress is below yield',0,'You signed a non-compliant lifting point.',{s:-40},null,'During the lift the skid swings and the sling angle flattens. One lug bends out of plane and tears at the weld toe; the skid drops 40 cm onto the truck bed. Nobody is hurt, but the pump casing cracks and an investigation finds your signature on a non-compliant certificate.'),
   O('Approve the heaviest 25 × 160 mm lug to be safe, no further checks',0.55,'Safe on paper, but welds are not verified and the heavy lug increases weld volume and distortion.',{c:-8},null,'The skid ships late after extensive welding. A later audit flags the missing weld NDT – the lifting point is re-certified at extra cost.'),
   O('Ask for four lugs instead of two',0.3,'A four-point lift with a rigid skid is statically indeterminate – two diagonal lugs can end up carrying almost all the load unless a spreader/equaliser is used.',{t:-10},null,'The redesign takes two days. With four legs and no equaliser, strain gauges during the first lift show two lugs carrying ~80 % of the load – exactly the scenario the sizing assumed away.')]}],
 debrief:{chain:['Get the load path right: inclined sling legs carry more than half the weight (1/sin θ) plus dynamic effects.','Orient lugs in the plane of the sling – weak-axis bending is a classic failure mode.','Combine stresses (normal + shear) with von Mises at the critical section.','Compare against the standard\'s allowable (S<sub>y</sub>/N<sub>d</sub>), not against yield.','Check every failure mode of a pin-loaded eye (net section, bearing, tear-out, weld) and verify the as-built part (NDT, proof load).'],
  concepts:[['von Mises & safety factor','w1l3'],['Bending σ = M/W','w1l4'],['Stress concentration at holes','w1l5']],
  pitfalls:['Treating "below yield" as "safe": design factors cover real uncertainties.','Ignoring sling angle – at 30° to horizontal the leg force is twice the vertical share.','Assuming load sharing in multi-leg lifts of rigid loads.','Forgetting out-of-plane loads on lugs (side pulls when the load rotates).','Single load paths with no redundancy need extra care – a single crack can be fatal.'],
  history:'<b>Silver Bridge, Point Pleasant (USA), 15 December 1967.</b> The eyebar-chain suspension bridge over the Ohio River collapsed in rush-hour traffic, killing 46 people. The investigation traced the collapse to a small crack at the pin hole of a single eyebar, grown by stress corrosion and corrosion fatigue; because each chain link consisted of only two eyebars, the structure had no redundancy and the fracture led to total collapse. Pin-loaded eyes, single load paths and inspection access deserve special attention.'}};}});
/* ---------- CASE 3: supplier FEA report ---------- */
defCase({id:'c3',icon:'🖥',title:'The Supplier\'s FEA Report',level:2,domains:['f','s'],inspired:'Sleipner A 1991 (FE analysis error)',
teaser:'A supplier\'s FE report shows 600+ MPa in a S355 bracket and demands a costly redesign. Is the bracket really overstressed?',
build(){
 const F=rint(16,30)*500,L=120,t=20,hh=60,W=t*hh*hh/6;const sn=F*L/W;const Kt=rnd(1.7,1.9);const strue=sn*Kt;const Sy=355;
 const sing=h=>sn*2.9*Math.pow(2/h,0.456);const pk=[2,1,0.5].map(h=>Math.round(sing(h)));const far=[2,1,0.5].map((h,i)=>Math.round(sn*(1.006+[0.012,0.004,0.001][i])));
 const fil=[1,0.5,0.25].map((h,i)=>Math.round(strue*[0.93,0.985,0.997][i]));const conv=fil[2];const SF=Sy/conv;
 return{brief:{avatar:'🧔',who:'Ravi Patel',role:'Supplier quality engineer (Tier-1 supplier)',quote:`Our FE analysis shows ${pk[2]} MPa in the bracket corner – way above the 355 MPa yield of S355. We need to redesign with a 30 mm plate. That is +€38k tooling and 8 weeks. Please approve the change request.`,
  story:`<p>The bracket is a cantilever arm (S355, 20 mm plate, 60 mm deep at the root section) carrying a static design load <b>F = ${fmt(F/1000,1)} kN</b> at a lever arm of <b>${L} mm</b> from the critical root section. Company rule: static safety factor on yield ≥ 1.5 at the design load.</p><p>The supplier's report contains one colourful contour plot with a red spot at the inside corner of the arm and the sentence "max. von Mises ${pk[2]} MPa > S<sub>y</sub> → design not acceptable".</p>`,
  sketch:(c)=>{c.fillStyle='#24324d';c.beginPath();c.moveTo(100,40);c.lineTo(180,40);c.lineTo(180,150);c.lineTo(520,150);c.lineTo(520,210);c.lineTo(100,210);c.closePath();c.fill();c.strokeStyle='#4fc3f7';c.lineWidth=2;c.stroke();
   for(let k=0;k<6;k++){c.strokeStyle='#9aa6bf';c.beginPath();c.moveTo(100,48+k*28);c.lineTo(88,58+k*28);c.stroke();}
   const g=c.createRadialGradient(180,150,2,180,150,60);g.addColorStop(0,'#ef5350');g.addColorStop(0.3,'#ffd54f');g.addColorStop(1,'#24324d00');c.fillStyle=g;c.fillRect(120,90,120,120);
   arrow(c,500,100,500,148,'#ffb74d',3);txt(c,'F',508,110,'#ffb74d','bold 13px system-ui');txt(c,'"max σvM = '+pk[2]+' MPa"',196,140,'#ef5350','bold 12px system-ui');txt(c,'bolted to frame',30,230,'#9aa6bf','11px system-ui');txt(c,'sharp inside corner in the FE model',190,235,'#c9d2e6','11px system-ui');}},
 steps:[
  {type:'decide',title:'First reaction',q:'How do you respond to the change request?',opts:[
   O('Before deciding, check whether the peak value is a converged, physical stress: ask for the mesh study, the BCs/loads and the CAD geometry at the hot spot',1,'An FE peak value is a claim that needs evidence – especially at a corner.',{t:-2}),
   O('Approve – the FE result clearly exceeds yield',0.1,'Approving on a single unverified contour plot can waste €38k and 8 weeks – or worse, if the real issue is elsewhere.',{c:-30,t:-30}),
   O('Reject – FE results above yield are always wrong because the analysis is linear',0.2,'Linear analysis above yield is not automatically wrong (it indicates local plasticity); dismissing it without checking is equally unjustified.',{s:-10}),
   O('Ask the supplier to rerun with an elastic-plastic material so the peak drops below yield',0.4,'Plasticity would cap the number, but it hides the real question: is this peak a singularity or a real stress concentration?',{t:-5})]},
  {type:'request',title:'Data request',q:'Which items do you ask the supplier for?',items:[
   R('Peak stress at the hot spot for 3 mesh sizes (mesh convergence study)',1,'Decides whether the peak is converged or singular.'),R('Description of boundary conditions and load application',1,'Point loads/rigid fixations create artificial peaks.'),R('The CAD model / drawing detail of the inside corner (radius?)',1,'Is the sharp corner real or a simplification?'),R('Reaction-force summary vs applied load',0.5,'Good sanity check of the model set-up.'),R('The supplier\'s ISO 9001 certificate',0,'Quality-system paperwork does not validate an analysis.'),R('The same plot with a different colour scale',0,'Cosmetics; the number stays the same.')],
   evidence:{h:'Supplier reply',html:tbl([['Mesh size at corner','2 mm','1 mm','0.5 mm'],['Peak σ<sub>vM</sub> at corner (MPa)',...pk],['σ<sub>vM</sub> 10 mm away from corner, top fibre (MPa)',...far]])+'<p class="small">BCs: bolt holes fixed; load F distributed over the load pad (OK). Reactions = applied load (OK). <b>CAD drawing: inside corner has a 3 mm fillet radius – removed ("defeatured") in the FE model.</b></p>'}},
  {type:'compute',title:'Mesh study',ref:'w2l2',q:'Compute the ratio of the corner peak at 0.5 mm to the peak at 1 mm.',ans:pk[2]/pk[1],tol:0.02,dec:3,explain:`${pk[2]}/${pk[1]} = ${fmt(pk[2]/pk[1],3)} ≈ 2<sup>0.456</sup> = 1.372 – the same ratio for 2 → 1 mm (${fmt(pk[1]/pk[0],3)}). A constant growth ratio per refinement is the fingerprint of a stress singularity.`},
  {type:'decide',title:'Interpretation',q:'What does the mesh study tell you?',opts:[
   O('The corner peak is a singularity of the sharp (defeatured) corner – it has no physical meaning and would grow with every refinement',1,'Exactly. The real part has a 3 mm fillet – model it, and the stress will converge.'),
   O('The stress is converged at ~'+pk[2]+' MPa',0,'A 37 % increase per halving is the opposite of converged.',{s:-5}),
   O('The finer mesh is more accurate, so the true stress is even higher than '+pk[2]+' MPa',0.1,'At a sharp corner there IS no finite "true" linear-elastic stress – the number depends only on the mesh.'),
   O('Mesh convergence doesn\'t matter for static analysis',0,'It matters for every stress result.')]},
  {type:'compute',title:'Hand check',ref:'w1l4',q:`Independent hand calculation (always do one!): nominal bending stress at the root section σ = F·L/W with W = t·h²/6 (t = ${t} mm, h = ${hh} mm). Compare with the FE stress 10 mm from the corner.`,ans:sn,unit:'MPa',tol:0.03,dec:1,explain:`W = ${t}·${hh}²/6 = ${W} mm³ → σ = ${F}·${L}/${W} = ${fmt(sn,1)} MPa. The FE far-field value (${far[2]} MPa) agrees within ~1 % – the model's load path is fine; only the corner detail is wrong.`},
  {type:'info',title:'Rerun',q:`You ask for a rerun with the real 3 mm fillet. Result table (now in the case file).`,evidence:{h:'Rerun with 3 mm fillet',html:tbl([['Mesh size at fillet','1 mm','0.5 mm','0.25 mm'],['Peak σ<sub>vM</sub> (MPa)',...fil]])}},
  {type:'compute',title:'Safety factor',q:'Is the fillet peak converged (< 2 % change)? Then compute the static safety factor on yield with the finest-mesh value.',ans:SF,tol:0.03,dec:3,explain:`Change 0.5 → 0.25 mm: ${fmt(100*(fil[2]-fil[1])/fil[1],1)} % → converged. n = 355/${conv} = ${fmt(SF,3)} ≥ 1.5 ✔. Effective K<sub>t</sub> = ${fmt(conv/sn,2)}.`},
  {type:'final',title:'Decision on the change request',q:'What do you decide?',opts:[
   O(`Reject the change request: the ${pk[2]} MPa is a mesh-dependent singularity of a defeatured corner. With the real fillet the converged peak is ${conv} MPa (n = ${fmt(SF,2)} ≥ 1.5). Ask for a revised report documenting the mesh study and fillet model.`,1,'Evidence-based, documented, and it saves the project €38k and 8 weeks.',{},null,'The revised report confirms n = '+fmt(SF,2)+'. The bracket goes into production unchanged; prototype strain-gauge tests later measure '+Math.round(conv*rnd(0.94,1.04))+' MPa at the fillet. Your FE review checklist (convergence, hand check, defeaturing) becomes part of the supplier quality manual.'),
   O('Approve the 30 mm redesign – better safe than sorry',0.15,'Not safer – just heavier, later and more expensive, based on a numerical artefact.',{c:-35,t:-35},null,'The program slips 8 weeks and pays €38k for tooling. The heavier bracket shifts the natural frequency of the assembly into the engine excitation range – a vibration problem appears in testing that costs another month.'),
   O('Accept the original design without any further documentation',0.5,'Right technical conclusion, but without a revised report the file still says "design not acceptable" – an audit or a future failure investigation would find a contradiction.',{},null,'Production starts on time. Two years later an auditor finds the unrevised FE report stating "design not acceptable" in the design file – a major finding that takes weeks of paperwork to close.'),
   O('Ask for a nonlinear plastic analysis before deciding',0.45,'Possible, but unnecessary: the linear analysis with the real geometry already shows sufficient margin.',{t:-15},null,'The nonlinear analysis takes three weeks and shows no plasticity at the design load – the answer you already had. The schedule slips.')]}],
 debrief:{chain:['Treat any FE peak as a claim: is it converged, and is the geometry real?','A constant growth ratio (~1.37 per halving at a 90° re-entrant corner) proves a singularity.','Hand-calculate the nominal stress – it validates the global load path of the model.','Model the real fillet, demonstrate convergence, then compare with the criterion.','Decide on evidence and document it.'],
  concepts:[['Mesh convergence & singularities','w2l2'],['BC modelling errors','w2l4'],['Reading FE results','w2l5'],['Bending σ = M/W','w1l4']],
  pitfalls:['Defeaturing fillets in critical regions creates singularities.','Reporting the "max" of a contour plot without asking where and why it occurs.','No hand check – a model can be wrong by a factor of 2 in either direction.','Over-reacting to artefacts (expensive redesigns) is also an engineering failure.','Unconverged FE can also UNDER-estimate stresses (coarse meshes at real notches).'],
  history:'<b>Sleipner A, Gandsfjord (Norway), 23 August 1991.</b> The concrete gravity base structure of a North Sea platform sank during a controlled ballasting test (no fatalities; economic loss widely quoted at around US$700 million). Investigations found that the linear-elastic finite element analysis had underestimated the shear forces in the "tricell" walls by about 45 %, attributed to unfavourable element shapes/meshing in that region, and that the reinforcement detailing was also inadequate. Independent checks and attention to mesh quality could have revealed the problem – FE results always need verification.'}};}});

/* ---------- CASE 4: hydraulic cylinder ---------- */
const lame=(p,ri,ro)=>{const a=ri*ri,b=ro*ro;const st=p*(b+a)/(b-a),sr=-p,sz=p*a/(b-a);return{st,sr,sz,vm:Math.sqrt(0.5*((st-sr)**2+(sr-sz)**2+(sz-st)**2))};};
defCase({id:'c4',icon:'🛢',title:'More Pressure, Please',level:2,domains:['s'],inspired:'Grover Shoe Factory boiler explosion 1905',
teaser:'A customer wants to run your hydraulic cylinder at higher pressure. Thin-wall formula or Lamé? Weld efficiency? Proof test?',
build(){
 const Di=pick([80,100,125]),ratio=rnd(12,15);const t=Math.round(Di/ratio*2)/2;const ri=Di/2,ro=ri+t;const p0=25,pn=pick([31.5,35]);const Sy=355,Sut=490;
 const kR=0.55;const L=lame(pn,ri,ro),Lthin=pn*Di/(2*t);const lim=kR*Sy;const E=0.85;const sz=L.sz;
 let dt=2;while(dt<14&&lame(pn,ri,ri+t+dt).vm>kR*355)dt++;
 const opts=[{t:'Keep the current tube (E355+N, t = '+t+' mm)',Sy:355,Sut:490,th:t,c:0},{t:`Thicker tube E355+N, t = ${t+dt} mm (new OD, new mounting parts)`,Sy:355,Sut:490,th:t+dt,c:-15,tt:-15},{t:`Higher-strength tube E470 (S<sub>y</sub> 470, S<sub>u</sub> 650 MPa), same dimensions`,Sy:470,Sut:650,th:t,c:-6,tt:-5}];
 opts.forEach(o=>{o.L=lame(pn,ri,ri+o.th);o.ok=o.L.vm<=kR*o.Sy&&1.5*o.L.vm<=0.9*o.Sy;o.pb=2/Math.sqrt(3)*o.Sut*Math.log((ri+o.th)/ri);});
 const passing=opts.filter(o=>o.ok);const best=passing.length?passing.reduce((a,b)=>a.c>b.c?a:b):opts[1];
 const pb=2/Math.sqrt(3)*Sut*Math.log(ro/ri);
 return{brief:{avatar:'👨‍🔧',who:'Henrik Larsen',role:'Customer, mobile machinery OEM',quote:`Your Ø${Di} cylinders run fine at ${p0*10} bar. For the new machine we need ${pn*10} bar. It's the same cylinder, just more pressure – can you confirm by Friday?`,
  story:`<p>Barrel: seamless tube E355+N (S<sub>y</sub> = 355, S<sub>ut</sub> = 490 MPa), bore D<sub>i</sub> = ${Di} mm, wall t = ${t} mm, closed ends (welded end cap, circumferential weld, joint efficiency E = 0.85 for the inspection level used).</p><p>Company design rule for pressure-cycled cylinders: σ<sub>vM</sub> at the bore ≤ 0.55·S<sub>y</sub> at rated pressure, and ≤ 0.9·S<sub>y</sub> at the proof-test pressure of 1.5 × rated.</p>`,
  sketch:(c)=>{c.fillStyle='#56627e';c.fillRect(80,70,420,16);c.fillRect(80,164,420,16);c.fillRect(70,70,14,110);c.fillStyle='#4fc3f733';c.fillRect(84,86,300,78);c.fillStyle='#78909c';c.fillRect(384,86,14,78);c.fillRect(398,118,200,14);
   txt(c,'p = '+pn*10+' bar',220,130,'#4fc3f7','bold 14px system-ui','center');txt(c,'Ø'+Di,92,128,'#c9d2e6','12px system-ui');txt(c,'t = '+t+' mm',300,62,'#c9d2e6','12px system-ui');txt(c,'end-cap weld',40,200,'#ffb74d','11px system-ui');dot(c,77,175,5,'#ffb74d');}},
 steps:[
  {type:'decide',title:'Model choice',q:`D<sub>i</sub>/t = ${fmt(Di/t,1)}. Which stress model do you use for the barrel?`,opts:[
   O('Thick-walled cylinder (Lamé) – D/t < 20, so the stress varies noticeably through the wall',1,'Rule of thumb: thin-wall theory (σ = pD/2t) is fine for D/t > ~20; below that, use Lamé – the maximum hoop stress is at the bore.'),
   O('Thin-wall hoop formula σ = pD/(2t) – it is a pipe after all',0.3,`For D/t = ${fmt(Di/t,1)} it underestimates the peak hoop stress at the bore by ~${fmt(100*(L.st-Lthin)/L.st,0)} %.`,{s:-10}),
   O('Beam bending theory',0,'The barrel is loaded by internal pressure, not bending.'),
   O('Only axial stress matters because the ends are closed',0,'Hoop stress is about twice the axial stress – it governs.')]},
  {type:'compute',title:'Lamé hoop stress',q:`Compute the <b>hoop stress at the bore</b> at ${pn} MPa: σ<sub>θ</sub> = p(r<sub>o</sub>² + r<sub>i</sub>²)/(r<sub>o</sub>² − r<sub>i</sub>²).`,ans:L.st,unit:'MPa',tol:0.02,dec:1,explain:`r<sub>i</sub> = ${ri}, r<sub>o</sub> = ${ro} mm → σ<sub>θ</sub> = ${fmt(L.st,1)} MPa (thin-wall formula: ${fmt(Lthin,1)} MPa). At the bore also σ<sub>r</sub> = −p = ${-pn} MPa and σ<sub>z</sub> = p r<sub>i</sub>²/(r<sub>o</sub>² − r<sub>i</sub>²) = ${fmt(sz,1)} MPa.`},
  {type:'compute',title:'Equivalent stress',ref:'w1l3',q:'Compute the <b>von Mises stress at the bore</b> from σ<sub>θ</sub>, σ<sub>r</sub> = −p and σ<sub>z</sub> (closed ends).',ans:L.vm,unit:'MPa',tol:0.03,dec:1,explain:`σ<sub>vM</sub> = √(½[(σ<sub>θ</sub>−σ<sub>r</sub>)² + (σ<sub>r</sub>−σ<sub>z</sub>)² + (σ<sub>z</sub>−σ<sub>θ</sub>)²]) = ${fmt(L.vm,1)} MPa vs limit 0.55·355 = ${fmt(lim,0)} MPa → ${L.vm<=lim?'OK':'<b>not OK</b>'}. Proof test (1.5×): ${fmt(1.5*L.vm,0)} MPa vs 0.9·355 = ${fmt(0.9*Sy,0)} MPa.`},
  {type:'decide',title:'Weld check',q:'The end cap is attached with a circumferential weld (joint efficiency E = 0.85). Which stress does the weld efficiency reduce the capacity for?',opts:[
   O('The axial (longitudinal) stress σ<sub>z</sub> – a circumferential weld is loaded across its length by the axial stress',1,`σ<sub>z</sub>/E = ${fmt(sz/E,1)} MPa – comfortably low. Longitudinal seams (if any) would see the hoop stress.`),
   O('The hoop stress',0.15,'The hoop stress runs ALONG a circumferential weld; it governs longitudinal seams.'),
   O('The radial stress',0,'Radial stress is −p at the bore and 0 outside – it is not what loads the weld.'),
   O('Weld efficiency only matters for fatigue',0.1,'Joint efficiencies are static design factors in pressure codes.')]},
  {type:'decide',title:'Design option',q:`At ${pn*10} bar, which barrel do you offer? (Both rules must be met; prefer the least change.)`,opts:opts.map(o=>({t:o.t,q:o===best?1:o.ok?0.6:0.05,fb:`σ<sub>vM</sub> = ${fmt(o.L.vm,1)} MPa vs ${fmt(kR*o.Sy,0)} (rated) and ${fmt(1.5*o.L.vm,0)} vs ${fmt(0.9*o.Sy,0)} MPa (proof) → ${o.ok?'compliant':'NOT compliant'}. Ideal burst ≈ ${fmt(o.pb,0)} MPa (${fmt(o.pb/pn,1)} × rated).`,fx:o.ok?{c:o.c||0,t:o.tt||0}:{s:-30},set:{bar:o}}))},
  {type:'compute',title:'Burst margin',q:`Estimate the ideal-plastic <b>burst pressure</b> of the CURRENT tube: p<sub>b</sub> ≈ (2/√3)·S<sub>ut</sub>·ln(r<sub>o</sub>/r<sub>i</sub>).`,ans:pb,unit:'MPa',tol:0.03,dec:1,explain:`p<sub>b</sub> = 1.155·490·ln(${ro}/${ri}) = ${fmt(pb,1)} MPa = ${fmt(pb/pn,2)} × the requested pressure. Burst margin alone is not the design criterion for pressure-cycled cylinders – fatigue at the bore and at ports/welds is.`},
  {type:'final',title:'Answer to the customer',q:'What do you tell Henrik?',opts:[
